name: Verificações e publicação

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes de regressão
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar comportamento, conteúdo e preservação do progresso
        run: node --test tests/*.mjs

  publicar:
    name: Publicar site verificado
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar somente os arquivos públicos
        run: |
          mkdir _site
          cp *.html *.js *.png manifest.webmanifest .nojekyll _site/
          cp -R content m _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v4
