higella, e é usada no paciente ambulatorial.", "É de uso intravenoso, cobre Pseudomonas e é usada em infecção hospitalar."], "coms": ["Certa.", "Errada. A primeira parte está certa, mas nenhuma penicilina cobre MRSA.", "Errada. A ampicilina da aula é IV, de uso hospitalar.", "Errada. Não cobre Pseudomonas."], "correta": 0, "expl": "Fonte: Tabela 2.1.", "fio": null, "id": 47, "aprof": "A ampicilina é uma aminopenicilina intravenosa. Tem o espectro da amoxicilina, e a ela se somam a <i>Listeria<\/i> e a <i>Shigella<\/i>. Por ser IV, é usada no paciente <b>internado<\/b>, e a amoxicilina oral fica para o ambulatório. Ela não cobre MRSA, que tem PBP2a, nem <i>Pseudomonas<\/i>, que exige a piperacilina-tazobactam. A confusão é achar que \"IV e hospitalar\" significa espectro maior em tudo. Para a prova, o par certo é ampicilina e <i>Listeria<\/i>, especialmente na meningite em maiores de 50 anos, associada à ceftriaxona. Gancho: ampicilina é a prima intravenosa da amoxicilina, com Listeria no bolso."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: Na pneumonia comunitária ambulatorial sem comorbidade, a amoxicilina pura é uma resposta correta na prova do professor.", "alts": ["Verdadeiro", "Falso"], "coms": ["Correto. O professor aceita amoxicilina pura na pneumonia comunitária sem comorbidade. Fonte: 'o que cai', item 7.", "Errado. O professor aceita amoxicilina pura na pneumonia comunitária sem comorbidade. Fonte: 'o que cai', item 7."], "correta": 0, "expl": "O professor aceita amoxicilina pura na pneumonia comunitária sem comorbidade. Fonte: 'o que cai', item 7.", "fio": null, "id": 48, "aprof": "Na pneumonia comunitária ambulatorial <b>sem comorbidade<\/b>, o agente principal é o pneumococo, sensível à amoxicilina. Por isso a amoxicilina pura, ou com clavulanato, é resposta correta na prova do professor. Quando há comorbidade, como diabetes, a conduta muda para amoxicilina-clavulanato com macrolídeo, porque entram os atípicos. A afirmativa é verdadeira. A armadilha é achar que toda pneumonia exige macrolídeo ou que a amoxicilina pura é \"fraca demais\". O sinal para trocar de esquema é a comorbidade ou a necessidade de internação, e não a simples presença de pneumonia. Gancho: sem comorbidade, amoxicilina; com comorbidade, some o macrolídeo."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Idoso de 82 anos, residente em asilo, com febre, rigidez de nuca e confusão. Suspeita de meningite bacteriana. Qual esquema empírico é o mais adequado?", "alts": ["Piperacilina-tazobactam.", "Oxacilina + metronidazol.", "Ceftriaxona isolada em dose dobrada.", "Ceftriaxona + ampicilina."], "coms": ["Errada. Penetra mal no SNC.", "Errada. Não cobre os agentes da meningite comunitária.", "Errada. Esquema da meningite abaixo de 50 anos.", "Certa. A partir de 50 anos, cobrir Listeria: a alternativa certa tem ampicilina."], "correta": 3, "expl": "Questão trazida pelo professor (certo de cair). Fonte: 'o que cai', itens 1 e 5.", "fio": null, "id": 49, "aprof": "A meningite bacteriana em idoso exige pensar nos agentes por faixa etária. Em maiores de 50 anos, soma-se a <i>Listeria<\/i> aos agentes habituais, e a ceftriaxona <b>não cobre<\/b> <i>Listeria<\/i>. A solução é associar a <b>ampicilina<\/b>, que cobre. A ceftriaxona cobre pneumococo e meningococo e penetra no SNC. Em menores de 50 anos, a ceftriaxona sozinha, em dose dobrada, é o esquema. A pipe-tazo penetra mal no SNC, e oxacilina com metronidazol não fazem sentido na meningite. A armadilha é reconhecer \"meningite\" e escolher só a ceftriaxona, ignorando a idade. Gancho: 50 anos ou mais, ampicilina na meningite."}, {"tema": "Penicilinas", "nivel": "Decoreba", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: A oxacilina tem atividade contra MRSA.", "alts": ["Verdadeiro", "Falso"], "coms": ["Errado. MRSA = S. aureus resistente à meticilina/oxacilina. Afirmativa falsa das provas do professor. Fonte: 'o que cai', item 6.", "Correto. MRSA = S. aureus resistente à meticilina/oxacilina. Afirmativa falsa das provas do professor. Fonte: 'o que cai', item 6."], "correta": 1, "expl": "MRSA = S. aureus resistente à meticilina/oxacilina. Afirmativa falsa das provas do professor. Fonte: 'o que cai', item 6.", "fio": null, "id": 50, "aprof": "MRSA significa <i>S. aureus<\/i> resistente à meticilina, o que, na prática, inclui a oxacilina. A oxacilina foi criada para o MSSA, que produz penicilinase, mas o MRSA tem a PBP2a de baixa afinidade, que torna a droga ineficaz. A afirmativa é falsa. O tratamento do MRSA é ceftarolina ou vancomicina. A confusão aparece porque o nome da oxacilina remete a \"antiestafilocócica\", mas a classe vale só para o MSSA. Para não cair, lembre-se de que o R de MRSA já diz o que a droga não faz. Gancho: o R de MRSA é de resistência à oxacilina."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Valor na borda do corte", "enun": "Criança de 8 anos teve febre reumática com artrite migratória e coreia. O ecocardiograma é normal, sem cardite. A profilaxia secundária deve ser feita com:", "alts": ["Penicilina benzatina a cada 21 dias, por 10 anos ou até os 25 anos, o que durar mais.", "Penicilina benzatina a cada 21 dias, por 5 anos, o que levaria até os 13 anos.", "Amoxicilina por 10 dias e alta, sem profilaxia secundária.", "Penicilina benzatina a cada 21 dias, por 5 anos ou até os 21 anos, o que durar mais."], "coms": ["Errada. Esse prazo é da cardite leve (lesão residual leve).", "Errada. Ignora a regra do 'o que durar mais'.", "Errada. Conduta niilista; a profilaxia secundária é obrigatória após febre reumática.", "Certa. Sem cardite: 5 anos ou até 21. Aos 8 anos, 5 anos levariam aos 13; vale até os 21."], "correta": 3, "expl": "Questão do professor (certo de cair). Regra: sem cardite 5 anos/21; cardite leve 10 anos/25; moderada a grave até 40 ou por toda a vida; vale o que durar mais. Fonte: 'o que cai', itens 1 e 5.", "fio": null, "id": 51, "aprof": "A profilaxia secundária existe porque cada nova faringite por <i>S. pyogenes<\/i> pode reativar a resposta autoimune e agravar o coração; a benzatina forma um depósito que libera penicilina por cerca de 21 dias, daí o intervalo. O prazo depende da gravidade da cardite e sempre vale o que durar mais, entre um número de anos e uma idade-limite. Sem cardite, são 5 anos ou até os 21 anos. Aos 8 anos, 5 anos terminariam aos 13, mas a idade de 21 é maior e prevalece. O erro típico é pegar o prazo da cardite leve (10 anos ou 25 anos) ou esquecer a regra do 'o que durar mais'. Gancho: sem cardite, 5 e 21; leve, 10 e 25; moderada ou grave, 40 ou a vida toda. O professor disse que isso cai com certeza."}, {"tema": "Penicilinas", "nivel": "ENAMED", "tipo": "Caso clínico", "arq": "Distrator de família", "enun": "Paciente de 58 anos internado há 6 dias por AVC desenvolve febre, secreção purulenta e infiltrado novo na radiografia. Não tem alergias. Entre as opções, a mais adequada para iniciar é:", "alts": ["Meropeném.", "Ceftriaxona + azitromicina.", "Piperacilina-tazobactam.", "Amoxicilina-clavulanato."], "coms": ["Errada. Carbapenêmico entra após falha de pipe-tazo ou cefepima em 48–72 h.", "Errada. Esquema da pneumonia comunitária que interna.", "Certa. Infecção após 48 h de internação → cobrir Pseudomonas.", "Errada. Não cobre Pseudomonas; serve para comunitária."], "correta": 2, "expl": "IRAS (≥ 48 h de internação) → pipe-tazo ou cefepima. Fonte: resumo 2.5; Tabela 6.2.", "fio": null, "id": 52, "aprof": "Infecção relacionada à assistência é a adquirida após 48 horas de internação, e a flora do hospital é diferente da flora da comunidade: entram a <i>Pseudomonas<\/i> e bactérias resistentes. Por isso o esquema precisa cobrir <i>Pseudomonas<\/i>. Entre as penicilinas, só a piperacilina-tazobactam faz isso, e na aula ela divide a primeira linha com a cefepima. Aqui o paciente está há 6 dias internado e desenvolve pneumonia, então é pneumonia hospitalar. A confusão comum é escolher ceftriaxona com azitromicina, que é o esquema da pneumonia comunitária. Outra é correr para o meropeném: carbapenêmico não é primeira linha, só entra após falha ou quando há ESBL. Gancho: 48 horas de internação, pense em <i>Pseudomonas<\/i>."}, {"tema": "Penicilinas", "nivel": "ENAMED", "tipo": "Caso clínico", "arq": "Diagnóstico + conduta", "enun": "Doador de sangue de 35 anos, assintomático, com VDRL 1:8 e treponêmico reagente. Sem exames anteriores. A conduta segundo a aula é:", "alts": ["Não tratar, pois é cicatriz sorológica.", "Benzatina 2.400.000 UI semanal por 3 semanas, por ser sífilis latente de duração ignorada.", "Penicilina cristalina IV, por ser sífilis assintomática.", "Benzatina 2.400.000 UI dose única, porque o título é baixo."], "coms": ["Errada. Sem tratamento prévio documentado, não se pode assumir cicatriz.", "Certa. Sem data = tardia.", "Errada. Cristalina é para neurossífilis.", "Errada. O título não define o estágio; a ausência de data define."], "correta": 1, "expl": "Guia: sífilis sem data (latente de duração ignorada, gestante com VDRL + sem lesão, doador de sangue) → benzatina × 3. Fonte: guia g2.", "fio": null, "id": 53, "aprof": "Sífilis latente é a fase sem sintomas, com sorologia reagente. Se a infecção tem menos de um ano, é latente recente; se ocorreu há mais tempo ou não dá para saber quando foi, trata-se como latente tardia, porque o mais seguro é supor o pior. Esse doador nunca teve exame prévio e não tem sintomas, então a duração é ignorada, e o esquema é benzatina 2.400.000 UI semanal por 3 semanas, num total de 7.200.000 UI. A confusão é usar dose única por causa do título baixo: o título não define o esquema, quem define é o tempo de doença. Outra armadilha é a cristalina, reservada à neurossífilis. Gancho: sem data, três semanas."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Mulher de 62 anos, diabética, com pneumonia comunitária leve, tratada em casa. O esquema mais adequado segundo a aula é:", "alts": ["Amoxicilina-clavulanato + azitromicina.", "Piperacilina-tazobactam.", "Ceftriaxona + azitromicina.", "Amoxicilina isolada."], "coms": ["Certa. A comorbidade obriga a cobrir atípicos.", "Errada. Esquema de infecção relacionada à assistência.", "Errada. Esquema da pneumonia que exige internação.", "Errada. Serve para pneumonia ambulatorial sem comorbidade."], "correta": 0, "expl": "Questão trazida em aula. Fonte: 'o que cai', item 5; Tabela 2.3.", "fio": null, "id": 54, "aprof": "Na pneumonia comunitária, o pneumococo é o agente principal, mas as atípicas (<i>Mycoplasma<\/i>, <i>Chlamydophila<\/i>, <i>Legionella<\/i>) também aparecem, e nenhum betalactâmico atua contra elas porque não têm parede ou vivem dentro das células. Quando há comorbidade, como o diabetes desta paciente, a aula manda cobrir os dois grupos: amoxicilina-clavulanato para o pneumococo e azitromicina para os atípicos. A amoxicilina isolada só vale na pneumonia sem comorbidade. A ceftriaxona com azitromicina é o esquema de quem precisa internar, e a pipe-tazo é de infecção hospitalar, ambas fora de escala aqui. Gancho: comorbidade em casa, amoxi-clav mais azitro."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: Na gestante com sífilis alérgica à penicilina, a conduta é dessensibilizar e usar penicilina.", "alts": ["Verdadeiro", "Falso"], "coms": ["Correto. Penicilina é a única que trata o feto de forma confiável. Fonte: Tabela 2.2.", "Errado. Penicilina é a única que trata o feto de forma confiável. Fonte: Tabela 2.2."], "correta": 0, "expl": "Penicilina é a única que trata o feto de forma confiável. Fonte: Tabela 2.2.", "fio": null, "id": 55, "aprof": "Na sífilis da gestante, o objetivo é tratar também o feto, e a penicilina é o único antibiótico que atravessa a placenta em quantidade confiável e cura a sífilis congênita. Por isso, mesmo com alergia, a conduta é dessensibilizar, ou seja, introduzir a penicilina em doses crescentes sob supervisão, e depois tratar normalmente. Trocar por doxiciclina é a confusão comum, mas ela é evitada na gestação, por afetar dentes e ossos do feto. Vale lembrar que as penicilinas são seguras na gestação, e afirmar que são contraindicadas é uma assertiva falsa que o professor já usou. Gancho: gestante com sífilis, penicilina sempre."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Par ou sequência", "arq": "Par ou sequência", "enun": "Ordene a 'escada' de resistência do S. aureus e o tratamento de cada degrau, do mais sensível ao mais resistente:", "alts": ["Sensível à penicilina → MRSA (oxacilina) → MSSA (vancomicina) → resistente à vancomicina.", "Sensível à penicilina → MSSA (ceftarolina) → MRSA (oxacilina) → resistente à vancomicina.", "MSSA (oxacilina) → sensível à penicilina → MRSA (vancomicina) → resistente à vancomicina.", "Sensível à penicilina → MSSA (oxacilina) → MRSA (vancomicina ou ceftarolina) → resistente/intermediário à vancomicina."], "coms": ["Errada. Troca MSSA e MRSA e seus tratamentos.", "Errada. Oxacilina não trata MRSA.", "Errada. O sensível à penicilina é o primeiro degrau.", "Certa."], "correta": 3, "expl": "Fonte: resumo 2.3.", "fio": null, "id": 56, "aprof": "A escada mostra como o <i>S. aureus<\/i> foi escapando de cada droga. A cepa original é sensível à penicilina. Depois surgiu a penicilinase, uma betalactamase que corta o anel, e a resposta foi a oxacilina, resistente a essa enzima: é o MSSA. Em seguida a bactéria alterou a PBP (a PBP2a), a afinidade pelos betalactâmicos caiu e surgiu o MRSA, tratado com vancomicina ou com a ceftarolina, a cefalosporina que consegue se ligar à PBP2a. No topo estão as cepas com sensibilidade intermediária ou resistentes à vancomicina. A confusão comum é inverter a ordem ou achar que a oxacilina atua no MRSA: o R de MRSA já diz que é resistente a ela."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Conduta no momento certo", "enun": "Homem de 45 anos com artrite séptica de joelho. A cultura do líquido sinovial mostra S. aureus sensível à oxacilina. O antibiótico mais adequado é:", "alts": ["Oxacilina IV.", "Vancomicina IV.", "Penicilina G cristalina.", "Ceftarolina."], "coms": ["Certa. MSSA em infecção grave → oxacilina.", "Errada. Vancomicina é para MRSA; no MSSA é inferior e mais tóxica.", "Errada. S. aureus produz penicilinase.", "Errada. Reservada para MRSA documentado."], "correta": 0, "expl": "Indicações da oxacilina: artrite séptica, abscessos, celulite grave, endocardite de valva nativa por MSSA. Fonte: resumo 2.3.", "fio": null, "id": 57, "aprof": "A oxacilina foi desenhada para o <i>S. aureus<\/i> produtor de penicilinase, o MSSA. Como a cultura já mostrou sensibilidade à oxacilina, não há motivo para uma droga mais ampla ou mais tóxica. Artrite séptica, abscessos, celulite grave e endocardite de valva nativa são as indicações clássicas. A vancomicina é o distrator mais tentador, mas serve ao MRSA, é nefrotóxica e é menos eficaz que a oxacilina no MSSA; a ceftarolina também é reservada ao MRSA. A penicilina cristalina falha porque o estafilococo produz penicilinase. Princípio da aula: use a menor arma que alcança a bactéria identificada. Gancho: MSSA, oxacilina; MRSA, vancomicina ou ceftarolina."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Mulher de 24 anos com odinofagia, febre de 38,8 °C, exsudato amigdaliano, linfonodos cervicais anteriores dolorosos e sem tosse. O teste rápido para estreptococo do grupo A é positivo. A conduta é:", "alts": ["Amoxicilina com clavulanato como primeira escolha.", "Amoxicilina sem clavulanato por 10 dias, ou penicilina benzatina IM em dose única.", "Azitromicina como primeira escolha.", "Ceftriaxona IM dose única."], "coms": ["Errada. O professor considera errado: o clavulanato é desnecessário aqui.", "Certa. S. pyogenes não produz betalactamase.", "Errada. Macrolídeo é reservado para o alérgico à penicilina.", "Errada. Não é o esquema de faringite da aula."], "correta": 1, "expl": "Questão trazida em aula: faringite estreptocócica → amoxicilina pura ou benzatina; no alérgico, macrolídeo. Fonte: 'o que cai', item 5.", "fio": null, "id": 58, "aprof": "O teste rápido positivo confirma <i>S. pyogenes<\/i>, e o ponto central é que esse estreptococo não produz betalactamase e continua sensível à penicilina. Logo não há razão para proteger a amoxicilina com clavulanato, que só aumentaria diarreia e custo. A conduta é amoxicilina pura por 10 dias, ou benzatina IM em dose única, que resolve o problema de adesão. No alérgico, usa-se macrolídeo. A confusão é pensar que clavulanato torna a amoxicilina melhor sempre: ele é para H. influenzae e Moraxella de sinusite e otite, não para garganta. A ceftriaxona e a azitromicina de primeira escolha também estão erradas. Gancho: garganta, penicilina sem escudo."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Diagnóstico + conduta", "enun": "Homem de 25 anos com úlcera genital indolor, de base limpa, há 10 dias. Treponêmico reagente. Diagnóstico e tratamento:", "alts": ["Sífilis terciária; penicilina cristalina IV.", "Sífilis primária; ceftriaxona 250 mg IM dose única.", "Sífilis primária; benzatina 2.400.000 UI IM, dose única.", "Sífilis primária; benzatina 2.400.000 UI semanal por 3 semanas."], "coms": ["Errada. Úlcera indolor recente é primária.", "Errada. Esquema de gonorreia citado em aula.", "Certa. Cancro duro; sífilis recente = dose única.", "Errada. Diagnóstico certo, esquema da sífilis tardia."], "correta": 2, "expl": "Primária, secundária e latente recente: benzatina 2.400.000 UI dose única (1.200.000 em cada glúteo). Fonte: Tabela 2.2.", "fio": null, "id": 59, "aprof": "Úlcera genital indolor, de base limpa, com treponêmico reagente é sífilis primária (cancro duro). Nas fases primária, secundária e latente recente, o esquema é uma única dose de benzatina 2.400.000 UI IM, 1.200.000 UI em cada glúteo. A dose semanal por três semanas fica para a latente tardia, a de duração ignorada e a terciária, e a cristalina IV é da neurossífilis. A armadilha é tratar tudo com três doses por medo de falhar, mas o esquema depende da fase. Atenção à alternativa com ceftriaxona 250 mg: ela é o esquema da gonorreia citado em aula, não da sífilis. Gancho: sintoma recente, uma dose; sem data, três."}, {"tema": "Penicilinas", "nivel": "ENAMED", "tipo": "Caso clínico", "arq": "Valor na borda do corte", "enun": "Adolescente de 19 anos teve o primeiro surto de febre reumática aos 17, com cardite leve que deixou insuficiência mitral discreta. Usa benzatina regularmente. Até quando deve manter a profilaxia?", "alts": ["Até os 22 anos.", "Até os 27 anos.", "Pode suspender agora, pois já passou dos 18 anos.", "Até os 25 anos."], "coms": ["Errada. Usa 5 anos (prazo de quem não teve cardite).", "Certa. Cardite leve: 10 anos (17 + 10 = 27) ou até os 25; vale o que durar mais, 27.", "Errada. A maioridade não é critério.", "Errada. Aplica só a idade-limite, mas os 10 anos terminam depois."], "correta": 1, "expl": "Calcule os dois prazos e escolha o maior: 17 + 10 = 27 > 25. Fonte: resumo 2.2.", "fio": null, "id": 60, "aprof": "A regra é calcular os dois prazos e adotar o maior. Aqui a cardite foi leve, deixando insuficiência mitral discreta, então valem 10 anos de profilaxia ou até os 25 anos de idade. O primeiro surto foi aos 17: 10 anos depois são 27 anos. Como 27 é maior que 25, a profilaxia vai até os 27. O erro comum é decorar só a idade-limite e responder 25. A idade só prevalece quando é a que dura mais, como acontece em crianças pequenas, em que 10 anos terminariam cedo demais. Pode suspender aos 19 por ser adulto? Não, a maioridade não é critério. Gancho: some o tempo ao início e compare com a idade-limite."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "Em quais situações a ceftriaxona é usada isoladamente, segundo os esquemas da aula?", "alts": ["Pneumonia que interna e meningite a partir de 50 anos.", "Endocardite de valva nativa e aborto infectado.", "Pielonefrite, peritonite bacteriana espontânea e gonorreia.", "Colangite, pé diabético e DIP."], "coms": ["Errada. Exigem azitromicina e ampicilina.", "Errada. Exigem oxacilina (e metronidazol).", "Certa.", "Errada. Todas exigem associação."], "correta": 2, "expl": "Fonte: Tabela 6.2.", "fio": null, "id": 61, "aprof": "Para escolher o que somar à ceftriaxona, pergunte o que ela não cobre naquele sítio. Ela cobre os Gram-negativos comunitários e o pneumococo, e penetra bem nos tecidos. Na pielonefrite o agente é Gram-negativo, e na PBE as bactérias que atravessam a parede do intestino também são Gram-negativas aeróbias, então anaeróbios não participam e metronidazol é desnecessário. Na gonorreia, a <i>Neisseria<\/i> é coberta pela ceftriaxona em dose única (a nota de revisão lembra que o protocolo atual associa azitromicina). As outras alternativas falham porque exigem parceiros: azitromicina na pneumonia, ampicilina na meningite, oxacilina na endocardite, metronidazol na colangite, clindamicina no pé diabético e doxiciclina na DIP."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Asserção-razão", "arq": "Asserção-razão", "enun": "Avalie as asserções e a relação entre elas.<br><br><b>I.<\/b> A cefazolina é a profilaxia de praticamente todas as cirurgias, inclusive as cardíacas.<br><br><b>PORQUE<\/b><br><br><b>II.<\/b> A infecção de sítio cirúrgico costuma vir da flora da pele, formada sobretudo por S. aureus e S. pyogenes, cobertos pela cefazolina.", "alts": ["As duas asserções são verdadeiras, e a II justifica a I.", "As duas asserções são verdadeiras, mas a II não justifica a I.", "A I é verdadeira, e a II é falsa.", "A I é falsa, e a II é verdadeira.", "As duas asserções são falsas."], "coms": ["Correta. Flora da pele = Gram-positivos = 1ª geração. Fonte: resumo 3.2.", "Incorreta. Exigiria as duas verdadeiras sem relação de causa. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria a I verdadeira e a II falsa. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria a I falsa e a II verdadeira. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria as duas falsas. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I."], "correta": 0, "expl": "Flora da pele = Gram-positivos = 1ª geração. Fonte: resumo 3.2.", "fio": null, "id": 62, "aprof": "Na asserção I, a cefazolina é a profilaxia de praticamente todas as cirurgias, e na II está o porquê: a infecção de sítio cirúrgico costuma vir da flora da pele, formada por <i>S. aureus<\/i> e <i>S. pyogenes<\/i>, que são Gram-positivos, e a cefalosporina de 1ª geração é forte justamente contra eles. Portanto as duas são verdadeiras e a II explica a I. A confusão é achar que uma cefalosporina 'mais forte', como a ceftriaxona, protegeria melhor. Ela é mais potente contra Gram-negativos, mas a flora da pele é Gram-positiva. Isso vale até para cirurgia cardíaca, assunto que se repete todo ano nos ENADE. Gancho: pele é Gram-positivo, então primeira geração."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Assertivas", "arq": "Assertivas com contagem", "enun": "Sobre a ceftriaxona:<br>I. Penetra em quase todos os tecidos, inclusive no SNC.<br>II. Cobre Gram-negativos comunitários e pneumococo.<br>III. Cobre Pseudomonas e produtores de ESBL.<br>IV. É a segunda droga mais associada à colite por C. difficile, depois da clindamicina.<br>Quantas estão corretas?", "alts": ["Três.", "Quatro.", "Uma.", "Duas."], "coms": ["Certa. Só a III é falsa.", "Errada. A III é falsa.", "Errada. I, II e IV estão corretas; só a III é falsa.", "Errada. I, II e IV estão corretas."], "correta": 0, "expl": "Fonte: resumo 3.4.", "fio": null, "id": 63, "aprof": "Vale julgar cada item. I é verdadeira: a ceftriaxona atravessa bem a barreira hematoencefálica, por isso trata meningite. II é verdadeira: cobre <i>E. coli<\/i>, <i>Klebsiella<\/i>, <i>Proteus<\/i>, <i>Neisseria<\/i>, <i>H. influenzae<\/i> e o pneumococo. III é falsa: ela não cobre <i>Pseudomonas<\/i> e é destruída pelas ESBL, que hidrolisam as cefalosporinas de 3ª e 4ª gerações. IV é verdadeira: ao eliminar a flora Gram-negativa do intestino, abre espaço para o <i>C. difficile<\/i>, e a ceftriaxona é a segunda mais associada, depois da clindamicina. Logo, três corretas. O erro típico é aceitar o item III por ela ser 'de terceira geração'. Gancho: a única de 3ª que pega <i>Pseudomonas<\/i> é a ceftazidima."}, {"tema": "Cefalosporinas", "nivel": "ENAMED", "tipo": "Caso clínico", "arq": "Distrator de família", "enun": "Paciente com fibrose cística e pneumonia; o escarro mostra Pseudomonas aeruginosa sensível a betalactâmicos. Entre as opções, qual NÃO cobre esse agente?", "alts": ["Piperacilina-tazobactam.", "Ceftazidima.", "Cefepima.", "Ceftriaxona."], "coms": ["Errada. Cobre.", "Errada. Cobre.", "Errada. Cobre.", "Certa (é a que não cobre)."], "correta": 3, "expl": "Quem pega Pseudomonas na aula: pipe-tazo, ceftazidima, cefepima, meropeném, imipeném. Fonte: guia g4.", "fio": null, "id": 64, "aprof": "A <i>Pseudomonas<\/i> é um Gram-negativo com todos os mecanismos de resistência, e poucos betalactâmicos a alcançam. Na aula, quem cobre são piperacilina-tazobactam, ceftazidima, cefepima, meropeném e imipeném. A ceftriaxona não cobre, embora seja de 3ª geração, e o ertapeném também não. Como a pergunta é 'NÃO cobre', a resposta é a ceftriaxona. A confusão vem da ideia de que toda 3ª geração é para Gram-negativos hospitalares: a ceftriaxona é para os comunitários, e entre as de 3ª só a ceftazidima pega <i>Pseudomonas<\/i>. Gancho: cefePIMA é a do 'P' de <i>Pseudomonas<\/i>, e a ceftaZidima tem o 'Taz' que pega."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: A cefotaxima é de 3ª geração, mas o professor afirmou que não a cobra na prova.", "alts": ["Verdadeiro", "Falso"], "coms": ["Correto. Ele disse: 'não cobrei em prova e não vou'. Também não cobra nomes comerciais (Rocefin). Fonte: 'o que cai', item 4.", "Errado. Ele disse: 'não cobrei em prova e não vou'. Também não cobra nomes comerciais (Rocefin). Fonte: 'o que cai', item 4."], "correta": 0, "expl": "Ele disse: 'não cobrei em prova e não vou'. Também não cobra nomes comerciais (Rocefin). Fonte: 'o que cai', item 4.", "fio": null, "id": 65, "aprof": "Aqui o gabarito é uma afirmação sobre a própria prova do professor: ele disse que a cefotaxima é de 3ª geração, mas 'não cobrei em prova e não vou'. A mesma regra vale para nomes comerciais, como Rocefin. Estudar isso não é desperdício, porque exames de residência cobram, mas na prova dele o foco é outro: decorar nome e geração das cefalosporinas realmente cobradas, como cefazolina, cefuroxima, ceftriaxona, ceftazidima, cefepima e ceftarolina. A confusão comum é achar que, por ser 3ª geração, a cefotaxima precisa estar na lista de decoreba. Gancho: na prova dele, a dupla da 3ª geração é ceftriaxona e ceftazidima."}, {"tema": "Cefalosporinas", "nivel": "ENAMED", "tipo": "Caso clínico", "arq": "Mecanismo dentro da clínica", "enun": "Paciente com KPC isolada em hemocultura recebe ceftazidima-avibactam. Sobre essa associação, é correto afirmar:", "alts": ["A ceftazidima-avibactam é cefalosporina de 5ª geração.", "O avibactam é inibidor de betalactamase e torna a ceftazidima a melhor opção contra KPC, mas não atua contra metalobetalactamases como a NDM.", "A associação também é a melhor opção contra NDM.", "O avibactam é um carbapenêmico que potencializa a ceftazidima."], "coms": ["Errada. A ceftazidima é de 3ª.", "Certa.", "Errada. Avibactam não trava metalobetalactamase.", "Errada. Não é betalactâmico."], "correta": 1, "expl": "Fonte: resumo 3.4; guia g7.", "fio": null, "id": 66, "aprof": "O avibactam é um inibidor de betalactamase: sozinho não mata a bactéria, apenas se liga à enzima e a protege a ceftazidima. A KPC é uma carbapenemase que destrói os carbapenêmicos, e por isso a combinação de ceftazidima com avibactam é a melhor opção contra ela. O limite é a metalobetalactamase, como a NDM, que o avibactam não bloqueia. A confusão está nas alternativas erradas: a associação não é uma cefalosporina de 5ª geração (a 5ª é a ceftarolina) e o avibactam não é carbapenêmico. Na aula, ele é descrito como um inibidor que não é um betalactâmico. Gancho: KPC, ceftazidima-avibactam; NDM, ela não resolve."}, {"tema": "Cefalosporinas", "nivel": "ENAMED", "tipo": "Dados exatos", "arq": "Valor na borda do corte", "enun": "Pela IDSA (nota de revisão), a neutropenia febril é definida por:", "alts": ["Neutrófilos abaixo de 1.000/mm³ e qualquer temperatura acima de 37,8 °C.", "Neutrófilos abaixo de 500/mm³ (ou abaixo de 1.000 com queda prevista) e temperatura de 38,3 °C, ou 38 °C mantida por uma hora.", "Neutrófilos abaixo de 1.500/mm³ e temperatura de 38 °C em uma medida.", "Neutrófilos abaixo de 100/mm³ e temperatura de 39 °C."], "coms": ["Errada. 1.000 foi o corte citado em aula; a temperatura está errada.", "Certa.", "Errada. 1.500 é o limite inferior do normal, não o critério; 38 °C precisa durar 1 hora.", "Errada. 100 é neutropenia profunda."], "correta": 1, "expl": "A aula citou 1.000; a IDSA usa < 500 (ou < 1.000 com queda prevista). Fonte: resumo 3.5, nota de revisão.", "fio": null, "id": 67, "aprof": "Neutropenia febril combina duas medidas: poucos neutrófilos e febre. A neutropenia grave é tradicionalmente abaixo de 500/mm³, ou abaixo de 1.000 com queda esperada, e a febre é 38,3 °C numa medida ou 38 °C por uma hora, porque uma única medida baixa pode ser ruído. Essa é a definição da IDSA, que é a resposta correta aqui. A aula citou o corte de 1.000, e nessa divergência a nota de revisão indica a IDSA, o que torna os números das outras alternativas, como 1.500 ou 100, incorretos. Se a prova do professor perguntar de forma direta, o foco é a conduta: cefepima. Gancho: 500, e 38,3 de uma vez ou 38 por uma hora."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Paciente em quimioterapia com 300 neutrófilos/mm³ e febre de 38,5 °C, estável hemodinamicamente. O antibiótico inicial é:", "alts": ["Vancomicina isolada.", "Ceftriaxona.", "Cefepima.", "Fluconazol."], "coms": ["Errada. Só Gram-positivos.", "Errada. Não cobre Pseudomonas.", "Certa. Neutropenia febril é o 2º tema mais cobrado das cefalosporinas.", "Errada. Antifúngico entra só depois."], "correta": 2, "expl": "Fonte: 'o que cai', item 2; resumo 3.5.", "fio": "nf", "id": 68, "aprof": "O paciente tem 300 neutrófilos e febre, o que é neutropenia febril, uma emergência: sem neutrófilos, qualquer infecção avança rápido. O risco principal é bacteriano, tanto Gram-negativo, inclusive <i>Pseudomonas<\/i>, quanto Gram-positivo. A cefepima, de 4ª geração, cobre Gram-negativos com <i>Pseudomonas<\/i> e é primeira linha. Como o paciente está estável, a vancomicina não é necessária desde o início. A ceftriaxona é a confusão comum: ela não cobre <i>Pseudomonas<\/i>. O fluconazol não é inicial, porque o antifúngico entra só depois de persistência da febre. Gancho: paciente da quimio, cefePIMA com 'P' de <i>Pseudomonas<\/i>; essa é o tema mais cobrado das cefalosporinas depois da pneumonia."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Caso-fio", "enun": "Ainda sobre esse paciente: após 48 horas de cefepima, ele piora, com queda da pressão e sinais de infecção de cateter. O que se acrescenta segundo a sequência da aula?", "alts": ["Fluconazol.", "Azitromicina.", "Metronidazol.", "Vancomicina."], "coms": ["Errada. Antifúngico é o passo seguinte, se ainda não melhorar.", "Errada. Atípicos não são a preocupação.", "Errada. A lacuna aqui são os Gram-positivos (cateter, pele).", "Certa. Grave ou piora em 48 h → + vancomicina."], "correta": 3, "expl": "Sequência: cefepima → + vancomicina → + antifúngico. Raciocínio por exclusão. Fonte: resumo 3.5.", "fio": "nf", "id": 69, "aprof": "A sequência da aula é por exclusão. Começa-se com a cefepima, que cobre os Gram-negativos. Se o paciente é grave ou piora em 48 horas, soma-se vancomicina para cobrir os Gram-positivos, entre eles <i>S. aureus<\/i> resistente e estafilococos de cateter, que a cefepima não alcança bem. Aqui há queda de pressão e sinais de infecção de cateter, que reforçam a necessidade. Só depois, se a febre persistir, vem o antifúngico. A confusão é pular direto para o fluconazol; fungos só entram quando as bactérias já estão cobertas. Azitromicina e metronidazol, que cobrem atípicos e anaeróbios, não fazem parte dessa sequência. Gancho: primeiro Gram-negativo, depois Gram-positivo, por último fungo."}, {"tema": "Cefalosporinas", "nivel": "ENAMED", "tipo": "Caso clínico", "arq": "Caso-fio", "enun": "Ainda sobre esse paciente: mesmo com cefepima e vancomicina, mantém febre, agora em choque. Qual o próximo passo segundo a aula?", "alts": ["Acrescentar antifúngico, preferindo equinocandina por ser grave.", "Suspender antibióticos e aguardar culturas.", "Acrescentar fluconazol, por ser o antifúngico de escolha em qualquer caso.", "Trocar cefepima por ceftriaxona."], "coms": ["Certa. Cobertos Gram-negativos e Gram-positivos, restam os fungos; grave → equinocandina.", "Errada. Conduta niilista em paciente em choque.", "Errada. Fluconazol é para quem não está grave.", "Errada. Perderia Pseudomonas."], "correta": 0, "expl": "Fonte: resumo 3.5.", "fio": "nf", "id": 70, "aprof": "Cobertos os Gram-negativos e os Gram-positivos e sem melhora, restam os fungos, que é o raciocínio por exclusão da sequência da aula. A escolha do antifúngico depende da gravidade: o paciente está em choque, então se usa equinocandina, enquanto o fluconazol fica para o quadro não grave. Suspender os antibióticos e esperar as culturas é perigoso num neutropênico instável, e trocar cefepima por ceftriaxona piora a cobertura, porque a ceftriaxona não pega <i>Pseudomonas<\/i>. Fora da aula: pela IDSA, o antifúngico empírico costuma entrar após 4 a 7 dias de febre. Gancho: grave, equinocandina; não grave, fluconazol."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "Efeito adverso característico da cefepima, sobretudo em pacientes com função renal reduzida:", "alts": ["Neurotoxicidade, com confusão, ataxia e convulsões.", "Ruptura de tendão.", "Síndrome do homem vermelho.", "Efeito antabuse com álcool."], "coms": ["Certa.", "Errada. Quinolonas.", "Errada. É da vancomicina.", "Errada. Metronidazol."], "correta": 0, "expl": "Fonte: resumo 3.5.", "fio": null, "id": 71, "aprof": "A cefepima é eliminada pelos rins. Quando a função renal cai, o fármaco se acumula e passa a ter efeito no sistema nervoso central, causando confusão, ataxia e convulsões. Por isso o ajuste de dose ao clearance é essencial. As outras alternativas pertencem a outras classes: a ruptura de tendão é das quinolonas, a síndrome do homem vermelho é da vancomicina infundida rápido, por liberação de histamina, e o efeito antabuse com álcool é do metronidazol. Gancho: cefepima e cérebro, em quem tem rim ruim. Outra associação útil é que o imipeném também tem convulsão como efeito adverso típico, por isso a neurotoxicidade merece atenção nos dois."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "A 'regra da gangorra' das cefalosporinas afirma que:", "alts": ["Da 1ª à 5ª geração ganham progressivamente atividade contra Gram-positivos e Gram-negativos.", "Da 1ª à 4ª geração perdem atividade contra Gram-positivos e ganham contra Gram-negativos; a 5ª volta a atuar fortemente sobre Gram-positivos, incluindo MRSA.", "Da 1ª à 4ª ganham Gram-negativos; a 5ª ganha anaeróbios e atípicos.", "Da 1ª à 4ª geração ganham Gram-positivos e perdem Gram-negativos."], "coms": ["Errada. Não ganham nos dois lados ao mesmo tempo.", "Certa.", "Errada. Nenhuma pega atípico; a 5ª ganha MRSA.", "Errada. É o contrário."], "correta": 1, "expl": "Fonte: resumo 3.1.", "fio": null, "id": 72, "aprof": "Pense numa gangorra. Na primeira geração, o peso está nos Gram-positivos e no MSSA; a cada geração, esse peso passa para o lado dos Gram-negativos, e a quarta é a mais forte neles, com <i>Pseudomonas<\/i>. A quinta, a ceftarolina, volta a ser forte nos Gram-positivos, incluindo o MRSA, porque se liga à PBP2a. Isso explica usos práticos: pele e cirurgia pedem 1ª geração, pois a flora da pele é Gram-positiva, e o paciente internado com Gram-negativos pede 3ª ou 4ª. A confusão é achar que todas ganham tudo, ou que a 5ª ganha anaeróbios e atípicos. Nenhuma cefalosporina cobre enterococo, atípicos ou anaeróbios, com a exceção teórica da cefoxitina."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Distrator de família", "enun": "Criança com sinusite bacteriana que falhou com amoxicilina. Uma alternativa de 2ª linha citada em aula é:", "alts": ["Cefazolina.", "Ceftarolina.", "Cefepima.", "Cefuroxima."], "coms": ["Errada. 1ª geração; pele e profilaxia.", "Errada. Para MRSA documentado.", "Errada. 4ª geração, hospitalar.", "Certa. 2ª geração tem excelente penetração em vias aéreas."], "correta": 3, "expl": "Fonte: resumo 3.3.", "fio": null, "id": 73, "aprof": "As cefalosporinas de 2ª geração têm excelente penetração nas vias aéreas (seios da face, ouvido, faringe e pulmão). Na sinusite, os agentes são pneumococo, <i>H. influenzae<\/i> e <i>Moraxella<\/i>, alguns produtores de betalactamase, por isso a falha da amoxicilina leva a uma alternativa de espectro vizinho: a cefuroxima é a segunda linha. A confusão é escolher a cefazolina, que é de 1ª geração, forte em pele e profilaxia cirúrgica e fraca nesses Gram-negativos. A cefepima e a ceftarolina são de gerações mais altas e desnecessárias para um quadro ambulatorial, sendo reservadas à infecção hospitalar e ao MRSA. Gancho: vias aéreas, 2ª geração, como segunda linha."}, {"tema": "Cefalosporinas", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Epônimos e itens da mesma família", "enun": "Todas as cefalosporinas abaixo são de 1ª geração, EXCETO:", "alts": ["Cefadroxila.", "Cefalexina.", "Cefuroxima.", "Cefazolina."], "coms": ["Errada. É de 1ª geração (VO).", "Errada. É de 1ª geração (VO).", "Certa (é a exceção). Cefuroxima é de 2ª geração.", "Errada. É de 1ª geração (IV)."], "correta": 2, "expl": "1ª: cefalexina, cefadroxila, cefalotina, cefazolina. O professor insiste: o erro da prova está nos nomes. Fonte: 'o que cai', item 3.", "fio": null, "id": 74, "aprof": "O professor insistiu que o erro da prova está nos nomes, quase iguais, e não na função. As de 1ª geração são cefalexina, cefadroxila (ambas orais), cefalotina e cefazolina (IV). A cefuroxima é de 2ª geração, junto com cefaclor e cefoxitina; por isso é a exceção pedida. Para fixar, o gancho da aula: a 1ª geração começa com 'CEFA-' (cefalexina, cefadroxila, cefalotina, cefazolina), enquanto a cefuroxima e as outras de 2ª geração lembram as que 'respiram', por atuarem nas vias aéreas. A confusão está em ver 'cefa-' e achar que tudo é 1ª geração: cefaclor também começa com 'cefa' e é de 2ª. Gancho: decore em grupos."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Mecanismo dentro da clínica", "enun": "Por que a ceftriaxona se associa à colite por C. difficile?", "alts": ["Causa lesão direta da mucosa colônica.", "Elimina a flora Gram-negativa intestinal, permitindo a proliferação do C. difficile e a produção de toxinas.", "Estimula diretamente a produção de toxina pelo C. difficile.", "É excretada como toxina no cólon."], "coms": ["Errada. O mecanismo é o desequilíbrio da flora.", "Certa.", "Errada. O antibiótico não estimula a toxina; ele elimina a flora que competia com o C. difficile.", "Errada. A toxina é do C. difficile, não da ceftriaxona."], "correta": 1, "expl": "Fonte: resumo 3.4.", "fio": null, "id": 75, "aprof": "O intestino é ocupado por uma flora que mantém o <i>C. difficile<\/i> em quantidade mínima. A ceftriaxona, eliminada em parte pela bile e ativa contra Gram-negativos, destrói essa flora, e o <i>C. difficile<\/i>, que resiste, se multiplica e produz toxinas que lesam o cólon, causando colite pseudomembranosa com diarreia aquosa volumosa. Ou seja, o antibiótico cria o espaço, não causa a lesão diretamente nem é excretado como toxina. A confusão é imaginar que o fármaco seja irritante para a mucosa. Os mais associados são a clindamicina e, em segundo, a ceftriaxona. Gancho: antibiótico some com os concorrentes, o <i>C. difficile<\/i> assume."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "Entre as cefalosporinas de 3ª geração, qual cobre Pseudomonas?", "alts": ["Cefdinir.", "Cefotaxima.", "Ceftriaxona.", "Ceftazidima."], "coms": ["Errada. Também é de 3ª geração, mas não cobre Pseudomonas.", "Errada. Também é de 3ª geração, mas não cobre Pseudomonas, como a ceftriaxona.", "Errada. Não pega Pseudomonas.", "Certa. 'A Taz pega Pseudomonas'."], "correta": 3, "expl": "Fonte: resumo 3.4; guia g3.", "fio": null, "id": 76, "aprof": "Entre as cefalosporinas de 3ª geração, a ceftriaxona, a cefotaxima e o cefdinir cobrem Gram-negativos comunitários, mas só a ceftazidima alcança <i>Pseudomonas<\/i>. Associada ao avibactam, é a melhor opção contra a KPC. A confusão clássica é achar que todas as de 3ª geração se comportam como a ceftriaxona, a mais famosa. O professor contou que errou uma questão na faculdade por não saber que a ceftazidima era de 3ª geração, e não de 4ª, como a cefepima. Gancho: a 3ª geração é 'TRI e TAZ': ceftriaxona e ceftazidima, e a 'Taz' pega <i>Pseudomonas<\/i>. Cefotaxima e cefdinir são menos cobradas."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "A cefepima é primeira linha em:", "alts": ["Faringite estreptocócica.", "Profilaxia cirúrgica.", "Infecção relacionada à assistência e neutropenia febril.", "MRSA documentado."], "coms": ["Errada. Amoxicilina ou benzatina.", "Errada. Cefazolina.", "Certa.", "Errada. Ceftarolina."], "correta": 2, "expl": "Fonte: Tabela 3.1.", "fio": null, "id": 77, "aprof": "A cefepima é a cefalosporina de 4ª geração, com atividade forte contra Gram-negativos, incluindo <i>Pseudomonas<\/i>. Por isso é primeira linha onde a <i>Pseudomonas<\/i> é suspeita: na infecção relacionada à assistência (após 48 horas de internação) e na neutropenia febril. Na faringite estreptocócica, a escolha é amoxicilina ou benzatina; na profilaxia cirúrgica, a cefazolina; no MRSA documentado, a ceftarolina. A confusão é associar cefepima a todo paciente grave. Na aula, primeira linha não é 'a única': na infecção relacionada à assistência a piperacilina-tazobactam também é primeira linha, com a vantagem de cobrir anaeróbios. Gancho: cefePIMA, o 'P' de <i>Pseudomonas<\/i>, paciente internado e paciente da quimio."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Asserção-razão", "arq": "Asserção-razão", "enun": "Avalie as asserções e a relação entre elas.<br><br><b>I.<\/b> A ceftarolina é a única cefalosporina ativa contra MRSA.<br><br><b>PORQUE<\/b><br><br><b>II.<\/b> A ceftarolina se liga à PBP2a.", "alts": ["As duas asserções são verdadeiras, e a II justifica a I.", "As duas asserções são verdadeiras, mas a II não justifica a I.", "A I é verdadeira, e a II é falsa.", "A I é falsa, e a II é verdadeira.", "As duas asserções são falsas."], "coms": ["Correta. A ligação à PBP2a explica a atividade anti-MRSA. Fonte: resumo 3.5.", "Incorreta. Exigiria as duas verdadeiras sem relação de causa. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria a I verdadeira e a II falsa. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria a I falsa e a II verdadeira. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria as duas falsas. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I."], "correta": 0, "expl": "A ligação à PBP2a explica a atividade anti-MRSA. Fonte: resumo 3.5.", "fio": null, "id": 78, "aprof": "A ceftarolina é a cefalosporina de 5ª geração e a única ativa contra o MRSA. O MRSA resiste aos betalactâmicos porque expressa a PBP2a, uma versão alterada da proteína que o antibiótico não consegue se ligar bem. A ceftarolina foi desenhada para se ligar justamente à PBP2a, e assim a II explica a I. A confusão está em achar que as asserções são apenas verdadeiras e independentes: aqui há relação causal, e o mecanismo é a razão da exclusividade. Na prova, se a questão traz a sigla MRSA, a resposta entre as cefalosporinas é ceftarolina. Gancho: 'Carolina' pega MRSA, e a alteração da PBP diminui a afinidade dos outros betalactâmicos."}, {"tema": "Cefalosporinas", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Epônimos e itens da mesma família", "enun": "A ceftazidima pertence à:", "alts": ["3ª geração.", "4ª geração.", "5ª geração.", "2ª geração."], "coms": ["Certa. O professor contou que errou uma questão por não saber isso.", "Errada. A 4ª é a cefepima.", "Errada. A 5ª é a ceftarolina.", "Errada. A 2ª é cefuroxima, cefaclor e cefoxitina."], "correta": 0, "expl": "Fonte: 'o que cai', item 3.", "fio": null, "id": 79, "aprof": "A ceftazidima é de 3ª geração. O erro de prova costuma estar nos nomes quase iguais, e o professor ressaltou que não é preciso saber o que cada uma faz, e sim gravar o nome com a geração. A confusão natural é pensar em 4ª geração, porque a ceftazidima cobre <i>Pseudomonas<\/i>, como a cefepima, que é de fato a 4ª. Cobrir <i>Pseudomonas<\/i> não define a geração. Ela é a única de 3ª que o faz, e o resto da 3ª (ceftriaxona, cefotaxima, cefdinir) não. Gancho: 3ª geração, 'TRI e TAZ' (ceftriaxona e ceftazidima); 4ª, só a cefepima; 5ª, só a ceftarolina."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: O mecanismo de ação das cefalosporinas é diferente do das penicilinas.", "alts": ["Verdadeiro", "Falso"], "coms": ["Errado. Mesmo mecanismo (PBP). Alternativa que diga o contrário está errada na prova. Fonte: 'o que cai', item 7.", "Correto. Mesmo mecanismo (PBP). Alternativa que diga o contrário está errada na prova. Fonte: 'o que cai', item 7."], "correta": 1, "expl": "Mesmo mecanismo (PBP). Alternativa que diga o contrário está errada na prova. Fonte: 'o que cai', item 7.", "fio": null, "id": 80, "aprof": "Cefalosporinas e penicilinas são betalactâmicos e compartilham o anel betalactâmico, que imita a ligação D-alanil-D-alanina do peptidoglicano. Ambas inativam as PBP, impedem as ligações cruzadas, enfraquecem a parede e causam lise osmótica. O que muda é o espectro, a penetração nos tecidos e a resistência às enzimas. Por isso a afirmativa de que o mecanismo é diferente é falsa, e o professor avisou que a alternativa que diga o contrário está errada. A confusão é achar que, por terem espectros distintos, o mecanismo também seja. Para a pegadinha oposta, o mecanismo que 'retira cálcio e magnésio da membrana externa' é das polimixinas. Gancho: mesmo anel, mesma PBP."}, {"tema": "Cefalosporinas", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Epônimos e itens da mesma família", "enun": "Qual cefalosporina é de 2ª geração?", "alts": ["Cefepima.", "Cefalotina.", "Cefaclor.", "Ceftriaxona."], "coms": ["Errada. 4ª geração.", "Errada. 1ª geração.", "Certa. 2ª: cefuroxima, cefaclor, cefoxitina.", "Errada. 3ª geração."], "correta": 2, "expl": "Fonte: Tabela 3.1.", "fio": null, "id": 81, "aprof": "A 2ª geração reúne cefuroxima, cefaclor e cefoxitina, as de atuação equilibrada nas vias aéreas. A cefalotina é de 1ª geração, e a cefepima e a ceftriaxona são de 4ª e 3ª, respectivamente. A confusão é com o prefixo: cefaclor começa com 'cefa', como as de 1ª geração, mas é de 2ª. Por isso decorar em grupos ajuda: 1ª, 'CEFA' (cefalexina, cefadroxila, cefalotina, cefazolina); 2ª, as que respiram (cefuroxima, cefaclor, cefoxitina); 3ª, ceftriaxona e ceftazidima; 4ª, cefepima; 5ª, ceftarolina. O professor disse com todas as letras que 'tem que decorar, não tem jeito'. Gancho: cefaclor é o clorado que respira."}, {"tema": "Cefalosporinas", "nivel": "ENAMED", "tipo": "Caso clínico", "arq": "Diagnóstico + conduta", "enun": "Homem de 35 anos com meningite comunitária, sem comorbidades, sem imunossupressão. O esquema empírico citado em aula é:", "alts": ["Cefazolina.", "Cefuroxima.", "Ceftriaxona + ampicilina.", "Ceftriaxona em dose dobrada."], "coms": ["Errada. Não penetra/cobre os agentes da meningite.", "Errada. 2ª geração, usada em vias aéreas; não é o esquema da meningite.", "Errada. Ampicilina a partir de 50 anos (Listeria).", "Certa. Abaixo de 50 anos, sem fatores de risco para Listeria."], "correta": 3, "expl": "Fonte: Tabela 6.2.", "fio": null, "id": 82, "aprof": "Em meningite comunitária abaixo de 50 anos, sem imunossupressão, a ceftriaxona em dose dobrada cobre os agentes habituais (pneumococo e meningococo) e penetra no sistema nervoso central. A dose é dobrada porque o líquor exige concentração maior. A ampicilina entra só na meningite a partir de 50 anos, para cobrir a <i>Listeria<\/i>, que a ceftriaxona não cobre. A confusão é incluir ampicilina por reflexo: aos 35 anos, não há razão. Cefazolina e cefuroxima não são para meningite. Em prova, a idade é o gatilho: acima de 50, a alternativa certa tem ampicilina; abaixo, a ceftriaxona é suficiente. Gancho: 50 anos, <i>Listeria<\/i>, ampicilina."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Par ou sequência", "arq": "Par ou sequência", "enun": "Qual alternativa lista APENAS cefalosporinas de 1ª geração?", "alts": ["Cefalexina, cefaclor, cefalotina e cefazolina.", "Cefalexina, cefadroxila, cefalotina e cefazolina.", "Cefazolina, cefuroxima, cefadroxila e cefalexina.", "Cefalotina, cefoxitina, cefazolina e cefalexina."], "coms": ["Errada. Cefaclor é de 2ª.", "Certa.", "Errada. Cefuroxima é de 2ª.", "Errada. Cefoxitina é de 2ª."], "correta": 1, "expl": "Basta um item fora para invalidar a alternativa. Fonte: Tabela 3.1.", "fio": null, "id": 83, "aprof": "Como a alternativa precisa listar apenas de 1ª geração, um intruso invalida a opção. As quatro de 1ª são cefalexina, cefadroxila, cefalotina e cefazolina. Nas outras alternativas, o intruso é cefaclor (2ª) na primeira, cefuroxima (2ª) na terceira e cefoxitina (2ª) na quarta. O professor insistiu em que o erro da prova está nos nomes quase iguais, por isso é útil varrer a lista um nome por vez, em vez de reconhecer o conjunto. Gancho: a 1ª geração é a do 'CEFA' que protege a pele: cefalexina, cefadroxila, cefalotina, cefazolina. O cefaclor engana por começar igual, mas pertence às que atuam nas vias aéreas."}, {"tema": "Cefalosporinas", "nivel": "ENAMED", "tipo": "Múltipla escolha", "arq": "Mecanismo dentro da clínica", "enun": "A cefoxitina é a cefalosporina com ação contra anaeróbios, mas é pouco usada na prática porque:", "alts": ["Induz betalactamases do tipo AmpC que a destroem.", "É extremamente nefrotóxica.", "Só existe em apresentação oral.", "Não atravessa nenhuma porina."], "coms": ["Certa.", "Errada. Não é o motivo citado.", "Errada. A cefoxitina é de uso parenteral; o problema é a indução de AmpC.", "Errada. Se não atravessasse, não pegaria nenhum Gram-negativo; o problema é a indução de AmpC."], "correta": 0, "expl": "O professor disse que não cobra o anaeróbio da cefoxitina, mas residência cobra. Fonte: resumo 3.3; 'o que cai', item 4.", "fio": null, "id": 84, "aprof": "A cefoxitina é a única cefalosporina com atividade teórica contra anaeróbios, mas ela induz betalactamases do tipo AmpC, que a destroem. Esse efeito não é comum nas demais cefalosporinas de uso diário. Então, apesar de existir na tabela, na prática se usa pouco. O professor foi claro: a cobertura de anaeróbios pela cefoxitina não vai cair na prova dele, mas as provas de residência gostam desse detalhe. Nas outras alternativas, a cefoxitina não é extremamente nefrotóxica, existe em formulação intravenosa e atravessa porinas. A regra geral continua sendo que nenhuma cefalosporina cobre anaeróbios, atípicos ou enterococo. Gancho: cefoxitina anaeróbia, mas a AmpC a desmonta."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Homem de 30 anos com celulite leve em perna, sem sinais sistêmicos, tratado em casa. Uma opção de 1ª geração com posologia mais cômoda é:", "alts": ["Cefadroxila a cada 12 horas.", "Cefazolina oral a cada 12 horas.", "Ceftarolina oral.", "Cefalexina a cada 24 horas."], "coms": ["Certa. Mais cômoda que a cefalexina.", "Errada. A cefazolina é intravenosa.", "Errada. Não é o caso nem a via.", "Errada. A cefalexina é a cada 6 horas."], "correta": 0, "expl": "1ª geração penetra bem em pele, subcutâneo e, no máximo, fáscia. Fonte: resumo 3.2.", "fio": null, "id": 85, "aprof": "As cefalosporinas de 1ª geração penetram bem na pele e no subcutâneo, e no máximo na fáscia, e cobrem os Gram-positivos que causam celulite, entre eles <i>S. pyogenes<\/i> e MSSA. Para um caso leve, ambulatorial, escolhe-se uma oral: cefalexina ou cefadroxila. A cefadroxila é administrada a cada 12 horas, o que dá posologia mais cômoda que a cefalexina, a cada 6. As alternativas erradas misturam nome e via: não existe cefazolina oral, é IV, e a ceftarolina é endovenosa e reservada ao MRSA documentado. Cefalexina a cada 24 horas está fora do esquema. Gancho: pele, 1ª geração; menos comprimidos, cefadroxila."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Grade 2×2", "arq": "Grade 2×2", "enun": "Sobre ceftriaxona e ceftazidima, respectivamente, quanto à cobertura de Pseudomonas e à geração:", "alts": ["Ceftriaxona: não cobre, 2ª; ceftazidima: não cobre, 3ª.", "Ceftriaxona: não cobre, 3ª; ceftazidima: cobre, 3ª.", "Ceftriaxona: cobre, 3ª; ceftazidima: cobre, 3ª.", "Ceftriaxona: não cobre, 3ª; ceftazidima: cobre, 4ª."], "coms": ["Errada. Ceftriaxona é de 3ª, e a ceftazidima cobre Pseudomonas.", "Certa.", "Errada. Ceftriaxona não cobre Pseudomonas.", "Errada. Ceftazidima é 3ª."], "correta": 1, "expl": "Fonte: resumo 3.4.", "fio": null, "id": 86, "aprof": "Duas informações precisam estar certas ao mesmo tempo. A ceftriaxona não cobre <i>Pseudomonas<\/i>, porque é uma 3ª geração com foco em Gram-negativos comunitários, e é da 3ª geração. A ceftazidima também é de 3ª geração, mas é a única dessa geração que cobre <i>Pseudomonas<\/i>. As alternativas erradas trocam as gerações (ceftriaxona de 2ª ou ceftazidima de 4ª) ou dizem que ambas cobrem. A 4ª geração é só a cefepima. Isso é o ponto em que o professor errou na faculdade: não saber que a ceftazidima era de 3ª. Gancho: mesma geração, comportamento diferente; a ceftazidima tem a 'Taz' que pega <i>Pseudomonas<\/i>."}, {"tema": "Cefalosporinas", "nivel": "ENAMED", "tipo": "Múltipla escolha", "arq": "Diretriz atual × aula", "enun": "Sobre a duração da profilaxia cirúrgica com cefazolina, segundo as diretrizes atuais citadas na nota de revisão:", "alts": ["Deve ser mantida por 7 dias após a cirurgia.", "Deve ser mantida até a retirada dos drenos.", "Deve ser suspensa no fechamento da incisão ou, no máximo, em 24 horas.", "Deve durar obrigatoriamente 48 horas."], "coms": ["Errada. Seria tratamento, não profilaxia.", "Errada. Prática não recomendada.", "Certa. A aula citou 24–48 h; a diretriz atual é ≤ 24 h.", "Errada. 48 h é o limite citado em aula, mas as diretrizes atuais limitam a 24 h."], "correta": 2, "expl": "Nota de revisão: 2 g IV (3 g acima de 120 kg), suspender no fechamento ou até 24 h. Na prova do professor, a pergunta costuma ser QUAL droga (cefazolina). Fonte: resumo 3.2.", "fio": null, "id": 87, "aprof": "O ponto é que a profilaxia não é tratamento: o objetivo é ter antibiótico no tecido no momento da incisão, e não mantê-lo por dias. Prolongar a profilaxia não reduz infecção e aumenta resistência e efeitos adversos, como colite por <i>C. difficile<\/i>. As diretrizes atuais mandam suspender no fechamento da incisão ou, no máximo, em 24 horas. A aula falava em 24 a 48 horas, e a nota de revisão corrige isso. Por isso 7 dias, 48 horas obrigatórias ou 'até retirar os drenos' estão errados. Na prova do professor, a pergunta costuma ser qual droga (cefazolina), e não a duração. Gancho: fechou a pele, acabou a profilaxia; teto de 24 horas."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: 'Pneumonia com necessidade de internamento' é sinônimo de pneumonia hospitalar e deve ser tratada com cobertura para Pseudomonas.", "alts": ["Verdadeiro", "Falso"], "coms": ["Errado. É pneumonia COMUNITÁRIA que interna: ceftriaxona + macrolídeo. Hospitalar é a adquirida após 48 h de internação. Pegadinha do guia g3.", "Correto. É pneumonia COMUNITÁRIA que interna: ceftriaxona + macrolídeo. Hospitalar é a adquirida após 48 h de internação. Pegadinha do guia g3."], "correta": 1, "expl": "É pneumonia COMUNITÁRIA que interna: ceftriaxona + macrolídeo. Hospitalar é a adquirida após 48 h de internação. Pegadinha do guia g3.", "fio": null, "id": 88, "aprof": "Pneumonia que interna não é o mesmo que pneumonia hospitalar. O critério é onde a infecção foi adquirida: a comunitária começa fora do hospital, mesmo que o paciente seja internado por gravidade, e é a adquirida após 48 horas de internação que se chama hospitalar ou relacionada à assistência. Por isso o paciente que interna com pneumonia comunitária recebe ceftriaxona com macrolídeo (azitromicina), cobrindo pneumococo e atípicos, e não precisa de cobertura para <i>Pseudomonas<\/i>. A confusão é equacionar internação com hospital. A cobertura para <i>Pseudomonas<\/i> com pipe-tazo ou cefepima é para quem já estava internado. Gancho: o relógio das 48 horas decide."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Mulher de 48 anos fará histerectomia radical videolaparoscópica. A profilaxia antimicrobiana indicada é:", "alts": ["Dispensa profilaxia por ser videolaparoscópica.", "Ceftazidima.", "Ceftriaxona + metronidazol.", "Cefazolina."], "coms": ["Errada. Conduta niilista.", "Errada. Antipseudomonas; não é profilaxia.", "Errada. Esse é tratamento de infecção abdominal, não profilaxia.", "Certa. ENADE 2021, mesmo raciocínio da cirurgia cardíaca."], "correta": 3, "expl": "Questão do ENADE 2021 trazida pelo professor. Fonte: 'o que cai', item 5.", "fio": null, "id": 89, "aprof": "A infecção do sítio cirúrgico vem da flora da pele, de <i>S. pyogenes<\/i> e <i>S. aureus<\/i>, que são Gram-positivos, mesmo quando a cirurgia é profunda. A cefazolina cobre esses germes e é a profilaxia de praticamente toda cirurgia. Ser videolaparoscópica reduz a incisão, mas não elimina o risco, e o professor trouxe esta questão do ENADE 2021, afirmando que se repete todo ano. A confusão é achar que a técnica minimamente invasiva dispensa profilaxia, ou escolher ceftriaxona com metronidazol, achando que a pelve exige cobertura de Gram-negativos e anaeróbios, o que é tratamento e não profilaxia. A ceftazidima, de 3ª geração, é desnecessária. Gancho: cirurgia, pele, cefazolina."}, {"tema": "Cefalosporinas", "nivel": "Decoreba", "tipo": "Par ou sequência", "arq": "Par ou sequência", "enun": "Associe, respectivamente, a geração de: cefoxitina, cefepima e ceftarolina.", "alts": ["3ª, 4ª e 4ª.", "1ª, 4ª e 5ª.", "2ª, 3ª e 5ª.", "2ª, 4ª e 5ª."], "coms": ["Errada. Cefoxitina é de 2ª e ceftarolina de 5ª; só a cefepima está certa.", "Errada. Cefoxitina é de 2ª.", "Errada. Cefepima é de 4ª.", "Certa."], "correta": 3, "expl": "Fonte: Tabela 3.1.", "fio": null, "id": 90, "aprof": "Aqui o importante é relacionar cada nome à geração correta. A cefoxitina é de 2ª geração, a cefepima de 4ª e a ceftarolina de 5ª. A cefoxitina é a de 2ª que engana, porque é a única com anaeróbios na teoria e porque os nomes são parecidos com as de 1ª. A cefepima é a única de 4ª e cobre <i>Pseudomonas<\/i>. A ceftarolina é a única de 5ª, voltada ao MRSA. As alternativas erradas trocam a geração da cefoxitina (3ª ou 1ª) ou da cefepima (3ª ou 4ª repetidas). Gancho: a ordem 2, 4, 5 sobe junto com a lógica da gangorra, em que a 4ª é a mais gram-negativa e a 5ª volta aos Gram-positivos."}, {"tema": "Cefalosporinas", "nivel": "Decoreba", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: A ceftriaxona é uma cefalosporina de 3ª geração.", "alts": ["Verdadeiro", "Falso"], "coms": ["Correto. Fonte: Tabela 3.1.", "Errado. Fonte: Tabela 3.1."], "correta": 0, "expl": "Fonte: Tabela 3.1.", "fio": null, "id": 91, "aprof": "Verdadeiro. A ceftriaxona é a representante mais famosa da 3ª geração, ao lado da ceftazidima. Na gangorra das gerações, a 3ª é forte nos Gram-negativos comunitários e no pneumococo, com ótima penetração tecidual, inclusive no sistema nervoso central, o que a torna a base de muitos esquemas. Sozinha, é a escolha em pielonefrite, PBE e gonorreia. Os limites também fazem parte do conceito: não cobre <i>Pseudomonas<\/i>, ESBL, enterococo, anaeróbios nem atípicos, por isso recebe parceiros conforme o sítio. A confusão é achar que 'terceira' significa a mais potente em geral: ela é mais potente em Gram-negativos, e a flora da pele pede 1ª geração. Gancho: 3ª geração, 'TRI e TAZ'."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Absoluto com cara de protocolo", "enun": "Que grupos de bactérias as cefalosporinas NÃO cobrem (considerando a regra da aula)?", "alts": ["Pneumococo, E. coli e MSSA.", "Enterococo, atípicos e anaeróbios.", "Gonococo, Salmonella e Shigella.", "Pseudomonas, MRSA e Listeria."], "coms": ["Errada. São cobertos por várias gerações.", "Certa. Exceção teórica: cefoxitina pega anaeróbio, mas o professor disse que não cobra.", "Errada. A ceftriaxona cobre.", "Errada. Ceftazidima e cefepima pegam Pseudomonas; ceftarolina pega MRSA."], "correta": 1, "expl": "Fonte: guia g3.", "fio": null, "id": 92, "aprof": "Nenhuma cefalosporina cobre enterococo, atípicos ou anaeróbios, e as exceções são só teóricas, como a cefoxitina para anaeróbios. Os atípicos (<i>Mycoplasma<\/i>, <i>Chlamydia<\/i>, <i>Legionella<\/i>) fogem porque o <i>Mycoplasma<\/i> não tem parede e os demais vivem dentro das células, onde os betalactâmicos entram mal. Por isso se associa azitromicina na pneumonia e doxiciclina na DIP. Os anaeróbios pedem metronidazol ou clindamicina. As outras alternativas misturam grupos que as cefalosporinas cobrem: pneumococo, <i>E. coli<\/i>, MSSA, gonococo, <i>Salmonella<\/i> e <i>Shigella<\/i>. A <i>Pseudomonas<\/i> e o MRSA têm cefalosporinas específicas, e a <i>Listeria<\/i> pede ampicilina. Gancho: o trio que escapa é 'E, A, A'."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Absoluto com cara de protocolo", "enun": "Qual bactéria é coberta pela ceftriaxona?", "alts": ["Neisseria gonorrhoeae.", "Enterococcus faecalis.", "Bacteroides fragilis.", "S. aureus sensível à oxacilina, como droga de escolha."], "coms": ["Certa.", "Errada. Nenhuma cefalosporina pega enterococo.", "Errada. Anaeróbio; precisa de metronidazol.", "Errada. A ceftriaxona não cobre MSSA de forma adequada (resumo 3.4)."], "correta": 0, "expl": "Ceftriaxona cobre E. coli, Klebsiella, Proteus, Salmonella, Shigella, Neisseria, H. influenzae, Moraxella e pneumococo. Fonte: resumo 3.4.", "fio": null, "id": 93, "aprof": "A ceftriaxona cobre a maioria dos Gram-negativos comunitários e o pneumococo, e a <i>Neisseria<\/i> faz parte desse grupo, por isso a gonorreia é tratada com uma dose IM. As outras alternativas são exatamente o que ela não cobre: o <i>Enterococcus<\/i>, os anaeróbios como <i>Bacteroides<\/i> e o MSSA, para o qual a droga de escolha é a oxacilina. A confusão é achar que, por ser potente, ela cobre tudo. A pergunta-chave da aula serve aqui: o que a ceftriaxona não pega naquele sítio? Enterococo, anaeróbios, atípicos, <i>Pseudomonas<\/i>, ESBL e MSSA. Gancho: a ceftriaxona vai bem com bactérias de 'comunidade', como a <i>Neisseria<\/i>."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Hemocultura de paciente internado mostra S. aureus resistente à oxacilina (MRSA). Segundo a regra de prova da aula, a cefalosporina indicada é:", "alts": ["Cefazolina.", "Ceftazidima.", "Ceftarolina.", "Cefepima."], "coms": ["Errada. Pega MSSA, não MRSA.", "Errada. Antipseudomonas; não pega MRSA.", "Certa. Única que se liga à PBP2a.", "Errada. 4ª geração; não pega MRSA."], "correta": 2, "expl": "A questão traz a sigla: MRSA → ceftarolina. Fonte: 'o que cai', item 7.", "fio": null, "id": 94, "aprof": "O professor monta a questão com uma sigla, e a sigla dá a resposta: MRSA leva à ceftarolina, e ESBL leva ao meropeném, sem trocar. O MRSA resiste à oxacilina porque a PBP2a tem pouca afinidade pelos betalactâmicos, e a ceftarolina é a cefalosporina que se liga a ela. A cefazolina é de 1ª geração e falha no MRSA, a ceftazidima e a cefepima são fortes em Gram-negativos e não cobrem MRSA. A vancomicina também trata MRSA, mas aqui a pergunta é sobre a cefalosporina. Na prática, a ceftarolina é pouco disponível nos hospitais, e a vancomicina é usada com mais frequência. Gancho: 'Carolina' e MRSA."}, {"tema": "Cefalosporinas", "nivel": "Decoreba", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: A cefepima é uma cefalosporina de 3ª geração.", "alts": ["Verdadeiro", "Falso"], "coms": ["Errado. Cefepima é a única de 4ª geração da aula. Fonte: Tabela 3.1.", "Correto. Cefepima é a única de 4ª geração da aula. Fonte: Tabela 3.1."], "correta": 1, "expl": "Cefepima é a única de 4ª geração da aula. Fonte: Tabela 3.1.", "fio": null, "id": 95, "aprof": "Falso. A cefepima é a cefalosporina de 4ª geração, e na lista da aula é a única. A de 3ª geração que cobre <i>Pseudomonas<\/i> é a ceftazidima, e talvez daí venha a confusão: as duas cobrem <i>Pseudomonas<\/i>, mas pertencem a gerações diferentes. Na gangorra, a 4ª é o ponto de maior força nos Gram-negativos, incluindo <i>Pseudomonas<\/i>. Ela é primeira linha na infecção relacionada à assistência e na neutropenia febril, e deve ser lembrada por ser neurotóxica quando a função renal está reduzida. Gancho: cefePIMA, a do 'P', quarta; ceftriaxona e ceftazidima, 'TRI e TAZ', terceira."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Conduta no momento certo", "enun": "Paciente internado em uso de ceftriaxona apresenta diarreia aquosa volumosa; a toxina de C. difficile é positiva. Qual medida de controle é correta?", "alts": ["Dispensa isolamento por não ser transmissível.", "Isolamento respiratório por aerossóis.", "Higiene das mãos com álcool gel, que é suficiente para esporos.", "Isolamento de contato e higiene das mãos com água e sabão."], "coms": ["Errada. Os esporos se transmitem pelo contato (mãos, superfícies); exige isolamento de contato.", "Errada. O isolamento é de contato.", "Errada. Álcool gel não mata esporos.", "Certa. O álcool não destrói os esporos."], "correta": 3, "expl": "Fonte: resumo 3.4; guia g3.", "fio": null, "id": 96, "aprof": "O <i>C. difficile<\/i> forma esporos, que resistem ao ambiente e são transmitidos por contato, e não por aerossol. Por isso o paciente fica em isolamento de contato. A higiene das mãos deve ser feita com água e sabão, porque o álcool gel não destrói os esporos, e a lavagem remove mecanicamente os esporos das mãos. A ceftriaxona é o segundo antibiótico mais associado, depois da clindamicina, e a origem do quadro está na perda da flora Gram-negativa do intestino. O tratamento está fora do escopo da aula, mas a vancomicina oral é útil, porque não é absorvida e age no lúmen intestinal. Gancho: esporo, sabão; álcool não resolve."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Mulher de 30 anos com febre, dor lombar e Giordano positivo; urocultura em andamento. Precisa de internação. O antibiótico empírico citado em aula é:", "alts": ["Ceftriaxona.", "Metronidazol.", "Ceftarolina.", "Cefalexina."], "coms": ["Certa. Pielonefrite → ceftriaxona.", "Errada. Só anaeróbios.", "Errada. Para MRSA.", "Errada. 1ª geração cobre só E. coli entre Gram-negativos; insuficiente para pielonefrite internada."], "correta": 0, "expl": "Fonte: Tabela 6.2.", "fio": null, "id": 97, "aprof": "Febre, dor lombar e Giordano positivo indicam pielonefrite, uma infecção por Gram-negativos da comunidade, principalmente <i>E. coli<\/i>. Quando exige internação, a ceftriaxona IV cobre esses agentes e penetra bem no rim, e é usada isolada, sem parceiro, porque não há anaeróbios nem atípicos envolvidos. O metronidazol cobre só anaeróbios, que não são os agentes do trato urinário. A ceftarolina é de uso restrito ao MRSA, e a cefalexina é oral e de 1ª geração, com pouca ação em Gram-negativos além da <i>E. coli<\/i>. Princípio da aula: comece pela menor arma que alcança as bactérias do sítio. Gancho: urina, Gram-negativo comunitário, ceftriaxona."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Paciente será submetido a cirurgia cardíaca (revascularização miocárdica). A profilaxia antimicrobiana mais adequada é:", "alts": ["Vancomicina para todos os pacientes.", "Cefazolina.", "Ceftriaxona, por ser mais potente.", "Meropeném."], "coms": ["Errada. Absoluto; não é a profilaxia padrão.", "Certa. A infecção vem da flora da pele (Gram-positivos).", "Errada. 'Mais forte' contra Gram-negativos; a flora da pele é Gram-positiva.", "Errada. Carbapenêmico não é profilaxia."], "correta": 1, "expl": "Questão do ENADE 2023 trazida pelo professor; ele disse que se repete todo ano. Fonte: 'o que cai', itens 1 e 5.", "fio": null, "id": 98, "aprof": "A cirurgia cardíaca assusta pela gravidade, e isso leva a escolher drogas mais amplas, mas a profilaxia depende de qual bactéria contamina a incisão: a flora da pele, Gram-positiva. A cefazolina cobre <i>S. aureus<\/i> e <i>S. pyogenes<\/i>, e por isso é a profilaxia de praticamente todas as cirurgias, inclusive as cardíacas. A ceftriaxona 'por ser mais potente' é a pegadinha clássica, pois sua força é em Gram-negativos. O meropeném é reservado a multirresistentes e não é primeira linha, e a vancomicina para todos os pacientes não é regra. Esta é a questão do ENADE 2023 que o professor trouxe, dizendo que se repete todo ano. Gancho: cirurgia, pele, cefazolina."}, {"tema": "Cefalosporinas", "nivel": "Decoreba", "tipo": "Dados exatos", "arq": "Corte vizinho", "enun": "A dose usual de cefazolina na profilaxia cirúrgica, segundo a nota de revisão, é:", "alts": ["1 g VO.", "2 g IV a cada 6 horas por 7 dias.", "2 g IV (3 g acima de 120 kg).", "500 mg IM."], "coms": ["Errada. A cefazolina é IV.", "Errada. Seria tratamento, não profilaxia.", "Certa.", "Errada. A cefazolina profilática é IV, 2 g."], "correta": 2, "expl": "Fonte: resumo 3.2, nota de revisão.", "fio": null, "id": 99, "aprof": "A dose usual da cefazolina na profilaxia é 2 g IV, e 3 g quando o paciente pesa mais de 120 kg, porque o peso corporal maior exige mais fármaco para atingir concentração tecidual eficaz no momento da incisão. A dose é única, dada antes da incisão, e não um tratamento prolongado: 2 g a cada 6 horas por 7 dias está errado, assim como 1 g VO, pois a cefazolina é injetável, e 500 mg IM. Essa dose vem da nota de revisão, e a prova do professor tende a perguntar qual droga, não a dose. Gancho: 2 g, e 3 g acima de 120 kg."}, {"tema": "Cefalosporinas", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Homem de 70 anos com pneumonia comunitária, FR 32 irpm, confusão e ureia elevada, sendo internado em enfermaria. O esquema empírico indicado em aula é:", "alts": ["Ceftriaxona + azitromicina.", "Ceftriaxona isolada.", "Piperacilina-tazobactam.", "Amoxicilina isolada."], "coms": ["Certa. Pneumonia que interna: pneumococo e atípicos.", "Errada. Falta cobrir atípicos.", "Errada. Não é infecção hospitalar.", "Errada. Esquema ambulatorial sem comorbidade."], "correta": 0, "expl": "Pneumonia que interna é o tema mais cobrado das cefalosporinas. Fonte: 'o que cai', item 2; guia g3.", "fio": null, "id": 100, "aprof": "Este é o quadro de pneumonia grave o bastante para internar: frequência respiratória alta, confusão e ureia elevada. É comunitária, apesar da internação, então os agentes são pneumococo e atípicos. A ceftriaxona cobre o pneumococo e os Gram-negativos comunitários, mas nenhum betalactâmico atua contra atípicos, e por isso se associa a azitromicina. Ceftriaxona isolada deixa os atípicos sem cobertura, e a amoxicilina isolada é para pneumonia sem comorbidade, tratada em casa. A pipe-tazo cobriria <i>Pseudomonas<\/i>, mas isso é para a pneumonia adquirida no hospital, após 48 horas ou 96 horas em UTI. Este é o tema mais cobrado das cefalosporinas. Gancho: pneumonia que interna, ceftriaxona e azitromicina."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "KPC significa:", "alts": ["Klebsiella pneumoniae carbapenemase.", "Klebsiella produtora de cefalosporinase.", "Betalactamase de espectro estendido.", "Proteína ligadora de penicilina tipo K."], "coms": ["Certa. Pode ocorrer também em outras espécies.", "Errada. O C é de carbapenemase: a enzima destrói carbapenêmicos.", "Errada. Essa é a ESBL.", "Errada. Proteína ligadora de penicilina é PBP, alvo do antibiótico."], "correta": 0, "expl": "Fonte: guia de siglas.", "fio": null, "id": 101, "aprof": "Siglas de resistência dizem qual enzima a bactéria fabrica, e a enzima dita o tratamento. KPC é <i>Klebsiella pneumoniae<\/i> carbapenemase: o C é de carbapenemase, enzima que hidrolisa o anel betalactâmico dos carbapenêmicos, justamente a classe que costuma ser o último recurso. Por isso, ao ler KPC na prova, o raciocínio muda: carbapenêmico deixa de servir e entra a ceftazidima-avibactam. A confusão comum é com ESBL, que é betalactamase de espectro estendido e ainda cede ao meropeném, ou com PBP, que é o alvo do antibiótico e não uma enzima da bactéria contra ele. Gancho: KPC, o C é de Carbapenem destruído. A enzima pode aparecer também em outras espécies, não só na <i>Klebsiella<\/i>."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Asserção-razão", "arq": "Asserção-razão", "enun": "Avalie as asserções e a relação entre elas.<br><br><b>I.<\/b> O meropeném é a primeira escolha para infecções por bactérias produtoras de KPC.<br><br><b>PORQUE<\/b><br><br><b>II.<\/b> O meropeném é o carbapenêmico mais potente.", "alts": ["As duas asserções são verdadeiras, e a II justifica a I.", "As duas asserções são verdadeiras, mas a II não justifica a I.", "A I é verdadeira, e a II é falsa.", "A I é falsa, e a II é verdadeira.", "As duas asserções são falsas."], "coms": ["Incorreta. Exigiria as duas verdadeiras e a II explicando a I. Aqui a I é falsa e a II é verdadeira.", "Incorreta. Exigiria as duas verdadeiras sem relação de causa. Aqui a I é falsa e a II é verdadeira.", "Incorreta. Exigiria a I verdadeira e a II falsa. Aqui a I é falsa e a II é verdadeira.", "Correta. A I é falsa (KPC destrói carbapenêmicos; usa-se ceftazidima-avibactam). A II é verdadeira. Fonte: Tabela 4.1 e 4.2.", "Incorreta. Exigiria as duas falsas. Aqui a I é falsa e a II é verdadeira."], "correta": 3, "expl": "A I é falsa (KPC destrói carbapenêmicos; usa-se ceftazidima-avibactam). A II é verdadeira. Fonte: Tabela 4.1 e 4.2.", "fio": null, "id": 102, "aprof": "Em asserção-razão, avalie cada frase sozinha antes de ligar as duas. A II é verdadeira: o meropeném é o carbapenêmico mais potente. Mas a I é falsa, porque a KPC é uma carbapenemase, enzima feita para destruir exatamente os carbapenêmicos, e potência não resolve se a droga é hidrolisada antes de agir. A exceção em que o meropeném é primeira linha é a ESBL, enzima que não destrói carbapenêmicos. Na KPC a escolha é ceftazidima-avibactam, porque o avibactam protege a ceftazidima da enzima. A armadilha é pensar que a droga mais forte serve para a bactéria mais resistente. Gancho: ESBL pede meropeném, KPC pede avibactam."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "ENAMED", "tipo": "Interpretação", "arq": "Figura, gráfico ou tabela", "enun": "Klebsiella pneumoniae produtora de ESBL isolada em hemocultura. Antibiograma: ceftriaxona R; cefepima R; piperacilina-tazobactam S; amicacina S; meropeném S. O antibiótico mais adequado é:", "alts": ["Amicacina isolada, por ser sensível e mais barata.", "Cefepima em dose máxima.", "Meropeném.", "Piperacilina-tazobactam, porque o antibiograma mostra sensibilidade."], "coms": ["Errada. Não é a escolha para ESBL.", "Errada. Está resistente.", "Certa. A sensibilidade à pipe-tazo é só in vitro; mais da metade da turma errou essa questão.", "Errada. Pegadinha: in vitro não é in vivo na ESBL."], "correta": 2, "expl": "Questão de prova do ano anterior; caiu igual no Sírio-Libanês. Fonte: 'o que cai', item 5.", "fio": null, "id": 103, "aprof": "ESBL é uma betalactamase que hidrolisa penicilinas e cefalosporinas, inclusive as de 3ª e 4ª gerações, e por isso ceftriaxona e cefepima aparecem resistentes. O ponto que a aula martela é a sensibilidade do antibiograma à piperacilina-tazobactam: na placa, o fármaco mata a bactéria antes de ela expressar a enzima, mas no paciente ela tem tempo de produzi-la e destruir a droga. É a imagem do ladrão com a faca no bolso. Por isso, com ESBL, a resposta é meropeném, mesmo com pipe-tazo marcado S. A armadilha do distrator é confiar no S in vitro. A amicacina também é S, mas é nefrotóxica e não é a escolha em hemocultura. Gancho: ESBL, sigla pede meropeném."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Assertivas", "arq": "Assertivas com contagem", "enun": "Sobre as superbactérias:<br>I. A KPC é tratada com meropeném em dose alta.<br>II. A ESBL é tratada com meropeném.<br>III. O grupo CESP tem AmpC induzível.<br>IV. A Pseudomonas reúne todos os mecanismos de resistência.<br>Estão corretas:", "alts": ["Todas.", "I e IV.", "I, II e III.", "II, III e IV."], "coms": ["Errada. A I é falsa: a KPC destrói o meropeném.", "Errada. A I é falsa, e faltam II e III, que são verdadeiras.", "Errada. Inclui a I, que é falsa, e exclui a IV, verdadeira.", "Certa. A I é falsa: KPC destrói o meropeném."], "correta": 3, "expl": "Fonte: Tabela 4.2.", "fio": null, "id": 104, "aprof": "Nesta questão, basta saber o que cada enzima faz. A KPC destrói carbapenêmicos, então a afirmativa I cai: dose alta não vence uma enzima que hidrolisa a droga. A ESBL hidrolisa penicilinas e cefalosporinas, mas poupa o carbapenêmico, daí o meropeném (II certa). No grupo CESP existe uma AmpC cromossômica que fica desligada e é induzida pelas cefalosporinas (III certa). A <i>Pseudomonas<\/i> reúne betalactamase, porinas reduzidas, alteração de PBP e bombas de efluxo (IV certa). A confusão típica é achar que o carbapenêmico serve para toda superbactéria. Ele serve para ESBL; para KPC, a enzima é feita contra ele. Gancho: cada sigla tem uma enzima e cada enzima tem um antídoto."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: Os carbapenêmicos co
