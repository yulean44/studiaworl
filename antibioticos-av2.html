to de memorizar é que macrolídeo e clindamicina têm o mesmo sítio e por isso competem entre si, e que tetraciclina e aminoglicosídeo ficam na subunidade menor. Gancho: 'macro' no maior (50S), 'tetra' no menor (30S)."}, {"tema": "Outras classes", "nivel": "Faculdade", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: Os aminoglicosídeos são concentração-dependentes.", "alts": ["Verdadeiro", "Falso"], "coms": ["Correto. O índice deles é pico/CIM. Fonte: Tabela 5.1; resumo 1.5.", "Errado. O índice deles é pico/CIM. Fonte: Tabela 5.1; resumo 1.5."], "correta": 0, "expl": "O índice deles é pico/CIM. Fonte: Tabela 5.1; resumo 1.5.", "fio": null, "id": 167, "aprof": "Antibióticos podem ter eficácia ligada ao pico de concentração ou ao tempo acima da CIM. Nos <b>aminoglicosídeos<\/b> o efeito bactericida cresce com a concentração, e o índice que importa é pico/CIM; por isso se usa uma dose alta, em geral única diária, para atingir um pico elevado e também reduzir a toxicidade. É o oposto dos betalactâmicos, tempo-dependentes, cuja curva no gráfico é em platô, enquanto a do aminoglicosídeo é em pico. Quinolonas dependem da exposição total, AUC/CIM. A confusão é generalizar 'todo antibiótico é tempo-dependente'. Gancho: pico alto, aminoglicosídeo; platô, betalactâmico."}, {"tema": "Outras classes", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Paciente em uso de metronidazol bebe cerveja em uma festa e apresenta rubor, náuseas, vômitos e taquicardia. O mecanismo é:", "alts": ["Reação anafilática ao álcool.", "Síndrome do homem vermelho.", "Hipoglicemia por interação.", "Efeito antabuse (dissulfiram-like)."], "coms": ["Errada. Não é alergia; é acúmulo de acetaldeído (efeito dissulfiram).", "Errada. Vancomicina.", "Errada. O quadro de rubor e vômitos após álcool é o efeito antabuse.", "Certa."], "correta": 3, "expl": "Fonte: Tabela 5.1.", "fio": null, "id": 168, "aprof": "Classicamente, explica-se que o metronidazol interfere na degradação do álcool (inibição da aldeído desidrogenase, mecanismo ainda discutido na literatura), e o acúmulo de acetaldeído causaria rubor, náuseas, vômitos e taquicardia: é o <b>efeito antabuse<\/b>, também chamado dissulfiram-like. A resposta é bioquímica e não imunológica, por isso não é anafilaxia. A confusão com a síndrome do homem vermelho vem do rubor, mas essa é da vancomicina com infusão rápida. O paciente deve ser orientado a evitar álcool durante o tratamento e logo depois. Gancho: metronidazol e cerveja não combinam; gosto metálico e antabuse."}, {"tema": "Outras classes", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Distrator de família", "enun": "Entre as quinolonas, quais cobrem Pseudomonas e quais cobrem pneumococo e atípicos (respiratórias)?", "alts": ["Todas cobrem igualmente.", "Nenhuma cobre Pseudomonas.", "Cipro e levo cobrem Pseudomonas; levo e moxi são respiratórias.", "Moxi cobre Pseudomonas; cipro é respiratória."], "coms": ["Errada. O espectro difere: cipro é fraca contra pneumococo.", "Errada. Cipro e levo cobrem.", "Certa.", "Errada. Inverte."], "correta": 2, "expl": "Conteúdo fora da aula, vindo do mapa mental. Fonte: Tabela 5.1.", "fio": null, "id": 169, "aprof": "As quinolonas atuam na DNA girase e são divididas por espectro. As de <b>espectro respiratório<\/b>, levofloxacino e moxifloxacino, cobrem pneumococo e atípicos, e por isso servem em pneumonia. O <b>cipro e o levo<\/b> cobrem Pseudomonas; o moxifloxacino, não de forma confiável. O levofloxacino é a única que fica nos dois grupos. A confusão é achar que 'todas fazem tudo', e na prova a armadilha é trocar o moxi pelo cipro. Este conteúdo veio do mapa mental, não da aula do professor, então tem menos chance de cair. Gancho: cipro tem Pseudomonas, moxi tem pulmão, levo tem os dois."}, {"tema": "Outras classes", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "Efeitos adversos das quinolonas:", "alts": ["Neurotoxicidade em renais crônicos e colite.", "Efeito antabuse e gosto metálico.", "Síndrome do homem vermelho e nefrotoxicidade.", "Tendinite e ruptura de tendão, QT longo e aneurisma de aorta; evitar na gestação e em crianças."], "coms": ["Errada. Cefepima.", "Errada. Metronidazol.", "Errada. Vancomicina.", "Certa."], "correta": 3, "expl": "Fonte: Tabela 5.1.", "fio": null, "id": 170, "aprof": "As quinolonas atuam na DNA girase, enzima que também existe, em forma diferente, em tecidos humanos, o que explica efeitos em tendão e cartilagem. Daí a tendinite e a ruptura de tendão, mais o QT longo e o risco de aneurisma de aorta, e a recomendação de <b>evitar na gestação e em crianças<\/b> pelo dano à cartilagem de crescimento. As outras alternativas misturam classes: neurotoxicidade em renal crônico é da cefepima, antabuse do metronidazol e homem vermelho da vancomicina. Gancho: quinolona = tendão, QT, aorta, e longe de gestante e criança."}, {"tema": "Associações e raciocínio clínico", "nivel": "ENAMED", "tipo": "Asserção-razão", "arq": "Asserção-razão", "enun": "Avalie as asserções e a relação entre elas.<br><br><b>I.<\/b> Na meningite em paciente de 60 anos, a ceftriaxona deve ser associada à ampicilina.<br><br><b>PORQUE<\/b><br><br><b>II.<\/b> A Listeria monocytogenes é um bacilo Gram-negativo produtor de ESBL.", "alts": ["As duas asserções são verdadeiras, e a II justifica a I.", "As duas asserções são verdadeiras, mas a II não justifica a I.", "A I é verdadeira, e a II é falsa.", "A I é falsa, e a II é verdadeira.", "As duas asserções são falsas."], "coms": ["Incorreta. Exigiria as duas verdadeiras e a II explicando a I. Aqui a I é verdadeira e a II é falsa.", "Incorreta. Exigiria as duas verdadeiras sem relação de causa. Aqui a I é verdadeira e a II é falsa.", "Correta. A I é verdadeira; a II é falsa: Listeria é bacilo Gram-POSITIVO, naturalmente não coberta pelas cefalosporinas. Fonte: resumo 2.4.", "Incorreta. Exigiria a I falsa e a II verdadeira. Aqui a I é verdadeira e a II é falsa.", "Incorreta. Exigiria as duas falsas. Aqui a I é verdadeira e a II é falsa."], "correta": 2, "expl": "A I é verdadeira; a II é falsa: Listeria é bacilo Gram-POSITIVO, naturalmente não coberta pelas cefalosporinas. Fonte: resumo 2.4.", "fio": null, "id": 171, "aprof": "A meningite acima de 50 anos exige cobrir <i>Listeria monocytogenes<\/i>, que é bacilo <b>Gram-positivo<\/b> e não é coberto por cefalosporinas; por isso se soma a ampicilina à ceftriaxona. A assertiva I é verdadeira. A II é falsa em dois pontos: Listeria é Gram-positiva e não tem relação com ESBL, que é um problema de Gram-negativos. Quando uma assertiva tem um erro fatual, a relação 'porque' desmorona, então a resposta é 'I verdadeira, II falsa'. A confusão é decorar só 'ampicilina para Listeria' sem lembrar a característica da bactéria. Gancho: acima de 50, ampicilina de companhia."}, {"tema": "Associações e raciocínio clínico", "nivel": "Faculdade", "tipo": "Assertivas", "arq": "Assertivas com contagem", "enun": "Sobre associações com ceftriaxona:<br>I. Colangite: + metronidazol.<br>II. Pneumonia que interna: + azitromicina.<br>III. PBE: + metronidazol.<br>IV. Meningite a partir de 50 anos: + ampicilina.<br>Assinale:", "alts": ["Todas estão corretas.", "Apenas a I está correta.", "Apenas uma é incorreta.", "Apenas duas estão corretas."], "coms": ["Errada. A III é falsa: PBE é ceftriaxona sem metronidazol.", "Errada. II e IV também estão corretas.", "Certa. A III é falsa: PBE é ceftriaxona isolada.", "Errada. Três estão corretas (I, II, IV)."], "correta": 2, "expl": "Fonte: guia g6.", "fio": null, "id": 172, "aprof": "A pergunta-chave é o que a ceftriaxona não cobre naquele sítio. Na colangite faltam os anaeróbios da bile, então vai o metronidazol (I certa). Na pneumonia que interna faltam os atípicos, e vai a azitromicina (II certa). Na meningite acima de 50 anos falta a Listeria, e vai a ampicilina (IV certa). Na <b>PBE<\/b>, porém, as bactérias que atravessam o intestino são Gram-negativos aeróbios, que a ceftriaxona cobre, então ela vai sozinha e o metronidazol é desnecessário (III errada). Portanto só uma é incorreta. A confusão é associar metronidazol a tudo que é abdominal. Gancho: PBE é a exceção, ceftriaxona sozinha."}, {"tema": "Associações e raciocínio clínico", "nivel": "Faculdade", "tipo": "Par ou sequência", "arq": "Par ou sequência", "enun": "Qual a sequência correta das 'quatro perguntas' para a escolha empírica do antibiótico?", "alts": ["Onde está a infecção → que bactérias vivem ali → em casa ou internado, leve ou grave → menor arma que alcança essas bactérias no tecido.", "Gravidade → droga mais potente → cultura → descalonar.", "Que bactérias vivem ali → menor arma → onde está a infecção → gravidade.", "Qual a droga mais potente → onde está a infecção → que bactérias vivem ali → custo."], "coms": ["Certa.", "Errada. Começa pelo sítio, não pela droga mais potente.", "Errada. A ordem importa.", "Errada. A potência não é o ponto de partida; a menor arma suficiente é o fim do raciocínio."], "correta": 0, "expl": "Fonte: resumo 6.1.", "fio": null, "id": 173, "aprof": "O raciocínio empírico segue uma ordem que vai do paciente à droga: <b>onde<\/b> está a infecção, quais bactérias vivem naquele lugar, o paciente está em casa ou internado e o quadro é leve ou grave, e só então qual a menor arma que alcança esses germes naquele tecido. Começar pela droga, pelo custo ou pelo espectro máximo inverte o raciocínio e gera uso excessivo de antibióticos. O sítio vem antes porque define a flora típica (pele, estafilococos; garganta, <i>S. pyogenes<\/i>). A confusão é partir do antibiótico 'mais forte'. Gancho: do sítio para o germe e do germe para a menor arma."}, {"tema": "Associações e raciocínio clínico", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "Qual a pergunta-chave para escolher o parceiro da ceftriaxona?", "alts": ["Qual é o antibiótico mais potente disponível?", "Qual droga tem o mesmo mecanismo da ceftriaxona?", "Qual droga tem menos efeitos adversos?", "O que a ceftriaxona não pega e costuma estar nesse lugar?"], "coms": ["Errada. Contraria a lógica da menor arma suficiente.", "Errada. O parceiro deve tapar lacuna de espectro, não repetir o mecanismo.", "Errada. Segurança importa, mas a pergunta-chave é a lacuna de espectro naquele sítio.", "Certa."], "correta": 3, "expl": "Fonte: guia g6.", "fio": null, "id": 174, "aprof": "A ceftriaxona é a base de muitos esquemas porque cobre Gram-negativos comunitários e pneumococo e penetra em quase todos os tecidos. Como nenhuma droga cobre tudo, o parceiro se escolhe preenchendo o buraco: <b>o que a ceftriaxona não pega e costuma estar nesse lugar?<\/b> Anaeróbios em intestino e bile, atípicos no pulmão, clamídia na pelve, Listeria na meningite acima de 50, MSSA na valva. As demais alternativas, como potência, mecanismo igual ou menos efeitos adversos, não ajudam a montar um esquema e levariam a drogas redundantes. Gancho: associação é remendo de espectro, e a pergunta aponta onde está o rasgo."}, {"tema": "Associações e raciocínio clínico", "nivel": "ENAMED", "tipo": "Caso clínico", "arq": "Diagnóstico + conduta", "enun": "Homem de 40 anos, previamente hígido, pneumonia leve tratada em casa, sem comorbidades. Na prova do professor, qual resposta é aceita?", "alts": ["Meropeném.", "Amoxicilina pura.", "Ceftriaxona IV.", "Azitromicina + ceftriaxona IV."], "coms": ["Errada. Arma desproporcional; carbapenêmico não é primeira linha.", "Certa. Ele aceita amoxicilina pura sem comorbidade.", "Errada. Paciente leve, em casa; não precisa de IV.", "Errada. Esquema de quem interna."], "correta": 1, "expl": "Fonte: 'o que cai', item 7.", "fio": null, "id": 175, "aprof": "Na pneumonia comunitária sem comorbidade o agente típico é o pneumococo, e a <b>amoxicilina pura<\/b> o cobre bem; com a regra do espectro mais estreito suficiente, não há razão para ceftriaxona IV, que é para quem interna, nem para azitromicina, que seria adicionada com comorbidade (para cobrir atípicos), e meropeném seria desperdício, pois carbapenêmicos nunca são primeira linha aqui. O professor afirma que, na prova dele, a amoxicilina pura é aceita nesse cenário. A confusão é achar que 'tem pneumonia, então tem que cobrir atípico'. Gancho: hígido em casa, amoxicilina; comorbidade, amoxi-clav + azitro."}, {"tema": "Associações e raciocínio clínico", "nivel": "Faculdade", "tipo": "Asserção-razão", "arq": "Asserção-razão", "enun": "Avalie as asserções e a relação entre elas.<br><br><b>I.<\/b> A peritonite bacteriana espontânea é tratada com ceftriaxona isolada, sem metronidazol.<br><br><b>PORQUE<\/b><br><br><b>II.<\/b> As bactérias que atravessam a parede intestinal na PBE são principalmente Gram-negativas aeróbias, e anaeróbios raramente participam.", "alts": ["As duas asserções são verdadeiras, e a II justifica a I.", "As duas asserções são verdadeiras, mas a II não justifica a I.", "A I é verdadeira, e a II é falsa.", "A I é falsa, e a II é verdadeira.", "As duas asserções são falsas."], "coms": ["Correta. Muitos anaeróbios no líquido sugerem perfuração (peritonite secundária). Fonte: guia g6.", "Incorreta. Exigiria as duas verdadeiras sem relação de causa. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria a I verdadeira e a II falsa. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria a I falsa e a II verdadeira. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria as duas falsas. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I."], "correta": 0, "expl": "Muitos anaeróbios no líquido sugerem perfuração (peritonite secundária). Fonte: guia g6.", "fio": null, "id": 176, "aprof": "Na cirrose com ascite, a PBE vem da translocação de bactérias do intestino para o líquido, e esses agentes são principalmente Gram-negativos entéricos aeróbios, como <i>E. coli<\/i>. A ceftriaxona cobre esses germes, e como <b>anaeróbios raramente participam<\/b>, o metronidazol não agrega nada. Por isso a II explica a I; por isso a resposta é a primeira opção (as duas verdadeiras e a II justifica a I). O contraste clínico é a peritonite secundária, em que há perfuração e flora mista, com muitos anaeróbios no líquido; aí o esquema muda e é preciso investigar cirurgicamente. Gancho: PBE é infecção de um germe só, sem perfuração; ceftriaxona sozinha."}, {"tema": "Associações e raciocínio clínico", "nivel": "Faculdade", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: Primeira linha significa que existe uma única droga correta para aquela infecção.", "alts": ["Verdadeiro", "Falso"], "coms": ["Errado. Várias drogas podem ser primeira linha ao mesmo tempo (pipe-tazo e cefepima na IRAS). Fonte: guia g7.", "Correto. Várias drogas podem ser primeira linha ao mesmo tempo (pipe-tazo e cefepima na IRAS). Fonte: guia g7."], "correta": 1, "expl": "Várias drogas podem ser primeira linha ao mesmo tempo (pipe-tazo e cefepima na IRAS). Fonte: guia g7.", "fio": null, "id": 177, "aprof": "Muitas infecções têm mais de uma opção válida, e 'primeira linha' é uma categoria, não uma droga única. Na infecção relacionada à assistência, por exemplo, <b>piperacilina-tazobactam e cefepima<\/b> são ambas primeira linha, e a escolha depende de detalhes como a necessidade de cobrir anaeróbios, que só a pipe-tazo cobre. A exceção é quando a aula é explícita: carbapenêmicos têm só duas indicações de primeira linha (meropeném para ESBL, imipeném para pâncreas). A confusão é pensar que o gabarito sempre tem uma única resposta, e então descartar uma alternativa válida. Gancho: primeira linha pode ter parceiros, não é monopólio."}, {"tema": "Associações e raciocínio clínico", "nivel": "Faculdade", "tipo": "Grade 2×2", "arq": "Grade 2×2", "enun": "Sítio e bactérias típicas (Tabela 6.1), respectivamente: seios da face/ouvido e urina/intestino/vias biliares.", "alts": ["Atípicos; estafilococos.", "Pneumococo, H. influenzae e Moraxella; Gram-negativos, com anaeróbios no intestino e na bile.", "S. pyogenes; Pseudomonas.", "Gram-negativos; pneumococo e atípicos."], "coms": ["Errada. Atípicos são do pulmão; estafilococos, da pele.", "Certa.", "Errada. S. pyogenes é da garganta; Pseudomonas, da infecção hospitalar.", "Errada. Inverte."], "correta": 1, "expl": "Fonte: Tabela 6.1.", "fio": null, "id": 178, "aprof": "Cada sítio tem sua flora típica, e é por ela que se escolhe a cobertura. <b>Seios da face e ouvido<\/b>: pneumococo, <i>H. influenzae<\/i> e <i>Moraxella<\/i>, sendo os dois últimos frequentemente produtores de betalactamase, daí a amoxicilina com clavulanato. <b>Urina, intestino e vias biliares<\/b>: Gram-negativos, com anaeróbios no intestino e na bile. As outras alternativas trocam os sítios: <i>S. pyogenes<\/i> é da garganta, Pseudomonas é de infecção hospitalar e pneumococo com atípicos é do pulmão. Gancho: ouvido e seio, três bactérias respiratórias; urina e intestino, Gram-negativos."}, {"tema": "Associações e raciocínio clínico", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Paciente com endocardite de valva nativa, aguardando hemoculturas. O esquema citado em aula é:", "alts": ["Ceftriaxona + doxiciclina.", "Ceftriaxona + azitromicina.", "Ceftriaxona + oxacilina.", "Ceftriaxona + metronidazol."], "coms": ["Errada. A doxiciclina cobre clamídia; na endocardite a lacuna é o MSSA (oxacilina).", "Errada. Azitromicina cobre atípicos (pulmão); na valva a lacuna é o MSSA.", "Certa. A oxacilina cobre o MSSA.", "Errada. Metronidazol cobre anaeróbios (intestino, bile); na endocardite a lacuna é o MSSA."], "correta": 2, "expl": "Fonte: Tabela 6.2.", "fio": null, "id": 179, "aprof": "Na endocardite de valva nativa o agente mais temido é o <i>S. aureus<\/i> sensível, o MSSA, que a ceftriaxona não cobre de forma confiável, então soma-se a <b>oxacilina<\/b>, desenvolvida justamente para o estafilococo produtor de penicilinase. Se a hemocultura vier com MRSA, a conduta muda para vancomicina ou ceftarolina. A confusão é escolher azitromicina ou doxiciclina por 'atípico' e 'clamídia', que não fazem parte da endocardite comum; e o metronidazol só vale para anaeróbios. Gancho: válvula, estafilococo, oxacilina; a lacuna da ceftriaxona aqui é o MSSA."}, {"tema": "Associações e raciocínio clínico", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Mulher de 70 anos com febre, icterícia e dor em hipocôndrio direito (tríade de Charcot). Esquema antimicrobiano:", "alts": ["Ceftriaxona + azitromicina.", "Ceftriaxona isolada.", "Ceftriaxona + ampicilina.", "Ceftriaxona + metronidazol."], "coms": ["Errada. Atípicos não são o problema da bile.", "Errada. Faltam os anaeróbios.", "Errada. Ampicilina é para Listeria na meningite.", "Certa. Bile = intestino: Gram-negativos e anaeróbios."], "correta": 3, "expl": "Fonte: Tabela 6.2.", "fio": null, "id": 180, "aprof": "Febre, icterícia e dor em hipocôndrio direito (tríade de Charcot) indicam colangite, infecção das vias biliares. A flora ali é de Gram-negativos entéricos, que a ceftriaxona cobre, mais anaeróbios, que ela não cobre; por isso se associa o <b>metronidazol<\/b>. Azitromicina cobriria atípicos, e ampicilina cobriria Listeria, nenhum desses é problema no trato biliar. A ceftriaxona sozinha seria correta só na PBE, em que os anaeróbios não participam. Gancho: bile e intestino têm anaeróbio, e onde há anaeróbio vai metronidazol (ou clindamicina)."}, {"tema": "Associações e raciocínio clínico", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Em pacientes de regiões com pneumococo resistente, qual droga pode ser somada à ceftriaxona na meningite?", "alts": ["Vancomicina.", "Doxiciclina.", "Clindamicina.", "Metronidazol."], "coms": ["Certa.", "Errada. Cobre clamídia; não trata pneumococo resistente na meningite.", "Errada. Não é usada na meningite.", "Errada. Anaeróbios não são agentes da meningite comunitária."], "correta": 0, "expl": "Fonte: resumo 6.2.", "fio": null, "id": 181, "aprof": "A ceftriaxona atravessa bem a barreira hematoencefálica e cobre o pneumococo, principal agente da meningite bacteriana. Em regiões onde o pneumococo tem resistência às cefalosporinas, a ceftriaxona sozinha pode falhar, e acrescenta-se a <b>vancomicina<\/b>, que age em Gram-positivos por outro mecanismo (liga-se ao D-alanil-D-alanina). Doxiciclina, clindamicina e metronidazol não são esquemas de meningite empírica. Não confundir com a ampicilina, adicionada acima de 50 anos para cobrir a Listeria, e não por resistência do pneumococo. Gancho: pneumococo resistente, vancomicina; Listeria, ampicilina."}, {"tema": "Associações e raciocínio clínico", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Apendicite supurada em homem de 30 anos. Além da cirurgia, o esquema antimicrobiano da aula é:", "alts": ["Ceftriaxona + oxacilina.", "Ceftriaxona + azitromicina.", "Cefazolina isolada.", "Ceftriaxona + metronidazol."], "coms": ["Errada. Esquema da endocardite; no apêndice a lacuna são os anaeróbios.", "Errada. Esquema do pulmão; o apêndice precisa de cobertura para anaeróbios.", "Errada. Cefazolina é profilaxia.", "Certa."], "correta": 3, "expl": "Fonte: Tabela 6.2.", "fio": null, "id": 182, "aprof": "A apendicite supurada é uma infecção da flora intestinal, com Gram-negativos e anaeróbios. A ceftriaxona cobre os primeiros, e o <b>metronidazol<\/b> acrescenta os anaeróbios; a cirurgia faz o controle do foco, que nunca é substituído por antibiótico. A cefazolina é profilaxia cirúrgica e não esquema terapêutico aqui; a oxacilina serve para estafilococo e a azitromicina para atípicos, e nenhum deles é o que falta. A confusão é parar na ceftriaxona e esquecer o buraco anaeróbio do abdome. Gancho: apêndice, bile, pelve e ferida profunda, ceftriaxona mais metronidazol."}, {"tema": "Associações e raciocínio clínico", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Homem de 25 anos com uretrite purulenta; Gram com diplococos Gram-negativos intracelulares. Antibiótico citado em aula:", "alts": ["Ceftriaxona IM em dose única.", "Metronidazol.", "Penicilina benzatina.", "Ceftarolina."], "coms": ["Certa.", "Errada. Só anaeróbios e protozoários (tricomonas); não pega o gonococo.", "Errada. Sífilis.", "Errada. Ceftarolina é para MRSA."], "correta": 0, "expl": "Gonorreia → ceftriaxona IM dose única. Fonte: Tabela 6.2.", "fio": null, "id": 183, "aprof": "Uretrite purulenta com diplococos Gram-negativos intracelulares é gonorreia, causada por <i>Neisseria gonorrhoeae<\/i>. A ceftriaxona cobre Neisseria muito bem e é dada em <b>dose única IM<\/b>, o que garante a adesão. Metronidazol é para anaeróbios e tricomonas, a benzatina é para sífilis e a ceftarolina é para MRSA. Atenção à nota de revisão: a aula citou 250 mg, mas o PCDT-IST 2022 recomenda 500 mg IM com azitromicina 1 g VO. Na prova do professor, vale a ceftriaxona IM em dose única. Gancho: Neisseria, ceftriaxona IM, uma vez."}, {"tema": "Associações e raciocínio clínico", "nivel": "ENAMED", "tipo": "Caso clínico", "arq": "Mecanismo dentro da clínica", "enun": "Paciente com abscesso de partes moles por S. aureus. Cultura: oxacilina R; vancomicina S; clindamicina S. O médico quer uma cefalosporina. Qual e por quê?", "alts": ["Cefazolina, por cobrir estafilococos.", "Ceftriaxona em dose dobrada.", "Ceftarolina, por se ligar à PBP2a.", "Cefepima, por ser de geração mais alta."], "coms": ["Errada. Só MSSA.", "Errada. Esquema da meningite; o abscesso de partes moles por MRSA exige ceftarolina ou vancomicina.", "Certa. MRSA.", "Errada. Gangorra: 4ª perdeu Gram+."], "correta": 2, "expl": "Fonte: resumo 3.5.", "fio": null, "id": 184, "aprof": "Oxacilina R no <i>S. aureus<\/i> é o MRSA, e isso significa que a PBP foi alterada (PBP2a), com baixa afinidade por betalactâmicos. A <b>ceftarolina<\/b>, de 5ª geração, é a única cefalosporina que se liga à PBP2a, e por isso funciona. A cefazolina, de 1ª geração, cobre MSSA mas falha no MRSA; ceftriaxona e cefepima, de gerações mais altas, perdem o Gram-positivo, e 'geração mais alta' não quer dizer 'mais ativa em tudo'. A regra do professor é: sigla MRSA, ceftarolina (ou vancomicina). Gancho: gangorra das gerações, na quinta o Gram-positivo volta."}, {"tema": "Associações e raciocínio clínico", "nivel": "ENAMED", "tipo": "Caso clínico", "arq": "Diferencial por exclusão", "enun": "Cirrótico com ascite e febre. Paracentese: 2.800 neutrófilos/mm³, Gram com flora polimicrobiana, incluindo anaeróbios, glicose baixa. O que esse padrão sugere?", "alts": ["Tuberculose peritoneal.", "Peritonite secundária (perfuração); a conduta difere da PBE, com cobertura de anaeróbios e investigação cirúrgica.", "PBE típica; ceftriaxona isolada.", "Ascite estéril; não tratar."], "coms": ["Errada. Pensa-se em TB quando predominam linfócitos.", "Certa.", "Errada. Polimicrobiana com anaeróbios sugere perfuração.", "Errada. 2.800 neutrófilos com flora polimicrobiana não é estéril."], "correta": 1, "expl": "Fonte: guia g6 e g7.", "fio": null, "id": 185, "aprof": "Na PBE típica o líquido ascítico tem muitos neutrófilos, mas o Gram é negativo ou mostra um germe só, e a glicose é normal. Aqui há 2.800 neutrófilos, <b>flora polimicrobiana com anaeróbios<\/b> e glicose baixa, o que indica contaminação por conteúdo intestinal, ou seja, <b>peritonite secundária<\/b>, por perfuração. Essa condição exige cobertura de anaeróbios e investigação cirúrgica, e não apenas ceftriaxona. A tuberculose peritoneal teria predomínio de linfócitos. A confusão é aplicar cegamente 'cirrótico com ascite e neutrófilos, PBE'. Gancho: muitos germes e anaeróbios no líquido, pense em perfuração."}, {"tema": "Associações e raciocínio clínico", "nivel": "ENAMED", "tipo": "Caso clínico", "arq": "Diagnóstico + conduta", "enun": "Adolescente de 17 anos, sexualmente ativa, com dor em baixo ventre, febre de 38,4 °C, dor à mobilização do colo e massa anexial. A mãe pergunta se pode dar 'o antibiótico mais simples'. O esquema correto, segundo a aula, inclui:", "alts": ["Ceftriaxona isolada.", "Ceftriaxona, metronidazol e doxiciclina.", "Azitromicina isolada.", "Amoxicilina isolada."], "coms": ["Errada. Faltam anaeróbios e clamídia.", "Certa. DIP: gonococo, anaeróbios e clamídia.", "Errada. Não cobre gonococo nem anaeróbios adequadamente.", "Errada. Não cobre clamídia nem gonococo resistente; não é o esquema de DIP."], "correta": 1, "expl": "Fonte: guia g6.", "fio": null, "id": 186, "aprof": "Febre, dor em baixo ventre, dor à mobilização do colo e massa anexial em mulher sexualmente ativa configuram doença inflamatória pélvica. A DIP é polimicrobiana: gonococo (ceftriaxona), anaeróbios (metronidazol) e clamídia (doxiciclina). Por isso o esquema é <b>ceftriaxona, metronidazol e doxiciclina<\/b>. Azitromicina, amoxicilina ou ceftriaxona isoladas deixam lacunas, e isso pode causar falha, infertilidade e abscesso tubo-ovariano. 'O mais simples' não é critério quando a infecção tem três grupos de agentes. Gancho: pelve e IST, três drogas para três lacunas."}, {"tema": "Associações e raciocínio clínico", "nivel": "Faculdade", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: Na PBE, predomínio de linfócitos no líquido ascítico deve levar a pensar em tuberculose ou carcinomatose.", "alts": ["Verdadeiro", "Falso"], "coms": ["Correto. Fonte: guia g7.", "Errado. Fonte: guia g7."], "correta": 0, "expl": "Fonte: guia g7.", "fio": null, "id": 187, "aprof": "O líquido ascítico infectado por bactérias é rico em <b>neutrófilos<\/b>, a célula da resposta bacteriana aguda. Quando predominam linfócitos, a inflamação é crônica e granulomatosa ou neoplásica, e a hipótese passa a ser tuberculose peritoneal ou carcinomatose. A PBE é definida por neutrófilos acima de 250/mm³, e abaixo disso, com linfócitos, outra causa deve ser buscada. A confusão é tratar tudo que é líquido ascítico inflamado como PBE. Gancho: neutrófilo, bactéria; linfócito, pense em tuberculose ou câncer."}, {"tema": "Associações e raciocínio clínico", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Valor na borda do corte", "enun": "Cirrótico com ascite, febre e dor abdominal difusa. Paracentese: 380 neutrófilos/mm³, cultura em andamento, sem pneumoperitônio. Conduta antimicrobiana:", "alts": ["Meropeném.", "Aguardar cultura, pois 380 está abaixo do corte de 500.", "Ceftriaxona isolada.", "Ceftriaxona + metronidazol."], "coms": ["Errada. Carbapenêmico não é primeira linha; PBE comunitária é ceftriaxona isolada.", "Errada. O corte é 250.", "Certa. PBE (> 250 neutrófilos) por Gram-negativos entéricos.", "Errada. PBE não leva metronidazol."], "correta": 2, "expl": "Fonte: Tabela 6.2; guia g6.", "fio": null, "id": 188, "aprof": "A PBE é diagnosticada com <b>neutrófilos acima de 250/mm³<\/b> no líquido ascítico, e não 500, que é um número de outro contexto. Com 380 já se trata, sem esperar a cultura, porque o atraso piora o prognóstico do cirrótico. Como são Gram-negativos entéricos aeróbios, a <b>ceftriaxona isolada<\/b> basta, e o metronidazol não é necessário. Meropeném é amplo demais e viola o princípio do espectro estreito suficiente. Sem pneumoperitônio, não há sinal de perfuração que sugira peritonite secundária. Gancho: mais de 250 neutrófilos, trata; ceftriaxona sozinha."}, {"tema": "Associações e raciocínio clínico", "nivel": "ENAMED", "tipo": "Dados exatos", "arq": "Diretriz atual × aula", "enun": "Para gonorreia, a aula citou ceftriaxona 250 mg. Segundo o PCDT-IST 2022 (nota de revisão), o esquema é:", "alts": ["Ceftriaxona 500 mg IM + azitromicina 1 g VO, em dose única.", "Ceftriaxona 250 mg IM isolada.", "Penicilina benzatina 2.400.000 UI.", "Ceftriaxona 1 g IV por 7 dias."], "coms": ["Certa.", "Errada. É a dose da aula, desatualizada.", "Errada. Esquema da sífilis.", "Errada. Gonorreia não complicada é dose única IM."], "correta": 0, "expl": "Fonte: resumo 6.2, nota de revisão. Na prova do professor, vale o que ele ensinou; na residência, o PCDT.", "fio": null, "id": 189, "aprof": "Esta questão tem duas camadas. Na aula o professor citou ceftriaxona 250 mg, e na prova dele vale o que ele ensinou. A nota de revisão traz o <b>PCDT-IST 2022<\/b>: ceftriaxona 500 mg IM associada a azitromicina 1 g VO, em dose única. A azitromicina entra por cobrir a clamídia, que muitas vezes acompanha a gonorreia, e pela preocupação com resistência. Benzatina é de sífilis, e a ceftriaxona IV por 7 dias seria um esquema de doença disseminada, não de uretrite. A confusão está em qual versão vale em cada prova: na do professor, a aula; na residência, o protocolo. Gancho: 500 mg + azitro."}, {"tema": "Associações e raciocínio clínico", "nivel": "Faculdade", "tipo": "Grade 2×2", "arq": "Grade 2×2", "enun": "Relacione o parceiro da ceftriaxona à lacuna coberta, respectivamente: azitromicina, ampicilina e doxiciclina.", "alts": ["Listeria; atípicos; anaeróbios.", "Anaeróbios; Listeria; atípicos.", "Atípicos; MSSA; clamídia.", "Atípicos; Listeria; clamídia."], "coms": ["Errada. Desloca tudo: azitro = atípicos, ampicilina = Listeria, doxi = clamídia.", "Errada. Azitromicina não cobre anaeróbios.", "Errada. MSSA é a oxacilina.", "Certa."], "correta": 3, "expl": "Fonte: resumo 6.2.", "fio": null, "id": 190, "aprof": "Cada parceiro preenche uma lacuna específica da ceftriaxona. A <b>azitromicina<\/b>, um macrolídeo, cobre os atípicos, que não têm parede ou vivem dentro das células e escapam dos betalactâmicos, como no pulmão. A <b>ampicilina<\/b> cobre a Listeria, bacilo Gram-positivo, na meningite acima de 50 anos. A <b>doxiciclina<\/b> cobre a clamídia, nas infecções pélvicas e IST. A confusão é trocar a ordem, em especial anaeróbios (metronidazol) e MSSA (oxacilina), que estão em outras linhas do esquema. Gancho: azitro, atípico; ampi, Listeria; doxi, clamídia."}, {"tema": "Associações e raciocínio clínico", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Homem de 32 anos, trabalhador de esgoto, com febre, mialgia intensa em panturrilhas e sufusão conjuntival após enchente. Tratamento citado em aula:", "alts": ["Ceftriaxona ou penicilina cristalina.", "Vancomicina.", "Cefazolina.", "Metronidazol."], "coms": ["Certa. Leptospirose.", "Errada. Só Gram-positivos; não cobre leptospira.", "Errada. 1ª geração; não é o esquema da leptospirose.", "Errada. Só anaeróbios."], "correta": 0, "expl": "Fonte: Tabela 6.2.", "fio": null, "id": 191, "aprof": "Febre, mialgia intensa de panturrilhas e sufusão conjuntival após exposição à água de enchente ou esgoto sugerem <b>leptospirose<\/b>, causada por espiroqueta. Espiroquetas são sensíveis à penicilina, por isso a penicilina cristalina IV é uma das opções, e a ceftriaxona também é aceita. Vancomicina só cobre Gram-positivos, a cefazolina é profilaxia cirúrgica e o metronidazol é de anaeróbios. A confusão é esquecer que penicilina cobre espiroquetas, e não só Gram-positivos. Gancho: Treponema e Leptospira, as duas espiroquetas da penicilina."}, {"tema": "Associações e raciocínio clínico", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "Segundo a Tabela 6.1, as bactérias típicas da infecção de pele e ferida cirúrgica são:", "alts": ["Gram-negativos e anaeróbios.", "Pseudomonas e bactérias resistentes.", "Pneumococo e atípicos.", "Estafilococos e estreptococos (Gram-positivos)."], "coms": ["Errada. Típicos de intestino e bile.", "Errada. Infecção hospitalar.", "Errada. Pulmão.", "Certa."], "correta": 3, "expl": "Fonte: Tabela 6.1.", "fio": null, "id": 192, "aprof": "A pele e a ferida cirúrgica são colonizadas por estafilococos e estreptococos, <b>Gram-positivos<\/b> como o <i>S. aureus<\/i> e o <i>S. pyogenes<\/i>. É por isso que a cefazolina, de 1ª geração, é a profilaxia de praticamente toda cirurgia: ela cobre exatamente essa flora. Um erro comum é achar que uma cefalosporina de 3ª geração seria 'mais forte', mas a 3ª geração é mais ativa contra Gram-negativos e menos contra Gram-positivos. As outras alternativas descrevem outros sítios: Gram-negativos e anaeróbios são do intestino e Pseudomonas é de infecção hospitalar. Gancho: pele, Gram-positivo, cefazolina."}, {"tema": "Associações e raciocínio clínico", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Mulher de 22 anos com febre, dor abdominal e secreção fétida após aborto inseguro. Esquema da aula para aborto infectado:", "alts": ["Ceftriaxona isolada.", "Ampicilina e azitromicina.", "Oxacilina, ceftriaxona e metronidazol.", "Ceftriaxona e doxiciclina."], "coms": ["Errada. Faltam oxacilina (pele) e metronidazol (anaeróbios).", "Errada. Não cobre anaeróbios nem MSSA.", "Certa.", "Errada. Esquema incompleto; o aborto infectado da aula leva oxacilina e metronidazol."], "correta": 2, "expl": "Fonte: Tabela 6.2.", "fio": null, "id": 193, "aprof": "Aborto infectado é uma infecção polimicrobiana de origem genital e pélvica, com Gram-positivos como estafilococos e estreptococos, Gram-negativos e anaeróbios. Por isso o esquema da aula é <b>oxacilina, ceftriaxona e metronidazol<\/b>: cada um preenche uma parte do espectro, a oxacilina para o estafilococo, a ceftriaxona para os Gram-negativos e o metronidazol para os anaeróbios. A ceftriaxona sozinha deixa duas lacunas, e ampicilina com azitromicina erra o alvo. A confusão é com a DIP, que usa doxiciclina para a clamídia. Gancho: aborto, três drogas, três lacunas. A justificativa da oxacilina (cobrir o estafilococo) é um raciocínio de espectro; a aula só dá o esquema."}, {"tema": "Associações e raciocínio clínico", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "Segundo a lógica da aula, o princípio para a terapia empírica é:", "alts": ["Escolher o antibiótico mais barato, independentemente do sítio.", "Começar pela opção de espectro mais estreito suficiente e escalonar em caso de falha.", "Associar sempre três antibióticos.", "Sempre começar pelo antibiótico de maior espectro e descalonar depois."], "coms": ["Errada. O sítio define as bactérias; o custo vem depois.", "Certa.", "Errada. Absoluto; a associação depende da lacuna.", "Errada. Absoluto."], "correta": 1, "expl": "Fonte: resumo 6.1.", "fio": null, "id": 194, "aprof": "Antibiótico é um recurso que gera resistência quando mal usado. Por isso a lógica da aula é <b>começar pela opção de espectro mais estreito suficiente<\/b> e escalonar se houver falha. O espectro amplo desde o início mata flora normal, favorece C. difficile e seleciona germes resistentes. Escolher só pelo preço ignora o sítio, e associar sempre três drogas não tem lógica. A alternativa 'começar largo e descalonar' é uma estratégia real em pacientes muito graves, mas não é o princípio ensinado para a escolha empírica geral. Gancho: menor arma que alcança o germe, e sobe se falhar."}, {"tema": "Associações e raciocínio clínico", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Paciente diabético com úlcera infectada no pé, com secreção fétida e celulite ao redor. Esquema da aula:", "alts": ["Ceftriaxona + azitromicina.", "Ceftriaxona isolada.", "Oxacilina isolada.", "Ceftriaxona + clindamicina."], "coms": ["Errada. Pulmão; no pé diabético faltam anaeróbios e a pele.", "Errada. Faltam anaeróbios e a cobertura da pele.", "Errada. Não cobre Gram-negativos nem anaeróbios do pé diabético.", "Certa."], "correta": 3, "expl": "Fonte: Tabela 6.2.", "fio": null, "id": 195, "aprof": "O pé diabético infectado tem flora mista, com Gram-positivos de pele, Gram-negativos e anaeróbios, esses últimos em tecido necrótico e isquêmico. A ceftriaxona cobre Gram-negativos, mas deixa lacunas, e a <b>clindamicina<\/b> cobre os Gram-positivos da pele e os anaeróbios. Ceftriaxona com azitromicina seria o esquema de pneumonia que interna, e oxacilina isolada deixaria Gram-negativos e anaeróbios sem cobertura. A confusão é tratar só celulite e ignorar a secreção fétida, que aponta para anaeróbios. Gancho: odor fétido, anaeróbio; pé diabético, ceftriaxona mais clinda."}, {"tema": "Associações e raciocínio clínico", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Paciente internado há 5 dias por fratura de fêmur desenvolve infecção urinária febril. Classificação e esquema inicial:", "alts": ["Infecção comunitária; cefalexina.", "Infecção relacionada à assistência; piperacilina-tazobactam ou cefepima.", "Infecção relacionada à assistência; meropeném de saída.", "Infecção comunitária; ceftriaxona."], "coms": ["Errada. Passou de 48 h de internação; e cefalexina não cobre Pseudomonas.", "Certa. Após 48 h de internação.", "Errada. Meropeném só após falha.", "Errada. Passou de 48 h."], "correta": 1, "expl": "Fonte: Tabela 6.2.", "fio": null, "id": 196, "aprof": "Uma infecção que surge após 48 horas de internação é <b>infecção relacionada à assistência<\/b>, e a flora hospitalar inclui Pseudomonas e bactérias resistentes. A ceftriaxona e a cefalexina não cobrem Pseudomonas, e por isso o esquema é <b>piperacilina-tazobactam ou cefepima<\/b>, ambas primeira linha. O meropeném de saída é um erro, pois carbapenêmicos entram após falha em 48 a 72 horas, exceto em ESBL ou pâncreas. A confusão é classificar como comunitária por ser 'infecção urinária comum'. O que define é o tempo de internação, não o órgão. Gancho: mais de 48 horas dentro do hospital, cubra Pseudomonas."}, {"tema": "Associações e raciocínio clínico", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Paciente na UTI há mais de 96 horas, em ventilação mecânica, com pneumonia. Segundo a questão trazida em aula, o esquema deve:", "alts": ["Ser restrito à ceftriaxona.", "Cobrir apenas anaeróbios.", "Cobrir Pseudomonas.", "Cobrir apenas pneumococo e atípicos."], "coms": ["Errada. Ceftriaxona não pega Pseudomonas.", "Errada. O alvo da pneumonia de UTI é Pseudomonas e resistentes.", "Certa. É infecção relacionada à assistência.", "Errada. Esquema comunitário."], "correta": 2, "expl": "Questão trazida em aula. Fonte: 'o que cai', item 5.", "fio": null, "id": 197, "aprof": "Pneumonia em paciente na UTI há mais de 96 horas, ventilado, é infecção relacionada à assistência, associada à ventilação. A flora do hospital inclui <b>Pseudomonas<\/b> e outros Gram-negativos resistentes, que a ceftriaxona não cobre, por isso o esquema precisa incluir Pseudomonas (por exemplo pipe-tazo ou cefepima). Restringir-se a pneumococo e atípicos é o esquema da pneumonia comunitária que interna, outra situação. A confusão é com 'pneumonia que interna', que é comunitária e usa ceftriaxona com macrolídeo, e não hospitalar. Gancho: o tempo de internação define a flora."}, {"tema": "Associações e raciocínio clínico", "nivel": "ENAMED", "tipo": "Caso clínico", "arq": "Diagnóstico + conduta", "enun": "Mulher de 64 anos, hipertensa, com tosse produtiva, febre e crepitações em base direita. FR 22, PA 128/80, SatO2 95%, orientada, ureia normal. Vai para casa. Esquema mais adequado segundo a aula:", "alts": ["Amoxicilina-clavulanato + azitromicina.", "Ceftriaxona + azitromicina.", "Amoxicilina isolada.", "Levofloxacino + vancomicina."], "coms": ["Certa. Ambulatorial com comorbidade (HAS): cobrir atípicos.", "Errada. Esquema de quem interna.", "Errada. Paciente tem comorbidade.", "Errada. Esquema fora da aula e desproporcional, com vancomicina sem indício de MRSA."], "correta": 0, "expl": "Fonte: Tabela 2.3.", "fio": null, "id": 198, "aprof": "Mulher de 64 anos com hipertensão tem comorbidade, e a pneumonia é leve e tratada em casa (parâmetros estáveis, orientada, ureia normal). A comorbidade obriga a cobrir atípicos além do pneumococo, e o esquema é <b>amoxicilina-clavulanato + azitromicina<\/b>: o clavulanato protege contra <i>H. influenzae<\/i> e <i>Moraxella<\/i> produtores de betalactamase, e a azitromicina cobre atípicos. A amoxicilina isolada é correta apenas sem comorbidade. A ceftriaxona seria para quem interna, e levofloxacino com vancomicina é exagero. Gancho: comorbidade, soma azitro; sem comorbidade, amoxicilina pura."}, {"tema": "Associações e raciocínio clínico", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Mulher de 26 anos com dor pélvica, febre, corrimento e dor à mobilização do colo. Diagnóstico de doença inflamatória pélvica. Esquema (ENAMED trazido em aula):", "alts": ["Ceftriaxona + azitromicina.", "Ceftriaxona + metronidazol + doxiciclina.", "Ceftriaxona + doxiciclina.", "Amoxicilina-clavulanato isolada."], "coms": ["Errada. Faltam os anaeróbios; o esquema da aula para DIP usa metronidazol e doxiciclina.", "Certa. Gonococo, anaeróbios e clamídia.", "Errada. Faltam os anaeróbios.", "Errada. Não cobre clamídia nem é o esquema da aula para DIP."], "correta": 1, "expl": "Questão ENAMED trazida pelo professor. Fonte: 'o que cai', item 5.", "fio": null, "id": 199, "aprof": "A DIP é polimicrobiana: gonococo e outras Gram-negativas, anaeróbios e clamídia. A ceftriaxona cobre o gonococo, mas a lacuna de anaeróbios exige o <b>metronidazol<\/b>, e a de clamídia exige a <b>doxiciclina<\/b>, daí o esquema de três drogas, que o professor trouxe de uma prova ENAMED. Ceftriaxona com azitromicina deixaria o anaeróbio descoberto, e ceftriaxona com doxiciclina também, e amoxicilina-clavulanato não é esquema de DIP. A confusão é omitir o metronidazol por parecer 'muita droga'. Gancho: pelve e IST, ceftriaxona, metronidazol, doxiciclina."}, {"tema": "Associações e raciocínio clínico", "nivel": "ENAMED", "tipo": "Caso clínico", "arq": "Diferencial por exclusão", "enun": "Idosa de 78 anos com febre e confusão. Família traz receita de glibenclamida da bolsa; dextro 112 mg/dL. Rigidez de nuca e Kernig positivo. Líquor turvo com 1.800 células (90% neutrófilos). Gram ainda não liberado. Esquema empírico:", "alts": ["Aciclovir isolado.", "Ceftriaxona isolada.", "Ceftriaxona + ampicilina.", "Glicose hipertônica e observação."], "coms": ["Errada. O líquor é bacteriano.", "Errada. Esquema de < 50 anos.", "Certa. Meningite bacteriana em ≥ 50 anos: cobrir Listeria.", "Errada. Dado-isca: o dextro normal afasta hipoglicemia."], "correta": 2, "expl": "Fonte: Tabela 6.2.", "fio": null, "id": 200, "aprof": "Rigidez de nuca, Kernig e líquor turvo com predomínio de neutrófilos indicam meningite bacteriana, e a conduta é iniciar o antibiótico sem esperar o Gram. A idade acima de 50 anos exige cobrir <i>Listeria<\/i>, então o esquema é <b>ceftriaxona + ampicilina<\/b>. A glibenclamida e o dextro de 112 excluem hipoglicemia como causa da confusão, e por isso a glicose hipertônica não ajuda. O aciclovir cobre encefalite herpética, que daria líquor com linfócitos. Gancho: acima de 50, ampicilina; sem esperar o Gram, sem atraso."}, {"tema": "Guia do Murilo", "nivel": "Decoreba", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: Os betalactâmicos são bacteriostáticos: apenas impedem a multiplicação, e a eliminação depende do sistema imune.", "alts": ["Verdadeiro", "Falso"], "coms": ["Errado. Betalactâmicos são BACTERICIDAS: inativam a PBP, a parede cede e a bactéria sofre lise osmótica. Bacteriostáticos (como a doxiciclina) só freiam o crescimento. Fonte: guia do Murilo; resumo 1.1.", "Correto. Betalactâmicos são BACTERICIDAS: inativam a PBP, a parede cede e a bactéria sofre lise osmótica. Bacteriostáticos (como a doxiciclina) só freiam o crescimento. Fonte: guia do Murilo; resumo 1.1."], "correta": 1, "expl": "Betalactâmicos são BACTERICIDAS: inativam a PBP, a parede cede e a bactéria sofre lise osmótica. Bacteriostáticos (como a doxiciclina) só freiam o crescimento. Fonte: guia do Murilo; resumo 1.1.", "fio": null, "aprof": "A diferença entre bactericida e bacteriostático está no destino da bactéria. O betalactâmico trava a PBP, a enzima que faz as ligações cruzadas do peptidoglicano; sem elas, a parede fica fraca e a pressão interna rompe a célula. Isso mata a bactéria, por isso o grupo é bactericida. Já drogas que agem no ribossomo, como a doxiciclina, costumam apenas impedir a multiplicação e dependem da defesa do paciente para eliminar o germe. A pegadinha é achar que, por ser bactericida, o tratamento pode ser curto: matar não encurta o tempo necessário. Gancho: parede quebrada, bactéria estourada.", "id": 201}, {"tema": "Guia do Murilo", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Exceção ignorada", "enun": "A produção de betalactamase é um mecanismo de resistência típico dos Gram-negativos. Qual Gram-positivo é a exceção clássica, por produzir betalactamase (penicilinase)?", "alts": ["Enterococcus faecalis.", "Listeria monocytogenes.", "Streptococcus pyogenes.", "Staphylococcus aureus."], "coms": ["Errada. O problema do enterococo com as cefalosporinas é a PBP de baixa afinidade, não a penicilinase.", "Errada. É tratada com ampicilina justamente por não ter essa resistência relevante.", "Errada. Não produz betalactamase: por isso a faringite se trata com amoxicilina sem clavulanato.", "Certa. Por isso a penicilina G não serve para o estafilococo e surgiu a oxacilina."], "correta": 3, "expl": "Guia do Murilo: betalactamase é quase exclusiva dos Gram-negativos; a exceção é o S. aureus. Fonte: resumo 1.3 e 2.3.", "fio": null, "aprof": "Nos Gram-negativos, as betalactamases ficam no espaço periplasmático, logo antes do alvo, e destroem o anel do antibiótico que acabou de passar pela porina. Os Gram-positivos não têm membrana externa nem periplasma, e o mecanismo típico deles é a PBP alterada, como no MRSA. O <i>S. aureus<\/i> é a exceção importante: libera penicilinase, e por isso a penicilina G deixou de funcionar contra ele e foi criada a oxacilina, resistente a essa enzima. O distrator mais tentador é o <i>S. pyogenes<\/i>, que continua sensível à penicilina e dispensa clavulanato. Gancho: estafilococo tem tesoura; estreptococo não.", "id": 202}, {"tema": "Guia do Murilo", "nivel": "Faculdade", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: Se o paciente melhora em 48 horas, o antibiótico pode ser suspenso antes do tempo previsto, pois o betalactâmico é bactericida.", "alts": ["Verdadeiro", "Falso"], "coms": ["Errado. Não se interrompe o antibiótico antes do tempo: bactérias remanescentes podem causar recidiva mais grave e selecionar resistência. Fonte: guia do Murilo; V/F das provas do professor ('menos de 5 dias por ser bactericida' é falso).", "Correto. Não se interrompe o antibiótico antes do tempo: bactérias remanescentes podem causar recidiva mais grave e selecionar resistência. Fonte: guia do Murilo; V/F das provas do professor ('menos de 5 dias por ser bactericida' é falso)."], "correta": 1, "expl": "Não se interrompe o antibiótico antes do tempo: bactérias remanescentes podem causar recidiva mais grave e selecionar resistência. Fonte: guia do Murilo; V/F das provas do professor ('menos de 5 dias por ser bactericida' é falso).", "fio": null, "aprof": "A melhora clínica chega antes da erradicação: a febre cai quando a carga bacteriana diminui, mas ainda restam bactérias, inclusive as que estavam em fase de crescimento lento e são menos atingidas pelo betalactâmico, que age sobre a parede em formação. Parar cedo deixa esse resto voltar a crescer, muitas vezes com quadro pior e com chance de selecionar resistência. O professor já cobrou a ideia em V ou F: 'penicilinas podem ser usadas por menos de 5 dias por serem bactericidas' é falso. A duração depende da infecção e do sítio, não do fato de a droga matar. Gancho: melhorou não é curou.", "id": 203}, {"tema": "Guia do Murilo", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Homem de 40 anos foi mordido por um cão na mão há 8 horas; a ferida é profunda e já está avermelhada. Segundo o guia do Murilo, o antibiótico indicado é:", "alts": ["Azitromicina isolada.", "Amoxicilina com clavulanato.", "Penicilina benzatina IM.", "Amoxicilina sem clavulanato."], "coms": ["Errada. Não cobre bem anaeróbios e estafilococo da mordedura.", "Certa. Cobre a flora oral do animal, com Pasteurella, estreptococos, estafilococos e anaeróbios.", "Errada. Esquema de sífilis e faringite, não de mordedura.", "Errada. Falta proteção contra betalactamases e cobertura adequada de anaeróbios e S. aureus."], "correta": 1, "expl": "Guia do Murilo: mordedura de animal → amoxicilina-clavulanato. Complemento: é o esquema consagrado (cobre Pasteurella, anaeróbios e S. aureus). Não estava nas transcrições da aula.", "fio": null, "aprof": "A boca do animal tem uma flora mista: <i>Pasteurella<\/i> (Gram-negativo típico da mordedura de cão e gato), estreptococos, <i>S. aureus<\/i> da pele e anaeróbios. A amoxicilina sozinha pega a <i>Pasteurella<\/i> e os estreptococos, mas é destruída pelas betalactamases do estafilococo e de parte dos anaeróbios. O clavulanato é o escudo que protege a amoxicilina dessas enzimas, completando o espectro. Por isso amoxicilina-clavulanato é a escolha clássica, inclusive como profilaxia em mordeduras de risco. Esse item veio do guia do Murilo e não aparecia nas transcrições das aulas. Gancho: mordeu, clavulanou.", "id": 204}, {"tema": "Guia do Murilo", "nivel": "Faculdade", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: A eficácia dos betalactâmicos pode ser ampliada com infusão prolongada (lenta), porque o efeito depende do tempo acima da CIM.", "alts": ["Verdadeiro", "Falso"], "coms": ["Correto. Betalactâmicos são tempo-dependentes; infusão prolongada ou contínua mantém a concentração acima da CIM por mais tempo. Fonte: guia do Murilo; resumo 1.5.", "Errado. Betalactâmicos são tempo-dependentes; infusão prolongada ou contínua mantém a concentração acima da CIM por mais tempo. Fonte: guia do Murilo; resumo 1.5."], "correta": 0, "expl": "Betalactâmicos são tempo-dependentes; infusão prolongada ou contínua mantém a concentração acima da CIM por mais tempo. Fonte: guia do Murilo; resumo 1.5.", "fio": null, "aprof": "O que mata no betalactâmico é manter a droga livre acima da CIM pelo maior tempo possível dentro do intervalo, e não atingir um pico alto. Na infusão rápida, a concentração sobe muito e cai, ficando parte do intervalo abaixo da CIM. Quando a mesma dose corre em 3 a 4 horas, ou em infusão contínua, a curva vira um platô acima da CIM. Isso é especialmente útil em pacientes graves. Não confunda 'infusão lenta' do betalactâmico com a da vancomicina: na vancomicina, infundir devagar evita a síndrome do homem vermelho. Gancho: betalactâmico gosta de platô.", "id": 205}, {"tema": "Guia do Murilo", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Epônimos e itens da mesma família", "enun": "Os três atípicos citados no guia são:", "alts": ["Legionella pneumophila, Chlamydophila pneumoniae e Mycoplasma pneumoniae.", "Pseudomonas, Acinetobacter e Klebsiella.", "Pneumococo, H. influenzae e Moraxella.", "Listeria, Shigella e Salmonella."], "coms": ["Certa.", "Errada. Gram-negativos hospitalares.", "Errada. São os típicos de vias aéreas, cobertos por betalactâmicos.", "Errada. Não são atípicos."], "correta": 0, "expl": "Fonte: guia do Murilo; resumo 1.4.", "fio": null, "aprof": "Os atípicos recebem esse nome porque não respondem ao tratamento típico da pneumonia com betalactâmicos. O <i>Mycoplasma<\/i> simplesmente não tem parede celular, e a <i>Chlamydophila<\/i> e a <i>Legionella<\/i> vivem dentro das células do hospedeiro, onde o betalactâmico praticamente não chega. Como o betalactâmico age inibindo a formação da parede, não adianta usá-lo em quem não tem parede ou está escondido. Por isso usam-se drogas que agem no ribossomo e penetram na célula: macrolídeos (azitromicina), doxiciclina ou quinolonas respiratórias. Gancho: LCM, Legionella, Chlamydophila, Mycoplasma, e nenhum betalactâmico.", "id": 206}, {"tema": "Guia do Murilo", "nivel": "Faculdade", "tipo": "Asserção-razão", "arq": "Asserção-razão", "enun": "Avalie as asserções e a relação entre elas.<br><br><b>I.<\/b> Nenhum betalactâmico é eficaz contra o Mycoplasma pneumoniae.<br><br><b>PORQUE<\/b><br><br><b>II.<\/b> O Mycoplasma não possui parede celular, o alvo dos inibidores da síntese de parede.", "alts": ["As duas asserções são verdadeiras, e a II justifica a I.", "As duas asserções são verdadeiras, mas a II não justifica a I.", "A I é verdadeira, e a II é falsa.", "A I é falsa, e a II é verdadeira.", "As duas asserções são falsas."], "coms": ["Correta. Não adianta inibir a formação da parede em quem não tem parede. Fonte: guia do Murilo; resumo 1.4.", "Incorreta. Exigiria as duas verdadeiras sem relação de causa. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria a I verdadeira e a II falsa. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria a I falsa e a II verdadeira. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria as duas falsas. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I."], "correta": 0, "expl": "Não adianta inibir a formação da parede em quem não tem parede. Fonte: guia do Murilo; resumo 1.4.", "fio": null, "aprof": "A asserção-razão testa se você entende o porquê. A primeira frase é verdadeira, e a segunda é exatamente a explicação: os betalactâmicos agem sobre a PBP e o peptidoglicano, e o <i>Mycoplasma<\/i> não tem parede, então não existe alvo. Para a <i>Chlamydophila<\/i> e a <i>Legionella<\/i>, o motivo é outro (são intracelulares), mas a conclusão é a mesma. Na prova, ver um desses três nomes já permite eliminar todas as alternativas com penicilina, cefalosporina ou carbapenêmico. Gancho: sem parede, sem alvo.", "id": 207}, {"tema": "Guia do Murilo", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Par ou sequência", "enun": "Segundo o guia, a penicilina G cristalina é indicada em:", "alts": ["Infecção por MSSA e por MRSA.", "Profilaxia da febre reumática e sífilis latente tardia.", "Leptospirose e neurossífilis.", "Sífilis primária e faringite estreptocócica."], "coms": ["Errada. MSSA é oxacilina; MRSA, vancomicina ou ceftarolina.", "Errada. Benzatina.", "Certa. Espiroquetas, e a cristalina IV alcança o SNC.", "Errada. São indicações da benzatina."], "correta": 2, "expl": "Fonte: guia do Murilo; Tabela 2.1.", "fio": null, "aprof": "A penicilina G existe em duas formas com o mesmo espectro: cristalina (IV, de ação rápida e nível alto) e benzatina (IM, depósito de liberação lenta). A cristalina entra quando é preciso concentração alta e rápida, inclusive no sistema nervoso central, como na neurossífilis, e em infecções graves por espiroquetas, como a leptospirose. A benzatina serve para sífilis fora do SNC, faringite e profilaxia da febre reumática, porque garante semanas de nível baixo e constante. A pegadinha é trocar as duas formas: neurossífilis nunca é benzatina. Gancho: cristalina vai ao cérebro e à lepto.", "id": 208}, {"tema": "Guia do Murilo", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Valor na borda do corte", "enun": "Mulher de 30 anos com febre reumática na infância foi submetida a troca de valva mitral por prótese. Segundo o guia, a profilaxia com benzatina deve durar:", "alts": ["Pode ser suspensa após a cirurgia, pois a valva doente foi retirada.", "Até os 25 anos.", "Até os 21 anos.", "Por toda a vida."], "coms": ["Errada. Conduta niilista; a prótese mantém o risco e exige profilaxia permanente.", "Errada. Prazo da cardite leve.", "Errada. Prazo de quem não teve cardite.", "Certa. Substituição valvar → profilaxia por toda a vida."], "correta": 3, "expl": "Guia do Murilo: sem cardite 5 anos/21; leve 10 anos/25; moderada-grave até 40 ou toda a vida; substituição valvar: toda a vida. Vale o que durar mais.", "fio": null, "aprof": "A profilaxia secundária da febre reumática existe para impedir novos surtos, porque cada reinfecção estreptocócica pode agravar a lesão das valvas. A duração cresce com a gravidade do dano: sem cardite, 5 anos ou até os 21; cardite leve, 10 anos ou até os 25; moderada ou grave, até os 40 ou por toda a vida. Quem já precisou trocar a valva teve o dano máximo e mantém a profilaxia por toda a vida. O erro clássico é achar que a cirurgia 'resolveu' o problema e permite parar. Gancho: quanto pior a valva, mais longa a benzatina; trocou a valva, é para sempre.", "id": 209}, {"tema": "Guia do Murilo", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Valor na borda do corte", "enun": "Paciente de 15 anos teve febre reumática aos 12, com cardite moderada. Pelo guia, a profilaxia vai até:", "alts": ["Os 25 anos.", "Os 40 anos ou por toda a vida.", "Os 22 anos (10 anos após o surto).", "Os 17 anos (5 anos após o surto)."], "coms": ["Errada. Prazo da cardite leve.", "Certa. Cardite moderada a grave.", "Errada. Mistura a regra da cardite leve.", "Errada. Prazo de quem não teve cardite, e ainda sem o 'até os 21'."], "correta": 1, "expl": "Fonte: guia do Murilo; 'o que cai', item 1.", "fio": null, "aprof": "Aqui o detalhe que decide é a gravidade da cardite. Na cardite moderada ou grave, a lesão valvar costuma ser permanente e a chance de piora com nova infecção é alta, por isso a profilaxia vai até os 40 anos ou por toda a vida. Os prazos de 5 anos (até 21) e 10 anos (até 25) são para quem não teve cardite ou teve cardite leve. Leia sempre a palavra que qualifica a cardite antes de fazer a conta. Gancho: sem, leve, moderada: 21, 25, 40.", "id": 210}, {"tema": "Guia do Murilo", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Diagnóstico + conduta", "enun": "Gestante de 28 semanas com febre e rigidez de nuca. O líquor mostra bacilos Gram-positivos. Agente e tratamento, segundo o guia:", "alts": ["Listeria monocytogenes; ceftriaxona isolada.", "Streptococcus pneumoniae; ampicilina.", "Listeria monocytogenes; ampicilina.", "Neisseria meningitidis; ceftriaxona isolada."], "coms": ["Errada. Agente certo, conduta errada: nenhuma cefalosporina cobre Listeria.", "Errada. Pneumococo é diplococo Gram-positivo.", "Certa. Bastonete Gram-positivo; gestantes, idosos e imunossuprimidos são grupos de risco.", "Errada. Meningococo é diplococo Gram-negativo."], "correta": 2, "expl": "Guia do Murilo: meningite por Listeria (bastonete Gram+) → ampicilina. Complemento: gestação é fator de risco clássico para Listeria.", "fio": null, "aprof": "A <i>Listeria<\/i> é um bacilo (bastonete) Gram-positivo que causa meningite em quem tem imunidade celular reduzida: idosos acima de 50 anos, gestantes, recém-nascidos e imunossuprimidos. O ponto-chave é que ela é naturalmente resistente a todas as cefalosporinas, porque suas PBP têm baixa afinidade por elas. Por isso, quando há risco de <i>Listeria<\/i>, a ceftriaxona sozinha falha e é preciso ampicilina. O distrator mais forte é o que acerta o agente e erra a droga (Listeria com ceftriaxona). Gancho: bastonete Gram+ no líquor, ampicilina na hora.", "id": 211}, {"tema": "Guia do Murilo", "nivel": "Faculdade", "tipo": "Interpretação", "arq": "Figura, gráfico ou tabela", "enun": "Adolescente com febre, petéquias e rigidez de nuca. Gram do líquor: diplococos Gram-negativos. Pelo guia, o tratamento é:", "alts": ["Cefalosporina de 3ª geração (ceftriaxona).", "Ampicilina isolada.", "Vancomicina isolada.", "Penicilina benzatina IM."], "coms": ["Certa. Meningococo.", "Errada. Ampicilina é a droga da Listeria.", "Errada. Vancomicina só cobre Gram-positivos.", "Errada. Não atinge o SNC."], "correta": 0, "expl": "Guia do Murilo: Neisseria meningitidis (diplococo Gram−) → cefalosporina. Fonte: guia g2.", "fio": null, "aprof": "Diplococos Gram-negativos no líquor, sobretudo com petéquias, apontam para <i>Neisseria meningitidis<\/i>. A ceftriaxona, cefalosporina de 3ª geração, atravessa bem a barreira hematoencefálica inflamada e cobre a <i>Neisseria<\/i>, por isso é o tratamento. A ampicilina entra quando o problema é <i>Listeria<\/i> (bacilo Gram-positivo ou idade acima de 50 anos), e a vancomicina é usada contra pneumococo resistente, nunca sozinha contra Gram-negativos. Gancho: diplococo Gram-negativo e petéquia, ceftriaxona.", "id": 212}, {"tema": "Guia do Murilo", "nivel": "ENAMED", "tipo": "Caso clínico", "arq": "Mecanismo dentro da clínica", "enun": "Paciente de UTI com pneumonia associada à ventilação por Acinetobacter baumannii multirresistente. O guia do Murilo indica ampicilina-sulbactam associada a tigeciclina. Qual componente da ampicilina-sulbactam tem atividade intrínseca contra o Acinetobacter?", "alts": ["A ampicilina.", "Os dois igualmente.", "O sulbactam.", "Nenhum dos dois; só a tigeciclina age."], "coms": ["Errada. O próprio guia lembra que o Acinetobacter é resistente à ampicilina.", "Errada. A ampicilina isolada não tem ação.", "Certa. O sulbactam, além de inibidor de betalactamase, liga-se a PBP do Acinetobacter.", "Errada. O sulbactam tem ação própria contra esse germe."], "correta": 2, "expl": "Guia do Murilo: Acinetobacter → ampicilina-sulbactam + tigeciclina, independentemente do antibiograma. Complemento (fora da aula): o sulbactam tem atividade intrínseca contra Acinetobacter; IDSA recomenda esquemas com sulbactam em combinação.", "fio": null, "aprof": "O <i>Acinetobacter baumannii<\/i> é um Gram-negativo hospitalar que acumula resistências, inclusive a carbapenêmicos. Curiosamente, o sulbactam, que na maioria das bactérias só funciona como escudo contra betalactamases, tem ação antibacteriana própria contra o <i>Acinetobacter<\/i>, porque se liga às PBP dele. A ampicilina, sozinha, não age (o guia lembra que o germe é resistente a ela). A tigeciclina, uma glicilciclina parente das tetraciclinas, entra na associação para somar mecanismos. Esse esquema veio do guia do Murilo e não estava nas transcrições; na prova, se aparecer <i>Acinetobacter<\/i>, pense em ampicilina-sulbactam com tigeciclina. Gancho: Acineto, sulbactam é quem trabalha.", "id": 213}, {"tema": "Guia do Murilo", "nivel": "Faculdade", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: Segundo o guia, no Acinetobacter usa-se ampicilina-sulbactam associada a tigeciclina independentemente do resultado do antibiograma.", "alts": ["Verdadeiro", "Falso"], "coms": ["Correto. É o que o guia afirma. Complemento: a associação se justifica pela gravidade e pela resistência frequente; o sulbactam tem ação intrínseca contra o germe. Fonte: guia do Murilo (não estava nas transcrições).", "Errado. É o que o guia afirma. Complemento: a associação se justifica pela gravidade e pela resistência frequente; o sulbactam tem ação intrínseca contra o germe. Fonte: guia do Murilo (não estava nas transcrições)."], "correta": 0, "expl": "É o que o guia afirma. Complemento: a associação se justifica pela gravidade e pela resistência frequente; o sulbactam tem ação intrínseca contra o germe. Fonte: guia do Murilo (não estava nas transcrições).", "fio": null, "aprof": "O guia frisa que a associação é usada mesmo que o antibiograma mostre resistência à ampicilina, porque não é a ampicilina que trabalha: o sulbactam tem ação direta contra o <i>Acinetobacter<\/i> e a tigeciclina soma outro mecanismo, no ribossomo. Em infecções graves por esse germe multirresistente, combinar drogas é a regra. A pegadinha seria descartar a ampicilina-sulbactam por ver 'ampicilina R' no laudo. Gancho: no Acineto, o laudo de ampicilina não manda.", "id": 214}, {"tema": "Guia do Murilo", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Absoluto com cara de protocolo", "enun": "Qual Gram-positivo NENHUMA cefalosporina, da 1ª à 5ª geração, cobre bem?", "alts": ["Enterococo.", "Streptococcus pyogenes.", "MRSA.", "MSSA."], "coms": ["Certa. Resistência intrínseca às cefalosporinas.", "Errada. Cefalosporinas de 1ª geração cobrem.", "Errada. A ceftarolina (5ª) cobre.", "Errada. A cefazolina cobre."], "correta": 0, "expl": "Guia do Murilo; resumo 3.1 (enterococo, atípicos e anaeróbios ficam de fora).", "fio": null, "aprof": "O enterococo é naturalmente resistente a todas as cefalosporinas, porque suas PBP têm baixa afinidade por elas. Isso inclui a ceftarolina, que, apesar de pegar MRSA, não resolve o enterococo. Por isso infecções por enterococo (urinárias, endocardite, intra-abdominais) são tratadas com ampicilina ou, se resistente, vancomicina. A regra da aula reúne as três lacunas de todas as cefalosporinas: enterococo, atípicos e anaeróbios. O distrator mais forte é o MRSA, que parece 'o mais difícil' mas tem a ceftarolina. Gancho: cefalosporina tem três buracos, E-A-A: enterococo, atípico, anaeróbio.", "id": 215}, {"tema": "Guia do Murilo", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "Na profilaxia cirúrgica, o guia indica cefalosporina de:", "alts": ["5ª geração (ceftarolina).", "1ª geração (cefazolina).", "4ª geração (cefepima).", "3ª geração (ceftriaxona)."], "coms": ["Errada. Reservada ao MRSA documentado.", "Certa. A flora da pele é Gram-positiva.", "Errada. Reservada a IRAS e neutropenia febril.", "Errada. 'Mais forte' contra Gram-negativos, não contra a flora da pele."], "correta": 1, "expl": "Guia do Murilo; 'o que cai', item 1 (questão que se repete todo ano).", "fio": null, "aprof": "A infecção de ferida cirúrgica vem quase sempre da própria pele do paciente, onde vivem <i>S. aureus<\/i> e estreptococos. A 1ª geração das cefalosporinas é a mais forte contra Gram-positivos (lembre a gangorra: da 1ª para a 4ª, perde Gram-positivo e ganha Gram-negativo). A cefazolina, por via IV, é barata, segura e cobre exatamente esses germes. Usar geração mais alta 'para garantir' é erro: perde-se força contra Gram-positivo e seleciona resistência. Gancho: corte na pele, cefazolina; ENADE repete todo ano.", "id": 216}, {"tema": "Guia do Murilo", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Diretriz atual × aula", "enun": "O guia diz que a cefoxitina é de 2ª geração e combate anaeróbios. Sobre isso, considerando também o que o professor disse em aula, assinale a correta:", "alts": ["É falso: nenhuma cefalosporina tem ação contra anaeróbios, sem exceção.", "É verdade, e por isso ela é a escolha preferida na peritonite.", "É falso: a cefoxitina é de 3ª geração.", "É verdade, mas o professor afirmou que esse detalhe não cai na prova dele; costuma cair em residência."], "coms": ["Errada. A cefoxitina é a exceção.", "Errada. É pouco usada: induz AmpC que a destrói.", "Errada. É de 2ª.", "Certa. Os dois dizem a verdade; o professor só avisou que não cobra."], "correta": 3, "expl": "Guia do Murilo + aula: cefoxitina é 2ª geração e pega anaeróbios, mas o professor disse 'isso não vai estar na minha prova'. Fonte: 'o que cai', item 4; resumo 3.3.", "fio": null, "aprof": "A cefoxitina é a exceção que confirma a regra das cefalosporinas: é de 2ª geração e, diferente das outras, tem ação contra anaeróbios. Na prática é pouco usada, porque induz betalactamases do tipo AmpC que acabam destruindo a própria droga. O professor comentou em aula que esse detalhe não estará na prova dele, mas ele aparece em provas de residência, e o guia do Murilo o incluiu. Saber as duas coisas evita erro em qualquer cenário. Gancho: cefOXItina, a 2ª que respira sem oxigênio.", "id": 217}, {"tema": "Guia do Murilo", "nivel": "Decoreba", "tipo": "Par ou sequência", "arq": "Par ou sequência", "enun": "Ceftazidima: geração e diferencial, respectivamente.", "alts": ["3ª geração; cobre MRSA.", "4ª geração; cobre Pseudomonas.", "5ª geração; cobre anaeróbios.", "3ª geração; cobre Pseudomonas."], "coms": ["Errada. MRSA é a ceftarolina.", "Errada. A 4ª é a cefepima, que também pega Pseudomonas.", "Errada.", "Certa. 'A Taz pega Pseudomonas'."], "correta": 3, "expl": "Guia do Murilo; o professor errou uma questão por não saber que a ceftazidima é de 3ª. Fonte: 'o que cai', item 3.", "fio": null, "aprof": "Entre as cefalosporinas de 3ª geração, a ceftriaxona é a mais usada, mas não pega <i>Pseudomonas<\/i>. A ceftazidima é a irmã de 3ª geração que pega, e essa diferença é cobrada justamente porque os nomes são parecidos. A cefepima (4ª) também pega <i>Pseudomonas<\/i>, o que gera a confusão da geração. O professor contou que errou uma questão na faculdade por achar que a ceftazidima era de 4ª. Associada ao avibactam, ela vira a melhor droga contra KPC. Gancho: TAZ, terceira que pega Pseudomonas.", "id": 218}, {"tema": "Guia do Murilo", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Mecanismo dentro da clínica", "enun": "O guia afirma que a 3ª geração 'não tem atividade contra o grupo CESP'. Diante de Enterobacter isolado com ceftriaxona sensível no antibiograma, qual é a forma correta de entender essa regra?", "alts": ["A ceftriaxona funciona, desde que em dose dobrada.", "O grupo CESP é formado por Gram-positivos, que as 3ª gerações não cobrem.", "A ceftriaxona pode até parecer ativa in vitro, mas induz a AmpC do grupo CESP e falha no tratamento; por isso deve ser evitada.", "A ceftriaxona nunca aparece sensível no antibiograma do grupo CESP."], "coms": ["Errada. Dose não resolve a indução da AmpC.", "Errada. São enterobactérias (Gram-negativos).", "Certa. É a explicação da aula.", "Errada. Pode aparecer sensível; é exatamente a pegadinha."], "correta": 2, "expl": "Guia do Murilo + aula: grupo CESP tem AmpC cromossômica induzível; evitar 3ª geração mesmo com antibiograma sensível. Fonte: resumo 4.2.", "fio": null, "aprof": "<i>Citrobacter<\/i>, <i>Enterobacter<\/i>, <i>Serratia<\/i>, <i>Proteus<\/i>, além de <i>Morganella<\/i> e <i>Providencia<\/i>, carregam no cromossomo uma betalactamase AmpC que fica 'desligada'. Na placa do laboratório, a ceftriaxona mata antes que a enzima seja ligada, e o laudo sai sensível. No paciente, a própria cefalosporina de 3ª geração induz a AmpC, que passa a destruí-la, e o tratamento falha. Por isso a frase do guia, 'não tem atividade', deve ser entendida como 'não confie nela'. Carbapenêmicos são ativos contra AmpC. Gancho: CESP, ladrão com a faca no bolso; não dê a ceftriaxona para ele.", "id": 219}, {"tema": "Guia do Murilo", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Idoso internado em uso de ceftriaxona há 6 dias apresenta diarreia aquosa com mais de 6 evacuações por dia e leucocitose. A complicação mais provável, citada no guia, é:", "alts": ["Efeito antabuse.", "Colite por Clostridioides (Clostridium) difficile.", "Síndrome do homem vermelho.", "Neurotoxicidade."], "coms": ["Errada. É do metronidazol com álcool.", "Certa. A 3ª geração elimina a flora intestinal e favorece o C. difficile.", "Errada. É da vancomicina.", "Errada. É da cefepima em renais."], "correta": 1, "expl": "Guia do Murilo: 3ª geração causa infecção por C. difficile (segunda droga mais associada, após a clindamicina). Fonte: resumo 3.4.", "fio": null, "aprof": "A ceftriaxona é muito eficaz contra a flora Gram-negativa do intestino. Ao eliminá-la, sobra espaço para o <i>Clostridioides difficile<\/i>, que forma esporos resistentes ao antibiótico, cresce e libera toxinas que inflamam o cólon. O quadro típico é diarreia aquosa volumosa, às vezes com febre e leucocitose, em paciente internado usando antibiótico. A clindamicina é a mais associada; a ceftriaxona vem em segundo. Controle: isolamento de contato e lavagem das mãos com água e sabão, porque o álcool não mata esporos. Gancho: ceftriaxona limpa o intestino, e o difficile ocupa o lugar.", "id": 220}, {"tema": "Guia do Murilo", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Paciente em quimioterapia com 200 neutrófilos/mm³ e febre de 38,6 °C. O guia indica:", "alts": ["Cefepima, que cobre Pseudomonas.", "Cefazolina.", "Ceftriaxona.", "Ertapeném."], "coms": ["Certa.", "Errada. Só Gram-positivos da pele.", "Errada. Não pega Pseudomonas.", "Errada. Não pega Pseudomonas."], "correta": 0, "expl": "Guia do Murilo; 'o que cai' (segundo tema mais cobrado das cefalosporinas).", "fio": null, "aprof": "O neutropênico perde a principal defesa contra bactérias e pode morrer em horas por uma bacteremia por Gram-negativo, sendo a <i>Pseudomonas<\/i> a mais temida. Por isso o antibiótico empírico precisa cobri-la desde o início: a cefepima, de 4ª geração, faz isso. Ceftriaxona e ertapeném são armadilhas porque parecem 'fortes', mas não pegam <i>Pseudomonas<\/i>. Na sequência da aula, se o paciente piora ou tem sinais de infecção de cateter, soma-se vancomicina, e se continua febril, um antifúngico. Gancho: cefePIMA, a que pega Pseudomonas na neutropenia.", "id": 221}, {"tema": "Guia do Murilo", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "Ceftarolina: geração e principal indicação.", "alts": ["5ª geração; KPC.", "4ª geração; Pseudomonas.", "3ª geração; meningite.", "5ª geração; MRSA."], "coms": ["Errada. KPC é ceftazidima-avibactam.", "Errada. Essa é a cefepima.", "Errada. Essa é a ceftriaxona.", "Certa. Liga-se à PBP2a."], "correta": 3, "expl": "Fonte: guia do Murilo; resumo 3.5.", "fio": null, "aprof": "A ceftarolina é a única cefalosporina que consegue se ligar à PBP2a, a PBP alterada que torna o <i>S. aureus<\/i> resistente à meticilina (MRSA). Por isso ela 'fecha a gangorra': a 5ª geração volta a ser forte contra Gram-positivos, inclusive o MRSA. Na prova do professor, a regra é direta: apareceu a sigla MRSA, pense em ceftarolina (ou vancomicina). Não confunda com a ceftazidima-avibactam, que é a droga da KPC. Gancho: Carolina pega o MRSA.", "id": 222}, {"tema": "Guia do Murilo", "nivel": "Faculdade", "tipo": "Assertivas", "arq": "Assertivas com contagem", "enun": "Sobre os carbapenêmicos, segundo o guia:<br>I. São ativos contra ESBL.<br>II. São ativos contra AmpC.<br>III. São ativos contra Pseudomonas (exceto o ertapeném).<br>IV. São ativos contra KPC.<br>Estão corretas:", "alts": ["I, II e III.", "I, II, III e IV.", "I e III.", "II e IV."], "coms": ["Certa. A IV é falsa: KPC é uma carbapenemase.", "Errada. Carbapenêmico não pega KPC.", "Errada. Também são ativos contra AmpC.", "Errada."], "correta": 0, "expl": "Guia do Murilo: carbapenêmicos ativos para ESBL, AmpC e Pseudomonas; inativos para KPC. Fonte: resumo 4.1 e 4.2.", "fio": null, "aprof": "O anel dos carbapenêmicos resiste a quase todas as betalactamases, inclusive a ESBL e a AmpC, e eles entram por porinas extras, o que explica a ação contra <i>Pseudomonas<\/i> (exceto o ertapeném). A exceção são as carbapenemases, enzimas que destroem justamente os carbapenêmicos; a mais conhecida é a KPC. Contra ela, a escolha é a ceftazidima-avibactam. A pegadinha é achar que 'o mais forte pega tudo'. Gancho: carbapenêmico vence ESBL e AmpC, mas perde para a KPC.", "id": 223}, {"tema": "Guia do Murilo", "nivel": "Decoreba", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: Os carbapenêmicos são inativos contra bactérias produtoras de KPC.", "alts": ["Verdadeiro", "Falso"], "coms": ["Correto. A KPC é uma carbapenemase: hidrolisa os carbapenêmicos. Escolha: ceftazidima-avibactam. Fonte: guia do Murilo; Tabela 4.2.", "Errado. A KPC é uma carbapenemase: hidrolisa os carbapenêmicos. Escolha: ceftazidima-avibactam. Fonte: guia do Murilo; Tabela 4.2."], "correta": 0, "expl": "A KPC é uma carbapenemase: hidrolisa os carbapenêmicos. Escolha: ceftazidima-avibactam. Fonte: guia do Murilo; Tabela 4.2.", "fio": null, "aprof": "KPC significa <i>Klebsiella pneumoniae<\/i> carbapenemase: o próprio nome diz que é uma enzima que destrói carbapenêmicos. Por isso, mesmo o meropeném, o mais potente da classe, falha contra ela. A saída é a ceftazidima-avibactam, em que o avibactam inativa a KPC e protege a ceftazidima. Na falta dela, usam-se polimixina ou aminoglicosídeo, que são nefrotóxicos. Gancho: KPC come carbapenêmico.", "id": 224}, {"tema": "Guia do Murilo", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Distrator de família", "enun": "Qual carbapenêmico NÃO tem ação contra Pseudomonas, segundo o guia?", "alts": ["Nenhum; todos pegam.", "Ertapeném.", "Meropeném.", "Imipeném."], "coms": ["Errada.", "Certa.", "Errada. É o mais potente e pega Pseudomonas.", "Errada. Pega Pseudomonas."], "correta": 1, "expl": "Fonte: guia do Murilo; Tabela 4.1.", "fio": null, "aprof": "O ertapeném é o carbapenêmico 'comunitário': dose única diária, IM ou IV, útil em pele e partes moles e no tratamento em casa. O preço dessa comodidade é o espectro: ele não pega <i>Pseudomonas<\/i> nem <i>Acinetobacter<\/i>. Meropeném e imipeném pegam. Por isso, numa infecção hospitalar em que a <i>Pseudomonas<\/i> é possível, o ertapeném é escolha errada. Gancho: ERTApeném ERra a Pseudomonas.", "id": 225}, {"tema": "Guia do Murilo", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Mecanismo dentro da clínica", "enun": "Segundo o guia, o imipeném precisa ser associado à cilastatina porque:", "alts": ["A cilastatina permite a via oral.", "A cilastatina aumenta a penetração no SNC.", "Seria degradado pela desidropeptidase renal; a cilastatina inibe essa enzima.", "A cilastatina é um inibidor de betalactamase que amplia o espectro."], "coms": ["Errada.", "Errada.", "Certa.", "Errada. Não é inibidor de betalactamase."], "correta": 2, "expl": "Guia do Murilo: imipeném é degradado pela di-hidropeptidase, salvo se associado à cilastatina; boa penetração no pâncreas. Fonte: Tabela 4.1.", "fio": null, "aprof": "No rim existe uma enzima, a desidropeptidase (di-hidropeptidase) renal, que degrada o imipeném, reduzindo seu nível e sua ação nas vias urinárias. A cilastatina não tem ação antibacteriana: ela só bloqueia essa enzima, protegendo o imipeném. Por isso a droga é vendida sempre como imipeném-cilastatina. Não confunda com os inibidores de betalactamase (clavulanato, tazobactam, avibactam), que protegem contra enzimas da bactéria, não do rim. A nota de revisão lembra que, na literatura, a cilastatina é nefroprotetora. Gancho: cilastatina guarda
