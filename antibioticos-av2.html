<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antibióticos · 230 questões</title>
<meta name="description" content="Banco de 230 questões de Antibióticos para a AV2 de Farmacologia, feito por Yuri Bolivar (Medicina Zarns, turma 41C).">
<meta name="author" content="Yuri Bolivar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
/* VOICE: estudo noturno, foco, calmo
   IDEA: o template do usuário — app escuro de cards com contorno em cobre
   PICTURE: o próprio card da questão, grande, no centro
   COLOUR and TYPE: marrom-café profundo, cobre e âmbar; DM Sans
   LAYOUT: coluna única de app, filtros em pílula, barra inferior fixa */
:root{color-scheme:dark;--bg:#17110d;--panel:#1f1712;--panel2:#271c15;--line:#5a3c26;--cu:#c98b54;--cu2:#e0a86f;--ink:#f1e6da;--mut:#b49d88;--ok:#8fbf7a;--okbg:#1f2a17;--no:#e07a62;--nobg:#2e1913}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "DM Sans",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cu2);outline-offset:2px}
.app{max-width:760px;margin:0 auto;padding:16px 16px 110px}
header{display:flex;align-items:center;gap:14px;margin:6px 0 16px}
header h1{font-size:clamp(24px,5vw,32px);line-height:1.05;margin:0;font-weight:700;text-wrap:balance}
header p{margin:4px 0 0;color:var(--mut);font-size:14px}
.ring{flex:none;width:64px;height:64px}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:0 14px;height:48px;margin-bottom:12px}
.search input{flex:1;background:none;border:0;color:var(--ink);font-size:16px;outline:none}
.search svg{flex:none;opacity:.7}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.pill{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:0 14px;height:38px;font-size:14px;color:var(--mut);white-space:nowrap}
.pill.on{border-color:var(--cu);color:var(--ink);background:var(--panel2)}
.card{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:18px}
.topics{display:grid;gap:12px}
.topic{display:grid;gap:8px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:16px}
.topic:hover{border-color:var(--cu)}
.topic b{font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mut);font-size:13px}
.bar{height:8px;border-radius:9px;background:#2f231a;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)}.bar .r{background:var(--no)}
.qhead{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:2px 8px;color:var(--mut)}
.tag.lv{color:var(--cu2);border-color:var(--cu)}
.enun{font-size:17px;margin:0 0 16px}
.alts{display:grid;gap:10px}
.alt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px;min-height:48px}
.alt .l{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--cu2)}
.alt:not([disabled]):hover{border-color:var(--cu)}
.alt[disabled]{cursor:default}
.alt.ok{border-color:var(--ok);background:var(--okbg)}.alt.ok .l{background:var(--ok);color:#13200d;border-color:var(--ok)}
.alt.no{border-color:var(--no);background:var(--nobg)}.alt.no .l{background:var(--no);color:#2a0f08;border-color:var(--no)}
.com{grid-column:2;font-size:14px;color:var(--mut);margin-top:4px}
.alt.ok .com{color:#cfe3c4}.alt.no .com{color:#f0c1b5}
.expl{margin-top:16px;border:1px dashed var(--cu);border-radius:14px;padding:14px;background:#211810}
.expl h3{margin:0 0 6px;font-size:15px;color:var(--cu2)}
.expl p{margin:0;font-size:15px}
.verdict{font-weight:700;margin:14px 0 0;font-size:16px}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--no)}
.nav{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.btn.pri{background:var(--cu);border-color:var(--cu);color:#1b120b;font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.counter{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:14px;margin:4px 2px 10px}
.link{background:none;border:0;color:var(--cu2);text-decoration:underline;padding:6px 0;min-height:44px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:14px}
.dot{height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:13px;color:var(--mut)}
.dot.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.dot.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.dot.cur{outline:2px solid var(--cu2)}
.stat{display:grid;gap:12px}
.row{display:grid;gap:6px}
.row .meta{justify-content:space-between}
h2{font-size:19px;margin:22px 0 10px}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
.big{font-size:clamp(34px,8vw,48px);font-weight:700;line-height:1;color:var(--cu2)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:6px}
.kpis .card{padding:14px}
.kpis small{color:var(--mut);font-size:13px}
textarea{width:100%;min-height:90px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;font:14px/1.4 "DM Sans",sans-serif}
.dialog{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:20px;z-index:20}
.dialog.on{display:grid}
.dialog .card{max-width:420px}
.by{margin:4px 0 0;font-size:14px;color:var(--cu2)}.by b{color:var(--ink)}
.me{flex:none;margin:0;display:grid;justify-items:center;gap:6px}.frame{width:84px;height:84px;border-radius:50%;padding:3px;background:conic-gradient(#c98b54,#e0a86f,#7a4f2e,#c98b54);box-shadow:0 0 0 4px var(--bg),0 0 0 5px var(--line)}.frame img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#271c15}.me figcaption{font-size:12px;font-weight:700;color:var(--cu2);white-space:nowrap}
.sign{display:grid;justify-items:center;text-align:center;gap:10px;margin:40px 0 10px;padding-top:24px;border-top:1px solid var(--line);color:var(--mut);font-size:14px}.sign b{color:var(--ink)}.sign p{margin:0;max-width:44ch}
@media(max-width:480px){.frame{width:62px;height:62px}.ring{width:52px;height:52px}header h1{font-size:22px}}
.memo{display:grid;justify-items:center;gap:10px;margin:4px 0 18px;text-align:center}
.memo .pic{width:150px;height:150px;border-radius:22px;padding:4px;background:conic-gradient(#c98b54,#e0a86f,#7a4f2e,#c98b54);box-shadow:0 0 0 5px var(--bg),0 0 0 6px var(--line)}
.memo img{width:100%;height:100%;border-radius:18px;object-fit:cover;display:block}
.memo h2{margin:6px 0 0;font-size:clamp(24px,5vw,30px);line-height:1.1}
.memo p{margin:0;color:var(--mut);font-size:14px;max-width:46ch}
.cai{display:grid;gap:12px}
.cai .card h3{margin:0 0 8px;font-size:17px;display:flex;gap:10px;align-items:baseline}
.cai .card h3 span{color:var(--cu2);font-size:14px;flex:none}
.cai ul{margin:0;padding-left:18px}.cai li{margin:4px 0}
.cai .q{color:var(--mut);font-size:14px;font-style:italic;margin:8px 0 0}
.cai table{width:100%;border-collapse:collapse;font-size:15px;margin-top:4px}.cai td,.cai th{border-top:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}.cai th{color:var(--cu2);width:3.2em}
.treino{margin-top:12px;height:44px;border-radius:12px;border:1px solid var(--cu);background:transparent;color:var(--cu2);padding:0 14px;font-weight:700}
.no-cai{border-color:#6b3a2c}
.pill.x{border-color:var(--cu);color:var(--cu2)}
@media(max-width:480px){nav.bottom button{font-size:11px}}
.deep{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.deep summary{cursor:pointer;color:var(--cu2);font-weight:700;font-size:15px;min-height:36px;display:flex;align-items:center}
.deep p{margin:6px 0 0;font-size:15px;line-height:1.6}
.src{font-size:12px;color:var(--cu2);border:1px solid var(--line);border-radius:6px;padding:0 5px;white-space:nowrap}
.mur{border-color:var(--cu);background:linear-gradient(160deg,#2a1d14,var(--panel))}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:#120d0aee;border-top:1px solid var(--line);backdrop-filter:blur(8px);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:10px 0;font-size:12px;color:var(--mut);min-height:60px}
nav.bottom button.on{color:var(--cu2)}
nav.bottom svg{width:22px;height:22px}
@media (prefers-reduced-motion:no-preference){.alt,.topic,.pill{transition:border-color .15s,background .15s}}
</style>
</head>

<script>
{
const Q = [{"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "Decoreba", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: A alteração da PBP aumenta a afinidade pelo betalactâmico.", "alts": ["Verdadeiro", "Falso"], "coms": ["Errado. A alteração da PBP DIMINUI a afinidade (o pedreiro muda de forma e a droga não encaixa). Afirmativa que o professor usa em prova. Fonte: 'o que cai', item 6.", "Correto. A alteração da PBP DIMINUI a afinidade (o pedreiro muda de forma e a droga não encaixa). Afirmativa que o professor usa em prova. Fonte: 'o que cai', item 6."], "correta": 1, "expl": "A alteração da PBP DIMINUI a afinidade (o pedreiro muda de forma e a droga não encaixa). Afirmativa que o professor usa em prova. Fonte: 'o que cai', item 6.", "fio": null, "id": 1, "aprof": "A <b>PBP<\/b> é a enzima que o antibiótico precisa encaixar para funcionar, e a eficácia depende da <b>afinidade<\/b> entre as duas. Na resistência por alteração da PBP, a proteína muda de forma, o betalactâmico deixa de encaixar e a afinidade <b>cai<\/b>. É o que acontece no MRSA, com a PBP2a. Por isso a afirmativa que fala em aumento de afinidade é falsa: se a afinidade aumentasse, a bactéria ficaria mais sensível, e não resistente. A confusão comum é decorar \"alteração da PBP\" como algo bom para a droga, quando é justamente o mecanismo de escape da bactéria. Pense no pedreiro que mudou de formato: a chave (o antibiótico) não serve mais. Gancho: resistência por PBP alterada sempre significa afinidade menor."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "Faculdade", "tipo": "Interpretação", "arq": "Figura, gráfico ou tabela", "enun": "Um gráfico de concentração plasmática × tempo mostra duas curvas para o mesmo intervalo: a curva X tem um pico alto logo após a dose e cai rapidamente; a curva Y se mantém em platô pouco acima da CIM durante quase todo o intervalo. Sobre a curva que representa o padrão desejado para um betalactâmico, assinale a correta:", "alts": ["As duas curvas são equivalentes, pois a dose total é a mesma.", "Curva Y, porque o efeito depende do tempo em que a concentração livre permanece acima da CIM.", "Curva X, porque o efeito depende da altura do pico em relação à CIM.", "Curva X, porque o efeito depende da área sob a curva em relação à CIM."], "coms": ["Errada. Para betalactâmicos a distribuição no tempo muda o efeito, mesmo com dose total igual.", "Certa. Betalactâmico é tempo-dependente: o platô (fT > CIM) é o que importa.", "Errada. Pico/CIM é o índice dos aminoglicosídeos (concentração-dependentes).", "Errada. AUC/CIM é o índice principal das quinolonas."], "correta": 1, "expl": "O professor disse que o gráfico com curva em pico e curva em platô cai: o betalactâmico é o platô. Fonte: 'o que cai', item 1; resumo 1.5.", "fio": null, "id": 2, "aprof": "Os betalactâmicos matam bloqueando a construção da parede, e isso só acontece enquanto há droga livre ocupando as PBP de bactérias em crescimento. Por isso o que importa é <b>por quanto tempo<\/b> a concentração livre fica acima da CIM (fT acima da CIM), e não o quão alto foi o pico. A curva Y, em platô logo acima da CIM, mantém a droga disponível quase o intervalo todo, e é o padrão desejado. A curva X, com pico alto e queda rápida, é o desenho clássico das drogas concentração-dependentes, como os aminoglicosídeos. A armadilha é pensar que pico maior mata mais, ou que a dose total basta: a mesma dose pode estar quase toda abaixo da CIM. Gancho: betalactâmico quer platô, não pico."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "Faculdade", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: Nenhum betalactâmico, nem mesmo os carbapenêmicos, atua contra bactérias atípicas.", "alts": ["Verdadeiro", "Falso"], "coms": ["Correto. Atípicos não têm parede (Mycoplasma) ou são intracelulares (Chlamydophila, Legionella). Fonte: resumo 1.4.", "Errado. Atípicos não têm parede (Mycoplasma) ou são intracelulares (Chlamydophila, Legionella). Fonte: resumo 1.4."], "correta": 0, "expl": "Atípicos não têm parede (Mycoplasma) ou são intracelulares (Chlamydophila, Legionella). Fonte: resumo 1.4.", "fio": null, "id": 3, "aprof": "Os betalactâmicos atacam a síntese da parede celular, então só funcionam se o alvo existir e estiver acessível. O <i>Mycoplasma<\/i> não tem parede nenhuma, e <i>Chlamydophila<\/i>, <i>Chlamydia<\/i> e <i>Legionella<\/i> vivem dentro das células do hospedeiro, onde esses fármacos penetram mal. Nesse raciocínio, nem a potência dos carbapenêmicos resolve, porque o problema não é a bactéria destruir a droga, é a droga não ter alvo ou não chegar nele. A afirmativa é verdadeira, e a pegadinha é achar que o meropeném, por ser \"o mais forte\", pegaria atípicos. Quem trata atípico usa macrolídeo, doxiciclina ou quinolona respiratória. Gancho: atípico apareceu, risque todos os betalactâmicos."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "Qual das drogas abaixo NÃO é um betalactâmico?", "alts": ["Ampicilina.", "Oxacilina.", "Cefalexina.", "Neomicina."], "coms": ["Errada. Aminopenicilina.", "Errada. Penicilina antiestafilocócica.", "Errada. Cefalosporina de 1ª geração.", "Certa. É um aminoglicosídeo."], "correta": 3, "expl": "Questão trazida pelo professor em aula. Fonte: 'o que cai', item 5.", "fio": null, "id": 4, "aprof": "Betalactâmico é toda droga que carrega o anel betalactâmico: penicilinas, cefalosporinas, carbapenêmicos e o aztreonam. Ampicilina e oxacilina são penicilinas, e cefalexina é cefalosporina de primeira geração. A <b>neomicina<\/b> é um aminoglicosídeo, que atua no ribossomo 30S e não tem anel betalactâmico nem relação com a parede. A confusão vem do nome: terminações como \"-micina\" enganam, e nem toda \"-micina\" é da mesma classe (azitromicina é macrolídeo, vancomicina é glicopeptídeo, clindamicina é lincosamida). Para não errar, associe o sufixo ao grupo, \"-penem\", \"cef-\" e \"-cilina\" para betalactâmicos, e \"-micina\" com cautela. Gancho: neomicina e gentamicina andam juntas, são aminoglicosídeos."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "Qual mecanismo de resistência aos betalactâmicos existe APENAS nos Gram-negativos?", "alts": ["Bombas de efluxo.", "Produção de betalactamase.", "Redução ou fechamento das porinas.", "Alteração da PBP."], "coms": ["Errada. Não é exclusivo de Gram-negativos no material e não depende de membrana externa.", "Errada. Predomina nos Gram-negativos, mas o S. aureus (Gram+) produz penicilinase.", "Certa. Porina só existe em quem tem membrana externa, ou seja, Gram-negativos.", "Errada. É o mecanismo típico do Gram-positivo MRSA (PBP2a)."], "correta": 2, "expl": "Porinas fazem parte da membrana externa, ausente nos Gram-positivos. Fonte: resumo, seção 1.3.", "fio": null, "id": 5, "aprof": "Os Gram-negativos têm uma <b>membrana externa<\/b> lipídica por fora da parede, e o antibiótico só passa por canais chamados <b>porinas<\/b>. Se a bactéria reduz ou fecha as porinas, a droga simplesmente não entra. Os Gram-positivos não têm membrana externa, então esse mecanismo não existe neles. Já a betalactamase aparece nos dois grupos (o <i>S. aureus<\/i> produz penicilinase), o efluxo é possível em vários germes e a alteração da PBP é típica do MRSA, um Gram-positivo. A armadilha é marcar betalactamase por ser a mais famosa. Ao ver \"apenas nos Gram-negativos\", pense em estrutura exclusiva deles: porina e membrana externa. Gancho: sem membrana externa, sem porina para fechar."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "Faculdade", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: A ampicilina é tempo-dependente, e por isso pode-se sugerir infusão prolongada.", "alts": ["Verdadeiro", "Falso"], "coms": ["Correto. Betalactâmicos são tempo-dependentes; infusão prolongada aumenta o tempo acima da CIM. Afirmativa verdadeira das provas do professor. Fonte: 'o que cai', item 6.", "Errado. Betalactâmicos são tempo-dependentes; infusão prolongada aumenta o tempo acima da CIM. Afirmativa verdadeira das provas do professor. Fonte: 'o que cai', item 6."], "correta": 0, "expl": "Betalactâmicos são tempo-dependentes; infusão prolongada aumenta o tempo acima da CIM. Afirmativa verdadeira das provas do professor. Fonte: 'o que cai', item 6.", "fio": null, "id": 6, "aprof": "Como o efeito dos betalactâmicos depende do tempo em que a concentração livre fica acima da CIM, qualquer estratégia que alargue esse tempo ajuda. Doses mais frequentes ou <b>infusão prolongada<\/b> fazem exatamente isso, sobretudo em paciente grave. A ampicilina é uma penicilina, logo betalactâmica, logo tempo-dependente, e a afirmativa é verdadeira. O erro comum é lembrar de infusão prolongada como \"coisa de aminoglicosídeo\" ou achar que subir a dose de uma vez compensa. Pico mais alto não adianta se a concentração cai abaixo da CIM no fim do intervalo. Gancho: betalactâmico, tempo manda; aminoglicosídeo, pico manda."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "Faculdade", "tipo": "Asserção-razão", "arq": "Asserção-razão", "enun": "Avalie as asserções e a relação entre elas.<br><br><b>I.<\/b> A vancomicina atua apenas sobre Gram-positivos.<br><br><b>PORQUE<\/b><br><br><b>II.<\/b> A vancomicina é um betalactâmico de molécula pequena que não atravessa porinas.", "alts": ["As duas asserções são verdadeiras, e a II justifica a I.", "As duas asserções são verdadeiras, mas a II não justifica a I.", "A I é verdadeira, e a II é falsa.", "A I é falsa, e a II é verdadeira.", "As duas asserções são falsas."], "coms": ["Incorreta. Exigiria as duas verdadeiras e a II explicando a I. Aqui a I é verdadeira e a II é falsa.", "Incorreta. Exigiria as duas verdadeiras sem relação de causa. Aqui a I é verdadeira e a II é falsa.", "Correta. A I é verdadeira; a II é falsa: vancomicina é glicopeptídeo (não betalactâmico) e é uma molécula GRANDE, por isso não atravessa a membrana externa. Fonte: resumo 5.2.", "Incorreta. Exigiria a I falsa e a II verdadeira. Aqui a I é verdadeira e a II é falsa.", "Incorreta. Exigiria as duas falsas. Aqui a I é verdadeira e a II é falsa."], "correta": 2, "expl": "A I é verdadeira; a II é falsa: vancomicina é glicopeptídeo (não betalactâmico) e é uma molécula GRANDE, por isso não atravessa a membrana externa. Fonte: resumo 5.2.", "fio": null, "id": 7, "aprof": "A assertiva I é verdadeira, e a razão está no tamanho e na classe. A vancomicina é um <b>glicopeptídeo<\/b>: molécula grande, que se liga ao D-alanil-D-alanina e bloqueia a montagem da parede por outro caminho. Por ser grande demais, não atravessa a membrana externa dos Gram-negativos, e por isso só pega Gram-positivos, incluindo o MRSA. A assertiva II erra em dois pontos: não é betalactâmico e não é pequena. A confusão frequente é achar que, por agir na parede, é parente das penicilinas, e que \"não passa por porina\" significa molécula pequena. Gancho: vancomicina é grande, e grande não entra no Gram-negativo."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Mecanismo dentro da clínica", "enun": "Jovem de 22 anos, com tosse seca há 10 dias, mal-estar e cefaleia, radiografia com infiltrado intersticial bilateral. O médico suspeita de Mycoplasma pneumoniae. Por que a amoxicilina não é adequada?", "alts": ["O Mycoplasma não tem parede celular, que é o alvo dos betalactâmicos.", "A amoxicilina não penetra no pulmão.", "O Mycoplasma produz betalactamase de espectro estendido.", "O Mycoplasma tem PBP2a, como o MRSA."], "coms": ["Certa. Sem parede não há PBP para inativar; nenhum betalactâmico pega atípico.", "Errada. Amoxicilina é a base do tratamento da pneumonia pneumocócica ambulatorial.", "Errada. O problema não é enzima: falta o alvo.", "Errada. PBP2a é do MRSA."], "correta": 0, "expl": "Atípicos: Mycoplasma (sem parede), Chlamydophila e Legionella (intracelulares). Nenhum betalactâmico atua; usa-se macrolídeo, doxiciclina ou quinolona respiratória. Fonte: resumo 1.4.", "fio": null, "id": 8, "aprof": "A amoxicilina é uma penicilina, e as penicilinas só funcionam inibindo as PBP que montam a parede. O <i>Mycoplasma pneumoniae<\/i> é a bactéria que <b>não tem parede celular<\/b>, então não há alvo para o betalactâmico, por mais que a droga chegue ao pulmão. O quadro de tosse seca arrastada, cefaleia e infiltrado intersticial em jovem é a pneumonia atípica clássica. A confusão é pensar que o problema seria penetração, betalactamase de espectro estendido ou PBP2a. Esses mecanismos supõem que existe parede e que a bactéria resiste, e aqui ela nem tem o alvo. O tratamento é com macrolídeo, doxiciclina ou quinolona respiratória. Gancho: sem parede, sem betalactâmico."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Uma palavra trocada", "enun": "Os betalactâmicos compartilham o anel betalactâmico. São exemplos de classes que pertencem a esse grupo:", "alts": ["Penicilinas, cefalosporinas, carbapenêmicos e monobactâmicos.", "Penicilinas, aminoglicosídeos, carbapenêmicos e monobactâmicos.", "Penicilinas, cefalosporinas, macrolídeos e monobactâmicos.", "Penicilinas, cefalosporinas, carbapenêmicos e glicopeptídeos."], "coms": ["Certa. O aztreonam é o monobactâmico.", "Errada. Aminoglicosídeo age no 30S.", "Errada. Macrolídeo age no ribossomo 50S.", "Errada. Glicopeptídeo (vancomicina) não tem anel betalactâmico."], "correta": 0, "expl": "Fonte: resumo 1.1.", "fio": null, "id": 9, "aprof": "O anel betalactâmico é a assinatura do grupo, e quatro classes o carregam: penicilinas, cefalosporinas, carbapenêmicos e monobactâmicos (o aztreonam). O que muda entre elas é o resto da molécula, que define espectro, penetração e resistência às enzimas. Os distratores trocam por outras classes de nome parecido: aminoglicosídeos e macrolídeos agem no ribossomo, e os glicopeptídeos, como a vancomicina, também agem na parede, mas por outro mecanismo e sem o anel. Agir na parede não significa ser betalactâmico. Para decidir, pergunte se a droga tem o anel e atua nas PBP. Gancho: quatro famílias com o mesmo anel, e só o aztreonam é \"mono\" por ter o anel sozinho."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "ENAMED", "tipo": "Caso clínico", "arq": "Mecanismo dentro da clínica", "enun": "Uma Klebsiella isolada em hemocultura é resistente a ceftriaxona. O laboratório mostra que ela hidrolisa o anel de penicilinas e de cefalosporinas de 3ª e 4ª geração, mas é inibida pelo clavulanato in vitro. O mecanismo e a conduta mais adequada são, respectivamente:", "alts": ["PBP2a; ceftarolina.", "KPC; meropeném.", "ESBL; meropeném.", "AmpC induzível; ceftriaxona em dose dobrada."], "coms": ["Errada. PBP2a é mecanismo do MRSA, Gram-positivo.", "Errada. KPC destrói carbapenêmicos; a conduta seria ceftazidima-avibactam.", "Certa. Betalactamase de espectro estendido → meropeném, mesmo se pipe-tazo parecer sensível.", "Errada. AmpC (grupo CESP) contraindica 3ª geração; e a ESBL não se resolve com dose."], "correta": 2, "expl": "ESBL hidrolisa penicilinas e cefalosporinas de 3ª e 4ª; tratamento: meropeném. Fonte: resumo 4.2.", "fio": null, "id": 10, "aprof": "A pista central é a enzima que <b>hidrolisa penicilinas e cefalosporinas de 3ª e 4ª gerações<\/b>: isso é a <b>ESBL<\/b>, betalactamase de espectro estendido. O clavulanato inibe a ESBL in vitro, o que ajuda a identificar o mecanismo, mas não é tratamento confiável. A conduta é o <b>meropeném<\/b>, que resiste às ESBL, mesmo se a piperacilina-tazobactam parecer sensível no antibiograma. A KPC destrói inclusive os carbapenêmicos, então o meropeném seria inútil nela. A PBP2a é do MRSA, que é Gram-positivo, e a AmpC induzível não é o quadro descrito. A troca clássica é MRSA e ESBL: sigla MRSA leva à ceftarolina, sigla ESBL leva ao meropeném. Gancho: ESBL, meropeném, sem negociar."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "O principal efeito adverso das penicilinas é:", "alts": ["Ototoxicidade.", "Reação alérgica, pelo anel betalactâmico altamente alergênico.", "Prolongamento do QT.", "Ruptura de tendão."], "coms": ["Errada. É efeito de aminoglicosídeos.", "Certa. Alergia é o principal efeito adverso.", "Errada. Macrolídeos e quinolonas.", "Errada. Quinolonas."], "correta": 1, "expl": "Fonte: resumo 1.6.", "fio": null, "id": 11, "aprof": "O anel betalactâmico é altamente alergênico, e por isso a <b>reação alérgica<\/b> é o principal efeito adverso das penicilinas, de formas leves, como urticária, até a anafilaxia. As outras alternativas pertencem a outras classes: ototoxicidade é dos aminoglicosídeos, prolongamento do QT é dos macrolídeos e das quinolonas, e ruptura de tendão é das quinolonas. A confusão é transferir efeitos adversos de classes \"mais perigosas\" para as penicilinas, que são muito seguras fora da alergia, inclusive na gestação. Para fixar, ligue cada classe ao seu efeito típico. Gancho: penicilina, alergia; aminoglicosídeo, nefro e ototoxicidade; quinolona, tendão."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "Faculdade", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: Por serem bactericidas, as penicilinas podem ser usadas por menos de 5 dias em qualquer infecção.", "alts": ["Verdadeiro", "Falso"], "coms": ["Errado. Ser bactericida não encurta automaticamente o tratamento. Afirmativa falsa das provas do professor. Fonte: 'o que cai', item 6.", "Correto. Ser bactericida não encurta automaticamente o tratamento. Afirmativa falsa das provas do professor. Fonte: 'o que cai', item 6."], "correta": 1, "expl": "Ser bactericida não encurta automaticamente o tratamento. Afirmativa falsa das provas do professor. Fonte: 'o que cai', item 6.", "fio": null, "id": 12, "aprof": "Ser bactericida significa matar a bactéria, mas não define quanto tempo o tratamento deve durar. A duração depende da infecção, do sítio, da carga bacteriana e da resposta clínica. Além disso, o betalactâmico é tempo-dependente: é preciso manter a concentração acima da CIM por tempo suficiente, e interromper cedo e de forma generalizada põe isso em risco. Tratar menos de 5 dias \"em qualquer infecção\" é uma generalização que o professor usa como falsa. A confusão é concluir \"mata, então termina logo\", misturando potência com duração. Existem esquemas curtos para algumas infecções, mas não valem para todas. Gancho: bactericida descreve como mata, não quando para."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "Faculdade", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: A ação dos betalactâmicos depende da afinidade pela PBP e de a droga conseguir chegar ao alvo.", "alts": ["Verdadeiro", "Falso"], "coms": ["Correto. Afinidade pela PBP e acesso ao alvo (porinas, betalactamases no caminho) decidem o efeito. Afirmativa das provas do professor. Fonte: 'o que cai', item 6.", "Errado. Afinidade pela PBP e acesso ao alvo (porinas, betalactamases no caminho) decidem o efeito. Afirmativa das provas do professor. Fonte: 'o que cai', item 6."], "correta": 0, "expl": "Afinidade pela PBP e acesso ao alvo (porinas, betalactamases no caminho) decidem o efeito. Afirmativa das provas do professor. Fonte: 'o que cai', item 6.", "fio": null, "id": 13, "aprof": "Para um betalactâmico funcionar são necessárias duas coisas em sequência: <b>chegar<\/b> ao alvo e <b>encaixar<\/b> nele. Chegar envolve as porinas dos Gram-negativos e as betalactamases do periplasma, que podem destruir a droga no caminho. Encaixar depende da afinidade pela PBP. Se falha qualquer uma, o efeito some, e é por isso que os mecanismos de resistência se dividem entre barrar a entrada, cortar o anel e mudar a PBP. A afirmativa une as duas etapas e é verdadeira. A confusão comum é achar que só a afinidade importa, esquecendo o acesso. Gancho: precisa entrar e precisa encaixar."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "Decoreba", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: As penicilinas são contraindicadas na gestação.", "alts": ["Verdadeiro", "Falso"], "coms": ["Errado. As penicilinas são seguras na gestação. Afirmativa falsa das provas do professor. Fonte: 'o que cai', item 6.", "Correto. As penicilinas são seguras na gestação. Afirmativa falsa das provas do professor. Fonte: 'o que cai', item 6."], "correta": 1, "expl": "As penicilinas são seguras na gestação. Afirmativa falsa das provas do professor. Fonte: 'o que cai', item 6.", "fio": null, "id": 14, "aprof": "As penicilinas estão entre os antibióticos mais seguros na gestação, e a afirmativa de contraindicação é falsa. O exemplo mais forte é a sífilis: a penicilina benzatina é o tratamento da gestante, e se houver alergia a recomendação é dessensibilizar e usar penicilina, e não trocar por outro antibiótico. Quem deve ser evitado na gestação são classes como a doxiciclina e as quinolonas. A confusão é generalizar \"antibiótico na gestação é perigoso\". Para não cair, lembre-se de que o risco depende da classe e que o anel betalactâmico traz o problema da alergia, e não da gravidez. Gancho: gestante com sífilis, penicilina sempre."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "ENAMED", "tipo": "Múltipla escolha", "arq": "Diretriz atual × aula", "enun": "Paciente com alergia não grave à amoxicilina precisa de antibiótico betalactâmico. Sobre a reação cruzada, segundo a literatura atual citada nas notas de revisão, é correto:", "alts": ["É mínima entre amoxicilina e cefalexina, pois pertencem a classes diferentes.", "É maior com carbapenêmicos do que com cefalosporinas.", "É de cerca de 10% com qualquer cefalosporina, porque todas compartilham o anel betalactâmico.", "Depende mais das cadeias laterais do que do anel, sendo menor que 1% com carbapenêmicos e aztreonam."], "coms": ["Errada. Amoxicilina e cefalexina têm cadeia lateral semelhante: é o par de maior risco.", "Errada. Com carbapenêmicos é abaixo de 1%.", "Errada. Número antigo; a cruzada é baixa e ligada à cadeia lateral.", "Certa. A cadeia lateral é o principal determinante."], "correta": 3, "expl": "Nota de revisão: a cruzada depende das cadeias laterais; maior entre amoxicilina e cefalexina. Fonte: resumo 1.6.", "fio": null, "id": 15, "aprof": "A alergia a uma penicilina costuma ser dirigida à <b>cadeia lateral<\/b> da molécula, e não ao anel em si. Por isso a reação cruzada depende de quão parecidas são as cadeias entre a droga que causou a alergia e a nova. Ela é maior quando a cadeia é igual, como entre amoxicilina e cefalexina, e fica abaixo de 1% com carbapenêmicos e aztreonam. A armadilha é a ideia de que \"todos compartilham o anel, então todos cruzam\", o que superestima o risco, ou de que classes diferentes nunca cruzam, o que ignora a cadeia lateral idêntica. Segundo a nota de revisão, é isto que vale como literatura atual. Gancho: o que cruza é a cadeia lateral, não o anel."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "ENAMED", "tipo": "Asserção-razão", "arq": "Asserção-razão", "enun": "Avalie as asserções e a relação entre elas.<br><br><b>I.<\/b> Os Gram-negativos tendem a ser mais resistentes aos betalactâmicos do que os Gram-positivos.<br><br><b>PORQUE<\/b><br><br><b>II.<\/b> Nos Gram-negativos, o antibiótico depende de porinas para atravessar a membrana externa e é exposto a betalactamases concentradas no periplasma.", "alts": ["As duas asserções são verdadeiras, e a II justifica a I.", "As duas asserções são verdadeiras, mas a II não justifica a I.", "A I é verdadeira, e a II é falsa.", "A I é falsa, e a II é verdadeira.", "As duas asserções são falsas."], "coms": ["Correta. A II explica a I: a membrana externa, com porinas e betalactamases no periplasma, é a razão da maior resistência. Fonte: resumo 1.2.", "Incorreta. Exigiria as duas verdadeiras sem relação de causa. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria a I verdadeira e a II falsa. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria a I falsa e a II verdadeira. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria as duas falsas. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I."], "correta": 0, "expl": "A II explica a I: a membrana externa, com porinas e betalactamases no periplasma, é a razão da maior resistência. Fonte: resumo 1.2.", "fio": null, "id": 16, "aprof": "A assertiva I é verdadeira e a II explica o porquê. O Gram-positivo é \"aberto\": a parede espessa fica exposta e o antibiótico chega direto às PBP. O Gram-negativo tem uma <b>membrana externa<\/b> a ser atravessada por porinas, e no espaço periplasmático as betalactamases ficam concentradas, prontas para cortar o anel. Duas barreiras em série aumentam muito a chance de a droga não chegar viva à PBP. A confusão comum é pensar que parede espessa significa mais resistência, quando a espessura não protege o Gram-positivo do antibiótico. Em asserção-razão, teste se a II realmente causa a I: aqui causa. Gancho: Gram-negativo tem porta estreita e guardas lá dentro."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "Decoreba", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: As penicilinas retiram cálcio e magnésio da membrana externa dos Gram-negativos.", "alts": ["Verdadeiro", "Falso"], "coms": ["Errado. Esse é o mecanismo das polimixinas. Penicilinas inativam a PBP. Pegadinha clássica do professor. Fonte: guia g1.", "Correto. Esse é o mecanismo das polimixinas. Penicilinas inativam a PBP. Pegadinha clássica do professor. Fonte: guia g1."], "correta": 1, "expl": "Esse é o mecanismo das polimixinas. Penicilinas inativam a PBP. Pegadinha clássica do professor. Fonte: guia g1.", "fio": null, "id": 17, "aprof": "Os betalactâmicos agem por um mecanismo único: inativam a <b>PBP<\/b> e impedem as ligações cruzadas do peptidoglicano. Retirar cálcio e magnésio da membrana externa, desestruturando-a como um detergente, é o mecanismo das <b>polimixinas<\/b> (como a colistina), usadas como última linha em Gram-negativos multirresistentes. Por isso a afirmativa é falsa. A confusão é natural, pois os dois grupos atingem estruturas do envelope bacteriano. Para separar, lembre que o betalactâmico atua na parede, por dentro da membrana externa, e a polimixina age na própria membrana externa. Gancho: polimixina é o detergente, penicilina é o veneno do pedreiro."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Distrator de família", "enun": "Paciente com suspeita de Legionella. Qual das opções abaixo tem atividade contra esse agente?", "alts": ["Azitromicina.", "Piperacilina-tazobactam.", "Ceftriaxona.", "Meropeném."], "coms": ["Certa. Macrolídeo cobre atípicos.", "Errada. Betalactâmico; não pega atípico.", "Errada. Cefalosporina não pega atípico.", "Errada. Nem o carbapenêmico, o betalactâmico mais amplo, cobre atípico."], "correta": 0, "expl": "Regra de prova: apareceu Mycoplasma, Chlamydia ou Legionella, elimine todos os betalactâmicos. Fonte: guia g1.", "fio": null, "id": 18, "aprof": "A <i>Legionella<\/i> é uma bactéria atípica de localização intracelular, e os betalactâmicos penetram mal dentro das células do hospedeiro. Por isso nenhum deles funciona, e isso inclui a piperacilina-tazobactam, a ceftriaxona e o meropeném, apesar de serem potentes. Os fármacos que atuam são os macrolídeos, como a azitromicina, a doxiciclina e as quinolonas respiratórias. A armadilha é escolher o carbapenêmico por ser \"o mais amplo\", esquecendo que amplo para bactérias com parede não é amplo para atípicos. A regra prática do professor serve de atalho: apareceu <i>Mycoplasma<\/i>, <i>Chlamydia<\/i> ou <i>Legionella<\/i>, elimine todos os betalactâmicos. Gancho: atípico, olhe primeiro para o macrolídeo."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Uma palavra trocada", "enun": "Sobre o MRSA, assinale a correta:", "alts": ["Resiste por fechar as porinas da membrana externa.", "Expressa PBP2a, que tem alta afinidade pelos betalactâmicos.", "É sensível à oxacilina, mas resistente à penicilina G.", "Expressa PBP2a, que tem baixa afinidade pelos betalactâmicos."], "coms": ["Errada. S. aureus é Gram-positivo e não tem membrana externa.", "Errada. Uma palavra trocada: alta afinidade tornaria a droga eficaz.", "Errada. Isso descreve o MSSA. O R do MRSA é resistência à meticilina/oxacilina.", "Certa. A PBP alterada diminui a afinidade."], "correta": 3, "expl": "MRSA = PBP2a, menor afinidade. Fonte: resumo 1.3.", "fio": null, "id": 19, "aprof": "O MRSA resiste porque expressa a <b>PBP2a<\/b>, uma PBP alterada com <b>baixa afinidade<\/b> pelos betalactâmicos. O antibiótico não se encaixa nela, e a bactéria segue montando a parede. O \"R\" de MRSA é de resistência à meticilina, e por extensão à oxacilina, então é errado dizer que é sensível à oxacilina. Fechar porinas é um mecanismo de Gram-negativos, e o <i>S. aureus<\/i> é Gram-positivo. A confusão frequente é achar que a PBP2a aumenta a afinidade, o que contradiz o próprio conceito de resistência. A ceftarolina é a cefalosporina que consegue se ligar à PBP2a, e a vancomicina age por outro caminho. Gancho: PBP2a, pedreiro de outro formato."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Mecanismo dentro da clínica", "enun": "Na analogia da aula, a parede bacteriana é um muro de tijolos. Qual correspondência está CORRETA?", "alts": ["A PBP é a tesoura que corta o anel; a betalactamase é o pedreiro que monta a parede.", "A PBP é o pedreiro que une os tijolos; a betalactamase é a tesoura que corta o anel do antibiótico.", "O clavulanato é o pedreiro substituto quando a PBP está alterada.", "A porina é o pedreiro; a PBP é a porta de entrada do antibiótico."], "coms": ["Errada. Inverte os papéis: a PBP monta, a betalactamase destrói o antibiótico.", "Certa. É exatamente a analogia usada em aula.", "Errada. O clavulanato é um escudo (inibidor de betalactamase), não substitui a PBP.", "Errada. A porina é o canal (a porta) da membrana externa dos Gram-negativos."], "correta": 1, "expl": "PBP = pedreiro (transpeptidase); betalactamase = tesoura; porina = porta. Fonte: resumo, seções 1.1 e 1.3.", "fio": null, "id": 20, "aprof": "Guarde a analogia como um mapa de funções. A parede é o muro, e a <b>PBP<\/b> é o pedreiro que une os tijolos, ou seja, faz as ligações cruzadas. O antibiótico atrapalha o pedreiro. A <b>betalactamase<\/b> é a tesoura da bactéria, que corta o anel do antibiótico antes de ele agir. Já a porina é a porta pela qual a droga entra, e o clavulanato é o escudo que protege o antibiótico da tesoura. A confusão é inverter os papéis de PBP e betalactamase, porque ambas \"mexem\" na molécula. Para decidir, pergunte quem constrói e quem destrói: a PBP constrói a parede, a betalactamase destrói o antibiótico. Gancho: pedreiro constrói, tesoura corta."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Grade 2×2", "enun": "Relacione a classe ao índice farmacodinâmico mais associado à eficácia, respectivamente: betalactâmico, aminoglicosídeo e quinolona.", "alts": ["AUC/CIM; pico/CIM; fT > CIM.", "fT > CIM; AUC/CIM; pico/CIM.", "fT > CIM; pico/CIM; AUC/CIM.", "Pico/CIM; fT > CIM; AUC/CIM."], "coms": ["Errada. Betalactâmico não é AUC-dependente; quinolona não é tempo-dependente.", "Errada. Troca aminoglicosídeo e quinolona.", "Certa. Tempo acima da CIM; pico; exposição total.", "Errada. Troca betalactâmico e aminoglicosídeo."], "correta": 2, "expl": "Betalactâmico = tempo; aminoglicosídeo = pico; quinolona = AUC. Fonte: resumo 1.5.", "fio": null, "id": 21, "aprof": "Cada classe tem um jeito de matar que define o índice que prediz sucesso. Os betalactâmicos dependem do <b>tempo<\/b> acima da CIM (fT acima da CIM). Os aminoglicosídeos são concentração-dependentes: quanto maior o pico em relação à CIM, mais matam, então o índice é pico sobre CIM. Nas quinolonas, o índice principal é a exposição total, a <b>AUC/CIM<\/b>. A pegadinha é embaralhar as três palavras: tempo, pico e área. Uma forma de fixar é associar o desenho: platô para betalactâmico, pico para aminoglicosídeo e área para quinolona. Gancho: tempo, pico, área, na ordem betalactâmico, aminoglicosídeo, quinolona."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "ENAMED", "tipo": "Interpretação", "arq": "Figura, gráfico ou tabela", "enun": "Um estudo compara, em pacientes graves, o mesmo betalactâmico em doses intermitentes (linha contínua, com picos e vales que caem abaixo da CIM no fim de cada intervalo) e em infusão contínua (linha pontilhada, estável acima da CIM). Qual interpretação é a mais adequada?", "alts": ["A infusão contínua mantém a concentração livre acima da CIM por mais tempo, otimizando o índice que prediz eficácia dos betalactâmicos.", "A infusão contínua aumenta o risco de resistência, pois a concentração nunca atinge um pico.", "O esquema intermitente é superior, pois os picos mais altos aumentam a morte bacteriana dos betalactâmicos.", "Os dois esquemas são equivalentes, pois a área sob a curva é semelhante."], "coms": ["Certa. Betalactâmico é tempo-dependente; o vale abaixo da CIM é o problema do esquema intermitente.", "Errada. Não há pico 'necessário' para betalactâmicos; manter acima da CIM é o objetivo.", "Errada. Pico alto é vantagem para concentração-dependentes (aminoglicosídeos).", "Errada. AUC/CIM é o índice das quinolonas; para betalactâmico importa o tempo acima da CIM."], "correta": 0, "expl": "fT > CIM é o índice dos betalactâmicos; infusão prolongada é recomendada sobretudo em pacientes graves. Fonte: resumo 1.5 e figura de infusão contínua.", "fio": null, "id": 22, "aprof": "A figura mostra exatamente o conceito de tempo-dependência. Em doses intermitentes, a concentração cai abaixo da CIM no fim de cada intervalo, e nesse intervalo a bactéria cresce sem pressão do antibiótico. Na infusão contínua, a concentração fica estável acima da CIM, maximizando o <b>fT acima da CIM<\/b>, índice que prediz eficácia dos betalactâmicos. Por isso, em pacientes graves, a infusão prolongada é uma estratégia recomendada. A confusão está em achar que pico alto é melhor, ou que áreas iguais tornam os esquemas equivalentes: para betalactâmicos, a mesma área com tempo diferente gera efeito diferente. Gancho: o que vale é quanto tempo acima da CIM, e não o formato do pico."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "Faculdade", "tipo": "Assertivas", "arq": "Assertivas com contagem", "enun": "Sobre o envelope bacteriano e os betalactâmicos:<br>I. Nos Gram-positivos, a parede é espessa e exposta, e o antibiótico chega diretamente às PBP.<br>II. Nos Gram-negativos, o antibiótico precisa atravessar porinas e enfrenta betalactamases no espaço periplasmático.<br>III. Por ter parede espessa, o Gram-positivo é naturalmente mais resistente aos betalactâmicos que o Gram-negativo.<br>IV. Gram-positivos coram de roxo; Gram-negativos, de vermelho.<br>Estão corretas:", "alts": ["I, II, III e IV.", "I, II e IV.", "I e IV.", "II e III."], "coms": ["Errada. A III inverte a lógica.", "Certa. A III é falsa: a parede espessa é exposta; o Gram-negativo resiste mais pela membrana externa.", "Errada. A II também está correta.", "Errada. A III é falsa e faltam I e IV."], "correta": 1, "expl": "Gram-negativo resiste mais: membrana externa, porinas e betalactamases no periplasma. Fonte: resumo 1.2, Tabela 1.1.", "fio": null, "id": 23, "aprof": "Revise o envelope bacteriano. Nos Gram-positivos, a parede é espessa e <b>exposta<\/b>, e o antibiótico chega direto às PBP. Nos Gram-negativos, a parede é fina e fica escondida atrás da membrana externa, o que exige passar por porinas e enfrentar betalactamases no periplasma. A coloração de Gram reflete isso: Gram-positivo cora de roxo e Gram-negativo de vermelho. A assertiva III é a pegadinha, pois confunde espessura com resistência. A parede grossa do Gram-positivo não protege dos betalactâmicos, que chegam facilmente ao alvo, e o Gram-negativo é que resiste mais. Gancho: resistência vem do que está na frente da parede, e não da espessura dela."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Epônimos e itens da mesma família", "enun": "Clavulanato, sulbactam, tazobactam e avibactam têm em comum o fato de serem:", "alts": ["Betalactâmicos de amplo espectro usados isoladamente em infecções graves.", "Carbapenêmicos de uso oral.", "Inibidores de betalactamase, sem ação antibacteriana relevante isolada.", "Inibidores da desidropeptidase renal."], "coms": ["Errada. Não são usados como antibiótico isolado.", "Errada. Não são carbapenêmicos.", "Certa. São escudos que protegem o betalactâmico.", "Errada. Isso é a cilastatina, associada ao imipeném."], "correta": 2, "expl": "Os quatro são inibidores de betalactamase (escudos). Fonte: guia g1.", "fio": null, "id": 24, "aprof": "Esses quatro nomes são <b>inibidores de betalactamase<\/b>. Funcionam como escudos que se ligam à enzima da bactéria e a inativam, protegendo o betalactâmico parceiro, como em amoxicilina-clavulanato, ampicilina-sulbactam, piperacilina-tazobactam e ceftazidima-avibactam. Isoladamente não têm ação antibacteriana relevante, então não são antibióticos de uso solo. Não são carbapenêmicos, e a inibição da desidropeptidase renal é papel da cilastatina, associada ao imipeném. Um cuidado: o avibactam cobre várias betalactamases, mas não as metalobetalactamases, como a NDM. Gancho: sufixo \"-bactam\" e clavulanato são escudos, e o parceiro é o soldado."}, {"tema": "Bases: mecanismo, resistência e farmacodinâmica", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "Os betalactâmicos são bactericidas porque:", "alts": ["Ligam-se à subunidade 30S do ribossomo e interrompem a síntese proteica.", "Inibem a DNA girase e impedem a replicação do DNA bacteriano.", "Desestruturam a membrana externa dos Gram-negativos como um detergente.", "Inativam as PBP, impedindo as ligações cruzadas do peptidoglicano, o que leva à lise osmótica da bactéria em crescimento."], "coms": ["Errada. 30S é o alvo de aminoglicosídeos e tetraciclinas (doxiciclina).", "Errada. DNA girase é o alvo das quinolonas.", "Errada. Esse é o mecanismo das polimixinas (colistina).", "Certa. A PBP (o 'pedreiro') é inativada pelo anel, que imita o D-alanil-D-alanina; sem ligações cruzadas, a parede cede e a célula estoura."], "correta": 3, "expl": "O anel betalactâmico imita a extremidade D-Ala-D-Ala e inativa a PBP de forma covalente; sem ligações cruzadas, ocorre lise osmótica. Fonte: resumo, seção 1.1.", "fio": null, "id": 25, "aprof": "Os betalactâmicos têm um alvo preciso: a <b>PBP<\/b>, que faz as ligações cruzadas do peptidoglicano. O anel imita a extremidade D-alanil-D-alanina e inativa a enzima de forma covalente. Sem novas ligações, a parede enfraquece enquanto a bactéria continua crescendo, a água entra e a célula sofre <b>lise osmótica<\/b>. Daí vem o caráter bactericida. As outras alternativas descrevem mecanismos de classes diferentes: 30S é de aminoglicosídeos e tetraciclinas, DNA girase é de quinolonas e o efeito de detergente é das polimixinas. A confusão é decorar \"bactericida\" sem o mecanismo. Gancho: parede fraca mais bactéria crescendo igual a lise."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Assertivas", "arq": "Assertivas com contagem", "enun": "Sobre a piperacilina-tazobactam:<br>I. É primeira linha nas infecções relacionadas à assistência, ao lado da cefepima.<br>II. Tem vantagem sobre a cefepima por cobrir anaeróbios.<br>III. É boa opção na meningite, pela ótima penetração no SNC.<br>IV. É o tratamento de escolha para bactérias produtoras de ESBL.<br>Assinale:", "alts": ["Apenas I, II e IV estão corretas.", "Todas estão corretas.", "Apenas I e II estão corretas.", "Apenas I está correta."], "coms": ["Errada. ESBL → meropeném, mesmo com pipe-tazo 'sensível'.", "Errada. A III (meningite) e a IV (ESBL) são falsas.", "Certa. III e IV são falsas: penetra mal no SNC e não serve para ESBL.", "Errada. A II também está correta."], "correta": 2, "expl": "Fonte: resumo 2.5.", "fio": null, "id": 26, "aprof": "A piperacilina-tazobactam é a penicilina mais potente e a única ativa contra <i>Pseudomonas<\/i>, com o tazobactam protegendo-a de betalactamases. É primeira linha, ao lado da cefepima, nas infecções relacionadas à assistência, e tem a vantagem de cobrir também anaeróbios. A assertiva III falha porque ela penetra mal no SNC e não serve para meningite. A IV é a pegadinha clássica: para ESBL o tratamento é o meropeném, mesmo quando o antibiograma mostra a pipe-tazo como sensível. Isso porque o teste in vitro não reproduz a produção da enzima no organismo. Gancho: pipe-tazo cobre muito, mas não cérebro e não ESBL."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "A oxacilina foi desenvolvida para tratar:", "alts": ["S. aureus resistente à meticilina (MRSA).", "Pseudomonas aeruginosa.", "Gram-negativos comunitários, como E. coli.", "S. aureus produtor de penicilinase, sensível à meticilina (MSSA)."], "coms": ["Errada. O R de MRSA é justamente resistência à meticilina/oxacilina.", "Errada. A única penicilina antipseudomonas é a pipe-tazo.", "Errada. A oxacilina não cobre Gram-negativos.", "Certa."], "correta": 3, "expl": "Fonte: resumo 2.3.", "fio": null, "id": 27, "aprof": "A história das penicilinas é uma corrida contra a resistência. O <i>S. aureus<\/i> passou a produzir <b>penicilinase<\/b>, que cortava a penicilina natural, e a oxacilina foi criada para resistir a essa enzima. Por isso é indicada no <b>MSSA<\/b>, em infecções graves como artrite séptica, abscessos e endocardite de valva nativa. Ela não resolve o MRSA, que resiste por outra via, a PBP2a. Também não foi feita para Gram-negativos ou Pseudomonas, o campo das aminopenicilinas e da pipe-tazo. A confusão é associar \"estafilococo\" a qualquer droga antiestafilocócica. Gancho: oxacilina é a droga do MSSA, e a vancomicina ou a ceftarolina são as do MRSA."}, {"tema": "Penicilinas", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "Antibiótico de escolha na neurossífilis:", "alts": ["Penicilina G benzatina IM, semanal por 3 semanas.", "Penicilina G cristalina IV.", "Ceftriaxona IM, dose única.", "Penicilina G benzatina IM, dose única."], "coms": ["Errada. Esquema da sífilis tardia ou de duração ignorada.", "Certa. Questão trazida em aula.", "Errada. Dose única de ceftriaxona é o esquema da gonorreia.", "Errada. A benzatina não atinge nível adequado no SNC."], "correta": 1, "expl": "Neurossífilis = cristalina. Fonte: guia g2.", "fio": null, "id": 28, "aprof": "A neurossífilis exige penicilina em concentração suficiente no sistema nervoso central, e por isso se usa a <b>cristalina IV<\/b>, que atinge níveis elevados no líquor. A benzatina IM é uma formulação de depósito, de liberação lenta, e serve para as outras formas de sífilis, mas não produz concentração liquórica adequada para tratar o SNC. A ceftriaxona não é o esquema de escolha aqui. A confusão é achar que \"sífilis é benzatina\" sempre, o que vale para as formas primária, secundária e latente, e não para a neurossífilis. Gancho: sistema nervoso central, cristalina na veia."}, {"tema": "Penicilinas", "nivel": "Decoreba", "tipo": "Dados exatos", "arq": "Corte vizinho", "enun": "Na profilaxia secundária da febre reumática, a dose e o intervalo da penicilina benzatina citados em aula são:", "alts": ["1.200.000 UI a cada 21 dias.", "2.400.000 UI a cada 21 dias.", "1.200.000 UI a cada 7 dias.", "600.000 UI a cada 30 dias."], "coms": ["Certa. Fonte: 'o que cai', item 1.", "Errada. 2.400.000 UI é a dose da sífilis.", "Errada. Semanal é o esquema da sífilis tardia (com 2.400.000 UI).", "Errada. Não é o esquema da aula."], "correta": 0, "expl": "Benzatina 1.200.000 UI a cada 21 dias. Fonte: resumo 2.2.", "fio": null, "id": 29, "aprof": "A benzatina é a penicilina de depósito que garante exposição por cerca de três semanas, e a profilaxia secundária da febre reumática explora isso: <b>1.200.000 UI a cada 21 dias<\/b>. O objetivo é impedir novas infecções por <i>S. pyogenes<\/i> que reativariam a doença e agravariam a cardite. Os distratores trocam dose e intervalo. A dose de 2.400.000 UI é a da sífilis, e intervalos de 7 ou 30 dias não correspondem ao esquema. A confusão frequente é misturar as doses de sífilis e de febre reumática, ambas com benzatina. Gancho: sífilis tem 2,4 milhões; febre reumática tem 1,2 milhão a cada 21 dias."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Distrator de família", "enun": "Criança de 5 anos com otite média aguda que não melhorou com amoxicilina. O motivo mais provável da falha e a troca adequada são:", "alts": ["S. pyogenes; trocar por benzatina.", "Pneumococo produtor de betalactamase; amoxicilina com clavulanato.", "Infecção por atípicos; trocar por ceftriaxona.", "H. influenzae ou Moraxella produtores de betalactamase; amoxicilina com clavulanato."], "coms": ["Errada. S. pyogenes não é o agente típico da otite.", "Errada. O pneumococo resiste por PBP alterada, não por betalactamase.", "Errada. Atípico não é causa típica de otite, e ceftriaxona não pega atípico.", "Certa. O clavulanato protege a amoxicilina."], "correta": 3, "expl": "Otite e sinusite: pneumococo, H. influenzae e Moraxella (com betalactamase) → amoxi-clav. Fonte: Tabela 2.3.", "fio": null, "id": 30, "aprof": "A otite média e a sinusite têm três agentes principais: pneumococo, <i>H. influenzae<\/i> e <i>Moraxella<\/i>. O uso maciço de amoxicilina selecionou <i>H. influenzae<\/i> e <i>Moraxella<\/i> produtores de <b>betalactamase<\/b>, que cortam a amoxicilina. Em falha de tratamento, a explicação mais provável é essa, e a solução é o <b>clavulanato<\/b>, o escudo contra a enzima. O <i>S. pyogenes<\/i> não produz betalactamase e causa faringite, não otite típica. A alternativa do pneumococo erra porque o mecanismo do pneumococo não é betalactamase. Atípicos não são causa típica de otite, e a ceftriaxona também não é a troca habitual. Gancho: falhou a amoxicilina na otite, ponha o escudo."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Termo que soa como gravidade", "enun": "Gestante de 18 semanas, assintomática, sem lesões, com VDRL 1:64 e teste treponêmico reagente. Não sabe quando se infectou. A conduta é:", "alts": ["Penicilina benzatina 2.400.000 UI em dose única.", "Penicilina benzatina 2.400.000 UI semanal por 3 semanas.", "Adiar o tratamento para depois do parto, pois a penicilina é contraindicada na gestação.", "Penicilina cristalina IV por 14 dias."], "coms": ["Errada. Dose única só na primária, secundária ou latente recente.", "Certa. Latente sem data = tratar como tardia.", "Errada. Penicilina é segura e obrigatória na gestante.", "Errada. Esse é o tratamento da neurossífilis."], "correta": 1, "expl": "Questão trazida em aula. Sífilis sem data → benzatina semanal × 3 (7.200.000 UI). Fonte: resumo 2.2, Tabela 2.2.", "fio": null, "id": 31, "aprof": "A sífilis se classifica por tempo. A latente de duração ignorada é tratada como <b>tardia<\/b>, porque, sem saber quando houve a infecção, não se pode assumir que seja recente. A tardia exige três doses de benzatina, 2.400.000 UI por semana, num total de 7.200.000 UI. Gestante assintomática, sem lesões, com VDRL positivo e teste treponêmico reagente, que \"não sabe quando se infectou\", cai exatamente nesse caso. A penicilina não é contraindicada na gestação, então adiar o tratamento é erro grave. A dose única é a da forma recente, e a cristalina é para neurossífilis. Gancho: sem data, é tardia, e tardia leva três semanas."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Interpretação", "arq": "Figura, gráfico ou tabela", "enun": "Gram do líquor de paciente de 74 anos com meningite: bacilos Gram-positivos. O agente provável e o antibiótico que precisa estar no esquema são:", "alts": ["H. influenzae; amoxicilina-clavulanato.", "Pneumococo; vancomicina.", "Listeria monocytogenes; ampicilina.", "Meningococo; ceftriaxona isolada."], "coms": ["Errada. É cocobacilo Gram-negativo.", "Errada. Pneumococo é diplococo Gram-positivo lanceolado.", "Certa.", "Errada. Meningococo é diplococo Gram-negativo."], "correta": 2, "expl": "Gram do líquor (certo de cair): bacilo Gram+ = Listeria → ampicilina. Fonte: guia g2.", "fio": null, "id": 32, "aprof": "O Gram do líquor ajuda a escolher o antibiótico antes da cultura. <b>Bacilos Gram-positivos<\/b> numa meningite apontam para <i>Listeria monocytogenes<\/i>, que é um bacilo, ao contrário do pneumococo e do meningococo, que são diplococos. A ceftriaxona não cobre <i>Listeria<\/i>, então a ampicilina precisa estar no esquema. Isso é especialmente importante em maiores de 50 anos, como este paciente de 74. A confusão é escolher ceftriaxona sozinha por ser a droga da meningite, ou vancomicina por haver Gram-positivo. A vancomicina é para pneumococo resistente. Gancho: bacilo Gram-positivo no líquor, garanta a ampicilina."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Interpretação", "arq": "Figura, gráfico ou tabela", "enun": "Adulto de 30 anos com meningite. Gram do líquor: diplococos Gram-negativos. Qual a conduta antimicrobiana, segundo o guia da aula?", "alts": ["Ceftriaxona isolada.", "Ceftriaxona + ampicilina.", "Penicilina benzatina IM.", "Ceftriaxona + vancomicina obrigatória."], "coms": ["Certa. Meningococo → só ceftriaxona.", "Errada. Ampicilina é para Listeria (bacilo Gram+ ou ≥ 50 anos).", "Errada. A benzatina não alcança o SNC.", "Errada. A vancomicina é para pneumococo resistente."], "correta": 0, "expl": "Diplococo Gram− = meningococo → ceftriaxona. Fonte: guia g2.", "fio": null, "id": 33, "aprof": "Diplococos Gram-negativos no líquor indicam <b>meningococo<\/b>, que é sensível à ceftriaxona. Nesse caso, ela sozinha basta, em dose dobrada pelo perfil de meningite. Não há por que acrescentar ampicilina, que serve à <i>Listeria<\/i>, um bacilo Gram-positivo e típico de idosos, e a vancomicina fica para o pneumococo em regiões com resistência. A armadilha é associar tudo \"por segurança\" no esquema empírico, quando o Gram já restringiu o agente. A benzatina é de uso intramuscular e não serve para meningite. Gancho: diplococo Gram-negativo, ceftriaxona sozinha; bacilo Gram-positivo, ampicilina junto."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "A penicilina benzatina é usada por via intramuscular porque:", "alts": ["Forma um depósito que libera o fármaco lentamente durante cerca de três semanas, garantindo a adesão.", "Tem espectro maior que a cristalina.", "Atravessa melhor a barreira hematoencefálica.", "Não é absorvida por via oral e é destruída no plasma."], "coms": ["Certa.", "Errada. O espectro é igual ao da cristalina.", "Errada. Não serve para neurossífilis.", "Errada. O motivo é o depósito de liberação lenta."], "correta": 0, "expl": "Fonte: resumo 2.2.", "fio": null, "id": 34, "aprof": "A benzatina é pouco solúvel, e por isso, depois da injeção intramuscular, forma um <b>depósito<\/b> no músculo que libera a penicilina G lentamente durante cerca de três semanas. Isso mantém níveis baixos mas sustentados e garante a <b>adesão<\/b>, algo valioso na sífilis, na faringite estreptocócica e na profilaxia da febre reumática. Não amplia o espectro, que é o mesmo da cristalina, e não melhora a passagem pela barreira hematoencefálica, o que é a razão de não servir na neurossífilis. A confusão é pensar que a via IM \"faz mais\" que a IV. Ela só muda a farmacocinética. Gancho: benzatina é depósito, não espectro novo."}, {"tema": "Penicilinas", "nivel": "ENAMED", "tipo": "Asserção-razão", "arq": "Asserção-razão", "enun": "Avalie as asserções e a relação entre elas.<br><br><b>I.<\/b> A piperacilina-tazobactam é adequada para tratar meningite hospitalar por Pseudomonas.<br><br><b>PORQUE<\/b><br><br><b>II.<\/b> A piperacilina-tazobactam é a única penicilina ativa contra Pseudomonas.", "alts": ["As duas asserções são verdadeiras, e a II justifica a I.", "As duas asserções são verdadeiras, mas a II não justifica a I.", "A I é verdadeira, e a II é falsa.", "A I é falsa, e a II é verdadeira.", "As duas asserções são falsas."], "coms": ["Incorreta. Exigiria as duas verdadeiras e a II explicando a I. Aqui a I é falsa e a II é verdadeira.", "Incorreta. Exigiria as duas verdadeiras sem relação de causa. Aqui a I é falsa e a II é verdadeira.", "Incorreta. Exigiria a I verdadeira e a II falsa. Aqui a I é falsa e a II é verdadeira.", "Correta. A I é falsa: pipe-tazo penetra mal no SNC e não serve para meningite. A II é verdadeira. Fonte: resumo 2.5.", "Incorreta. Exigiria as duas falsas. Aqui a I é falsa e a II é verdadeira."], "correta": 3, "expl": "A I é falsa: pipe-tazo penetra mal no SNC e não serve para meningite. A II é verdadeira. Fonte: resumo 2.5.", "fio": null, "id": 35, "aprof": "A assertiva II é verdadeira: a piperacilina-tazobactam é a única penicilina com atividade contra <i>Pseudomonas<\/i>. Mas ela não justifica a I. Em meningite, o antibiótico precisa atingir concentração adequada no sistema nervoso central, e a pipe-tazo <b>penetra mal<\/b> nele, portanto não serve. Ter o espectro certo não basta, é preciso chegar ao sítio da infecção. A armadilha é deduzir \"cobre Pseudomonas, então serve para qualquer Pseudomonas\". Em meningite, pense primeiro em penetração no SNC, e a pipe-tazo não é a escolha. Gancho: espectro mais penetração, as duas coisas."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Diferencial por exclusão", "enun": "Estudante de 19 anos com faringite exsudativa e febre recebeu amoxicilina. No 3º dia surgiu exantema maculopapular difuso. Ao exame: linfonodos cervicais posteriores aumentados, edema periorbitário e baço palpável. Qual a interpretação mais provável?", "alts": ["Alergia à penicilina; deve evitar betalactâmicos pelo resto da vida.", "Mononucleose infecciosa pelo EBV; o exantema pela amoxicilina não indica alergia verdadeira.", "Escarlatina; trocar por amoxicilina-clavulanato.", "Síndrome de Stevens-Johnson; internação imediata em UTI."], "coms": ["Errada. Rótulo de alergia indevido; é a reação típica da mononucleose.", "Certa. Linfonodo posterior + esplenomegalia + rash após amoxicilina.", "Errada. Esplenomegalia e linfonodos posteriores apontam para EBV.", "Errada. Não há lesão mucosa nem descolamento."], "correta": 1, "expl": "Fonte: resumo 2.4; guia g2 (pegadinha).", "fio": null, "id": 36, "aprof": "A amoxicilina em quem tem faringite viral pelo EBV costuma provocar um exantema maculopapular que <b>não é alergia verdadeira<\/b>. O contexto diferencia: linfonodos cervicais posteriores, edema periorbitário e esplenomegalia são típicos de mononucleose. Por isso o paciente não precisa ser rotulado como alérgico à penicilina, o que o privaria de um grupo muito útil de antibióticos. A armadilha é tratar todo exantema após penicilina como alergia, ou pensar em Stevens-Johnson, que cursa com lesões em mucosas e quadro grave. Escarlatina também não explica o baço e o edema periorbitário. Gancho: faringite, exantema pós-amoxicilina e baço palpável, pense em EBV."}, {"tema": "Penicilinas", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Distrator de família", "enun": "O que a ampicilina cobre a mais que a amoxicilina?", "alts": ["Pseudomonas e Acinetobacter.", "Mycoplasma e Legionella.", "Listeria e Shigella.", "MRSA."], "coms": ["Errada. Nenhuma aminopenicilina pega.", "Errada. Atípicos; nenhum betalactâmico pega.", "Certa.", "Errada. Nenhuma aminopenicilina pega MRSA (PBP2a)."], "correta": 2, "expl": "Fonte: Tabela 2.1.", "fio": null, "id": 37, "aprof": "A ampicilina tem o espectro da amoxicilina, ou seja, Gram-positivos, Gram-negativos comunitários e anaeróbios quando associada a um inibidor, e ganha duas bactérias: a <b>Listeria<\/b>, bacilo Gram-positivo, e a <b>Shigella<\/b>. A ampicilina é de uso intravenoso, enquanto a amoxicilina é oral, o que a leva ao paciente internado. Por isso a ampicilina entra na meningite em maiores de 50 anos, ao lado da ceftriaxona. Ela não cobre <i>Pseudomonas<\/i>, MRSA nem atípicos. A confusão é achar que \"ampicilina é mais forte\" e cobre Pseudomonas, o que é papel da pipe-tazo. Gancho: ampicilina é a amoxicilina na veia, com <i>Listeria<\/i> de bônus."}, {"tema": "Penicilinas", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "A penicilina G cristalina, além da neurossífilis, é primeira linha em:", "alts": ["Pielonefrite por E. coli.", "Pneumonia por Legionella.", "Infecção por MRSA.", "Leptospirose."], "coms": ["Errada. A penicilina natural não cobre Gram-negativos.", "Errada. Atípico; betalactâmico não pega.", "Errada. MRSA → vancomicina ou ceftarolina.", "Certa. Cristalina cobre espiroquetas (Treponema, Leptospira)."], "correta": 3, "expl": "Fonte: Tabela 2.1.", "fio": null, "id": 38, "aprof": "A cristalina e a benzatina são penicilina G, com o mesmo espectro estreito: Gram-positivos sensíveis e espiroquetas, como <i>Treponema<\/i> e <i>Leptospira<\/i>. Por isso, além da neurossífilis, a cristalina é primeira linha na <b>leptospirose<\/b>, que é causada por uma espiroqueta. Pielonefrite por <i>E. coli<\/i> é Gram-negativo, fora do espectro da penicilina G. A <i>Legionella<\/i> é atípica e o MRSA é resistente. A confusão é lembrar da penicilina só para sífilis e esquecer que \"espiroqueta\" inclui a leptospira. A ceftriaxona também é opção na leptospirose. Gancho: espiroqueta, penicilina G."}, {"tema": "Penicilinas", "nivel": "Decoreba", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: A penicilina benzatina e a penicilina cristalina têm o mesmo espectro.", "alts": ["Verdadeiro", "Falso"], "coms": ["Correto. As duas são penicilina G; mudam a via e a duração. Fonte: Tabela 2.1.", "Errado. As duas são penicilina G; mudam a via e a duração. Fonte: Tabela 2.1."], "correta": 0, "expl": "As duas são penicilina G; mudam a via e a duração. Fonte: Tabela 2.1.", "fio": null, "id": 39, "aprof": "As duas formulações contêm penicilina G. O que muda é a <b>via e a farmacocinética<\/b>. A cristalina é IV, de uso hospitalar, com níveis altos e curta duração, e a benzatina é IM, de depósito, liberada por cerca de três semanas. Como o princípio ativo é o mesmo, o espectro é o mesmo: Gram-positivos sensíveis e espiroquetas, sem Gram-negativos, sem atípicos e sem <i>S. aureus<\/i> produtor de penicilinase. A diferença de uso decorre da farmacocinética: neurossífilis e leptospirose pedem a cristalina, e sífilis comum, faringite e profilaxia da febre reumática usam a benzatina. Gancho: mesma droga, formulações diferentes, mesmo espectro."}, {"tema": "Penicilinas", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "A única penicilina com atividade contra Pseudomonas é:", "alts": ["Oxacilina.", "Ampicilina-sulbactam.", "Amoxicilina-clavulanato.", "Piperacilina-tazobactam."], "coms": ["Errada. Antiestafilocócica (MSSA); não pega Gram-negativos.", "Errada. Pega Gram-negativos comunitários, não Pseudomonas.", "Errada. O clavulanato protege contra betalactamase de H. influenzae e Moraxella, mas não dá cobertura de Pseudomonas.", "Certa."], "correta": 3, "expl": "Fonte: resumo 2.5.", "fio": null, "id": 40, "aprof": "A \"evolução\" das penicilinas foi ampliando o alcance: a natural, a oxacilina contra o MSSA, as aminopenicilinas que cruzam porinas dos Gram-negativos comunitários e, no topo, a <b>piperacilina-tazobactam<\/b>, a única que alcança <i>Pseudomonas<\/i>. Por isso é primeira linha na infecção relacionada à assistência, ao lado da cefepima, e cobre ainda anaeróbios. Oxacilina é de Gram-positivos, e amoxicilina-clavulanato e ampicilina-sulbactam, apesar do escudo, não atingem <i>Pseudomonas<\/i>. A armadilha é achar que qualquer inibidor de betalactamase amplia o espectro até a <i>Pseudomonas<\/i>. O escudo protege a droga, mas não muda a capacidade dela de entrar. Gancho: Pseudomonas na família da penicilina, só a pipe-tazo."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Mecanismo dentro da clínica", "enun": "Por que a amoxicilina atinge Gram-negativos comunitários que a penicilina G não atinge?", "alts": ["Por agir no ribossomo bacteriano.", "Por ter molécula menor e mais hidrofílica, atravessa as porinas da membrana externa.", "Por se ligar à PBP2a.", "Por ser resistente a todas as betalactamases."], "coms": ["Errada. É betalactâmico; age na PBP.", "Certa.", "Errada. Quem se liga à PBP2a é a ceftarolina.", "Errada. Por isso precisa de clavulanato contra H. influenzae e Moraxella."], "correta": 1, "expl": "Fonte: resumo 2.4.", "fio": null, "id": 41, "aprof": "Gram-negativos exigem que a droga passe pelas porinas. A penicilina G é maior e menos hidrofílica, então tem dificuldade de atravessar. A amoxicilina tem molécula <b>menor e mais hidrofílica<\/b>, que passa pelas porinas e chega às PBP dos Gram-negativos comunitários. Isso mostra que o espectro é determinado em grande parte pela estrutura física da molécula, e não por ela agir em local diferente: o mecanismo continua sendo a inibição da PBP. As outras alternativas confundem: ribossomo é de outras classes, PBP2a é do MRSA, e nenhuma penicilina resiste a todas as betalactamases, motivo da associação com clavulanato. Gancho: menor e mais hidrofílica passa pela porina."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Asserção-razão", "arq": "Asserção-razão", "enun": "Avalie as asserções e a relação entre elas.<br><br><b>I.<\/b> Na faringite estreptocócica, a amoxicilina pode ser usada sem clavulanato.<br><br><b>PORQUE<\/b><br><br><b>II.<\/b> O Streptococcus pyogenes não produz betalactamase.", "alts": ["As duas asserções são verdadeiras, e a II justifica a I.", "As duas asserções são verdadeiras, mas a II não justifica a I.", "A I é verdadeira, e a II é falsa.", "A I é falsa, e a II é verdadeira.", "As duas asserções são falsas."], "coms": ["Correta. Sem betalactamase não há o que inibir; o clavulanato é desnecessário. Fonte: Tabela 2.3.", "Incorreta. Exigiria as duas verdadeiras sem relação de causa. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria a I verdadeira e a II falsa. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria a I falsa e a II verdadeira. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria as duas falsas. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I."], "correta": 0, "expl": "Sem betalactamase não há o que inibir; o clavulanato é desnecessário. Fonte: Tabela 2.3.", "fio": null, "id": 42, "aprof": "O clavulanato só é necessário quando a bactéria produz betalactamase. O <i>S. pyogenes<\/i> <b>não produz<\/b>, então a amoxicilina simples, em 10 dias, ou a benzatina resolvem a faringite estreptocócica. A assertiva II explica a I: sem enzima a inibir, o escudo não acrescenta nada. A amoxicilina-clavulanato como primeira escolha na faringite seria um excesso de espectro. Já na otite e na sinusite, com <i>H. influenzae<\/i> e <i>Moraxella<\/i> produtores de betalactamase, o clavulanato é necessário. A confusão é usar \"mais forte\" onde não há necessidade. Gancho: sítio decide: garganta é amoxicilina pura, ouvido e seio levam o escudo."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Assertivas com contagem", "enun": "Questão de prova do professor. Avalie: (1) oxacilina cobre Gram-negativos; (2) benzatina cobre atípicos; (3) amoxicilina cobre Pseudomonas; (4) ampicilina cobre Listeria. Assinale a alternativa correta:", "alts": ["Apenas a 1 e a 4 são verdadeiras.", "Apenas a 2 e a 4 são verdadeiras.", "Apenas a 4 é verdadeira.", "Todas são falsas."], "coms": ["Errada. Oxacilina não cobre Gram-negativos.", "Errada. Nenhum betalactâmico cobre atípicos.", "Certa. Ampicilina cobre bastonetes Gram-positivos (Listeria).", "Errada. A 4 é verdadeira."], "correta": 2, "expl": "Questão trazida em aula. Fonte: 'o que cai', item 5.", "fio": null, "id": 43, "aprof": "Esta questão testa se você associa cada droga ao seu espectro real. A oxacilina é uma droga de Gram-positivos, o MSSA, e não alcança Gram-negativos, porque falta a capacidade de atravessar as porinas. A benzatina tem o espectro da penicilina G e não cobre atípicos, que não têm parede ou são intracelulares. A amoxicilina atravessa as porinas dos Gram-negativos comunitários, mas não cobre <i>Pseudomonas<\/i>, que é do domínio da pipe-tazo. A única verdadeira é a 4: a ampicilina cobre <i>Listeria<\/i>, o bacilo Gram-positivo da meningite do idoso. Gancho: ampicilina e Listeria, o par que o professor não esquece."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Valor na borda do corte", "enun": "Criança de 10 anos, após febre reumática, ficou com lesão mitral residual leve. A profilaxia com benzatina a cada 21 dias deve durar:", "alts": ["10 anos ou até os 25 anos, o que durar mais.", "Até os 40 anos ou por toda a vida.", "10 anos, terminando aos 20 anos.", "5 anos ou até os 21 anos, o que durar mais."], "coms": ["Certa. Cardite leve: 10 anos ou até 25.", "Errada. Prazo da lesão moderada ou grave.", "Errada. Esquece o 'até os 25, o que durar mais'.", "Errada. Prazo de quem não teve cardite."], "correta": 0, "expl": "Questão do professor. Fonte: 'o que cai', item 5; resumo 2.2.", "fio": null, "id": 44, "aprof": "A profilaxia secundária da febre reumática protege o coração de novos surtos, e o tempo depende do dano. Sem cardite, são 5 anos ou até os 21 anos. Na cardite leve, 10 anos ou até os 25 anos. Na lesão moderada ou grave, até os 40 anos ou por toda a vida. Vale sempre o prazo que durar <b>mais<\/b>. A criança de 10 anos com lesão mitral residual leve se encaixa em cardite leve: 10 anos levariam aos 20, mas até os 25 dura mais, logo é o prazo a seguir. A armadilha é escolher \"10 anos\" e parar nos 20. O mesmo raciocínio vale para o grupo sem cardite, de 5 anos ou até os 21. Gancho: leve, 10 ou 25; sem cardite, 5 ou 21; vale o maior."}, {"tema": "Penicilinas", "nivel": "Decoreba", "tipo": "Dados exatos", "arq": "Corte vizinho", "enun": "Na sífilis latente tardia ou de duração ignorada, a dose total de penicilina benzatina é:", "alts": ["2.400.000 UI.", "3.600.000 UI.", "7.200.000 UI.", "4.800.000 UI."], "coms": ["Errada. Dose total da sífilis recente.", "Errada. Confunde com 1.200.000 UI × 3.", "Certa. 2.400.000 UI × 3 semanas.", "Errada. Seriam só 2 doses."], "correta": 2, "expl": "Fonte: Tabela 2.2.", "fio": null, "id": 45, "aprof": "A sífilis é tratada por estágio. A forma recente (primária, secundária e latente recente) é resolvida com uma dose de 2.400.000 UI de benzatina, 1.200.000 UI em cada glúteo. As formas <b>latente tardia, de duração ignorada e terciária<\/b> pedem mais tempo de exposição, então são três doses semanais da mesma dose: 3 x 2.400.000 = 7.200.000 UI no total. A armadilha é o \"2.400.000 UI\", que é a dose de uma aplicação, e não o total do esquema longo. Nas opções, 3.600.000 e 4.800.000 são intermediários que não correspondem a nenhum esquema. Gancho: três semanas de 2,4 milhões somam 7,2 milhões."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Interpretação", "arq": "Grade 2×2", "enun": "Relacione o achado do Gram do líquor ao agente: (1) diplococos Gram-negativos junto a polimorfonucleares; (2) diplococos Gram-positivos lanceolados.", "alts": ["(1) H. influenzae; (2) pneumococo.", "(1) meningococo; (2) pneumococo.", "(1) pneumococo; (2) meningococo.", "(1) meningococo; (2) Listeria."], "coms": ["Errada. H. influenzae é cocobacilo, não diplococo.", "Certa.", "Errada. Inverte.", "Errada. Listeria é bacilo Gram-positivo."], "correta": 1, "expl": "Fonte: guia g2 (tabela do Gram do líquor); resumo 2.4 (figuras).", "fio": null, "id": 46, "aprof": "O Gram do líquor associa morfologia e coloração a um agente. <b>Diplococos Gram-negativos<\/b> perto de polimorfonucleares sugerem o meningococo (<i>Neisseria meningitidis<\/i>). <b>Diplococos Gram-positivos lanceolados<\/b> são o pneumococo. Já o bacilo Gram-positivo é a <i>Listeria<\/i>. A confusão mais comum é trocar a coloração: o Gram-negativo cora de vermelho e o Gram-positivo de roxo, e diplococo é só o formato. A <i>H. influenzae<\/i> é um cocobacilo Gram-negativo, que não aparece como diplococo nesta descrição. Isso importa, porque a conduta muda: meningococo é ceftriaxona sozinha, e a <i>Listeria<\/i> exige ampicilina. Gancho: forma mais cor mais agente."}, {"tema": "Penicilinas", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Uma palavra trocada", "enun": "Sobre a ampicilina, assinale a correta:", "alts": ["É de uso intravenoso, tem o espectro da amoxicilina mais Listeria e Shigella, e é usada no paciente internado.", "É de uso intravenoso e cobre MRSA.", "É de uso oral, tem o espectro da amoxicilina mais Listeria e S
