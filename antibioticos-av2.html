o imipeném do rim.", "id": 226}, {"tema": "Guia do Murilo", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Paciente com pancreatite necrosante e necrose infectada. Pelo guia, qual carbapenêmico tem boa penetração no pâncreas?", "alts": ["Ceftazidima-avibactam.", "Imipeném-cilastatina.", "Aztreonam.", "Ertapeném."], "coms": ["Errada. Não é carbapenêmico.", "Certa.", "Errada. É monobactâmico, não carbapenêmico.", "Errada."], "correta": 1, "expl": "Fonte: guia do Murilo; Tabela 4.1 (uma das exceções em que carbapenêmico é 1ª linha).", "fio": null, "aprof": "A regra da aula diz que carbapenêmico nunca é primeira linha, com duas exceções: infecção por ESBL (meropeném) e infecção do pâncreas (imipeném). A necrose pancreática infectada é de difícil acesso para muitos antibióticos, e o imipeném alcança boa concentração no tecido pancreático, além de cobrir Gram-negativos e anaeróbios intestinais que costumam infectar a necrose. Gancho: pâncreas pede imipeném.", "id": 227}, {"tema": "Guia do Murilo", "nivel": "ENAMED", "tipo": "Múltipla escolha", "arq": "Absoluto com cara de protocolo", "enun": "O guia diz que 'ertapeném + meropeném pegam KPC'. A interpretação mais correta, segundo a aula, é:", "alts": ["É uma estratégia de resgate (duplo carbapenêmico): ertapeném como isca e meropeném 1 hora depois; nem sempre funciona, e a primeira escolha é ceftazidima-avibactam.", "Funciona porque o ertapeném inibe a KPC, como o clavulanato.", "É a primeira escolha para KPC, superior à ceftazidima-avibactam.", "Os dois devem ser dados juntos na mesma infusão."], "coms": ["Certa.", "Errada. O ertapeném é consumido pela enzima; funciona como isca.", "Errada. A primeira escolha é ceftazidima-avibactam.", "Errada. O meropeném vem cerca de 1 hora depois."], "correta": 0, "expl": "Guia do Murilo + aula: duplo carbapenêmico é resgate, não primeira linha. Fonte: resumo 4.2.", "fio": null, "aprof": "A KPC prefere atacar o ertapeném. A estratégia do duplo carbapenêmico usa isso: dá-se o ertapeném primeiro para 'ocupar' as enzimas e, cerca de uma hora depois, o meropeném, que encontra menos KPC disponível e consegue agir. É uma manobra de resgate, usada quando faltam opções, e não funciona sempre. Quando disponível, a ceftazidima-avibactam é a escolha. Por isso a frase do guia está certa na ideia, mas na prova cuidado com alternativas que digam 'primeira escolha' ou 'na mesma infusão'. Gancho: ertapeném é a isca, meropeném é o anzol.", "id": 228}, {"tema": "Guia do Murilo", "nivel": "Faculdade", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: Para o guia, a 3ª geração de cefalosporinas é a mais indicada na profilaxia cirúrgica por ter espectro mais amplo.", "alts": ["Verdadeiro", "Falso"], "coms": ["Errado. Profilaxia cirúrgica é 1ª geração (cefazolina): a flora da pele é Gram-positiva. Fonte: guia do Murilo; 'o que cai', item 1.", "Correto. Profilaxia cirúrgica é 1ª geração (cefazolina): a flora da pele é Gram-positiva. Fonte: guia do Murilo; 'o que cai', item 1."], "correta": 1, "expl": "Profilaxia cirúrgica é 1ª geração (cefazolina): a flora da pele é Gram-positiva. Fonte: guia do Murilo; 'o que cai', item 1.", "fio": null, "aprof": "Espectro mais amplo não significa melhor para tudo. A 3ª geração ganhou força contra Gram-negativos e perdeu parte da força contra Gram-positivos, que são justamente os germes da pele que contaminam a ferida cirúrgica. Por isso a profilaxia é feita com cefazolina, de 1ª geração, e usar 3ª geração 'para garantir' é erro que, além de tudo, aumenta o risco de <i>C. difficile<\/i> e de resistência. Gancho: profilaxia é primeira.", "id": 229}, {"tema": "Guia do Murilo", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Diferencial por exclusão", "enun": "Klebsiella pneumoniae produtora de ESBL isolada em hemocultura, sem carbapenemase. Antibiograma: ceftriaxona R, cefepima R, piperacilina-tazobactam S, meropeném S. Pelo guia e pela aula, o tratamento é:", "alts": ["Ceftazidima-avibactam, por ser a droga mais nova.", "Piperacilina-tazobactam, pois está sensível.", "Ceftriaxona em dose dobrada.", "Meropeném."], "coms": ["Errada. É reservada para KPC.", "Errada. Na ESBL, a sensibilidade à pipe-tazo é só in vitro.", "Errada. Está resistente.", "Certa. Carbapenêmico é ativo contra ESBL e AmpC."], "correta": 3, "expl": "Guia do Murilo: carbapenêmicos são ativos para ESBL e AmpC. Fonte: 'o que cai', item 5; resumo 4.2.", "fio": null, "aprof": "ESBL e AmpC são betalactamases que destroem penicilinas e cefalosporinas, inclusive as de 3ª e 4ª gerações. O carbapenêmico resiste a ambas, e por isso o meropeném é a escolha. O laudo 'sensível' à piperacilina-tazobactam é a pegadinha preferida do professor: em ESBL, essa sensibilidade não se confirma no paciente, e mais da metade da turma do ano anterior errou. A ceftazidima-avibactam fica guardada para a KPC, que destrói carbapenêmicos. Gancho: ESBL ou AmpC, meropeném; KPC, ceftazidima-avibactam.", "id": 230}];
const KEY = "atb-av2-zarns-v1";
const L = "ABCDE";
const TEMAS = [...new Set(Q.map(q => q.tema))];
const NIVEIS = ["Decoreba", "Faculdade", "ENAMED"];
let st = {ans: {}, tema: "Todos", nivel: "Todos", status: "Todas", q: "", pos: 0, view: "inicio"};
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) st = Object.assign(st, s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const view = document.getElementById("view");
const done = q => st.ans[q.id] !== undefined;
const right = q => st.ans[q.id] === q.correta;
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function shortTema(t){ return t.replace(": mecanismo, resistência e farmacodinâmica","").replace(" e multirresistentes","").replace(" e raciocínio clínico",""); }

function filtered(statusOverride){
  const status = statusOverride || st.status, term = norm(st.q.trim());
  const ids = st.ids ? new Set(st.ids) : null;
  return Q.filter(q => (!ids || ids.has(q.id)) && (st.tema === "Todos" || q.tema === st.tema)
    && (st.nivel === "Todos" || q.nivel === st.nivel)
    && (status === "Todas" || (status === "Não feitas" && !done(q)) || (status === "Erradas" && done(q) && !right(q)) || (status === "Certas" && right(q)))
    && (!term || norm(q.enun + " " + q.alts.join(" ") + " " + q.tema).includes(term)));
}
function stats(list){ const d = list.filter(done), r = d.filter(right); return {n: list.length, d: d.length, r: r.length, w: d.length - r.length}; }
function bar(s){ return `<div class="bar"><i class="g" style="width:${s.n ? s.r / s.n * 100 : 0}%"></i><i class="r" style="width:${s.n ? s.w / s.n * 100 : 0}%"></i></div>`; }
function ring(){
  const s = stats(Q), p = Math.round(s.d / s.n * 100), c = 2 * Math.PI * 27;
  document.getElementById("ringArc").setAttribute("stroke-dasharray", `${c * s.d / s.n} ${c}`);
  document.getElementById("ringTxt").textContent = p + "%";
  document.getElementById("sub").textContent = `${s.d} de ${s.n} respondidas · ${s.d ? Math.round(s.r / s.d * 100) : 0}% de acerto`;
}
function pills(name, opts, cur){ return `<div class="pills" role="group" aria-label="${name}">` + opts.map(o => `<button class="pill${o === cur ? " on" : ""}" data-f="${name}" data-val="${esc(o)}">${esc(name === "tema" && o !== "Todos" ? shortTema(o) : o)}</button>`).join("") + `</div>`; }
function filters(isRev){
  return `<label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="busca" type="search" placeholder="Buscar: KPC, ceftarolina, Listeria…" value="${esc(st.q)}" aria-label="Buscar questões"></label>`
    + (st.ids ? `<div class="pills"><button class="pill x" id="limpaIds">Só: ${esc(st.idsNome)} · limpar ✕</button></div>` : "") + pills("tema", ["Todos", ...TEMAS], st.tema) + pills("nivel", ["Todos", ...NIVEIS], st.nivel) + (isRev ? "" : pills("status", ["Todas", "Não feitas", "Erradas", "Certas"], st.status));
}

function renderInicio(){
  const s = stats(Q);
  view.innerHTML = `<div class="kpis"><div class="card"><div class="big">${s.d}</div><small>respondidas</small></div><div class="card"><div class="big">${s.r}</div><small>acertos</small></div><div class="card"><div class="big">${s.w}</div><small>para revisar</small></div></div>
  <h2>Assuntos</h2><div class="topics">` + TEMAS.map(t => { const ts = stats(Q.filter(q => q.tema === t)); return `<button class="topic" data-tema="${esc(t)}"><b>${esc(t)}</b><div class="meta"><span>${ts.n} questões</span><span>${ts.d} feitas</span><span>${ts.d ? Math.round(ts.r / ts.d * 100) : 0}% de acerto</span></div>${bar(ts)}</button>`; }).join("")
  + `</div><p class="meta" style="margin-top:14px">O professor disse que carbapenêmicos são cerca de um quarto da prova. Comece por eles se o tempo for curto.</p>`;
  view.querySelectorAll(".topic").forEach(b => b.onclick = () => { st.tema = b.dataset.tema; st.ids = null; st.nivel = "Todos"; st.status = "Todas"; st.q = ""; const l = filtered(); const f = l.findIndex(q => !done(q)); st.pos = f < 0 ? 0 : f; go("questoes"); });
}

function renderQuestoes(isRev){
  if (isRev) st.status = "Erradas";
  const list = filtered();
  if (st.pos >= list.length) st.pos = Math.max(0, list.length - 1);
  let html = filters(isRev);
  if (!list.length){
    view.innerHTML = html + `<div class="card empty">${isRev ? "Nenhuma questão errada com esses filtros. Bom sinal." : "Nenhuma questão com esses filtros."}</div>`;
    bindFilters(isRev); return;
  }
  const q = list[st.pos], a = st.ans[q.id], answered = a !== undefined;
  html += `<div class="counter"><span>Questão ${st.pos + 1} de ${list.length}</span><span>nº ${q.id} do banco</span></div>
  <article class="card"><div class="qhead"><span class="tag">${esc(shortTema(q.tema))}</span><span class="tag lv">${esc(q.nivel)}</span><span class="tag">${esc(q.tipo)}</span></div>
  <p class="enun">${q.enun}</p><div class="alts">` + q.alts.map((t, i) => {
    let cls = "";
    if (answered){ if (i === q.correta) cls = " ok"; else if (i === a) cls = " no"; }
    return `<button class="alt${cls}" data-i="${i}" ${answered ? "disabled" : ""}><span class="l">${L[i]}</span><span>${esc(t)}</span>${answered ? `<span class="com">${esc(q.coms[i])}</span>` : ""}</button>`;
  }).join("") + `</div>`;
  if (answered){
    const ok = a === q.correta;
    html += `<p class="verdict ${ok ? "ok" : "no"}">${ok ? "Você acertou." : "Você marcou " + L[a] + ". A correta é " + L[q.correta] + "."}</p>
    <div class="expl"><h3>Por que a ${L[q.correta]} está certa</h3><p>${esc(q.expl)}</p><details class="deep" open><summary>Para aprender o assunto</summary><p>${q.aprof || ""}</p></details><p class="meta" style="margin-top:8px">Formato: ${esc(q.arq)}</p></div>
    <button class="link" id="redo">Refazer esta questão</button>`;
  }
  html += `</article><div class="nav"><button class="btn" id="prev" ${st.pos ? "" : "disabled"}>Anterior</button><button class="btn pri" id="next" ${st.pos < list.length - 1 ? "" : "disabled"}>Próxima</button></div>
  <details style="margin-top:14px"><summary class="meta" style="cursor:pointer;min-height:44px;display:flex;align-items:center">Ir para outra questão desta lista</summary><div class="grid">` +
  list.map((x, i) => `<button class="dot${done(x) ? (right(x) ? " ok" : " no") : ""}${i === st.pos ? " cur" : ""}" data-p="${i}" aria-label="Questão ${i + 1}">${i + 1}</button>`).join("") + `</div></details>`;
  view.innerHTML = html;
  bindFilters(isRev);
  view.querySelectorAll(".alt").forEach(b => b.onclick = () => { st.ans[q.id] = +b.dataset.i; save(); ring(); renderQuestoes(isRev); });
  const r = document.getElementById("redo"); if (r) r.onclick = () => { delete st.ans[q.id]; save(); ring(); renderQuestoes(isRev); };
  document.getElementById("prev").onclick = () => { st.pos--; save(); renderQuestoes(isRev); scrollTo(0, 0); };
  document.getElementById("next").onclick = () => { st.pos++; save(); renderQuestoes(isRev); scrollTo(0, 0); };
  view.querySelectorAll(".dot").forEach(b => b.onclick = () => { st.pos = +b.dataset.p; save(); renderQuestoes(isRev); scrollTo(0, 0); });
}
function bindFilters(isRev){
  view.querySelectorAll(".pill").forEach(b => b.onclick = () => { st[b.dataset.f] = b.dataset.val; st.pos = 0; save(); renderQuestoes(isRev); });
  const li = document.getElementById("limpaIds"); if (li) li.onclick = () => { st.ids = null; st.pos = 0; save(); renderQuestoes(isRev); };
  const i = document.getElementById("busca");
  i.oninput = () => { st.q = i.value; st.pos = 0; save(); const p = i.selectionStart; renderQuestoes(isRev); const n = document.getElementById("busca"); n.focus(); n.setSelectionRange(p, p); };
}

function renderProgresso(){
  const grp = (key, vals) => vals.map(v => { const s = stats(Q.filter(q => q[key] === v)); return `<div class="row"><div class="meta"><span>${esc(v)}</span><span>${s.r}/${s.d} certas · ${s.n - s.d} por fazer</span></div>${bar(s)}</div>`; }).join("");
  const tipos = [...new Set(Q.map(q => q.tipo))];
  view.innerHTML = `<h2 style="margin-top:0">Por assunto</h2><div class="card stat">${grp("tema", TEMAS)}</div>
  <h2>Por nível</h2><div class="card stat">${grp("nivel", NIVEIS)}</div>
  <h2>Por tipo de questão</h2><div class="card stat">${grp("tipo", tipos)}</div>
  <h2>Guardar ou levar o progresso</h2><div class="card stat"><p class="meta" style="margin:0">O progresso fica salvo neste navegador. Para passar para outro aparelho, copie o código abaixo e cole lá.</p>
  <textarea id="code" readonly>${esc(btoa(unescape(encodeURIComponent(JSON.stringify(st.ans)))))}</textarea>
  <div class="nav" style="margin-top:0"><button class="btn" id="copy">Copiar código</button><button class="btn" id="load">Colar código</button></div>
  <textarea id="paste" placeholder="Cole aqui o código de outro aparelho e toque em Colar código" style="display:none"></textarea>
  <button class="btn" id="reset" style="flex:none;border-color:var(--no);color:var(--no)">Apagar todo o progresso</button></div>`;
  document.getElementById("copy").onclick = async e => { try { await navigator.clipboard.writeText(document.getElementById("code").value); e.target.textContent = "Copiado"; } catch (x) { const c = document.getElementById("code"); c.select(); e.target.textContent = "Selecionado: copie manualmente"; } };
  document.getElementById("load").onclick = e => { const p = document.getElementById("paste"); if (p.style.display === "none"){ p.style.display = "block"; p.focus(); return; }
    try { const a = JSON.parse(decodeURIComponent(escape(atob(p.value.trim())))); st.ans = a; save(); ring(); renderProgresso(); } catch (x) { e.target.textContent = "Código inválido"; } };
  document.getElementById("reset").onclick = () => ask("Apagar todas as respostas? Isso não pode ser desfeito.", () => { st.ans = {}; st.pos = 0; save(); ring(); renderProgresso(); });
}
function ask(t, yes){ const d = document.getElementById("dlg"); document.getElementById("dlgTxt").textContent = t; d.classList.add("on");
  document.getElementById("dlgNo").onclick = () => d.classList.remove("on"); document.getElementById("dlgYes").onclick = () => { d.classList.remove("on"); yes(); }; }

  <h2>O que o professor disse que cai</h2><p>Tirado das aulas de Penicilinas (27/10) e Cefalosporinas e Carbapenêmicos (09/11). Segundo ele, toda a prova está na aula.</p></section>
  <div class="cai">
  <article class="card mur"><h3>Sessão do guia do Murilo</h3><p style="margin:0">30 questões novas cobrindo cada item do resumo "Assuntos guiados por Murilo", da Luisa. O resumo organizado está no fim desta aba.</p>${treino("murilo","Guia do Murilo")}</article>
  <article class="card"><h3><span>1</span>Profilaxia da febre reumática</h3>
   <p style="margin:0 0 6px">Benzatina 1.200.000 UI a cada 21 dias. Vale o prazo que durar mais.</p>
   <table><tr><th>Sem cardite</th><td>5 anos ou até os 21</td></tr><tr><th>Cardite leve</th><td>10 anos ou até os 25</td></tr><tr><th>Moderada ou grave</th><td>até os 40 ou por toda a vida</td></tr><tr><th>Troca de valva</th><td>por toda a vida <span class="src">guia do Murilo</span></td></tr></table>${treino("fr","Febre reumática")}</article>
  <article class="card"><h3><span>2</span>Meningite pelo Gram do líquor</h3><ul><li>Acima de 50 anos, a alternativa certa tem <b>ampicilina</b> (cobre <i>Listeria</i>).</li><li>Bacilo Gram+ = <i>Listeria</i>; diplococo Gram− = meningococo; diplococo Gram+ = pneumococo.</li></ul>${treino("men","Meningite")}</article>
  <article class="card"><h3><span>3</span>Tempo-dependente, com gráfico</h3><ul><li>Betalactâmico = <b>curva em platô</b> (tempo acima da CIM).</li><li>Curva com pico = concentração-dependente (aminoglicosídeo, quinolona).</li></ul>${treino("tempo","Tempo-dependente")}</article>
  <article class="card"><h3><span>4</span>Profilaxia cirúrgica = cefazolina</h3><ul><li>Cai todo ano, quase igual (ENADE 2021 e 2023): cirurgia cardíaca e histerectomia.</li><li>Motivo: a infecção vem da flora da pele (Gram-positivos).</li></ul>${treino("profi","Profilaxia cirúrgica")}</article>
  <h2>Peso de cada assunto</h2>
  <article class="card"><h3><span>¼</span>Carbapenêmicos: 4 a 5 questões</h3><p style="margin:0">Tema curto; praticamente tudo o que ele falou pode cair. ESBL → meropeném; KPC → ceftazidima-avibactam; ertapeném não pega <i>Pseudomonas</i>; imipeném no pâncreas.</p>${treino("carba","Carbapenêmicos")}</article>
  <article class="card"><h3><span>1º</span>Pneumonia que interna</h3><p style="margin:0">O tema mais cobrado das cefalosporinas: <b>ceftriaxona + azitromicina</b>. É comunitária, não hospitalar.</p>${treino("pnm","Pneumonia")}</article>
  <article class="card"><h3><span>2º</span>Neutropenia febril</h3><p style="margin:0">Cefepima → + vancomicina se grave ou piora em 48 h → + antifúngico (equinocandina se grave).</p>${treino("nf","Neutropenia febril")}</article>
  <h2>Decorar: nome e geração</h2>
  <article class="card"><p style="margin:0 0 6px">"Tem que decorar, não tem jeito." O erro está nos nomes, não no que a droga faz.</p>
   <table><tr><th>1ª</th><td>Cefalexina, cefadroxila, cefalotina, cefazolina</td></tr><tr><th>2ª</th><td>Cefuroxima, cefaclor, cefoxitina</td></tr><tr><th>3ª</th><td>Ceftriaxona, ceftazidima</td></tr><tr><th>4ª</th><td>Cefepima</td></tr><tr><th>5ª</th><td>Ceftarolina</td></tr></table>
   <p class="q">Ele errou uma questão na faculdade por não saber que a ceftazidima é de 3ª.</p>${treino("nomes","Gerações")}</article>
  <h2>Como ele monta a questão</h2>
  <article class="card"><ul><li>Sigla na questão manda: <b>MRSA → ceftarolina</b>; <b>ESBL → meropeném</b>, em qualquer sítio.</li><li><i>Mycoplasma</i>, <i>Chlamydia</i> ou <i>Legionella</i>: elimine todos os betalactâmicos.</li><li>Mecanismo das cefalosporinas é o mesmo das penicilinas.</li><li>Pneumonia comunitária sem comorbidade: amoxicilina pura está certa.</li><li>ESBL "sensível" a pipe-tazo → meropeném (mais da metade da turma errou).</li><li>Grupo CESP "sensível" à ceftriaxona → evitar 3ª geração.</li></ul>${treino("sigla","Siglas e pegadinhas")}</article>
  <article class="card"><h3>Verdadeiro ou falso das provas dele</h3><table>
   <tr><th>F</th><td>Oxacilina pega MRSA</td></tr><tr><th>V</th><td>Ampicilina é tempo-dependente; sugere-se infusão prolongada</td></tr><tr><th>F</th><td>Penicilina pode ser usada por menos de 5 dias por ser bactericida</td></tr><tr><th>F</th><td>Penicilina tira cálcio e magnésio da membrana (isso é polimixina)</td></tr><tr><th>F</th><td>Penicilina é contraindicada na gestação</td></tr><tr><th>F</th><td>Alteração da PBP aumenta a afinidade (diminui)</td></tr><tr><th>V</th><td>O efeito depende da afinidade pela PBP e de a droga chegar ao alvo</td></tr></table>${treino("vf","V ou F do professor")}</article>
  <h2 id="murilo">Guia do Murilo</h2>
  <p class="meta" style="margin:-4px 0 4px">Resumo "Assuntos guiados por Murilo para questões da prova", de Luisa Naziazeno. É um palpite da turma; onde ele diverge ou vai além da aula, está marcado.</p>
  <article class="card"><h3>Bases</h3><ul>
   <li>Betalactâmicos são <b>bactericidas</b> (matam), não bacteriostáticos.</li>
   <li>Betalactamase é resistência quase exclusiva dos Gram-negativos; exceção: <b><i>S. aureus</i></b> (Gram+) produz penicilinase.</li>
   <li><b>Não interromper o antibiótico antes do tempo</b>: risco de recidiva mais grave e mais difícil de tratar. <span class="src">fora das transcrições</span></li>
   <li>Eficácia aumenta com <b>infusão prolongada</b> (tempo-dependente).</li>
   <li>Atípicos: <i>Legionella</i>, <i>Chlamydophila</i> e <i>Mycoplasma</i>. Não adianta inibir parede em quem não tem parede.</li></ul></article>
  <article class="card"><h3>Penicilinas</h3><ul>
   <li><b>Mordedura de animal: amoxicilina-clavulanato.</b> <span class="src">fora das transcrições</span></li>
   <li>Cristalina: <b>leptospirose e neurossífilis</b>.</li>
   <li>Febre reumática: sem cardite 5 anos/21; leve 10 anos/25; moderada-grave 40 anos ou a vida; <b>troca de valva, a vida toda</b>. Vale o que durar mais.</li>
   <li>Meningite por <i>Listeria</i> (bastonete Gram+): <b>ampicilina</b>. Por meningococo (diplococo Gram−): <b>ceftriaxona</b>.</li>
   <li><i>Acinetobacter</i>: <b>ampicilina-sulbactam + tigeciclina</b>, mesmo com antibiograma resistente à ampicilina. Quem age é o sulbactam. <span class="src">fora das transcrições</span></li></ul></article>
  <article class="card"><h3>Cefalosporinas</h3><ul>
   <li>Nenhuma, da 1ª à 5ª, pega bem <b>enterococo</b>.</li>
   <li>Profilaxia cirúrgica: <b>1ª geração</b> (cefazolina).</li>
   <li>Cefoxitina: 2ª geração, pega anaeróbios. <span class="src">o professor disse que não cobra</span></li>
   <li>Ceftazidima: 3ª geração, pega <i>Pseudomonas</i>.</li>
   <li>3ª geração no grupo CESP: <b>evitar</b>; pode sair sensível no laudo, mas induz AmpC e falha.</li>
   <li>3ª geração favorece <b><i>C. difficile</i></b>.</li>
   <li>Cefepima: <b>neutropenia febril</b>; pega <i>Pseudomonas</i>.</li>
   <li>Ceftarolina: 5ª geração, <b>MRSA</b>.</li></ul></article>
  <article class="card"><h3>Carbapenêmicos</h3><ul>
   <li>Ativos contra <b>ESBL, AmpC e <i>Pseudomonas</i></b>; inativos contra <b>KPC</b>.</li>
   <li>Ertapeném não pega <i>Pseudomonas</i>.</li>
   <li>Imipeném é degradado pela desidropeptidase renal, por isso vem com <b>cilastatina</b>; boa penetração no <b>pâncreas</b>.</li>
   <li>Ertapeném + meropeném contra KPC é <b>resgate</b> (ertapeném como isca, meropeném 1 h depois). A primeira escolha é ceftazidima-avibactam.</li></ul>${treino("murilo","Guia do Murilo")}</article>
  <h2>O que ele disse que não cai</h2>
  <article class="card no-cai"><ul><li>Cefotaxima: "não cobrei em prova e não vou".</li><li>Cefoxitina cobrir anaeróbio: "isso não vai estar na minha prova" (cai em residência).</li><li>Nomes comerciais, como Rocefin.</li></ul></article>

document.querySelectorAll("nav.bottom button").forEach(b => b.onclick = () => go(b.dataset.v));
document.addEventListener("keydown", e => { if (st.view !== "questoes" && st.view !== "revisar") return; if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowRight") document.getElementById("next")?.click(); if (e.key === "ArrowLeft") document.getElementById("prev")?.click();
  const k = "abcde".indexOf(e.key.toLowerCase()); if (k >= 0) view.querySelectorAll(".alt:not([disabled])")[k]?.click(); });
ring(); go(st.view);
}
