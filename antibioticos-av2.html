brem anaeróbios.", "alts": ["Verdadeiro", "Falso"], "coms": ["Correto. Atuam contra Gram-positivos (incluindo MSSA), Gram-negativos e anaeróbios. Fonte: resumo 4.1.", "Errado. Atuam contra Gram-positivos (incluindo MSSA), Gram-negativos e anaeróbios. Fonte: resumo 4.1."], "correta": 0, "expl": "Atuam contra Gram-positivos (incluindo MSSA), Gram-negativos e anaeróbios. Fonte: resumo 4.1.", "fio": null, "id": 105, "aprof": "Os carbapenêmicos são os betalactâmicos de espectro mais amplo: cobrem Gram-positivos (inclusive MSSA), Gram-negativos (inclusive <i>Pseudomonas<\/i>, <i>Acinetobacter<\/i> e produtores de ESBL) e anaeróbios. Isso os diferencia das cefalosporinas, que não pegam anaeróbios (a cefoxitina é a exceção teórica e nem cai na prova dele). Na prática, em infecção abdominal um carbapenêmico sozinho cobre Gram-negativos e anaeróbios, enquanto com ceftriaxona é preciso somar metronidazol. O erro comum é estender o amplo espectro a tudo: ficam de fora MRSA, atípicos e bactérias com carbapenemase. Gancho: carbapenêmico pega quase tudo, menos MRSA, atípico e KPC."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: Os carbapenêmicos cobrem Acinetobacter (exceto o ertapeném).", "alts": ["Verdadeiro", "Falso"], "coms": ["Correto. Meropeném e imipeném cobrem Acinetobacter; o ertapeném não. Fonte: resumo 4.1; Tabela 4.1.", "Errado. Meropeném e imipeném cobrem Acinetobacter; o ertapeném não. Fonte: resumo 4.1; Tabela 4.1."], "correta": 0, "expl": "Meropeném e imipeném cobrem Acinetobacter; o ertapeném não. Fonte: resumo 4.1; Tabela 4.1.", "fio": null, "id": 106, "aprof": "Aqui o ponto é lembrar que o espectro amplo dos carbapenêmicos inclui bacilos Gram-negativos difíceis como <i>Pseudomonas<\/i> e <i>Acinetobacter<\/i>, mas que o ertapeném é o primo de espectro mais curto. Meropeném e imipeném cobrem os dois; o ertapeném não cobre nenhum. A afirmativa traz a exceção entre parênteses, e é por isso que está verdadeira. A confusão comum é tratar os três carbapenêmicos como iguais. O ertapeném é conveniente (dose única diária), mas essa praticidade vem ao custo de perder os germes hospitalares mais agressivos. Gancho: ertapeném é o carbapenêmico da comunidade, sem Pseudomonas e sem Acinetobacter."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Distrator de família", "enun": "Infecção de partes moles por Gram-negativo produtor de ESBL em paciente estável que poderia concluir o tratamento em casa, com uma dose diária. Qual carbapenêmico é mais prático?", "alts": ["Meropeném.", "Ertapeném.", "Imipeném-cilastatina.", "Polimixina."], "coms": ["Errada. Várias doses diárias.", "Certa. Dose única diária, IM ou IV; útil em pele e partes moles e tratamento domiciliar.", "Errada. Várias doses ao dia; a indicação da aula é pâncreas.", "Errada. Não é carbapenêmico e é tóxica."], "correta": 1, "expl": "Fonte: Tabela 4.1.", "fio": null, "id": 107, "aprof": "O raciocínio parte de dois dados: o germe é ESBL, então o carbapenêmico é a classe certa, e o paciente é estável, de partes moles e pode ir para casa. O ertapeném resolve as duas coisas: dose única diária, por via IM ou IV, o que permite tratamento domiciliar, e cobre Gram-negativos produtores de ESBL. O meropeném e o imipeném exigem várias doses por dia no hospital. A polimixina nem é carbapenêmico e é nefrotóxica, reservada a multirresistentes graves. O cuidado é lembrar a limitação do ertapeném: não cobre <i>Pseudomonas<\/i> nem <i>Acinetobacter<\/i>, então só serve aqui porque o germe não é esse. Gancho: ertapeném, a dose de casa."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Decoreba", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: O ertapeném cobre Pseudomonas aeruginosa.", "alts": ["Verdadeiro", "Falso"], "coms": ["Errado. Ertapeném não cobre Pseudomonas nem Acinetobacter. Fonte: guia g4.", "Correto. Ertapeném não cobre Pseudomonas nem Acinetobacter. Fonte: guia g4."], "correta": 1, "expl": "Ertapeném não cobre Pseudomonas nem Acinetobacter. Fonte: guia g4.", "fio": null, "id": 108, "aprof": "O ertapeném é o carbapenêmico mais restrito: não cobre <i>Pseudomonas<\/i> nem <i>Acinetobacter<\/i>. Em compensação tem dose única diária e serve para pele, partes moles e tratamento domiciliar. A afirmativa é falsa. A confusão vem de pensar que toda a classe herda o espectro do meropeném. Para <i>Pseudomonas<\/i> a lista da aula é piperacilina-tazobactam, ceftazidima, cefepima, meropeném e imipeném; ertapeném e ceftriaxona ficam de fora. Gancho: o ertapeném é o único carbapenêmico da lista que não aparece na lista de Pseudomonas, junto com a ceftriaxona."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Conduta no momento certo", "enun": "Na falta de ceftazidima-avibactam para tratar KPC, as alternativas citadas em aula são:", "alts": ["Ceftarolina.", "Ertapeném isolado.", "Polimixina ou aminoglicosídeo, que são nefrotóxicos.", "Vancomicina."], "coms": ["Errada. MRSA.", "Errada. Isolado não funciona; ele é só a isca.", "Certa.", "Errada. Só Gram-positivos."], "correta": 2, "expl": "Fonte: resumo 4.2.", "fio": null, "id": 109, "aprof": "A KPC destrói os carbapenêmicos, então a primeira escolha é a ceftazidima-avibactam: o avibactam bloqueia a carbapenemase e deixa a ceftazidima agir. Quando ela não está disponível, restam drogas de outras classes que não dependem do anel betalactâmico: polimixinas (que desestruturam a membrana externa) e aminoglicosídeos (que agem no ribossomo). O preço é a nefrotoxicidade, e a alternativa certa faz questão de mencionar isso. Ceftarolina e vancomicina são drogas para MRSA e Gram-positivos, sem ação em Gram-negativo. O ertapeném isolado é o distrator perigoso: ele só entra como isca na estratégia de duplo carbapenêmico, nunca sozinho. Gancho: sem avibactam, pega a droga nefrotóxica."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "ENAMED", "tipo": "Múltipla escolha", "arq": "Diretriz atual × aula", "enun": "Sobre a cilastatina e os efeitos adversos do imipeném, segundo a literatura citada na nota de revisão:", "alts": ["O efeito adverso típico do imipeném é a ototoxicidade.", "A cilastatina é nefroprotetora; o efeito adverso típico do imipeném é a convulsão.", "A cilastatina causa acidose tubular renal grave em quase todos os pacientes.", "A cilastatina causa síndrome do homem vermelho."], "coms": ["Errada. Aminoglicosídeos.", "Certa. A aula atribuiu acidose tubular à cilastatina; a literatura diverge.", "Errada. Foi o que a aula disse, mas a literatura não confirma.", "Errada. Vancomicina."], "correta": 1, "expl": "Fonte: resumo 4.1, nota de revisão.", "fio": null, "id": 110, "aprof": "Atenção, porque aqui há duas versões. A aula atribuiu à cilastatina uma acidose tubular, mas a literatura diz o contrário: a cilastatina é nefroprotetora, porque inibe a desidropeptidase renal que degradaria o imipeném, protegendo também o rim. O efeito adverso típico do imipeném é a convulsão, sobretudo em doses altas ou com função renal reduzida. A questão pede explicitamente a literatura, então a resposta certa é a que traz a cilastatina como nefroprotetora e a convulsão como efeito do imipeném. Se na prova do professor a pergunta vier sem essa ressalva, vale confirmar o que ele ensinou, mas a ideia farmacológica é esta. Ototoxicidade e homem vermelho são de aminoglicosídeo e vancomicina. Gancho: cilastatina protege, imipeném convulsiona."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "A função da cilastatina associada ao imipeném é:", "alts": ["Inibir a desidropeptidase renal, que degradaria o imipeném.", "Aumentar a penetração no SNC.", "Cobrir MRSA.", "Inibir betalactamases, como o clavulanato."], "coms": ["Certa.", "Errada. A cilastatina não muda a distribuição para o SNC; inibe a enzima renal.", "Errada. Nenhum carbapenêmico, com ou sem cilastatina, pega MRSA.", "Errada. Não é inibidor de betalactamase."], "correta": 0, "expl": "Fonte: Tabela 4.1; guia g4.", "fio": null, "id": 111, "aprof": "O imipeném sozinho é degradado por uma enzima do túbulo renal, a desidropeptidase, e perderia a ação antes de atingir concentração útil na urina e nos tecidos. A cilastatina é um inibidor dessa enzima: ela não tem ação antibacteriana, só protege o parceiro, fazendo o imipeném durar. Pense nela como um escudo, ideia parecida com a do clavulanato, mas com alvo diferente. O clavulanato inibe betalactamase bacteriana; a cilastatina inibe uma enzima do rim humano. É essa confusão que o distrator da questão explora. A cilastatina também não aumenta penetração no SNC nem cobre MRSA. Gancho: cilastatina para a desidropeptidase, clavulanato para a betalactamase."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Caso-fio", "enun": "Homem de 68 anos, diabético e com DPOC, tem pneumonia com hipotensão e confusão e é internado. O esquema inicial é:", "alts": ["Piperacilina-tazobactam.", "Amoxicilina-clavulanato + azitromicina VO.", "Meropeném.", "Ceftriaxona + azitromicina."], "coms": ["Errada. Ainda não é infecção hospitalar.", "Errada. Esquema ambulatorial.", "Errada. Carbapenêmico não é primeira linha aqui.", "Certa. Pneumonia comunitária que interna."], "correta": 3, "expl": "Fonte: resumo 6.2, correlação clínica.", "fio": "fio68", "id": 112, "aprof": "A pergunta-chave é onde o paciente adquiriu a infecção. Pneumonia que chega de casa e interna continua sendo comunitária, só que mais grave. Os agentes são pneumococo e atípicos: a ceftriaxona cobre o pneumococo e a azitromicina cobre os atípicos, que nenhum betalactâmico pega. Por isso o esquema inicial é ceftriaxona + azitromicina. A confusão comum é achar que internar vira infecção hospitalar: isso só ocorre depois de cerca de 48 horas de internação. Pipe-tazo e meropeném seriam exagero, e amoxicilina-clavulanato oral é para a pneumonia tratada em casa. Gancho: a comunitária que interna leva ceftriaxona mais macrolídeo."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Caso-fio", "enun": "Ainda sobre esse paciente: no 6º dia de internação, volta a ter febre com nova secreção. Como classificar e o que fazer?", "alts": ["Infecção por atípicos; trocar azitromicina por doxiciclina.", "IRAS; iniciar direto meropeném.", "Pneumonia comunitária refratária; dobrar a ceftriaxona.", "Infecção relacionada à assistência; cobrir Pseudomonas com piperacilina-tazobactam ou cefepima."], "coms": ["Errada. Febre nova no 6º dia de internação é IRAS, não atípico.", "Errada. Carbapenêmico só após falha.", "Errada. Passou a ser IRAS.", "Certa. Mais de 48 h de internação."], "correta": 3, "expl": "Fonte: resumo 6.2.", "fio": "fio68", "id": 113, "aprof": "Febre nova no 6º dia de internação mudou a categoria da infecção: passa a ser relacionada à assistência (IRAS, depois de 48 horas de internação), e o foco passa a ser a <i>Pseudomonas<\/i> e as bactérias hospitalares resistentes. Primeira linha: piperacilina-tazobactam ou cefepima, ambas com cobertura de <i>Pseudomonas<\/i>. O meropeném fica reservado para a falha, seguindo a regra de que carbapenêmico não é primeira linha. Dobrar a ceftriaxona não adianta, porque ela não cobre <i>Pseudomonas<\/i>, e trocar por doxiciclina erra o alvo: o problema não é atípico. Gancho: 48 horas dentro do hospital, pense em Pseudomonas."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Caso-fio", "enun": "Ainda sobre esse paciente: após 72 horas de piperacilina-tazobactam, ele piora. Conduta:", "alts": ["Voltar para ceftriaxona.", "Associar vancomicina como único ajuste.", "Escalonar para meropeném.", "Associar metronidazol."], "coms": ["Errada. Descalonar na piora perde Pseudomonas; o passo é meropeném.", "Errada. Sem indício de Gram-positivo; o passo da aula é meropeném.", "Certa.", "Errada. Pipe-tazo já cobre anaeróbios."], "correta": 2, "expl": "Fonte: resumo 6.2.", "fio": "fio68", "id": 114, "aprof": "A lógica da escalada é de espectro: começa-se pela droga mais estreita que alcança as bactérias prováveis e só se sobe quando falha. Piperacilina-tazobactam e cefepima são as primeiras linhas da IRAS; se após 48 a 72 horas o paciente piora, o meropeném entra como carbapenêmico de escalonamento, porque cobre Gram-negativos resistentes, inclusive ESBL. Voltar à ceftriaxona seria andar para trás e perderia <i>Pseudomonas<\/i>. Somar vancomicina sozinha cobre apenas Gram-positivos e não resolve um Gram-negativo resistente. Metronidazol só pega anaeróbio, que o pipe-tazo já cobre. Gancho: falhou o pipe-tazo ou a cefepima, o próximo degrau é o meropeném."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "ENAMED", "tipo": "Caso clínico", "arq": "Caso-fio", "enun": "Ainda sobre esse paciente: a cultura de aspirado traqueal mostra Klebsiella pneumoniae produtora de KPC. A melhor conduta é:", "alts": ["Trocar para ceftazidima-avibactam.", "Trocar para ertapeném isolado.", "Manter meropeném, pois é o carbapenêmico mais potente.", "Trocar meropeném por imipeném."], "coms": ["Certa. Os carbapenêmicos não atuam contra KPC.", "Errada. Ertapeném sozinho não funciona; é só a isca no duplo carbapenêmico.", "Errada. A KPC destrói os carbapenêmicos.", "Errada. Mesma classe, mesma destruição."], "correta": 0, "expl": "Fonte: resumo 6.2.", "fio": "fio68", "id": 115, "aprof": "Cultura com KPC significa que o paciente está com um germe que produz uma enzima capaz de hidrolisar os carbapenêmicos, incluindo o meropeném que talvez já esteja recebendo. Por isso a melhor conduta é trocar para ceftazidima-avibactam: o avibactam, que não é um betalactâmico, inibe a carbapenemase e protege a ceftazidima. Manter o meropeném por ser o mais potente é a armadilha clássica: potência não vale nada contra uma enzima feita para destruí-lo. Trocar por imipeném ou por ertapeném isolado erra pelo mesmo motivo. Gancho: KPC, mude de classe, não de carbapenêmico."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "Qual carbapenêmico NÃO cobre Pseudomonas?", "alts": ["Imipeném-cilastatina.", "Ertapeném.", "Todos cobrem Pseudomonas.", "Meropeném."], "coms": ["Errada. Cobre.", "Certa. Também não cobre Acinetobacter.", "Errada. O ertapeném não cobre.", "Errada. Cobre e é o mais potente."], "correta": 1, "expl": "Fonte: Tabela 4.1.", "fio": null, "id": 116, "aprof": "O ertapeném é o único carbapenêmico que não cobre <i>Pseudomonas<\/i> (nem <i>Acinetobacter<\/i>). A razão prática é que ele foi pensado para ser dose única diária em infecções da comunidade, como pele, partes moles e tratamento domiciliar, e não para o germe hospitalar mais temido. Imipeném e meropeném cobrem <i>Pseudomonas<\/i>, e é por isso que a alternativa 'todos cobrem' está errada. A confusão é lembrar 'carbapenêmico é amplo' e esquecer a exceção. Gancho: ertapeném é o carbapenêmico que fica de fora da lista da Pseudomonas."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "ENAMED", "tipo": "Múltipla escolha", "arq": "Diretriz atual × aula", "enun": "Pela IDSA (nota de revisão), em infecções por Enterobacter cloacae com AmpC induzível, sem ESBL, a opção preferida costuma ser:", "alts": ["Ertapeném obrigatoriamente.", "Ceftriaxona em dose dobrada.", "Polimixina.", "Cefepima, reservando carbapenêmico para ESBL ou resistência maior."], "coms": ["Errada. Absoluto.", "Errada. 3ª geração deve ser evitada.", "Errada. Última linha.", "Certa."], "correta": 3, "expl": "Fonte: resumo 4.2, nota de revisão.", "fio": null, "id": 117, "aprof": "Esta questão usa a nota de revisão: a aula diz para evitar cefalosporinas no grupo CESP, mas a IDSA, mais refinada, indica que para AmpC induzível (<i>Enterobacter cloacae<\/i>, <i>Klebsiella aerogenes<\/i> e <i>Citrobacter freundii<\/i>) a cefepima costuma ser preferida. A razão é que a cefepima, de 4ª geração, é um indutor fraco da AmpC e é pouco hidrolisada por ela, enquanto a ceftriaxona é um bom indutor. O carbapenêmico fica para quando há ESBL ou resistência maior, em linha com a regra de não usá-lo como primeira linha. Na prova do professor, a regra que vale é evitar a 3ª geração mesmo com antibiograma sensível. Gancho: AmpC evita 3ª geração, a 4ª geração pode servir."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "ENAMED", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: A perda da porina OprD pode reduzir a entrada dos carbapenêmicos na Pseudomonas.", "alts": ["Verdadeiro", "Falso"], "coms": ["Correto. Se os carbapenêmicos usam a OprD para entrar, sua perda reduz o acesso (porina = porta). Fonte: resumo 4.1 e 1.3.", "Errado. Se os carbapenêmicos usam a OprD para entrar, sua perda reduz o acesso (porina = porta). Fonte: resumo 4.1 e 1.3."], "correta": 0, "expl": "Se os carbapenêmicos usam a OprD para entrar, sua perda reduz o acesso (porina = porta). Fonte: resumo 4.1 e 1.3.", "fio": null, "id": 118, "aprof": "Porina é a porta de entrada do Gram-negativo, e carbapenêmicos entram na <i>Pseudomonas<\/i> pela OprD, porina que normalmente transporta aminoácidos. A molécula usa uma porta extra que os outros betalactâmicos não usam, e esse é um dos motivos do amplo espectro. Se a bactéria perde ou fecha a OprD, o carbapenêmico não entra em concentração suficiente, e aparece uma das formas de resistência da <i>Pseudomonas<\/i>. A afirmativa é verdadeira. Lembre que porinas só existem em Gram-negativos, porque só eles têm membrana externa. Gancho: sem porta não entra visita."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "Os carbapenêmicos NÃO atuam contra:", "alts": ["MRSA, atípicos e produtores de carbapenemase (KPC).", "Anaeróbios, pneumococo e Klebsiella sem carbapenemase.", "Pseudomonas, Acinetobacter e anaeróbios.", "ESBL, MSSA e E. coli."], "coms": ["Certa.", "Errada. Cobrem.", "Errada. Meropeném e imipeném cobrem.", "Errada. Cobrem."], "correta": 0, "expl": "Fonte: resumo 4.1; guia g4.", "fio": null, "id": 119, "aprof": "O espectro amplo dos carbapenêmicos tem três buracos. MRSA, porque a PBP2a alterada diminui a afinidade pelo betalactâmico, e quem resolve é a ceftarolina ou a vancomicina. Atípicos, porque o <i>Mycoplasma<\/i> não tem parede e <i>Chlamydia<\/i> e <i>Legionella<\/i> vivem dentro de células, onde nenhum betalactâmico chega bem. E bactérias com carbapenemase, como a KPC, que destroem a própria classe. Os distratores listam grupos que a classe cobre: anaeróbios, <i>Pseudomonas<\/i>, <i>Acinetobacter<\/i>, ESBL e MSSA. Gancho: em questão de exceção, pense em MRSA, atípico e KPC."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Asserção-razão", "arq": "Asserção-razão", "enun": "Avalie as asserções e a relação entre elas.<br><br><b>I.<\/b> Nas infecções pelo grupo CESP, deve-se evitar cefalosporina de 3ª geração mesmo com antibiograma sensível.<br><br><b>PORQUE<\/b><br><br><b>II.<\/b> Essas bactérias possuem AmpC cromossômica desligada, que é induzida pelas cefalosporinas.", "alts": ["As duas asserções são verdadeiras, e a II justifica a I.", "As duas asserções são verdadeiras, mas a II não justifica a I.", "A I é verdadeira, e a II é falsa.", "A I é falsa, e a II é verdadeira.", "As duas asserções são falsas."], "coms": ["Correta. A AmpC induzível explica a recomendação. Fonte: resumo 4.2.", "Incorreta. Exigiria as duas verdadeiras sem relação de causa. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria a I verdadeira e a II falsa. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria a I falsa e a II verdadeira. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria as duas falsas. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I."], "correta": 0, "expl": "A AmpC induzível explica a recomendação. Fonte: resumo 4.2.", "fio": null, "id": 120, "aprof": "As duas asserções são verdadeiras e a II explica a I. O grupo CESP (<i>Citrobacter<\/i>, <i>Enterobacter<\/i>, <i>Serratia<\/i>, <i>Proteus<\/i>, e na aula também <i>Morganella<\/i> e <i>Providencia<\/i>) carrega no cromossomo uma AmpC que fica desligada. No antibiograma, a bactéria parece sensível. Porém, no paciente, a cefalosporina de 3ª geração induz a produção da enzima, que passa a destruí-la, e o tratamento falha. Em outras palavras, o 'sensível' da placa vale para a bactéria desligada, não para a bactéria exposta à droga. Gancho: o antibiótico acende o interruptor da AmpC."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Par ou sequência", "arq": "Par ou sequência", "enun": "Na estratégia de duplo carbapenêmico contra KPC, a ordem é:", "alts": ["Imipeném e meropeném juntos, na mesma infusão.", "Ertapeném e meropeném juntos, na mesma infusão.", "Ertapeném primeiro, como isca para a carbapenemase; meropeném 1 hora depois.", "Meropeném primeiro; ertapeném 1 hora depois."], "coms": ["Errada. A estratégia usa ertapeném como isca, e com intervalo de 1 hora.", "Errada. O intervalo de 1 hora é parte da estratégia.", "Certa.", "Errada. Inverte a ordem."], "correta": 2, "expl": "Baseia-se na preferência da carbapenemase pelo ertapeném; nem sempre funciona. Fonte: resumo 4.2.", "fio": null, "id": 121, "aprof": "A estratégia usa o fato de que a carbapenemase da KPC tem preferência pelo ertapeném. Dado primeiro, ele funciona como isca: as enzimas se ocupam dele, e cerca de uma hora depois o meropeném chega a uma bactéria com menos enzima livre para destruí-lo. Por isso a ordem importa: ertapeném antes, meropeném depois. Dar juntos na mesma infusão tira a vantagem da isca, e inverter a ordem faria o meropeném encontrar a enzima livre. Lembre que é um resgate, não a primeira escolha, e nem sempre funciona. Gancho: isca primeiro, droga de verdade depois."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "ENAMED", "tipo": "Asserção-razão", "arq": "Asserção-razão", "enun": "Avalie as asserções e a relação entre elas.<br><br><b>I.<\/b> Na estratégia de duplo carbapenêmico, o ertapeném é administrado antes do meropeném.<br><br><b>PORQUE<\/b><br><br><b>II.<\/b> A carbapenemase tem preferência pelo ertapeném, que funciona como isca e ocupa as enzimas.", "alts": ["As duas asserções são verdadeiras, e a II justifica a I.", "As duas asserções são verdadeiras, mas a II não justifica a I.", "A I é verdadeira, e a II é falsa.", "A I é falsa, e a II é verdadeira.", "As duas asserções são falsas."], "coms": ["Correta. A preferência pela isca explica a ordem. Fonte: resumo 4.2.", "Incorreta. Exigiria as duas verdadeiras sem relação de causa. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria a I verdadeira e a II falsa. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria a I falsa e a II verdadeira. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria as duas falsas. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I."], "correta": 0, "expl": "A preferência pela isca explica a ordem. Fonte: resumo 4.2.", "fio": null, "id": 122, "aprof": "As duas asserções são verdadeiras e a II explica a I. A carbapenemase da KPC tem preferência pelo ertapeném, então ele é dado primeiro como isca e mantém as enzimas ocupadas. Uma hora depois, o meropeném, que é o carbapenêmico de ação mais robusta, chega com menos enzima livre para destruí-lo. É a causa que explica a ordem, por isso a relação de justificativa é verdadeira. Cuidado com a alternativa que diz que a II não justifica: aqui ela justifica, porque é justamente a preferência da enzima que define quem vai primeiro. Gancho: o ertapeném vai na frente porque a enzima gosta mais dele."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Mecanismo dentro da clínica", "enun": "A OprD é:", "alts": ["Uma PBP alterada do MRSA.", "Uma porina da Pseudomonas que normalmente transporta aminoácidos e que os carbapenêmicos usam para entrar.", "Uma carbapenemase da Pseudomonas.", "Uma bomba de efluxo do S. aureus."], "coms": ["Errada. Essa é a PBP2a.", "Certa.", "Errada. OprD é canal de entrada (porina), não enzima.", "Errada. Bomba expulsa o fármaco; OprD é porina da Pseudomonas, que deixa entrar."], "correta": 1, "expl": "Fonte: resumo 4.1.", "fio": null, "id": 123, "aprof": "Porinas são canais proteicos da membrana externa dos Gram-negativos. A OprD é a da <i>Pseudomonas<\/i> e transporta aminoácidos, mas os carbapenêmicos aproveitam essa entrada: é uma das vantagens estruturais que lhes permitem alcançar a PBP onde outros betalactâmicos não conseguem. Os distratores trocam a categoria de resistência. PBP alterada é do MRSA; carbapenemase é uma enzima; bomba de efluxo expulsa o fármaco. A OprD é porta, e perdê-la é um mecanismo de resistência da <i>Pseudomonas<\/i>. Gancho: OprD, a porta dos carbapenêmicos na Pseudomonas."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Grade 2×2", "arq": "Grade 2×2", "enun": "Relacione cada sigla à conduta da aula: ESBL e MRSA, respectivamente.", "alts": ["Ceftarolina; meropeném.", "Ceftazidima-avibactam; oxacilina.", "Meropeném; ceftarolina ou vancomicina.", "Piperacilina-tazobactam; cefazolina."], "coms": ["Errada. Troca as duas: pegadinha que o guia alerta.", "Errada. Ceftazidima-avibactam é KPC; oxacilina é MSSA.", "Certa.", "Errada. Pipe-tazo não serve para ESBL, e cefazolina não pega MRSA."], "correta": 2, "expl": "'MRSA → ceftarolina; ESBL → meropeném. Não troque.' Fonte: guia g4.", "fio": null, "id": 124, "aprof": "A questão pede o pareamento que o professor repete: a sigla indica a droga, quase independente do sítio da infecção. ESBL é enzima que destrói penicilinas e cefalosporinas, mas não carbapenêmicos, então o antídoto é o meropeném. MRSA é alteração do alvo, a PBP2a, e a droga é a que se liga a ela: a ceftarolina, ou a vancomicina, que age em outro alvo (a D-alanil-D-alanina). A armadilha é inverter os dois, e é por isso que a aula diz 'não troque'. O meropeném não pega MRSA e a ceftarolina não resolve ESBL. Gancho: ESBL tem E de Enzima e leva meropeném; MRSA tem R de Resistente e leva ceftarolina."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "ENAMED", "tipo": "Caso clínico", "arq": "Diferencial por exclusão", "enun": "Klebsiella pneumoniae de paciente de UTI. Antibiograma: ceftriaxona R; cefepima R; piperacilina-tazobactam R; meropeném R; ertapeném R; ceftazidima-avibactam S; amicacina S; polimixina S. Fenótipo e escolha:", "alts": ["AmpC; cefepima.", "KPC; ceftazidima-avibactam.", "NDM; ceftazidima-avibactam.", "ESBL; meropeném."], "coms": ["Errada. Cefepima resistente.", "Certa.", "Errada. Avibactam não trava metalobetalactamase; o padrão sensível a ceftazidima-avibactam sugere KPC.", "Errada. O meropeném está resistente."], "correta": 1, "expl": "Fonte: Tabela 4.2; guia g7.", "fio": null, "id": 125, "aprof": "Leia o antibiograma como um quebra-cabeça. Resistência a todos os betalactâmicos, incluindo meropeném e ertapeném, indica uma carbapenemase. Como a ceftazidima-avibactam é sensível, o avibactam está inibindo a enzima, o que é típico da KPC. A NDM é uma metalobetalactamase que o avibactam não inibe, então teria ceftazidima-avibactam resistente. Já ESBL seria sensível ao meropeném, e AmpC, à cefepima. A amicacina e a polimixina sensíveis são as alternativas nefrotóxicas, sem ser a primeira escolha. Gancho: se o avibactam funciona, é KPC; se não funciona, pense em NDM."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Paciente com pancreatite aguda necrosante evolui com infecção da necrose. O carbapenêmico de escolha, pela melhor penetração no pâncreas, é:", "alts": ["Ertapeném.", "Meropeném, por ser o mais potente.", "Nenhum; carbapenêmico nunca é primeira linha.", "Imipeném-cilastatina."], "coms": ["Errada. É o carbapenêmico que não pega Pseudomonas, junto com a ceftriaxona.", "Errada. Na aula, o pâncreas é do imipeném.", "Errada. Absoluto: o pâncreas é uma das exceções.", "Certa."], "correta": 3, "expl": "Fonte: Tabela 4.1.", "fio": null, "id": 126, "aprof": "A regra da aula é que carbapenêmico nunca é primeira linha, com duas exceções: meropeném para ESBL e imipeném para infecção pancreática. A razão da segunda exceção é a farmacocinética: o imipeném, protegido pela cilastatina, penetra melhor no pâncreas, e por isso é indicado na pancreatite necrosante infectada. A armadilha é escolher o meropeném por ser o mais potente: potência não é penetração tecidual, e o pâncreas é um sítio difícil de alcançar. 'Nenhum é primeira linha' esquece a exceção. O ertapeném nem cobre <i>Pseudomonas<\/i>. Gancho: pâncreas, imipeném."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Epônimos e itens da mesma família", "enun": "Quais drogas pegam Pseudomonas, segundo a aula?", "alts": ["Piperacilina-tazobactam, ceftazidima, cefepima, meropeném e imipeném.", "Oxacilina, cefepima, meropeném e imipeném.", "Ampicilina, ceftazidima, cefepima e ertapeném.", "Piperacilina-tazobactam, ceftriaxona, cefepima, meropeném e ertapeném."], "coms": ["Certa.", "Errada. Oxacilina não pega.", "Errada. Ampicilina e ertapeném não pegam Pseudomonas.", "Errada. Ceftriaxona e ertapeném não pegam."], "correta": 0, "expl": "Fonte: guia g4.", "fio": null, "id": 127, "aprof": "A lista da aula é um conjunto de drogas que cobrem <i>Pseudomonas<\/i>: piperacilina-tazobactam, ceftazidima, cefepima, meropeném e imipeném. Fora da aula, também cobrem aminoglicosídeos, ciprofloxacino e levofloxacino, aztreonam e polimixinas. A confusão está nos nomes parecidos: ceftazidima (3ª geração, pega) contra ceftriaxona (3ª geração, não pega), e meropeném e imipeném (pegam) contra ertapeném (não pega). Oxacilina e ampicilina também não alcançam, porque as aminopenicilinas só atravessam porinas de Gram-negativos comunitários. Gancho: 'Taz' de ceftazidima pega Pseudomonas, e a 4ª geração é a do 'P' de cefepima."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: Os carbapenêmicos são ativos contra MRSA, por serem os betalactâmicos de espectro mais amplo.", "alts": ["Verdadeiro", "Falso"], "coms": ["Errado. Espectro amplo não inclui MRSA (PBP2a). MRSA → ceftarolina ou vancomicina. Fonte: resumo 4.1.", "Correto. Espectro amplo não inclui MRSA (PBP2a). MRSA → ceftarolina ou vancomicina. Fonte: resumo 4.1."], "correta": 1, "expl": "Espectro amplo não inclui MRSA (PBP2a). MRSA → ceftarolina ou vancomicina. Fonte: resumo 4.1.", "fio": null, "id": 128, "aprof": "Espectro amplo não quer dizer espectro total. O MRSA resiste a todos os betalactâmicos, com exceção da ceftarolina, porque expressa a PBP2a, uma PBP com baixa afinidade pelo anel betalactâmico: a droga não encaixa, e a parede continua sendo montada. Os carbapenêmicos têm vantagens contra Gram-negativos (resistência às betalactamases e entrada por porinas), mas nenhuma delas corrige a alteração do alvo. Por isso o MRSA é tratado com ceftarolina ou vancomicina. A afirmativa é falsa porque usa uma justificativa que não é verdadeira. Gancho: alvo trocado, droga trocada."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Mecanismo dentro da clínica", "enun": "Duas vantagens estruturais explicam o amplo espectro dos carbapenêmicos:", "alts": ["O anel resiste a cerca de 99% das betalactamases, e a molécula atravessa porinas adicionais, como a OprD da Pseudomonas.", "Não sofrem ação de nenhuma enzima bacteriana.", "Agem no ribossomo e na parede ao mesmo tempo.", "Ligam-se à PBP2a e penetram nas células do hospedeiro."], "coms": ["Certa.", "Errada. Absoluto falso: a KPC os destrói.", "Errada. Só agem na PBP.", "Errada. Não pegam MRSA nem atípicos."], "correta": 0, "expl": "Fonte: resumo 4.1.", "fio": null, "id": 129, "aprof": "Os carbapenêmicos têm duas vantagens estruturais. Primeira: o anel resiste a cerca de 99% das betalactamases, o que é a tesoura da analogia da aula falhando em cortá-lo; é por isso que pegam ESBL. Segunda: a molécula atravessa porinas adicionais dos Gram-negativos, como a OprD da <i>Pseudomonas<\/i>, o que amplia a chegada à PBP. Os distratores erram o mecanismo: eles agem na parede, não no ribossomo; 'nenhuma enzima' é exagero, porque a carbapenemase os destrói; e ligar-se à PBP2a é a característica da ceftarolina. Gancho: entram por mais portas e resistem a mais tesouras."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Conduta no momento certo", "enun": "Paciente internado há 7 dias com pneumonia relacionada à assistência iniciou piperacilina-tazobactam. Após 72 horas, piora clinicamente. Qual a conduta antimicrobiana?", "alts": ["Associar amoxicilina.", "Manter e aguardar mais 7 dias.", "Escalonar para meropeném.", "Trocar por ceftriaxona."], "coms": ["Errada. Não acrescenta cobertura.", "Errada. Conduta niilista diante de piora.", "Certa. Falha de pipe-tazo ou cefepima em 48–72 h → meropeném.", "Errada. Diminui o espectro e perde Pseudomonas."], "correta": 2, "expl": "Fonte: guia g4; resumo 4.1.", "fio": null, "id": 130, "aprof": "A IRAS tem a <i>Pseudomonas<\/i> entre os agentes, e a piperacilina-tazobactam é uma das primeiras linhas, ao lado da cefepima. Se após 48 a 72 horas há piora, a regra da aula é escalar para meropeném, que cobre os Gram-negativos resistentes. Manter por sete dias sem mudar é arriscado em paciente que piorou. Trocar por ceftriaxona recua para uma droga sem cobertura de <i>Pseudomonas<\/i>, e amoxicilina é ainda mais estreita. O erro é achar que carbapenêmico nunca deve ser usado: ele não é primeira linha, mas é o degrau seguinte quando a primeira falha. Gancho: falha em 72 horas, suba para o meropeném."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "Os carbapenêmicos atuam contra os seguintes grupos, EXCETO:", "alts": ["Anaeróbios.", "MSSA.", "Enterobactérias produtoras de ESBL.", "Mycoplasma pneumoniae."], "coms": ["Errada. Cobrem.", "Errada. Cobrem.", "Errada. Cobrem.", "Certa (é a exceção). Atípico."], "correta": 3, "expl": "Fonte: resumo 4.1.", "fio": null, "id": 131, "aprof": "Pergunta de exceção: procure o grupo que o carbapenêmico não cobre. Eles pegam anaeróbios, MSSA (Gram-positivo) e enterobactérias produtoras de ESBL. O que fica de fora é o <i>Mycoplasma pneumoniae<\/i>, um atípico: não tem parede celular, então o alvo dos betalactâmicos não existe. Nenhum betalactâmico atua contra atípicos, nem mesmo os carbapenêmicos. A regra de ouro do professor é: apareceu <i>Mycoplasma<\/i>, <i>Chlamydia<\/i> ou <i>Legionella<\/i>, elimine todos os betalactâmicos. Para esses, use macrolídeo, doxiciclina ou quinolona respiratória. Gancho: sem parede, sem alvo."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Distrator de família", "enun": "Qual droga é carbapenêmico?", "alts": ["Aztreonam.", "Ertapeném.", "Avibactam.", "Ceftazidima."], "coms": ["Errada. Monobactâmico.", "Certa.", "Errada. Inibidor de betalactamase.", "Errada. Cefalosporina."], "correta": 1, "expl": "Fonte: resumo 1.1 e 4.1.", "fio": null, "id": 132, "aprof": "O sufixo ajuda: carbapenêmicos terminam em '-penem' (meropeném, imipeném, ertapeném). Os distratores são betalactâmicos de outros grupos ou não são betalactâmicos. O aztreonam é um monobactâmico, com anel isolado e só ação em Gram-negativos aeróbios. O avibactam é um inibidor de betalactamase e não é um betalactâmico, ainda que acompanhe a ceftazidima. A ceftazidima é uma cefalosporina de 3ª geração, a única da geração que cobre <i>Pseudomonas<\/i>. A confusão com a ceftazidima ocorre porque ela é a droga associada ao avibactam no tratamento da KPC. Gancho: o '-penem' é do carbapenêmico."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Epônimos e itens da mesma família", "enun": "O grupo CESP (com seus acréscimos da aula) inclui:", "alts": ["Citrobacter, Enterobacter, Serratia, Proteus, Morganella e Providencia.", "Clostridium, Enterococcus, Staphylococcus e Pseudomonas.", "Chlamydia, E. coli, Salmonella e Pseudomonas.", "Citrobacter, Enterococcus, Shigella e Proteus."], "coms": ["Certa.", "Errada. São gêneros fora do grupo; CESP são enterobactérias com AmpC.", "Errada. Só pegaram as iniciais; nenhuma é do grupo CESP.", "Errada. Enterococcus e Shigella não fazem parte."], "correta": 0, "expl": "Fonte: guia g4.", "fio": null, "id": 133, "aprof": "O grupo CESP é um mnemônico de enterobactérias com AmpC cromossômica induzível: <i>Citrobacter<\/i>, <i>Enterobacter<\/i>, <i>Serratia<\/i>, <i>Proteus<\/i>, mais <i>Morganella<\/i> e <i>Providencia<\/i>, acrescentadas pelo professor. Todas são Gram-negativas e compartilham o mesmo interruptor, que as cefalosporinas acendem. Saber a lista é essencial porque a questão costuma trazer apenas o nome da bactéria, como <i>Providencia<\/i>, e esperar que você reconheça o grupo. Os distratores misturam gêneros de outros mundos: <i>Clostridium<\/i> e <i>Enterococcus<\/i> são Gram-positivos, <i>Staphylococcus<\/i> também, e <i>Pseudomonas<\/i> e <i>Chlamydia<\/i> não pertencem ao grupo. Gancho: CESP mais Morganella e Providencia, tudo com AmpC."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Absoluto com cara de protocolo", "enun": "Segundo a regra da aula, os carbapenêmicos nunca são primeira linha, EXCETO em:", "alts": ["Infecção por KPC e por MRSA.", "Pneumonia comunitária grave e meningite.", "Neutropenia febril e profilaxia cirúrgica.", "Infecção por ESBL (meropeném) e infecção pancreática (imipeném)."], "coms": ["Errada. Carbapenêmico não pega nem KPC nem MRSA.", "Errada. Pneumonia que interna é ceftriaxona + azitromicina; meningite é ceftriaxona (± ampicilina).", "Errada. Cefepima e cefazolina.", "Certa."], "correta": 3, "expl": "Fonte: resumo 4.1.", "fio": null, "id": 134, "aprof": "A regra da aula é que carbapenêmicos nunca são primeira linha, por três motivos: são a reserva contra superbactérias, o uso amplo selecionaria resistência, e a maioria das infecções comunitárias é bem coberta por drogas mais estreitas. Duas exceções entram na lista: meropeném para ESBL (porque as outras classes foram hidrolisadas pela enzima) e imipeném para infecção pancreática (pela penetração). KPC é resistente ao carbapenêmico, MRSA não é coberto, e neutropenia febril leva cefepima. Profilaxia cirúrgica é cefazolina. Gancho: duas exceções, ESBL e pâncreas."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Uma palavra trocada", "enun": "Sobre o ertapeném, assinale a correta:", "alts": ["Dose única diária, IM ou IV; útil em pele e partes moles; é o carbapenêmico de escolha na Pseudomonas.", "Dose única diária, IM ou IV; útil em pele e partes moles e no tratamento domiciliar; não cobre Pseudomonas nem Acinetobacter.", "Dose única diária; é associado à cilastatina.", "Quatro doses diárias, só IV; é o mais potente dos carbapenêmicos."], "coms": ["Errada. Uma troca: não cobre Pseudomonas.", "Certa.", "Errada. A cilastatina vai com o imipeném.", "Errada. O mais potente é o meropeném."], "correta": 1, "expl": "Fonte: Tabela 4.1.", "fio": null, "id": 135, "aprof": "O ertapeném é o carbapenêmico prático: dose única diária, IM ou IV, útil em pele e partes moles e em tratamento domiciliar. O preço é o espectro, pois não cobre <i>Pseudomonas<\/i> nem <i>Acinetobacter<\/i>. Por isso a alternativa correta é a que une praticidade e limitação. Os distratores trocam atributos: dizer que ele é o escolhido na <i>Pseudomonas<\/i> inverte a verdade, associá-lo à cilastatina confunde com o imipeném, e dar quatro doses e potência máxima descreve o meropeném. Gancho: ertapeném é de casa, uma vez ao dia, sem Pseudomonas."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Pseudomonas aeruginosa isolada em paciente internado, sensível a todos os testados, sem falha prévia de tratamento. Qual opção NÃO é a primeira escolha segundo a aula?", "alts": ["Piperacilina-tazobactam.", "Cefepima.", "Meropeném.", "Ceftazidima."], "coms": ["Errada. É 1ª escolha.", "Errada. É 1ª escolha.", "Certa (não é 1ª escolha). Reservado para a falha.", "Errada. É 1ª escolha."], "correta": 2, "expl": "Pseudomonas: pipe-tazo, cefepima ou ceftazidima; meropeném após falha. Fonte: Tabela 4.2.", "fio": null, "id": 136, "aprof": "A pergunta traz um cenário sem falha prévia, então vale a regra do degrau: para <i>Pseudomonas<\/i>, a primeira linha é piperacilina-tazobactam, cefepima ou ceftazidima. O meropeném é carbapenêmico, e carbapenêmico fica de reserva para a falha. Ele cobre a <i>Pseudomonas<\/i>, por isso não é errado clinicamente, mas não é a primeira escolha segundo a aula. A confusão é pensar que o mais potente deve vir primeiro. Esse raciocínio gera resistência e esgota a última linha. Lembre também que mais de uma droga pode ser primeira linha ao mesmo tempo. Gancho: três primeiras linhas para Pseudomonas, e o meropeném espera na fila."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "ENAMED", "tipo": "Caso clínico", "arq": "Diagnóstico + conduta", "enun": "Paciente com ITU complicada por Enterobacter cloacae. Antibiograma: ceftriaxona S, cefepima S, meropeném S. O residente prescreve ceftriaxona 'porque está sensível'. Avalie:", "alts": ["A escolha é inadequada; o correto seria polimixina.", "A escolha é adequada; o antibiograma sensível deve ser sempre seguido.", "A escolha é inadequada; o correto seria ceftarolina.", "A escolha é inadequada; Enterobacter é do grupo CESP e a 3ª geração induz AmpC."], "coms": ["Errada. Última linha, desnecessária.", "Errada. Absoluto; é a pegadinha da aula.", "Errada. Ceftarolina é para MRSA.", "Certa."], "correta": 3, "expl": "Fonte: guia g4.", "fio": null, "id": 137, "aprof": "O antibiograma 'sensível' é verdadeiro só para a bactéria desligada. <i>Enterobacter<\/i> pertence ao grupo CESP, tem AmpC cromossômica e a cefalosporina de 3ª geração induz essa enzima; no paciente, ela passa a ser produzida, e a ceftriaxona falha, mesmo com S na placa. O residente cometeu o erro clássico da aula. A polimixina é de último recurso e nefrotóxica, e a ceftarolina é para MRSA. Uma alternativa discutida na literatura é a cefepima, mas, na prova dele, o ponto é não usar a 3ª geração. 'Sempre seguir o antibiograma' é a armadilha. Gancho: sensível na placa, falha no paciente."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "ENAMED", "tipo": "Caso clínico", "arq": "Conduta no momento certo", "enun": "Paciente com peritonite secundária a perfuração de cólon, internado há 1 dia, estável, sem fatores de risco para ESBL. O cirurgião sugere meropeném 'para garantir'. A melhor resposta segundo a lógica da aula é:", "alts": ["Usar ertapeném + vancomicina obrigatoriamente.", "Não usar antibiótico, pois a cirurgia resolve.", "Preferir um esquema de primeira linha que cubra Gram-negativos e anaeróbios, como ceftriaxona com metronidazol, reservando o carbapenêmico.", "Aceitar o meropeném, pois carbapenêmicos são primeira linha em qualquer infecção abdominal."], "coms": ["Errada. Absoluto e carbapenêmico desnecessário; vancomicina sem indício de MRSA.", "Errada. Niilista.", "Certa. Carbapenêmico não é primeira linha.", "Errada. Absoluto falso."], "correta": 2, "expl": "Peritonite secundária é intestino: anaeróbios + Gram-negativos. Fonte: resumo 4.1 e 6.2.", "fio": null, "id": 138, "aprof": "Perfuração de cólon é infecção do intestino: os agentes são Gram-negativos entéricos mais anaeróbios. Ceftriaxona cobre os primeiros e o metronidazol completa com anaeróbios, uma associação de espectro estreito e primeira linha. O paciente está internado há apenas 1 dia, estável e sem risco de ESBL, então não há razão para recorrer ao carbapenêmico 'para garantir'. Esse hábito queima a reserva e seleciona resistência. 'Não usar antibiótico' erra, porque a cirurgia controla o foco, mas a infecção peritoneal ainda exige cobertura. Vancomicina e ertapeném obrigatórios não têm base. Gancho: o carbapenêmico é a reserva, não a garantia."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "ENAMED", "tipo": "Caso clínico", "arq": "Diferencial por exclusão", "enun": "Escherichia coli isolada de abscesso hepático. Antibiograma: ampicilina R; ceftriaxona R; cefepima R; ceftazidima R; piperacilina-tazobactam S; meropeném S; ertapeném S. O fenótipo mais compatível é:", "alts": ["ESBL.", "MRSA.", "Bactéria sem mecanismo de resistência.", "KPC."], "coms": ["Certa. Resistência a penicilinas e cefalosporinas de 3ª e 4ª, com carbapenêmicos preservados.", "Errada. E. coli é Gram-negativo.", "Errada. Resistência a ampicilina e a todas as cefalosporinas mostra enzima de espectro estendido.", "Errada. Na KPC, os carbapenêmicos estariam resistentes."], "correta": 0, "expl": "Fonte: resumo 4.2.", "fio": null, "id": 139, "aprof": "Resistência a ampicilina, ceftriaxona, cefepima e ceftazidima, mas sensibilidade a pipe-tazo e carbapenêmicos, é a assinatura da ESBL: a enzima hidrolisa penicilinas e cefalosporinas de 3ª e 4ª gerações, e o carbapenêmico permanece intacto. Se fosse KPC, o meropeném e o ertapeném seriam resistentes. MRSA é uma bactéria Gram-positiva, e 'sem mecanismo' não explicaria a resistência a tantas classes. O S da pipe-tazo não deve ser levado a sério: é o 'ladrão com faca no bolso' da aula, e a conduta correta seria o meropeném. Gancho: cefalosporinas todas R e carbapenêmico S, ESBL."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Grade 2×2", "arq": "Grade 2×2", "enun": "Mecanismo e conduta, respectivamente, para KPC:", "alts": ["AmpC induzível; evitar 3ª geração.", "Carbapenemase que destrói carbapenêmicos; ceftazidima-avibactam.", "Betalactamase de espectro estendido; meropeném.", "PBP alterada; ceftarolina."], "coms": ["Errada. Esse é o grupo CESP.", "Certa.", "Errada. Essa é a ESBL.", "Errada. Essa é o MRSA."], "correta": 1, "expl": "Fonte: Tabela 4.2.", "fio": null, "id": 140, "aprof": "Mecanismo e conduta formam um par que precisa ser decorado junto. KPC é carbapenemase: enzima que destrói os carbapenêmicos. A conduta é ceftazidima-avibactam, em que o avibactam inibe a enzima. Os distratores são os outros pares: AmpC induzível com evitar 3ª geração (CESP), ESBL com meropeném, e PBP alterada com ceftarolina (MRSA). A questão testa se você mistura as siglas. Dica: o nome da enzima diz o que ela destrói, então a carbapenemase destrói carbapenêmicos. Gancho: carbapenemase destrói o carbapenêmico, o avibactam a desarma."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "ENAMED", "tipo": "Caso clínico", "arq": "Conduta no momento certo", "enun": "Paciente internado há 3 dias com IRAS, iniciou cefepima há 12 horas, está estável e ainda sem culturas. A família pede 'o antibiótico mais forte'. A conduta mais adequada é:", "alts": ["Associar ertapeném para cobrir Pseudomonas.", "Manter a cefepima e reavaliar em 48–72 h com as culturas.", "Trocar imediatamente por meropeném, por ser o mais potente.", "Suspender o antibiótico até sair a cultura."], "coms": ["Errada. Ertapeném não cobre Pseudomonas.", "Certa. Carbapenêmico entra após falha, não por pressão.", "Errada. Conduta extrema no momento errado.", "Errada. Niilista."], "correta": 1, "expl": "Fonte: guia g4.", "fio": null, "id": 141, "aprof": "Paciente estável, 12 horas de cefepima e sem culturas: a cefepima é primeira linha na IRAS e já cobre <i>Pseudomonas<\/i>. Não há motivo para trocar. O razoável é esperar as culturas e reavaliar em 48 a 72 horas, quando o antibiograma e a evolução orientam a conduta, e só então escalonar se houver falha. Suspender o antibiótico sem cultura expõe o paciente. Associar ertapeném não faz sentido, porque ele nem cobre <i>Pseudomonas<\/i>. Trocar por meropeném só porque é 'o mais forte' é o erro mais comum: a força da droga não substitui a lógica de espectro. Gancho: família pede o mais forte, o médico pede a cultura."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Assertivas", "arq": "Assertivas com contagem", "enun": "Sobre a Tabela 4.1 (carbapenêmicos):<br>I. O meropeném é o mais potente.<br>II. O imipeném é associado à cilastatina.<br>III. O ertapeném não cobre Acinetobacter.<br>IV. O ertapeném é o carbapenêmico de escolha na pancreatite infectada.<br>Assinale:", "alts": ["Todas estão corretas.", "Existe apenas uma correta.", "Existe apenas uma incorreta.", "Existem apenas duas incorretas."], "coms": ["Errada. A IV está errada.", "Errada. Três estão corretas (I, II, III).", "Certa. Só a IV está errada: o pâncreas é do imipeném.", "Errada. Só a IV é incorreta."], "correta": 2, "expl": "Fonte: Tabela 4.1.", "fio": null, "id": 142, "aprof": "Confira cada item com a tabela. I é verdadeira: o meropeném é o mais potente. II é verdadeira: o imipeném é associado à cilastatina, que impede sua degradação renal. III é verdadeira: o ertapeném não cobre <i>Pseudomonas<\/i> nem <i>Acinetobacter<\/i>. IV é falsa: o carbapenêmico da pancreatite necrosante infectada é o imipeném, que penetra melhor no pâncreas, não o ertapeném. Sobra, portanto, uma única incorreta. Em questões de contagem, julgue cada item sem influência dos outros. O erro frequente é trocar as indicações dos três carbapenêmicos entre si. Gancho: pâncreas é do imipeném, casa é do ertapeném, ESBL é do meropeném."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: Os carbapenêmicos atuam contra bactérias produtoras de ESBL.", "alts": ["Verdadeiro", "Falso"], "coms": ["Correto. ESBL → meropeném. Fonte: resumo 4.1.", "Errado. ESBL → meropeném. Fonte: resumo 4.1."], "correta": 0, "expl": "ESBL → meropeném. Fonte: resumo 4.1.", "fio": null, "id": 143, "aprof": "Os carbapenêmicos são a droga de escolha contra ESBL. A ESBL hidrolisa penicilinas e cefalosporinas, inclusive as de 3ª e 4ª gerações, mas o anel dos carbapenêmicos resiste a cerca de 99% das betalactamases, incluindo essa. Por isso a afirmativa é verdadeira. A confusão ocorre com a KPC, que é carbapenemase e destrói a própria classe: as duas siglas parecem próximas, mas o tratamento é oposto. Lembre também que o meropeném é a primeira linha na ESBL, mesmo quando a piperacilina-tazobactam aparece como sensível. Gancho: ESBL poupa o carbapenêmico, KPC destrói."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: A estratégia de duplo carbapenêmico sempre funciona contra KPC e é a primeira escolha.", "alts": ["Verdadeiro", "Falso"], "coms": ["Errado. É estratégia de resgate e nem sempre funciona; a primeira escolha é ceftazidima-avibactam. Fonte: resumo 4.2.", "Correto. É estratégia de resgate e nem sempre funciona; a primeira escolha é ceftazidima-avibactam. Fonte: resumo 4.2."], "correta": 1, "expl": "É estratégia de resgate e nem sempre funciona; a primeira escolha é ceftazidima-avibactam. Fonte: resumo 4.2.", "fio": null, "id": 144, "aprof": "O duplo carbapenêmico é um resgate usado quando não há ceftazidima-avibactam: o ertapeném entra primeiro como isca para a carbapenemase e o meropeném age cerca de uma hora depois. Ele se baseia na preferência da enzima pelo ertapeném e nem sempre funciona. Por isso 'sempre funciona' e 'primeira escolha' tornam a afirmativa falsa. A primeira escolha na KPC é a ceftazidima-avibactam. Palavras absolutas como 'sempre' e 'nunca' são pistas clássicas de afirmativa errada em medicina. Gancho: resgate não é primeira linha."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Interpretação", "arq": "Figura, gráfico ou tabela", "enun": "Infecção por Providencia stuartii. Antibiograma: ceftriaxona S; cefepima S; meropeném S. Segundo a aula, o que se deve evitar?", "alts": ["Cefalosporina de 3ª geração, mesmo com resultado sensível, porque ela induz a AmpC.", "Cefepima, porque é sempre ineficaz no grupo CESP.", "Meropeném, porque é contraindicado no grupo CESP.", "Nada; basta seguir o antibiograma."], "coms": ["Certa.", "Errada. Absoluto falso; a nota de revisão (IDSA) até prefere a cefepima para AmpC.", "Errada. O meropeném funciona no CESP; o que se evita é a 3ª geração.", "Errada. É exatamente a pegadinha."], "correta": 0, "expl": "Questão trazida em aula. Fonte: 'o que cai', item 5; guia g4.", "fio": null, "id": 145, "aprof": "<i>Providencia<\/i> e <i>Morganella<\/i> foram acrescentadas por ele ao grupo CESP, e a questão foi trazida em aula. O raciocínio é o da AmpC: a bactéria mantém uma enzima cromossômica desligada que a cefalosporina de 3ª geração liga. Na placa, aparece sensível; no paciente, produz a enzima e a droga falha. Portanto, evita-se a ceftriaxona mesmo com S. A cefepima e o meropeném não são contraindicados, e é por isso que os distratores que os proíbem estão errados. Seguir o antibiograma sem pensar é o distrator mais perigoso. Gancho: nome estranho na questão, desconfie da 3ª geração."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "ENAMED", "tipo": "Múltipla escolha", "arq": "Uma palavra trocada", "enun": "Sobre a NDM, assinale a correta:", "alts": ["É uma cepa de S. aureus resistente à vancomicina.", "É sinônimo de KPC.", "É uma metalobetalactamase de Gram-negativos, tratada com ceftazidima-avibactam isolada.", "É uma metalobetalactamase de Gram-negativos, e o avibactam não a inibe."], "coms": ["Errada. Nota de revisão da aula de penicilinas: NDM é enzima de Gram-negativos.", "Errada. KPC é serino-carbapenemase (inibida pelo avibactam); NDM é metalo (não inibida).", "Errada. Avibactam não age em metalo.", "Certa."], "correta": 3, "expl": "Fonte: resumo 3.4; guia g7.", "fio": null, "id": 146, "aprof": "A NDM é uma metalobetalactamase (New Delhi), um tipo de carbapenemase de Gram-negativos que usa zinco para hidrolisar o anel. Ela é diferente da KPC, que é uma serino-carbapenemase. O avibactam inibe a KPC, mas não inibe as metalobetalactamases, então a ceftazidima-avibactam isolada não funciona contra NDM. Essa é a pegadinha: dizer que se trata com ceftazidima-avibactam isolada confunde NDM com KPC. NDM também não é uma cepa de <i>S. aureus<\/i>, nem sinônimo de KPC. Gancho: avibactam desarma a KPC, mas não a NDM."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Mecanismo dentro da clínica", "enun": "Por que um antibiograma 'sensível' pode enganar em ESBL e no grupo CESP?", "alts": ["As betalactamases só existem dentro do organismo humano.", "A bactéria muda de espécie durante o tratamento.", "Na placa, o antibiótico mata a bactéria antes que ela expresse a enzima; no organismo, ela tem tempo de produzi-la e destruir o fármaco.", "O laboratório usa concentrações menores que as atingidas no sangue."], "coms": ["Errada. A enzima é da bactéria e existe na placa também; o problema é o tempo de expressão.", "Errada. Não há troca de espécie; há indução ou expressão da enzima.", "Certa. É o 'ladrão com a faca no bolso'.", "Errada. Não é a explicação da aula."], "correta": 2, "expl": "Fonte: resumo 4.2.", "fio": null, "id": 147, "aprof": "O antibiograma testa a bactéria na placa, onde o antibiótico mata a célula antes que ela tenha tempo de expressar a enzima de resistência. No organismo, o tempo é maior: a bactéria pode induzir ou produzir a betalactamase, destruir a droga e sobreviver. A aula usa a imagem do ladrão com a faca no bolso, que só a usa depois. Isso explica o engano na ESBL, em que a pipe-tazo parece sensível, e no grupo CESP, em que a ceftriaxona parece sensível, por causa da AmpC induzível. As outras alternativas inventam causas que não são as da aula, como troca de espécie ou concentrações menores. Gancho: sensibilidade in vitro não é in vivo."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Hemocultura de paciente de UTI mostra Klebsiella pneumoniae produtora de KPC. A melhor opção é:", "alts": ["Ceftriaxona.", "Ceftazidima-avibactam.", "Meropeném em dose máxima.", "Piperacilina-tazobactam."], "coms": ["Errada. Não pega KPC; nem pega ESBL.", "Certa.", "Errada. A KPC destrói os carbapenêmicos.", "Errada. Tazobactam não inibe KPC de forma útil; não é a escolha."], "correta": 1, "expl": "Fonte: Tabela 4.2.", "fio": null, "id": 148, "aprof": "Hemocultura com KPC significa infecção grave por um germe que produz carbapenemase, enzima que destrói os carbapenêmicos e inutiliza o meropeném mesmo em dose máxima. O tratamento é ceftazidima-avibactam: o avibactam é um inibidor de betalactamase que protege a ceftazidima. Ceftriaxona e piperacilina-tazobactam são hidrolisadas até por enzimas mais simples, como a ESBL. A tentação de aumentar a dose do meropeném é a armadilha: dose não corrige uma enzima feita para destruir a droga. Se a ceftazidima-avibactam faltar, polimixina ou aminoglicosídeo são as alternativas nefrotóxicas. Gancho: KPC, avibactam."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Mulher de 55 anos com pielonefrite grave. A urocultura mostra E. coli produtora de ESBL. O antibiótico de escolha é:", "alts": ["Ceftriaxona em dose dobrada.", "Ceftarolina.", "Cefepima.", "Meropeném."], "coms": ["Errada. ESBL hidrolisa cefalosporinas de 3ª.", "Errada. Ceftarolina é para MRSA.", "Errada. ESBL hidrolisa também a 4ª geração.", "Certa. A questão traz a sigla ESBL → meropeném, independentemente do sítio."], "correta": 3, "expl": "Fonte: 'o que cai', item 7.", "fio": null, "id": 149, "aprof": "A sigla ESBL já dá a resposta, independente do sítio: meropeném. A pielonefrite grave poderia sugerir ceftriaxona, que é o padrão comunitário, mas a ESBL hidrolisa as cefalosporinas de 3ª e 4ª gerações, então a ceftriaxona e a cefepima ficam sem efeito. A ceftarolina é uma droga para MRSA. O erro é deixar o sítio mandar mais que a bactéria: o sítio escolhe a primeira linha empírica, mas a bactéria identificada, com seu mecanismo, define a droga definitiva. Esta é exatamente a regra do professor: a questão traz a sigla, e a sigla decide. Gancho: ESBL, meropeném, em qualquer sítio."}, {"tema": "Carbapenêmicos e multirresistentes", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "A ESBL hidrolisa:", "alts": ["Penicilinas e cefalosporinas, inclusive as de 3ª e 4ª gerações.", "Apenas cefalosporinas de 5ª geração.", "Carbapenêmicos.", "Apenas penicilinas naturais."], "coms": ["Certa.", "Errada. A ESBL hidrolisa principalmente penicilinas e cefalosporinas de 3ª e 4ª.", "Errada. Isso é a carbapenemase (KPC).", "Errada. Isso seria uma penicilinase simples; ESBL é de espectro estendido."], "correta": 0, "expl": "Fonte: resumo 4.2.", "fio": null, "id": 150, "aprof": "A ESBL é uma betalactamase de espectro estendido: hidrolisa penicilinas e cefalosporinas, inclusive as de 3ª e 4ª gerações. 'Estendido' significa que ela vai além das betalactamases comuns, que só atacam penicilinas e cefalosporinas iniciais. Mas ela poupa os carbapenêmicos, e é por isso que o meropeném é o tratamento. Dizer que hidrolisa carbapenêmicos descreve a carbapenemase (KPC), e dizer que só ataca penicilinas naturais ou só cefalosporinas de 5ª geração subestima a enzima. Gancho: ESBL estende o alcance até a 4ª geração, mas para diante do carbapenêmico."}, {"tema": "Outras classes", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Gestante de 20 semanas com indicação teórica de tratar clamídia. Qual droga deve ser evitada?", "alts": ["Azitromicina.", "Ceftriaxona.", "Doxiciclina.", "Penicilina."], "coms": ["Errada. É a alternativa usada.", "Errada. Não é contraindicada.", "Certa. Evitar na gestação e em crianças pequenas (dentes e ossos).", "Errada. Segura, embora não trate clamídia."], "correta": 2, "expl": "Fonte: Tabela 5.1.", "fio": null, "id": 151, "aprof": "Antibiótico que se liga ao cálcio em formação deposita-se em dentes e ossos em crescimento, e é isso que torna a <b>doxiciclina<\/b>, uma tetraciclina, perigosa na gestação e em crianças pequenas: ela pode manchar e enfraquecer o esqueleto e os dentes do feto. No caso, a clamídia é um atípico, então a escolha segura é a azitromicina, que também é ativa contra ela. A confusão comum é achar que a penicilina é a vilã por ser 'antibiótico forte': penicilinas são seguras na gestação, embora não tratem clamídia, e a ceftriaxona também não é o problema. Gancho: tetraciclina = dente e osso, fora da gestação e da infância."}, {"tema": "Outras classes", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Recuperação direta", "enun": "Paciente com pneumonia que interna receberá ceftriaxona e um macrolídeo. Segundo a aula, qual macrolídeo associar e por quê?", "alts": ["Azitromicina, por causar menos diarreia na associação.", "Clindamicina, para cobrir atípicos.", "Doxiciclina, por ser macrolídeo de longa ação.", "Claritromicina, por ser melhor contra pneumococo."], "coms": ["Certa. Sozinho → claritromicina; com ceftriaxona → azitromicina.", "Errada. Não cobre atípicos.", "Errada. Não é macrolídeo.", "Errada. Isso vale para uso isolado."], "correta": 0, "expl": "Fonte: guia g5.", "fio": null, "id": 152, "aprof": "Macrolídeos agem no ribossomo 50S e cobrem os atípicos, que a ceftriaxona não alcança; por isso a pneumonia que interna leva <b>ceftriaxona + macrolídeo<\/b>. Dentro da classe há duas escolhas: a claritromicina é melhor contra pneumococo e é a opção quando o macrolídeo vai sozinho, mas, quando associado à ceftriaxona, o pneumococo já está coberto e o que pesa é a tolerância, e a azitromicina causa menos diarreia. É a regra da aula: sozinho, claritro; com ceftriaxona, azitro. As outras alternativas são erros de classe: clindamicina é lincosamida e doxiciclina é tetraciclina, nenhuma é macrolídeo. Gancho: azitro acompanha a ceftriaxona."}, {"tema": "Outras classes", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "Vancomicina: classe e espectro.", "alts": ["Glicopeptídeo; Gram-negativos multirresistentes.", "Lincosamida; Gram-positivos e anaeróbios.", "Betalactâmico; Gram-positivos e Gram-negativos.", "Glicopeptídeo; só Gram-positivos, incluindo MRSA."], "coms": ["Errada. Molécula grande, não passa a membrana externa.", "Errada. Essa é a clindamicina.", "Errada. Não é betalactâmico.", "Certa."], "correta": 3, "expl": "Fonte: Tabela 5.1.", "fio": null, "id": 153, "aprof": "A vancomicina é um glicopeptídeo: em vez de bloquear a PBP como os betalactâmicos, ela se liga ao D-alanil-D-alanina e impede a montagem da parede. Por ser uma molécula grande, não atravessa a membrana externa dos Gram-negativos, e por isso seu espectro é só de <b>Gram-positivos<\/b>, incluindo o MRSA. Isso elimina a primeira alternativa, que a coloca contra Gram-negativos. A confusão comum é com a clindamicina, que é lincosamida e pega Gram-positivos e anaeróbios, e com o rótulo de betalactâmico, que a vancomicina não tem apesar de também agir na parede. Gancho: molécula grande, só Gram-positivo; é a droga clássica do MRSA."}, {"tema": "Outras classes", "nivel": "ENAMED", "tipo": "Caso clínico", "arq": "Mecanismo dentro da clínica", "enun": "Paciente em hemodiálise recebe vancomicina e gentamicina por endocardite. Qual efeito adverso comum aos dois exige monitorização?", "alts": ["Prolongamento do QT.", "Nefrotoxicidade.", "Efeito antabuse.", "Ruptura de tendão."], "coms": ["Errada. Efeito de macrolídeos e quinolonas, não de vancomicina e gentamicina juntas.", "Certa. Ambos são nefrotóxicos.", "Errada. Metronidazol.", "Errada. Quinolonas."], "correta": 1, "expl": "Fonte: Tabela 5.1.", "fio": null, "id": 154, "aprof": "A vancomicina e os aminoglicosídeos têm em comum o rim como órgão-alvo: ambos são <b>nefrotóxicos<\/b>, e a gentamicina ainda é ototóxica. Somados no mesmo paciente os riscos se acumulam, por isso se monitoram creatinina, diurese e níveis do fármaco. No caso, o paciente já faz hemodiálise, o que torna o ajuste de dose e a vigilância ainda mais importantes. As outras alternativas pertencem a outras classes: QT longo é dos macrolídeos e quinolonas, antabuse é do metronidazol e ruptura de tendão é das quinolonas. Gancho: glicopeptídeo e aminoglicosídeo, dois 'glico' que castigam o rim."}, {"tema": "Outras classes", "nivel": "Decoreba", "tipo": "Verdadeiro ou Falso", "arq": "Verdadeiro ou falso", "enun": "Julgue a afirmativa: A doxiciclina é um macrolídeo.", "alts": ["Verdadeiro", "Falso"], "coms": ["Errado. É tetraciclina (sufixo '-ciclina'), que age no ribossomo 30S. Fonte: guia g5.", "Correto. É tetraciclina (sufixo '-ciclina'), que age no ribossomo 30S. Fonte: guia g5."], "correta": 1, "expl": "É tetraciclina (sufixo '-ciclina'), que age no ribossomo 30S. Fonte: guia g5.", "fio": null, "id": 155, "aprof": "Os nomes ajudam a classificar: o sufixo <b>-ciclina<\/b> identifica as tetraciclinas, e a doxiciclina é uma delas. Tetraciclinas agem no ribossomo 30S, enquanto os macrolídeos (azitromicina, claritromicina) agem no 50S, então são classes distintas com mecanismos diferentes, embora ambas cubram atípicos. A confusão vem de as duas serem usadas juntas ou no lugar uma da outra em pneumonia atípica e clamídia. Na prova, a pegadinha é trocar a classe da droga. Gancho: tetra-ciclina, 30S; macrolídeo, 50S; a doxiciclina nunca é macrolídeo."}, {"tema": "Outras classes", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "A clindamicina tem espectro e efeito adverso clássico, respectivamente:", "alts": ["Só anaeróbios; efeito antabuse.", "Atípicos; QT longo.", "Gram-positivos e anaeróbios; é o antibiótico mais associado ao C. difficile.", "Gram-negativos; ototoxicidade."], "coms": ["Errada. Isso é o metronidazol.", "Errada. Isso descreve os macrolídeos.", "Certa.", "Errada. Isso descreve os aminoglicosídeos."], "correta": 2, "expl": "Fonte: guia g5.", "fio": null, "id": 156, "aprof": "A clindamicina é uma lincosamida que age no ribossomo 50S e cobre <b>Gram-positivos e anaeróbios<\/b>, com boa penetração óssea. Ao eliminar a flora anaeróbia do intestino, abre espaço para o <i>Clostridioides difficile<\/i> se multiplicar e produzir toxinas, e por isso ela é o antibiótico mais associado à colite pseudomembranosa, seguida pela ceftriaxona. A confusão mais comum é trocar com o metronidazol, que pega só anaeróbios e cujo efeito adverso clássico é o antabuse, que aparece na primeira alternativa. Gancho: clinda = Gram-positivo + anaeróbio + C. diff."}, {"tema": "Outras classes", "nivel": "Faculdade", "tipo": "Asserção-razão", "arq": "Asserção-razão", "enun": "Avalie as asserções e a relação entre elas.<br><br><b>I.<\/b> O espectro do metronidazol restringe-se aos anaeróbios e a alguns protozoários.<br><br><b>PORQUE<\/b><br><br><b>II.<\/b> O metronidazol só é ativado em ambiente sem oxigênio.", "alts": ["As duas asserções são verdadeiras, e a II justifica a I.", "As duas asserções são verdadeiras, mas a II não justifica a I.", "A I é verdadeira, e a II é falsa.", "A I é falsa, e a II é verdadeira.", "As duas asserções são falsas."], "coms": ["Correta. A ativação em anaerobiose explica o espectro. Fonte: resumo 5.2.", "Incorreta. Exigiria as duas verdadeiras sem relação de causa. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria a I verdadeira e a II falsa. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria a I falsa e a II verdadeira. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I.", "Incorreta. Exigiria as duas falsas. Aqui a I é verdadeira e a II é verdadeira; a II justifica a I."], "correta": 0, "expl": "A ativação em anaerobiose explica o espectro. Fonte: resumo 5.2.", "fio": null, "id": 157, "aprof": "O metronidazol é um pró-fármaco: só é reduzido e ativado em ambiente sem oxigênio, e então lesa o DNA. Células aeróbias não têm esse sistema de ativação, de modo que a droga fica inerte nelas. Isso explica por que o espectro se limita a anaeróbios e a protozoários que vivem em baixa tensão de oxigênio, como giárdia, ameba e tricomonas. Por isso a II justifica a I; por isso a resposta é a primeira opção (as duas verdadeiras e a II justifica a I): o mecanismo é a causa do espectro. A confusão é marcar 'verdadeiras, mas sem relação' sem notar que a assertiva II é exatamente o porquê. Gancho: sem oxigênio, ativa; com oxigênio, nada."}, {"tema": "Outras classes", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Distrator de família", "enun": "Entre os antibióticos terminados em '-micina', quais são macrolídeos?", "alts": ["Azitromicina e claritromicina.", "Clindamicina e claritromicina.", "Gentamicina e azitromicina.", "Vancomicina e clindamicina."], "coms": ["Certa.", "Errada. Clindamicina é lincosamida.", "Errada. Gentamicina é aminoglicosídeo.", "Errada. Glicopeptídeo e lincosamida."], "correta": 0, "expl": "Fonte: resumo 5.2.", "fio": null, "id": 158, "aprof": "Muitas drogas terminam em '-micina', mas a classe não segue o sufixo. Os macrolídeos só têm duas representantes no material, <b>azitromicina e claritromicina<\/b>. A vancomicina é glicopeptídeo, a clindamicina é lincosamida e a gentamicina é aminoglicosídeo. Cada uma tem mecanismo, espectro e toxicidade próprios, então a classe determina o que esperar da droga. As alternativas erradas misturam essas classes, e a mais traiçoeira é a que junta azitromicina com gentamicina. Gancho: entre as '-micinas', só 'azi' e 'claritro' são macrolídeos; o sufixo '-ciclina' é das tetraciclinas."}, {"tema": "Outras classes", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Diferencial por exclusão", "enun": "Durante infusão rápida de vancomicina, o paciente apresenta rubor intenso em face, pescoço e tronco, com prurido, sem broncoespasmo nem hipotensão. Conduta:", "alts": ["Anafilaxia; suspender definitivamente e registrar alergia.", "Síndrome de Stevens-Johnson; UTI.", "Reação de Jarisch-Herxheimer; manter.", "Síndrome do homem vermelho; reduzir a velocidade de infusão."], "coms": ["Errada. Rótulo de alergia indevido.", "Errada. SSJ tem lesão de mucosa e descolamento de pele, ausentes aqui.", "Errada. Ocorre no tratamento da sífilis.", "Certa. Liberação de histamina pela infusão rápida, não alergia."], "correta": 3, "expl": "Fonte: resumo 5.2.", "fio": null, "id": 159, "aprof": "A <b>síndrome do homem vermelho<\/b> ocorre quando a vancomicina é infundida depressa: há liberação direta de histamina pelos mastócitos, sem IgE, e por isso não é alergia verdadeira. O quadro é rubor e prurido de face, pescoço e tronco, sem broncoespasmo nem hipotensão, que apontariam para anafilaxia. A conduta é reduzir a velocidade da infusão (e, se necessário, pausar), e a droga pode ser mantida; registrar alergia seria um erro, pois tiraria do paciente uma droga importante. A confusão mais comum é tratar como anafilaxia ou Stevens-Johnson. Gancho: homem vermelho = histamina, infundir devagar."}, {"tema": "Outras classes", "nivel": "Decoreba", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "Os aminoglicosídeos (gentamicina, amicacina) têm como efeitos adversos:", "alts": ["Fotossensibilidade.", "Nefro e ototoxicidade, e bloqueio neuromuscular.", "Ruptura de tendão.", "QT longo e CYP3A4."], "coms": ["Errada. Doxiciclina.", "Certa.", "Errada. Quinolonas.", "Errada. Macrolídeos (claritromicina)."], "correta": 1, "expl": "Fonte: Tabela 5.1.", "fio": null, "id": 160, "aprof": "Os aminoglicosídeos agem no ribossomo 30S e são concentrados em rim e ouvido interno, daí a <b>nefrotoxicidade e a ototoxicidade<\/b>, que podem ser irreversíveis. Eles também interferem na liberação de acetilcolina na junção neuromuscular, causando bloqueio neuromuscular, o que importa em quem usa relaxantes ou tem miastenia. As outras alternativas são de outras classes: fotossensibilidade é da doxiciclina, ruptura de tendão é das quinolonas, QT longo e CYP3A4 são dos macrolídeos. A confusão é misturar toxicidades de classes diferentes. Gancho: aminoglicosídeo = rim, ouvido e junção neuromuscular."}, {"tema": "Outras classes", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "Efeitos adversos e interações típicos dos macrolídeos:", "alts": ["Efeito antabuse com álcool.", "Nefrotoxicidade e ototoxicidade.", "Prolongam o QT; a claritromicina inibe o CYP3A4.", "Fotossensibilidade e esofagite."], "coms": ["Errada. Metronidazol.", "Errada. Aminoglicosídeos.", "Certa.", "Errada. Doxiciclina."], "correta": 2, "expl": "Fonte: Tabela 5.1.", "fio": null, "id": 161, "aprof": "Os macrolídeos têm dois pontos para decorar: <b>prolongam o QT<\/b>, e a claritromicina inibe o CYP3A4, a enzima hepática que metaboliza muitos fármacos, elevando seus níveis. Isso gera interações com estatinas, anticoagulantes e outros que também alteram o QT. A azitromicina quase não inibe o CYP3A4, o que é outra razão para ela ser a parceira da ceftriaxona. As alternativas erradas pertencem a outras classes: antabuse é do metronidazol, nefro e ototoxicidade são dos aminoglicosídeos e fotossensibilidade e esofagite são da doxiciclina. Gancho: macrolídeo = QT e CYP, claritro mais."}, {"tema": "Outras classes", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Mecanismo dentro da clínica", "enun": "Por que a vancomicina por via oral é útil contra C. difficile, mas não para infecção sistêmica?", "alts": ["É absorvida e concentra-se no fígado.", "Não é absorvida e age apenas no lúmen intestinal.", "Só age em pH ácido.", "É destruída pelo ácido gástrico antes de chegar ao cólon."], "coms": ["Errada. É justamente por NÃO ser absorvida que serve no intestino e não no sistema.", "Certa.", "Errada. Não é o motivo; a questão é a absorção oral.", "Errada. Se fosse destruída, não serviria para o C. difficile."], "correta": 1, "expl": "Fonte: resumo 5.2.", "fio": null, "id": 162, "aprof": "A vancomicina é uma molécula grande e polar que quase não atravessa a mucosa intestinal. Por via oral ela <b>não é absorvida<\/b> e permanece no lúmen, em alta concentração, exatamente onde o <i>C. difficile<\/i> produz suas toxinas, e por isso é eficaz na colite. Pelo mesmo motivo é inútil em infecção sistêmica: a droga nunca chega ao sangue. A confusão é achar que ela precisa ser absorvida para agir, ou que o ácido gástrico a destrói, o que não ocorre. Para infecção sistêmica por MRSA, a via é intravenosa. Gancho: o que não é absorvido fica no intestino, onde está o alvo."}, {"tema": "Outras classes", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Mecanismo dentro da clínica", "enun": "As polimixinas (colistina) agem:", "alts": ["Desestruturando a membrana externa como detergente; são última linha contra Gram-negativos multirresistentes.", "Inibindo a DNA girase.", "No ribossomo 50S; cobrem atípicos.", "Inibindo a PBP; são primeira linha contra Pseudomonas."], "coms": ["Certa.", "Errada. Quinolonas.", "Errada. Macrolídeos.", "Errada. Isso descreve betalactâmicos; polimixina é última linha."], "correta": 0, "expl": "Fonte: Tabela 5.1.", "fio": null, "id": 163, "aprof": "As polimixinas, como a colistina, agem como <b>detergente<\/b> na membrana externa dos Gram-negativos: desestruturam os lipídios e retiram cálcio e magnésio que estabilizam essa membrana. Por isso o professor pontua que 'retirar cálcio e magnésio da membrana externa' é mecanismo das polimixinas, e não das penicilinas, o que cai em V ou F. São nefro e neurotóxicas e ficam de reserva contra Gram-negativos multirresistentes, como a KPC, quando faltam opções. As outras alternativas descrevem quinolonas (DNA girase), macrolídeos (50S) e betalactâmicos (PBP). Gancho: polimixina = detergente de última linha."}, {"tema": "Outras classes", "nivel": "Faculdade", "tipo": "Caso clínico", "arq": "Distrator de família", "enun": "Paciente com pé diabético infectado recebe ceftriaxona com clindamicina. Qual a função da clindamicina nesse esquema?", "alts": ["Cobrir atípicos.", "Proteger a ceftriaxona das betalactamases.", "Cobrir Pseudomonas.", "Cobrir anaeróbios e Gram-positivos da pele."], "coms": ["Errada. Clindamicina não pega atípicos, e eles não são agentes do pé diabético.", "Errada. Isso é papel de inibidor de betalactamase (clavulanato, tazobactam).", "Errada. Clindamicina não pega Gram-negativos.", "Certa. O metronidazol pegaria só anaeróbio."], "correta": 3, "expl": "Pegadinha do guia g5.", "fio": null, "id": 164, "aprof": "No pé diabético a infecção costuma ser mista: pele colonizada por estafilococos e estreptococos, mais anaeróbios nos tecidos necróticos e mal perfundidos. A ceftriaxona cobre Gram-negativos, mas não cobre anaeróbios nem de forma confiável os Gram-positivos da pele, o MSSA em particular. A <b>clindamicina<\/b> preenche as duas lacunas, pois pega Gram-positivos e anaeróbios, e a boa penetração óssea também ajuda. A confusão é pensar que clindamicina serve só para anaeróbios, papel do metronidazol; é isso que a pegadinha do material aponta. Gancho: pergunta-chave, o que a ceftriaxona não pega nesse lugar? Anaeróbio e Gram-positivo."}, {"tema": "Outras classes", "nivel": "Faculdade", "tipo": "Múltipla escolha", "arq": "Recuperação direta", "enun": "Norfloxacino é citado no material para:", "alts": ["Profilaxia de peritonite bacteriana espontânea.", "Tratamento de meningite.", "Tratamento de MRSA.", "Profilaxia de febre reumática."], "coms": ["Certa.", "Errada. Meningite é ceftriaxona (± ampicilina).", "Errada. MRSA: vancomicina ou ceftarolina.", "Errada. Benzatina a cada 21 dias."], "correta": 0, "expl": "Fonte: Tabela 5.1.", "fio": null, "id": 165, "aprof": "Na cirrose com ascite, bactérias intestinais podem atravessar a parede e infectar o líquido, causando PBE. Em quem já teve um episódio, ou tem proteína baixa no líquido, a prevenção usa uma quinolona pouco absorvida que descontamina o intestino de Gram-negativos, o <b>norfloxacino<\/b>. Quinolonas agem na DNA girase e cobrem Gram-negativos entéricos, que são justamente os agentes da PBE. As outras alternativas não combinam: meningite e MRSA não são tratados com ele, e a profilaxia de febre reumática é a benzatina. Gancho: norfloxacino = prevenir PBE, intestino limpo de Gram-negativos."}, {"tema": "Outras classes", "nivel": "Faculdade", "tipo": "Grade 2×2", "arq": "Grade 2×2", "enun": "Relacione, respectivamente, o alvo ribossômico de macrolídeos e de doxiciclina:", "alts": ["30S; 30S.", "50S; 30S.", "50S; 50S.", "30S; 50S."], "coms": ["Errada. O macrolídeo é 50S.", "Certa.", "Errada. A doxiciclina é 30S.", "Errada. Inverte."], "correta": 1, "expl": "Pegadinha de 'uma palavra trocada': 30S/50S. Fonte: Tabela 5.1.", "fio": null, "id": 166, "aprof": "Os dois ribossomos bacterianos têm subunidades 30S e 50S, e cada classe se liga a uma. <b>Macrolídeos agem no 50S<\/b>, junto com a clindamicina; <b>doxiciclina age no 30S<\/b>, junto com os aminoglicosídeos. É uma pegadinha de 'uma palavra trocada', então a alternativa certa é 50S para macrolídeos e 30S para doxiciclina. Um jei
