<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8ecd6">
<script>
/* antes de tudo: tema da hora e cor da barra do iPhone já certos no primeiro quadro */
(()=>{try{let t=localStorage.getItem("pe:temaV4")?JSON.parse(localStorage.getItem("pe:tema2")||'"auto"'):"auto";
if(t==="auto"){const h=new Date().getHours();t=h>=5&&h<12?"amanhecer":h>=12&&h<18?"dourado":"noite";}
if(t!=="noite")document.documentElement.setAttribute("data-tema",t);
document.querySelector('meta[name="theme-color"]').setAttribute("content",{claro:"#f5f8fb",amanhecer:"#eef6fa",dourado:"#fcf6ec",meianoite:"#05070d",cristal:"#10283a",aurora:"#191433",floresta:"#11261a"}[t]||"#121a2d");}catch(e){}})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Estudos">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=62">
<link rel="icon" type="image/png" href="favicon.png?v=62">
<link rel="manifest" href="manifest.webmanifest?v=62">
<title>Planeta de Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
:root{
  --ink:#e9f0f8; --muted:#97a6bd; --faint:#5d6b84; --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --glass:rgba(22,32,52,.55); --glass2:rgba(255,255,255,.06); --glass3:rgba(255,255,255,.10); --solid:rgba(16,24,40,.86);
  --acc:#9fe0b0; --acc2:#8fd6ff; --acc-soft:rgba(159,224,176,.14); --ok:#9fe0b0; --bad:#f2a08f; --gold:#f2c46e;
  --font:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --on-ink:#0f1626; --doc:#d6dfeb; --forte:#ffffff; --opt:#141d31;
  --fundo:radial-gradient(60% 50% at 30% 45%,#1e2d48 0%,rgba(30,45,72,0) 70%),radial-gradient(50% 40% at 80% 80%,rgba(70,110,140,.25),transparent 70%),linear-gradient(180deg,#141d31 0%,#0c1220 100%);
  color-scheme:dark;
}
:root[data-tema="meianoite"]{
  --glass:rgba(10,12,20,.6); --solid:rgba(6,8,14,.92); --muted:#8a93a6; --faint:#4a5163; --line:rgba(255,255,255,.08);
  --acc:#9fe0b0; --acc2:#8fb8ff;
  --fundo:radial-gradient(45% 40% at 30% 45%,#121a2c 0%,rgba(18,26,44,0) 70%),linear-gradient(180deg,#05070d 0%,#000000 100%);
}
:root[data-tema="cristal"]{
  --acc:#9ff0e2; --acc2:#b8ecff; --acc-soft:rgba(159,240,226,.14); --glass:rgba(20,44,58,.5); --solid:rgba(14,32,44,.88);
  --fundo:radial-gradient(55% 45% at 30% 45%,#1d4357 0%,rgba(29,67,87,0) 70%),radial-gradient(45% 35% at 85% 15%,rgba(120,220,230,.18),transparent 70%),linear-gradient(180deg,#10283a 0%,#08141f 100%);
}
:root[data-tema="aurora"]{
  --acc:#a8f0c8; --acc2:#c9b3f0; --acc-soft:rgba(201,179,240,.14); --glass:rgba(34,28,58,.5); --solid:rgba(24,20,44,.88);
  --fundo:radial-gradient(50% 40% at 20% 15%,rgba(140,230,180,.25),transparent 70%),radial-gradient(50% 45% at 85% 25%,rgba(160,130,240,.28),transparent 70%),radial-gradient(60% 50% at 30% 50%,#2a2350 0%,rgba(42,35,80,0) 70%),linear-gradient(180deg,#191433 0%,#0b0a1a 100%);
}
:root[data-tema="floresta"]{
  --acc:#b5e48c; --acc2:#9fe0b0; --acc-soft:rgba(181,228,140,.14); --glass:rgba(22,44,30,.52); --solid:rgba(14,30,20,.9); --muted:#9cb39f; --faint:#5f7663;
  --fundo:radial-gradient(55% 45% at 30% 45%,#1f4a33 0%,rgba(31,74,51,0) 70%),radial-gradient(45% 35% at 80% 85%,rgba(140,200,110,.16),transparent 70%),linear-gradient(180deg,#11261a 0%,#07120c 100%);
}
:root[data-tema="amanhecer"]{
  --ink:#1d2a3a; --muted:#5e6e83; --faint:#9aa8ba; --line:rgba(30,50,80,.12); --line2:rgba(30,50,80,.2);
  --glass:rgba(255,255,255,.58); --glass2:rgba(30,50,80,.05); --glass3:rgba(30,50,80,.09); --solid:rgba(255,255,255,.9);
  --acc:#3f9a6a; --acc2:#3a8fc0; --acc-soft:rgba(63,154,106,.12); --ok:#3f9a6a; --bad:#c0574b; --gold:#b8860b;
  --on-ink:#ffffff; --doc:#2b3a4c; --forte:#0f1b2a; --opt:#ffffff;
  --fundo:radial-gradient(55% 50% at 30% 45%,#ffffff 0%,rgba(255,255,255,0) 70%),radial-gradient(50% 40% at 85% 15%,rgba(170,225,200,.5),transparent 70%),radial-gradient(50% 40% at 80% 90%,rgba(180,210,240,.6),transparent 70%),linear-gradient(180deg,#e9f2f9 0%,#d3e3ef 100%);
  color-scheme:light;
}
:root[data-tema="amanhecer"] .vidro{box-shadow:0 20px 50px rgba(40,70,110,.12),inset 0 1px 0 rgba(255,255,255,.8)}
:root[data-tema="amanhecer"] .modal-bg{background:rgba(200,215,230,.5)}
:root[data-tema="amanhecer"] .nav{background:rgba(255,255,255,.55)}
.fig{object-fit:contain;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.ico .fig{width:40px;height:40px}
.ico.fig-on{background:radial-gradient(circle,rgba(143,214,255,.14),transparent 70%);border-color:transparent}
.chipi .fig{width:22px;height:22px;margin:-4px 0}
.efe .fig{width:24px;height:24px;margin:-4px 0}
.festa .im img.fig{width:130px;height:130px}
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.tema{border:1px solid var(--line);border-radius:16px;padding:8px;cursor:pointer;text-align:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:transparent}
.tema.on{border-color:var(--acc2);color:var(--ink)}
.tema i{display:block;height:58px;border-radius:10px;margin-bottom:8px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased;background:var(--fundo);background-attachment:fixed;transition:background .6s}
html:not([data-tema]) body.aurora{background:radial-gradient(50% 40% at 25% 20%,rgba(140,220,170,.22),transparent 70%),radial-gradient(50% 40% at 80% 25%,rgba(150,130,230,.22),transparent 70%),radial-gradient(60% 50% at 30% 45%,#1e2d48 0%,rgba(30,45,72,0) 70%),linear-gradient(180deg,#141d31 0%,#0c1220 100%);background-attachment:fixed}
button,input,select,textarea{font-family:inherit}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:16px;height:16px;stroke-width:1.5}
::selection{background:rgba(143,214,255,.3)}

/* ---------- espaço e planeta ---------- */
#espaco{position:fixed;inset:0;z-index:0}
.mundo-canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}

/* ---------- navegação ---------- */
.nav{position:fixed;left:22px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;padding:10px 8px;border-radius:28px;background:rgba(18,27,45,.45);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line)}
.navbtn{position:relative;width:46px;height:46px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.2s}
.navbtn:hover{color:var(--ink);background:var(--glass2)}
.navbtn.active{color:var(--on-ink);background:var(--ink)}
.navbtn .tip{position:absolute;left:58px;white-space:nowrap;font-size:11px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);opacity:0;pointer-events:none;transform:translateX(-4px);transition:.2s}
.navbtn:hover .tip{opacity:1;transform:none}
.marca{position:fixed;left:30px;top:26px;z-index:20;font-size:12px;font-weight:300;letter-spacing:.42em;text-transform:uppercase;color:var(--muted)}

/* ---------- conteúdo ---------- */
.main{position:relative;z-index:10;min-height:100vh;padding:26px 34px 60px 110px;pointer-events:none}
.main > *{pointer-events:auto}
#view-inicio,#view-mundo,#view-inicio .home,#view-inicio .esq,#view-mundo .mundo-ui{pointer-events:none}
#view-inicio .vidro,#view-mundo .vidro,#view-inicio .esq > *,#view-mundo .mundo-ui > div:first-child{pointer-events:auto}
.view{max-width:1240px;margin:0 auto}
.topo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin:0 0 18px;pointer-events:auto}
.chipi{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);font-size:13px;color:var(--ink);font-weight:400;letter-spacing:.04em}
.chipi .lbar{width:90px;height:3px;border-radius:9px;background:var(--line);overflow:hidden}
.chipi .lbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}.dot.on{background:var(--acc)}

.titulo{font-weight:200;font-size:clamp(30px,4.2vw,54px);letter-spacing:.32em;text-transform:uppercase;line-height:1.15;margin:0}
.titulo.p{font-size:clamp(24px,2.8vw,36px);letter-spacing:.24em}
.sub{font-weight:300;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--muted);margin:10px 0 0}
.kicker{font-size:11px;font-weight:400;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.intro{color:var(--muted);font-weight:300;margin:12px 0 26px;max-width:640px}
.linha{height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent);margin:18px 0}

.vidro{background:var(--glass);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.06)}
.card{padding:20px 22px}
.h-sec{font-size:11.5px;font-weight:400;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;gap:10px}
.h-sec .grow{flex:1}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line2);background:var(--glass2);color:var(--ink);font-weight:400;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;padding:10px 18px;border-radius:99px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.btn:hover{background:var(--glass3);border-color:rgba(255,255,255,.3)}
.btn.pri{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.pri:hover{background:var(--forte);color:var(--on-ink);border-color:var(--forte)}
.btn.sm{padding:6px 12px;font-size:11px}
.btn.bad{border-color:rgba(242,160,143,.5);color:var(--bad)}
.btn.ic{padding:7px;border-radius:50%}
.bar{height:3px;border-radius:9px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:9px;transition:width .5s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.empty{padding:24px;text-align:center;color:var(--muted);font-weight:300}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);border-radius:14px;padding:10px 14px;font:400 14.5px var(--font);outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--acc2)}
select.f option{background:var(--opt)}
label.lb{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.ico{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--acc2)}
.ico img{width:30px;height:30px;object-fit:contain}
.ico.ok{color:var(--acc);border-color:rgba(159,224,176,.4)}

/* ---------- início ---------- */
.home{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:30px;min-height:calc(100vh - 120px)}
.home .esq{display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.home .esq > *{pointer-events:auto}
.home .dir{display:flex;flex-direction:column;gap:14px}
.relatorio-inicio .h-sec{margin-bottom:10px;letter-spacing:.14em}
.rs-cab{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-6px 0 8px}
.rs-cab .h-sec{margin:0}
.rs-mais{margin:-8px -6px -8px 0;min-height:44px;min-width:44px;padding:6px;border:0;background:transparent;color:var(--acc2);font:400 12px var(--font);cursor:pointer}
.rs-numeros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rs-numeros b{display:block;font-size:22px;font-weight:400;line-height:1.2;color:var(--ink)}
.rs-numeros span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rs-metricas{display:flex;align-items:center;gap:4px;flex:none}
.rs-metricas button{min-height:44px;min-width:44px;padding:6px 10px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--muted);font:400 12px var(--font);cursor:pointer}
.rs-metricas button[aria-pressed=true]{border-color:var(--line);background:var(--glass2);color:var(--ink)}
.rs-grafico{display:block;width:100%;height:108px;overflow:visible;margin-top:8px}
.rs-grafico line{stroke:var(--line)}
.rs-grafico text{fill:var(--muted);font:10px var(--font)}
.rs-grafico .rs-barra{fill:var(--acc2);opacity:.65}
.rs-grafico .rs-barra.hoje{fill:var(--acc);opacity:1}
.rs-grafico .rs-dia.hoje{fill:var(--ink);font-weight:600}
.rs-legenda{margin:2px 0 0;font-size:11px;color:var(--muted);line-height:1.4}
.rs-rodape{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stats{display:flex;gap:34px;flex-wrap:wrap}
.stat b{display:block;font-weight:200;font-size:38px;line-height:1;letter-spacing:.02em}
.stat span{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.miss{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.miss:last-child{border-bottom:0}
.miss .t{flex:1;min-width:0}
.miss .t b{display:block;font-weight:400;font-size:14.5px;line-height:1.3}
.miss .t small{display:block;color:var(--muted);font-size:12px;margin:2px 0 6px}
.miss.done{opacity:.55}
.miss .rw{font-size:11.5px;color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.premios{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.premios span{border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.acao{display:flex;align-items:center;gap:14px}
.acao .t{flex:1;min-width:0}.acao .t b{display:block;font-weight:400}.acao .t span{font-size:12.5px;color:var(--muted)}
.dica-mundo{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}

/* ---------- páginas (painel de vidro) ---------- */
.pagina{max-width:980px;margin-left:auto}
.pagina.larga{max-width:1240px}

/* ---------- mundo ---------- */
.mundo-ui{display:flex;flex-direction:column;justify-content:space-between;min-height:calc(100vh - 120px);pointer-events:none}
.mundo-ui > *{pointer-events:auto}
.colecao{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.cria{flex:none;width:74px;text-align:center;cursor:pointer;border-radius:18px;padding:10px 6px;border:1px solid transparent;transition:.2s}
.cria:hover{border-color:var(--line);background:var(--glass2)}
.cria .im{width:52px;height:52px;margin:0 auto;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,rgba(143,214,255,.16),transparent 70%)}
.cria .im img{width:56px;height:56px;object-fit:contain}
.cria .nm{font-size:10.5px;margin-top:4px;line-height:1.25}
.cria .rr{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.cria.lock{opacity:.4;cursor:default}
.cria.lock .im{color:var(--faint)}
.efeitos{display:flex;gap:8px;flex-wrap:wrap}
.efe{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.efe.on{color:var(--ink);border-color:rgba(143,214,255,.4);background:rgba(143,214,255,.08)}
.efe svg{color:var(--acc2)}

.painel-mundo{max-width:720px;padding:12px 16px}
.painel-mundo .efeitos{gap:6px}.painel-mundo .efe{padding:4px 10px 4px 6px;font-size:11.5px}
.painel-mundo .h-sec{margin:0}
.painel-mundo .colecao{margin-top:10px}
/* textos sobre o planeta somem enquanto você gira ou dá zoom, e voltam sozinhos */
.some-ao-girar{transition:opacity .45s ease, transform .45s ease}
body.explorando .some-ao-girar{opacity:0;transform:translateY(-6px);pointer-events:none}
body.explorando #view-mundo .painel-mundo{opacity:.15}
#view-mundo .painel-mundo{transition:opacity .45s}
/* guia de uso: três passos em tipografia fina, no mesmo estilo do título */
.guia{display:flex;align-items:flex-end;gap:18px;margin-top:0;flex-wrap:wrap}
.g-item{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--muted);transition:color .2s}
.g-item:hover{color:var(--ink)}
.g-n{font-weight:200;font-size:30px;line-height:1;letter-spacing:.06em;color:var(--faint);transition:color .2s}
.g-item:hover .g-n{color:var(--acc2)}
.g-item.ok .g-n{color:var(--acc)}
.g-t{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink);margin-top:6px}
.g-d{font-size:11.5px;font-weight:300;letter-spacing:.06em}
.g-sep{width:34px;height:1px;background:var(--line2);margin-bottom:22px}
/* ---------- foco ---------- */
.foco-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;padding-top:4vh}
.tempo-big{font-weight:200;font-size:clamp(70px,13vw,150px);letter-spacing:.06em;line-height:1;font-variant-numeric:tabular-nums}
.durs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.durs button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:7px 15px;font:400 12px var(--font);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.durs button.on{color:var(--on-ink);background:var(--ink);border-color:var(--ink)}
.timerpill{position:fixed;right:22px;bottom:22px;z-index:35;display:flex;align-items:center;gap:10px;cursor:pointer}
.timerpill b{font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:.08em}

/* ---------- matérias ---------- */
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.mat{padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:.2s}
.mat:hover{border-color:var(--line2);transform:translateY(-2px)}
.mat .hd{display:flex;align-items:center;gap:14px}
.mat b{font-weight:400;font-size:16px;line-height:1.3}
.mat small{color:var(--muted);font-size:12.5px}
.mat.add{align-items:center;justify-content:center;color:var(--muted);border-style:dashed;min-height:150px;letter-spacing:.2em;text-transform:uppercase;font-size:12px}
.secs{display:flex;flex-direction:column}
.sec{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.sec:last-child{border-bottom:0}
.sec:hover{padding-left:10px}
.sec .ck{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);flex:none;display:grid;place-items:center;color:var(--on-ink)}
.sec.lida .ck{background:var(--acc);border-color:var(--acc)}
.sec .t{flex:1;min-width:0;font-weight:400;font-size:15px;line-height:1.35}
.sec .n{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.grupo{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin:26px 0 4px}
.ownbar{display:flex;gap:4px;opacity:.6}
.sec:hover .ownbar{opacity:1}
.backlink{display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:var(--muted);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;padding:0;margin:0 0 18px}
.backlink:hover{color:var(--ink)}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.tabs button{border:0;background:transparent;border-radius:99px;padding:7px 16px;font:400 11.5px var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--on-ink)}

/* ---------- leitura ---------- */
.leitura{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:26px;align-items:start}
.doc{padding:34px 40px;background:var(--solid)}
.toc{position:sticky;top:30px;max-height:calc(100vh - 60px);overflow:auto;padding:16px 12px}
.toc ul{list-style:none;margin:0;padding:0}
.toc a{display:block;padding:6px 10px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:13px;line-height:1.35}
.toc a:hover{color:var(--ink);background:var(--glass2)}
.doc h2{font-weight:300;font-size:23px;letter-spacing:.06em;line-height:1.3;margin:38px 0 12px}
.doc h3{font-weight:400;font-size:16.5px;margin:30px 0 10px;line-height:1.4;padding:10px 0 8px;border-bottom:1px solid var(--line2);color:var(--forte)}
.doc p{margin:0 0 13px;color:var(--doc);font-weight:300}
.doc strong,.doc b{font-weight:500;color:var(--forte)}
.doc ul,.doc ol{margin:0 0 16px;padding-left:22px;color:var(--doc);font-weight:300}
.doc li{margin:4px 0}
.doc a{color:var(--acc2)}
.doc blockquote{margin:18px 0;padding:12px 18px;border-left:2px solid var(--acc2);background:rgba(143,214,255,.06);border-radius:0 12px 12px 0}
.doc blockquote p:last-child{margin:0}
.tablewrap{overflow-x:auto;margin:6px 0 20px;border:1px solid var(--line);border-radius:14px}
.doc table{border-collapse:collapse;width:100%;font-size:14px}
.doc th{text-align:left;font-weight:400;font-size:10.5px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);background:rgba(255,255,255,.03)}
.doc th,.doc td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-weight:300}
.doc tr:last-child td{border-bottom:0}
.lvtag{display:inline-block;font-size:10.5px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;padding:2px 10px;border-radius:99px;border:1px solid var(--line2)}
.lvtag.l1{border-color:var(--acc);color:var(--acc)}.lvtag.l2{border-color:var(--acc2);color:var(--acc2)}.lvtag.l3{color:var(--muted)}.lvtag.l4{color:var(--faint)}
.lbl{display:block;padding:12px 16px;border-radius:14px;margin:0 0 12px}
.lbl > strong:first-child{display:block;font-size:10.5px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;margin-bottom:4px;color:var(--acc2)}
.lbl-why{padding:0 2px}
.lbl-learn{background:rgba(255,255,255,.04);border:1px solid var(--line)}
.lbl-mem{padding:0;margin:20px 0 6px}
.lbl-mem > strong:first-child{display:inline-block;color:var(--acc);border:1px solid rgba(159,224,176,.5);padding:2px 10px;border-radius:99px}
.lbl-div{border:1px dashed var(--line2)}
.lbl-ref{font-size:13.5px;padding:0 2px}.lbl-ref > strong:first-child{display:inline;margin-right:6px}
.xref{cursor:pointer;color:var(--acc2);text-decoration:underline;text-underline-offset:3px}
li.task{list-style:none;margin-left:-22px;display:flex;gap:14px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
li.task input{margin-top:4px;width:18px;height:18px;accent-color:#9fe0b0;flex:none;cursor:pointer}
li.task.done > span{color:var(--faint);text-decoration:line-through}
.pratica{margin-top:18px;padding:18px 20px;border:1px solid var(--line);border-radius:18px;background:rgba(159,224,176,.05)}
.pratica .dica{margin:6px 0 12px;font-size:13.5px;font-weight:300}
.pratica .pratbt{display:flex;gap:10px;flex-wrap:wrap}
.filtroq{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:12px;border-radius:16px;flex-wrap:wrap}
.doc .tabtit{margin:22px 0 6px;font-size:13.5px;color:var(--muted)}
.doc .tabtit strong{color:var(--acc2);font-weight:400;letter-spacing:.06em;margin-right:6px}
.doc .quadro,.doc .correl{margin:20px 0;padding:14px 18px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.035)}
.doc .correl{border-color:rgba(159,224,176,.45);background:rgba(159,224,176,.06)}
.doc .quadro .qtit,.doc .correl .qtit{margin:0 0 8px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc2)}
.doc .correl .qtit{color:var(--acc)}
.doc .quadro ul,.doc .quadro ol{margin-bottom:0}
.doc .pontos li{margin-bottom:6px}
.doc .refs{font-size:13.5px;color:var(--muted)}
.leiturafim{display:flex;align-items:center;gap:16px;margin-top:34px;padding:18px 20px;border:1px solid var(--line);border-radius:18px;flex-wrap:wrap}
.leiturafim .t{flex:1;min-width:200px}
.searchhit{background:rgba(242,196,110,.35);color:#fff;border-radius:3px}
.edbar{display:flex;flex-wrap:wrap;gap:6px;position:sticky;top:0;z-index:3;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:14px;background:var(--solid)}
.edbar button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:5px 12px;font:400 12px var(--font);cursor:pointer}
.edbar button:hover{background:var(--glass2)}
.editavel{outline:none;min-height:320px}

/* consulta lateral: outra seção sempre ao lado da leitura */
.consulta{position:fixed;top:14px;right:14px;bottom:14px;width:min(560px,44vw);z-index:30;display:flex;flex-direction:column;background:var(--solid);transform:translateX(110%);transition:transform .3s ease}
.consulta.aberta{transform:none}
.consulta .cab{display:flex;flex-direction:column;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.consulta .cab .lin{display:flex;align-items:center;gap:8px}
.consulta .cab .tabs{flex-wrap:wrap}
.consulta .cab .tabs button{min-height:44px}
.consulta .corpo{overflow:auto;padding:6px 22px 30px}
.consulta .corpo.doc{padding:6px 22px 30px;background:transparent}
body.com-consulta .main{padding-right:calc(min(560px,44vw) + 30px)}
body.com-consulta .leitura{grid-template-columns:1fr}
body.com-consulta .leitura .toc{display:none}
@media (max-width:900px){.consulta{width:auto;left:10px;top:10px;bottom:84px}body.com-consulta .main{padding-right:14px}}
/* ---------- flashcards ---------- */
.fc-wrap{max-width:780px;margin:0 auto}
.fc-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 18px}
.fc-top select{flex:1;min-width:170px}
.fc-card{perspective:1600px;cursor:pointer;user-select:none;margin:0 0 18px}
.fc-inner{position:relative;min-height:320px;transition:transform .6s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.fc-card.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:50px 40px;display:flex;flex-direction:column;justify-content:center}
.fc-back{transform:rotateY(180deg);background:linear-gradient(160deg,rgba(143,214,255,.16),rgba(159,224,176,.10)),var(--glass)}
.fc-tag{position:absolute;top:18px;left:24px;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.fc-box{position:absolute;top:16px;right:22px;display:flex;gap:4px}
.fc-box i{width:7px;height:7px;border-radius:50%;border:1px solid var(--muted)}.fc-box i.on{background:var(--acc);border-color:var(--acc)}
.fc-q{font-size:23px;font-weight:300;line-height:1.4;text-align:center}
.fc-q b,.fc-a b{font-weight:500}
.fc-a{font-size:18px;font-weight:300;line-height:1.6;text-align:center}
.fc-hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.fc-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fc-nav .grow{flex:1}
.fc-nav .btn{padding:12px 26px}
.roundbar{display:flex;align-items:center;gap:14px;margin:0 0 16px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.roundbar .bar{flex:1}
.cardrow{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.cardrow .ce{border-radius:12px;padding:8px 12px;min-height:38px;outline:none;font-size:14px;font-weight:300;border:1px solid transparent}
.cardrow .ce[contenteditable]:hover{border-color:var(--line)}
.cardrow .ce:focus{border-color:var(--acc2)}

/* ---------- missões ---------- */
.dois{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:start}
.jstep{display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.jstep:last-child{border-bottom:0}
.jstep .n{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;flex:none;color:var(--muted)}
.jstep.ok .n{background:var(--acc);border-color:var(--acc);color:var(--on-ink)}
.jstep.atual .n{border-color:var(--acc2);color:var(--acc2);box-shadow:0 0 0 4px rgba(143,214,255,.12)}
.jstep.lock{opacity:.4}
.jstep .t{flex:1;min-width:0}
.jstep .t b{display:block;font-weight:400;font-size:15px}
.jstep .t small{color:var(--muted);font-size:12.5px}

/* ---------- progresso ---------- */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font)}
table.tb{border-collapse:collapse;width:100%;font-size:14px}
table.tb th{text-align:left;font-size:10.5px;font-weight:400;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
table.tb td{padding:11px 10px;border-bottom:1px solid var(--line);font-weight:300}

/* ---------- modal, festa, toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(6,10,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:grid;place-items:center;padding:16px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal{width:min(460px,100%);max-height:90vh;overflow:auto;padding:28px;background:rgba(20,30,50,.85)}
.modal h3{margin:0 0 8px;font-weight:300;font-size:20px;letter-spacing:.12em;text-transform:uppercase}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.festa{text-align:center;padding:8px 0}
.festa .im{width:150px;height:150px;margin:0 auto 8px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,rgba(143,214,255,.28),transparent 68%);animation:pop .7s cubic-bezier(.2,1.5,.4,1)}
.festa .im img{width:140px;height:140px;object-fit:contain}
.festa .im svg{width:62px;height:62px;stroke-width:1;color:var(--acc2)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.toasts{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:10px 18px;border-radius:99px;font-size:13px;letter-spacing:.04em;background:rgba(20,30,50,.85);backdrop-filter:blur(14px);border:1px solid var(--line2);animation:tin .3s ease}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}

/* ---------- responsivo ---------- */
@media (max-width:1100px){
  .home{grid-template-columns:1fr}
  .home .esq{min-height:58vh}
  .leitura,.dois{grid-template-columns:1fr}
  .toc{display:none}
}
@media (max-width:760px){
  body{font-size:15px}
  .nav{left:10px;right:10px;bottom:10px;top:auto;transform:none;flex-direction:row;justify-content:space-around;border-radius:22px;padding:6px}
  .navbtn{width:42px;height:42px}
  .navbtn .tip{display:none}
  .marca{left:18px;top:18px;letter-spacing:.3em;font-size:10.5px}
  .main{padding:56px 14px 96px}
  .topo{justify-content:flex-start;gap:6px}
  .chipi{padding:6px 11px;font-size:12px}.chipi .lbar{width:50px}
  .home .esq{min-height:52vh}
  .stats{gap:22px}.stat b{font-size:28px}
  .doc{padding:22px 18px}
  .grid2,.grid3{grid-template-columns:1fr}
  .fc-inner{min-height:270px}.fc-face{padding:44px 20px}.fc-q{font-size:19px}.fc-a{font-size:16px}
  .timerpill{bottom:82px;right:12px}
  .cardrow{grid-template-columns:1fr}
  .titulo{letter-spacing:.2em}
}

/* ---- barra fixa no topo das matérias e da leitura ---- */
.barraTopo{position:sticky;top:10px;z-index:6;margin:20px 0 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px;border-radius:22px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.barraTopo .tabs{border:0;background:transparent;padding:0;flex-wrap:wrap}
.barraTopo .tabs.grande button{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;font-size:12px}
.barraTopo .tabs.grande button svg{width:15px;height:15px}
.barraTopo.leit{margin-top:4px}
.barraTopo .tabs button .tabfig{width:22px;height:22px;object-fit:contain;margin:-4px 0}
.barraTopo.leit select.f{width:auto;max-width:min(380px,60vw);padding:7px 12px;border-radius:99px;font-size:13.5px}
.barraTopo .btn.on{background:var(--acc-soft);border-color:var(--acc)}
.btn[disabled]{opacity:.35;cursor:default}
@media (max-width:700px){.barraTopo{top:6px;border-radius:18px}.barraTopo .tabs.grande button span{font-size:10.5px}.barraTopo.leit select.f{max-width:100%;flex:1 1 100%;order:9}}
/* ---- consulta ao lado ---- */
.consulta .acomp{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;margin-right:4px}
/* ---- grifos ---- */
mark.grifo{color:inherit;border-radius:3px;padding:0 1px;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.g-a{background:rgba(242,196,110,.38)}.g-v{background:rgba(159,224,176,.36)}.g-z{background:rgba(143,214,255,.34)}.g-r{background:rgba(242,160,190,.36)}
mark.grifo.comnota{border-bottom:2px dotted rgba(255,255,255,.7)}
mark.grifo.pisca{outline:2px solid var(--ink);outline-offset:2px}
.gtool{position:fixed;z-index:60;display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:99px;flex-wrap:wrap;max-width:min(420px,94vw)}
.gtool .gc{width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);cursor:pointer;padding:0}
.gtool .gc.on{outline:2px solid var(--ink);outline-offset:1px}
.gtool .gnota{flex:1 1 100%;font-size:13.5px;font-weight:300;padding:4px 6px 6px;color:var(--doc)}
.notasSec{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);scroll-margin-top:90px}
.notasSec .dica{font-size:13px;margin:4px 0 10px}
.glist{display:grid;gap:8px;margin-bottom:10px}
.gitem{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:14px;padding:10px 12px;color:var(--ink);font:300 14px var(--font);cursor:pointer;width:100%;margin-bottom:8px}
.gitem:hover{border-color:var(--line2)}
.gitem .gq{border-radius:4px;padding:1px 4px;align-self:flex-start}
.gitem .gn{color:var(--muted);font-size:13.5px}
.nbloco{margin-bottom:12px}
/* ---- Kahoot dentro da matéria ---- */
.kframe{width:100%;height:760px;border:0;display:block;background:transparent;border-radius:22px}
.modal.imagem-ampliada{width:min(1100px,96vw);max-width:96vw}
.imagem-ampliada img{display:block;max-width:100%;max-height:72dvh;width:auto;height:auto;object-fit:contain;margin:0 auto;border-radius:12px}
/* ---- casos clínicos ---- */
.casos{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.caso{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px;border-radius:20px;color:var(--ink);font:300 14px var(--font);cursor:pointer;transition:.2s;border:1px solid var(--line)}
.caso:hover{transform:translateY(-2px);border-color:var(--line2)}
.caso b{font-weight:400;font-size:16.5px;line-height:1.35}
.caso .lin{display:flex;align-items:center;justify-content:space-between}
.caso .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.caso .tags i{font-style:normal;font-size:11px;letter-spacing:.06em;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.okchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ok)}
.casoTopo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
#matCorpo .prog,#qCorpo .prog{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
#matCorpo .prog i,#qCorpo .prog i{display:block;height:100%;background:var(--acc);transition:width .4s}
.abertura{padding:16px 18px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--line);margin-bottom:14px}
.etapa{padding:16px 0;border-top:1px solid var(--line)}
.etapa .info{padding:12px 16px;border-left:2px solid var(--acc2);background:rgba(143,214,255,.06);border-radius:10px;margin:8px 0}
.etapa .pq{font-size:17px;font-weight:400;margin:10px 0}
.etapa.feita .pq{font-size:15px;color:var(--doc)}
.etapa .rok{color:var(--ok);margin:4px 0}.etapa .rno{color:var(--bad);margin:4px 0}
.etapa .ex{font-size:14px;margin:4px 0 0}
.etapa .ops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:700px){.etapa .ops{grid-template-columns:1fr}}
.etapa .op{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);font:400 15px var(--font);cursor:pointer;transition:.15s}
.etapa .op b{font-weight:500;color:var(--acc)}
.etapa .op:hover:not([disabled]){border-color:var(--line2);background:rgba(255,255,255,.06)}
.etapa .op.certa{border-color:var(--ok);background:rgba(159,224,176,.14)}.etapa .op.errada{border-color:var(--bad);background:rgba(242,160,143,.1)}.etapa .op.apaga{opacity:.4}
.fbcaso{margin-top:12px;padding:14px 16px;border-radius:16px;border:1px solid var(--line)}
.fbcaso.ok b{color:var(--ok)}.fbcaso.no b{color:var(--bad)}
.fbcaso p{color:var(--doc);font-weight:300;margin:6px 0 12px}
.doc img{max-width:min(100%,440px);border-radius:12px;display:block;margin:10px 0;border:1px solid var(--line)}
.doc .imgdesc{padding:12px 16px;border:1px dashed var(--line2);border-radius:12px;background:rgba(255,255,255,.03)}
.doc .anotaula{padding:10px 14px;border-left:2px solid var(--gold);background:rgba(242,196,110,.08);border-radius:8px}
.doc figure.ref{margin:16px 0 20px;padding:12px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.025)}
.doc figure.ref img{max-width:100%;width:auto;max-height:520px;margin:0 auto 10px;display:block;cursor:zoom-in}
.doc figure.ref figcaption{font-size:13.5px;font-weight:300;color:var(--doc);line-height:1.5}
.doc figure.ref .fonte{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.doc figure.ref .fonte a{color:var(--acc2)}
.doc .figure-zoom{display:block;width:100%;border:0;padding:0;margin:0 0 10px;background:transparent;cursor:zoom-in}
.doc .figure-zoom img{height:auto;object-fit:contain;margin:0 auto}
.doc button.xref{font:inherit;background:transparent;border:0;padding:0;text-align:left}
.doc table.siglas{table-layout:fixed}

/* ================= tema claro (padrão) ================= */
:root{--nav-bg:rgba(18,27,45,.45);--modal-bg:rgba(20,30,50,.88);--veu:rgba(6,10,20,.55)}
:root[data-tema="claro"],:root[data-tema="amanhecer"],:root[data-tema="dourado"]{--nav-bg:rgba(255,255,255,.7);--modal-bg:rgba(255,255,255,.96);--veu:rgba(210,222,234,.55)}
:root[data-tema="claro"]{
  --ink:#1b2733; --muted:#5b6b7c; --faint:#8492a3; --line:rgba(20,40,70,.10); --line2:rgba(20,40,70,.18);
  --glass:rgba(255,255,255,.74); --glass2:rgba(20,40,70,.04); --glass3:rgba(20,40,70,.08); --solid:rgba(255,255,255,.95);
  --acc:#2f7f56; --acc2:#236f9f; --acc-soft:rgba(63,154,106,.12); --ok:#2f7f56; --bad:#c0574b; --gold:#a8790a;
  --on-ink:#ffffff; --doc:#2a3644; --forte:#0d1824; --opt:#ffffff;
  --fundo:radial-gradient(60% 55% at 35% 45%,#ffffff 0%,rgba(255,255,255,0) 70%),radial-gradient(45% 40% at 90% 10%,rgba(200,230,215,.55),transparent 70%),radial-gradient(45% 40% at 85% 95%,rgba(205,222,242,.7),transparent 70%),linear-gradient(180deg,#f5f8fb 0%,#e7eef5 100%);
  color-scheme:light;
}
:root[data-tema="claro"] .vidro{box-shadow:0 14px 40px rgba(40,70,110,.10),inset 0 1px 0 rgba(255,255,255,.9)}
.nav{background:var(--nav-bg)}
.modal{background:var(--modal-bg)}
.modal-bg{background:var(--veu)}
.toast{background:var(--modal-bg);color:var(--ink)}
:root[data-tema="claro"] .searchhit,:root[data-tema="amanhecer"] .searchhit,:root[data-tema="dourado"] .searchhit{color:var(--forte)}

/* ================= manual rápido ================= */
.manual h4{font-size:11px;font-weight:400;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}

/* ================= refinamento (taste + web interface guidelines) ================= */
/* ritmo: escala única de espaçamento 4·8·12·16·24·32·48 */
:root{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--raio:18px;--raio-p:12px}
.vidro{border-radius:var(--raio)}
.card{padding:var(--s5)}
/* texto que se lê: 16px, contraste alto; cinza só para rótulos */
.intro{font-size:15.5px;line-height:1.55;font-weight:300;color:var(--muted);margin:var(--s3) 0 var(--s6);max-width:560px;letter-spacing:0;text-transform:none}
.intro b{color:var(--ink);font-weight:500}
.doc p,.doc li{font-size:16px;line-height:1.7}
.titulo,.h-sec,.page-h,h1,h2,h3{text-wrap:balance}
/* rótulos: nunca abaixo de 12px */
.h-sec,.kicker,.sub,.g-t,.tabs button,.btn,.lb,label.lb,.premios span,.rr,.n,.fc-tag,.fc-hint,.roundbar{font-size:max(12px,1em)}
.h-sec{font-size:12px;letter-spacing:.22em}
.kicker{font-size:12px;letter-spacing:.22em}
.sub{font-size:12.5px;letter-spacing:.16em}
.btn{font-size:12.5px;letter-spacing:.1em}
.tabs button{font-size:12px;letter-spacing:.12em}
.miss .t small,.acao .t span,.mat small{font-size:13px}
/* números alinhados */
.stat b,.tempo-big,.chipi,.g-n,table.tb td,.rw{font-variant-numeric:tabular-nums}
/* um só estilo de foco, visível no teclado */
:focus{outline:none}
:focus-visible{outline:2px solid var(--acc2);outline-offset:3px}
input.f:focus-visible,select.f:focus-visible,textarea.f:focus-visible{outline:none;border-color:var(--acc2);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc2) 22%,transparent)}
/* selects nativos legíveis em qualquer tema */
select.f{background-color:var(--solid);color:var(--ink)}
/* respostas ao toque e ao ponteiro: só transform/opacity/cores */
.btn,.chipi,.navbtn,.tema,.cria,.mat,.sec,.g-item{transition:background-color .18s ease,border-color .18s ease,color .18s ease,transform .18s ease,opacity .18s ease}
.btn:active,.chipi:active,.navbtn:active{transform:scale(.97)}
.mat:hover{transform:translateY(-2px)}
/* modais e painéis não arrastam a página por trás */
.modal,.consulta .corpo{overscroll-behavior:contain}
/* alvos de toque de 44px em telas de toque */
@media (pointer:coarse){
  .btn{min-height:44px}.btn.sm{min-height:40px}.btn.ic{min-width:40px;min-height:40px}
  .chipi{min-height:40px}.navbtn{width:44px;height:44px}
  .tabs button{min-height:40px}
  .sec{min-height:48px}
}
#pane img,.consulta img{max-width:100%;height:auto}
[role=button]{cursor:pointer}
/* meta à direita dos títulos de seção */
.hs-meta{letter-spacing:.06em;text-transform:none;font-size:12.5px;color:var(--faint);white-space:nowrap}
.h-sec{flex-wrap:wrap;row-gap:4px}
/* chamada discreta para o manual na primeira visita */
#btAjuda.novo{border-color:var(--acc2);color:var(--acc2)}
/* menos movimento para quem pede */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* auditoria v25: contraste e alvos de toque */
.hs-meta,.fc-hint{color:var(--muted)}
.g-n{color:var(--muted)}
@media (pointer:coarse){
  button.chipi{min-width:44px;min-height:44px;justify-content:center}
  .durs button{min-height:44px}
  .backlink{min-height:44px;padding:0 4px 0 0}
}

/* ===== área de estudo no estilo de documentos: menu lateral em pastas + página ===== */
.ws{display:grid;grid-template-columns:276px minmax(0,1fr);gap:22px;align-items:start;max-width:1520px;margin-left:auto}

.arv-cab{display:flex;align-items:center;min-height:36px;padding:0 6px 0 10px}

.arv-busca{display:flex;align-items:center;gap:8px;margin:2px 2px 8px;padding:0 10px;min-height:36px;border-radius:10px;background:var(--glass2);border:1px solid var(--line);color:var(--muted);cursor:text}
.arv-busca svg{width:15px;height:15px;flex:none}
.arv-busca input{flex:1;min-width:0;border:0;background:none;outline:0;font:400 14px var(--font);color:var(--ink);padding:8px 0}
.arv-it{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:5px 8px;border:0;border-radius:8px;background:none;color:var(--ink);font:400 14px/1.3 var(--font);letter-spacing:0;text-transform:none;text-align:left;cursor:pointer;transition:background-color .12s,color .12s}

.arv-it:hover{background:var(--glass3)}

.arv-linha{display:flex;align-items:center}

svg.chev{width:13px!important;height:13px!important;transition:transform .15s}
[aria-expanded="true"] svg.chev{transform:rotate(90deg)}
.arv-it.pasta{padding-left:4px}

.arvore #resBusca .card{padding:2px;margin:0 0 8px!important;background:var(--glass2);border:1px solid var(--line);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:10px}

/* trilha (Matérias › MFC › Guia › Seção) */
.trilha{position:sticky;top:calc(10px + env(safe-area-inset-top));z-index:6;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 18px;padding:6px 8px;border-radius:14px;background:var(--solid);border:1px solid var(--line);box-shadow:0 4px 18px rgba(20,40,70,.06)}
.migalhas{display:flex;align-items:center;flex-wrap:nowrap;min-width:0;flex:1 1 auto;overflow:hidden;gap:0}
.migalhas > *{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.migalhas .sepm{flex:none}
.trilha{flex-wrap:nowrap}.trilha .grow{display:none}.trilha > .btn{flex:none}
.migalhas button,.migalhas .mig-g,.migalhas b{font:400 14px/1.3 var(--font);letter-spacing:0;text-transform:none;padding:6px 8px;border-radius:8px}

.migalhas button:hover{background:var(--glass3);color:var(--ink)}

.leitura-topo{position:sticky;top:calc(10px + env(safe-area-inset-top));z-index:6;margin-bottom:18px;background:var(--solid);border:1px solid var(--line);border-radius:14px;overflow:hidden}

.atalhos-estudo button:disabled{opacity:.45;cursor:default}

/* títulos e página de documento */
.doc-tit{margin:4px 0 6px;font-weight:600;font-size:clamp(24px,2.6vw,32px);line-height:1.2;letter-spacing:-.01em;text-transform:none;color:var(--forte)}
.ws .intro{margin-bottom:18px}

.qalt.errada{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}.qalt.errada > b{background:var(--bad);color:var(--forte);border-color:transparent}

/* ================= refino leve (nov/2026): mesma identidade, menos ruído ================= */
.conteudo-status{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;font-size:14px;color:var(--ink)}
/* Oito destinos acessíveis sem diminuir os alvos de toque. */

/* Prioritário · Resumo · Siglas: aba ativa com fundo suave em vez de moldura */
.atalhos-estudo button[aria-current=page]{background:var(--acc-soft);border-color:transparent;color:var(--forte);font-weight:500}
/* leitura: linha mais curta (cerca de 75 caracteres) e ritmo vertical mais calmo */
.ws .doc{max-width:800px}
.ws .doc h2,.ws .doc h3{scroll-margin-top:96px}

/* trilha e chips: um único peso de sombra, sem bordas duplicadas */
.trilha{box-shadow:0 1px 2px rgba(20,40,70,.05)}
:root[data-tema="claro"] .chipi,:root[data-tema="dourado"] .chipi{background:var(--solid);box-shadow:0 1px 2px rgba(20,40,70,.05)}
@media (prefers-reduced-motion:reduce){.btn:active,.chipi:active,.navbtn:active{transform:none}}
/* Web Interface Guidelines: transição só no que muda, foco visível no editor, rolagem presa no modal */
.navbtn .tip{transition:opacity .2s ease,transform .2s ease}
.caso,.etapa .op{transition:background-color .15s ease,border-color .15s ease,color .15s ease,transform .15s ease}
.editavel:focus-visible{outline:none;box-shadow:inset 0 0 0 1px var(--line2);border-radius:var(--raio-p)}
.modal,.arvore{overscroll-behavior:contain}
@media (pointer:fine){html{overscroll-behavior:none}}
/* vidro mais limpo no tema claro: o planeta atrás não vira mancha borrada sob o texto */
:root[data-tema="claro"]{--glass:rgba(255,255,255,.86)}
/* foco: durações legíveis mesmo com o planeta passando por trás */
.durs button{background:var(--solid);transition:background-color .18s ease,border-color .18s ease,color .18s ease}
.durs button:not(.on):hover{color:var(--ink);border-color:var(--line2)}

.sub{text-wrap:balance}

/* ================= golden hour (tarde no tema automático) ================= */
:root[data-tema="dourado"]{
  --ink:#2b2519; --muted:#6e6350; --faint:#a1957e; --line:rgba(90,65,20,.11); --line2:rgba(90,65,20,.19);
  --glass:rgba(255,251,243,.86); --glass2:rgba(90,65,20,.04); --glass3:rgba(90,65,20,.08); --solid:rgba(255,253,248,.95);
  --acc:#5c8a45; --acc2:#b07a2e; --acc-soft:rgba(120,165,90,.14); --ok:#4f8a4a; --bad:#c0574b; --gold:#a8790a;
  --on-ink:#ffffff; --doc:#3a3226; --forte:#1d180f; --opt:#fffdf8;
  --modal-bg:rgba(255,252,246,.97); --veu:rgba(235,220,195,.55); --nav-bg:rgba(255,251,243,.72);
  --fundo:radial-gradient(60% 55% at 35% 45%,#fffaf1 0%,rgba(255,250,241,0) 70%),radial-gradient(50% 45% at 90% 6%,rgba(255,205,140,.5),transparent 70%),radial-gradient(45% 40% at 8% 96%,rgba(200,222,175,.5),transparent 70%),linear-gradient(180deg,#fbf4e6 0%,#f2e3c9 100%);
  color-scheme:light;
}

:root[data-tema="dourado"] ::selection{background:rgba(214,160,80,.28)}
.tema.auto i{position:relative;overflow:hidden}
/* céu do dia (botão de aparência no topo) */
.diahora{position:relative;width:92px;height:38px;padding:0;border-radius:99px;border:1px solid var(--line2);overflow:hidden;cursor:pointer;flex:none;background:var(--solid);
  box-shadow:0 1px 2px rgba(20,40,70,.08),inset 0 0 0 1px rgba(255,255,255,.25);transition:transform .18s ease,box-shadow .18s ease}

  background:linear-gradient(180deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.08) 42%,rgba(255,255,255,0) 55%),radial-gradient(120% 90% at 50% 120%,rgba(0,0,0,.10),transparent 60%);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -1px 2px rgba(0,0,0,.12)}

/* painel do céu em Meu mundo: hora e nuvens */
.ceu-ctl{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:2px 0 10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.ceu-l{display:flex;align-items:center;gap:10px;flex:1 1 220px;min-width:0;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

.ceu-l.lock{opacity:.55}

.ceu-r{flex:1;min-width:0;height:28px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}

.ceu-r::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:var(--solid);border:1px solid var(--line2);box-shadow:0 2px 8px rgba(20,40,70,.18),inset 0 1px 0 rgba(255,255,255,.8)}
.ceu-r::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--solid);border:1px solid var(--line2);box-shadow:0 2px 8px rgba(20,40,70,.18)}
.ceu-r:focus-visible{outline:none}
.ceu-r:focus-visible::-webkit-slider-thumb{outline:2px solid var(--acc2);outline-offset:2px}
.ceu-r:focus-visible::-moz-range-thumb{outline:2px solid var(--acc2);outline-offset:2px}
.ceu-r.hora{--trilho:linear-gradient(90deg,#1c2847 0%,#2e3c60 18%,#f3cfb0 23%,#bcd9f0 30%,#a9d3f0 50%,#f8eedb 60%,#f0c58c 70%,#f5b47e 76%,#4a4f86 80%,#1c2847 86%,#1c2847 100%)}
.ceu-r.nuv{--trilho:linear-gradient(90deg,var(--glass2),#c9d0da)}
@media (pointer:coarse){.ceu-r{height:44px}.ceu-r::-webkit-slider-thumb{width:26px;height:26px;margin-top:-10px}}

/* estudo: superfícies opacas para leitura sem interferência do fundo */
:root{--papel:#131b2d}
:root[data-tema="meianoite"]{--papel:#07090f}:root[data-tema="cristal"]{--papel:#0f2230}:root[data-tema="aurora"]{--papel:#19152e}:root[data-tema="floresta"]{--papel:#0f2117}
:root[data-tema="claro"],:root[data-tema="amanhecer"]{--papel:#ffffff}:root[data-tema="dourado"]{--papel:#fffcf6}
body.estudo .ws .doc,body.estudo .leitura-topo,body.estudo .trilha,body.estudo .consulta,body.estudo .arvore,body.estudo .ws-main > .vidro,body.estudo .ws-main .card{background:var(--papel);backdrop-filter:none;-webkit-backdrop-filter:none}
body.com-consulta .consulta{background:var(--papel);backdrop-filter:none;-webkit-backdrop-filter:none}
body.estudo #espaco{opacity:.35}
body.estudo .nav{background:color-mix(in srgb,var(--papel) 94%,transparent)}

/* fundo da página por baixo da barra do iPhone e do "elástico" da rolagem: mesma cor do topo do tema */
html{background-color:#121a2d}
html[data-tema="meianoite"]{background-color:#05070d}html[data-tema="cristal"]{background-color:#10283a}html[data-tema="aurora"]{background-color:#191433}html[data-tema="floresta"]{background-color:#11261a}
html[data-tema="claro"]{background-color:#f5f8fb}html[data-tema="amanhecer"]{background-color:#eef6fa}html[data-tema="dourado"]{background-color:#fcf6ec}

/* ================= períodos do dia, refinados (manhã · tarde · noite) ================= */
/* manhã: ar fresco, céu limpo, um brilho de nascer do sol baixo à esquerda */
:root[data-tema="amanhecer"]{
  --glass:rgba(255,255,255,.68); --line:rgba(30,60,90,.10); --line2:rgba(30,60,90,.17);
  --fundo:radial-gradient(60% 55% at 32% 42%,#ffffff 0%,rgba(255,255,255,0) 70%),radial-gradient(55% 45% at 6% 104%,rgba(255,212,186,.42),transparent 70%),radial-gradient(50% 40% at 90% 6%,rgba(196,234,218,.55),transparent 70%),linear-gradient(180deg,#eef6fa 0%,#d8e7f1 100%);
}
:root[data-tema="amanhecer"] .vidro{box-shadow:0 1px 2px rgba(30,60,90,.05),0 14px 36px rgba(40,80,120,.09),inset 0 1px 0 rgba(255,255,255,.9)}
/* tarde: luz de golden hour mais macia e menos amarelada */
:root[data-tema="dourado"]{
  --glass:rgba(255,252,246,.8);
  --fundo:radial-gradient(60% 55% at 32% 42%,#fffbf4 0%,rgba(255,251,244,0) 70%),radial-gradient(55% 50% at 94% 2%,rgba(255,198,132,.40),transparent 70%),radial-gradient(50% 45% at 4% 102%,rgba(212,226,188,.42),transparent 70%),linear-gradient(180deg,#fcf6ec 0%,#f3e7d2 100%);
}
:root[data-tema="dourado"] .vidro{box-shadow:0 1px 2px rgba(110,80,30,.06),0 14px 36px rgba(130,95,40,.09),inset 0 1px 0 rgba(255,255,255,.9)}
/* noite: azul profundo, brilho de lua no alto e um horizonte leve embaixo */
:root:not([data-tema]){
  --glass:rgba(20,30,50,.62); --line:rgba(190,210,255,.10); --line2:rgba(190,210,255,.17);
  --fundo:radial-gradient(60% 50% at 30% 42%,#1f2e4b 0%,rgba(31,46,75,0) 70%),radial-gradient(38% 30% at 88% 8%,rgba(160,184,236,.13),transparent 70%),radial-gradient(70% 38% at 50% 112%,rgba(76,106,168,.22),transparent 70%),linear-gradient(180deg,#121a2d 0%,#0a0f1c 100%);
}
:root:not([data-tema]) .vidro{box-shadow:0 1px 0 rgba(0,0,0,.2),0 18px 44px rgba(0,0,0,.32),inset 0 1px 0 rgba(200,220,255,.07)}

/* ================= estudo em estilo de documento (paleta neutra de caderno, inspirada no Notion) ================= */
body.estudo{
  --n-ink:#111111; --n-text:#37352f; --n-muted:#615d59; --n-faint:#757575;
  --n-line:rgba(55,53,47,.09); --n-line2:rgba(55,53,47,.16); --n-hover:rgba(55,53,47,.055); --n-sel:rgba(55,53,47,.08);
  --n-blue:#0075de; --n-blue-tint:#e6f3fe; --n-side:#f6f5f4; --n-page:#ffffff; --n-mark:rgba(255,177,16,.26);
  --n-warm:#fbf3db; --n-warm-line:rgba(232,157,1,.35); --n-green-tint:rgba(63,154,106,.08);
}
:root[data-tema="dourado"] body.estudo{--n-side:#f6f2ea; --n-page:#fffdf8; --n-text:#3a362f}
:root:not([data-tema]) body.estudo,:root[data-tema="meianoite"] body.estudo,:root[data-tema="cristal"] body.estudo,:root[data-tema="aurora"] body.estudo,:root[data-tema="floresta"] body.estudo{
  --n-ink:#f4f6f9; --n-text:#d5dbe4; --n-muted:#9ba5b4; --n-faint:#6f7889;
  --n-line:rgba(255,255,255,.08); --n-line2:rgba(255,255,255,.14); --n-hover:rgba(255,255,255,.05); --n-sel:rgba(255,255,255,.085);
  --n-blue:#62aef0; --n-blue-tint:rgba(98,174,240,.14); --n-side:var(--papel); --n-page:var(--papel); --n-mark:rgba(232,157,1,.32);
  --n-warm:rgba(232,157,1,.10); --n-warm-line:rgba(232,157,1,.4); --n-green-tint:rgba(159,224,176,.07);
}
body.estudo{--doc:var(--n-text);--forte:var(--n-ink);--muted:var(--n-muted);--faint:var(--n-faint);--line:var(--n-line);--line2:var(--n-line2);--acc2:var(--n-blue)}
/* página */
body.estudo .ws .doc{background:var(--n-page);border:1px solid var(--n-line);border-radius:10px;box-shadow:0 1px 2px rgba(15,15,15,.04),0 8px 28px rgba(15,15,15,.04)}
body.estudo .doc p,body.estudo .doc li,body.estudo .doc ul,body.estudo .doc ol,body.estudo .doc th,body.estudo .doc td{font-weight:400}
body.estudo .doc p,body.estudo .doc li{color:var(--n-text);line-height:1.72}
body.estudo .doc h3{border-bottom:0;padding:0;margin:34px 0 8px;font-size:18px;font-weight:600;color:var(--n-ink);letter-spacing:-.005em}
body.estudo .doc strong,body.estudo .doc b{font-weight:600;color:var(--n-ink)}
body.estudo .doc a{color:var(--n-blue);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--n-blue) 35%,transparent);text-underline-offset:3px}
body.estudo .doc a:hover{text-decoration-color:var(--n-blue)}
/* citação e quadros como blocos de destaque */
body.estudo .doc blockquote{border-left:3px solid var(--n-ink);background:none;border-radius:0;padding:2px 0 2px 16px}
body.estudo .doc .quadro{border:0;border-radius:6px;background:var(--n-sel);padding:16px 18px}
body.estudo .doc .correl{border:0;border-radius:6px;background:var(--n-green-tint);padding:16px 18px}
body.estudo .doc .anotaula{border-left:0;border-radius:6px;background:var(--n-warm);padding:14px 16px}
body.estudo .doc .quadro .qtit,body.estudo .doc .correl .qtit{color:var(--n-muted)}
/* tabelas de linhas finas, cabeçalho em cinza de papel */
body.estudo .doc table{border:1px solid var(--n-line2);border-radius:6px;border-collapse:separate;border-spacing:0;overflow:hidden}
body.estudo .doc th{background:var(--n-side);color:var(--n-muted);border-bottom:1px solid var(--n-line2)}
body.estudo .doc th,body.estudo .doc td{border-bottom:1px solid var(--n-line);border-right:1px solid var(--n-line)}
body.estudo .doc th:last-child,body.estudo .doc td:last-child{border-right:0}
body.estudo .doc tbody tr:hover td{background:var(--n-hover)}
body.estudo .doc .tabtit strong{color:var(--n-muted)}
body.estudo .doc figure.ref{border:0;background:none;padding:0}
body.estudo .doc img{border-radius:6px}
body.estudo mark.grifo{border-radius:2px}
/* menu lateral como barra de páginas */
body.estudo .arvore{background:var(--n-side);border-color:var(--n-line)}
body.estudo .arv-it{border-radius:6px;min-height:30px}
body.estudo .arv-it:hover,body.estudo .arv-tg:hover{background:var(--n-hover)}
body.estudo .arv-it.on{background:var(--n-sel);color:var(--n-ink);font-weight:500}
body.estudo .arv-it.on > svg{color:var(--n-ink)}
body.estudo .arv-it.arv-m > svg,body.estudo .arv-it.pasta > svg:not(.chev){color:var(--n-muted)}
body.estudo .arv-busca{background:var(--n-hover);border-color:transparent;border-radius:6px}
body.estudo .arv-filhos{border-left-color:var(--n-line)}
/* trilha e abas */
body.estudo .trilha,body.estudo .leitura-topo{background:var(--n-page);border:1px solid var(--n-line);box-shadow:none;border-radius:10px}
body.estudo .trilha .btn{border-radius:6px}
body.estudo .atalhos-estudo button{border-radius:6px}
body.estudo .atalhos-estudo button[aria-current=page]{background:var(--n-sel);color:var(--n-ink);font-weight:500}

/* ================= mapa de revisões (flashcards) ================= */
.mapa-rev{padding:16px 18px 18px;margin:0 0 16px}
.mr-topo{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 18px;flex-wrap:wrap;margin-bottom:14px}
.mr-num{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mr-num b{font-size:34px;font-weight:300;line-height:1;color:var(--forte);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mr-num span{font-size:13px;color:var(--ink)}
.mr-num em{font-style:normal;font-size:12px;color:var(--muted)}
.mr-leg{display:flex;flex-wrap:wrap;gap:4px}
.mr-chip{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:4px 10px;border:1px solid transparent;border-radius:99px;background:transparent;color:var(--muted);font:400 12.5px var(--font);cursor:pointer;transition:background-color .15s ease,color .15s ease,border-color .15s ease}
.mr-chip i{width:8px;height:8px;border-radius:2px;flex:none}
.mr-chip em{font-style:normal;color:var(--ink);font-variant-numeric:tabular-nums}
@media (hover:hover) and (pointer:fine){.mr-chip:hover{background:var(--glass2);color:var(--ink)}}
.mr-chip[aria-pressed="true"]{background:var(--glass3);border-color:var(--line2);color:var(--ink)}
.mr-tela{width:100%;min-height:9px}
.mr-tela canvas{display:block}
@media (pointer:coarse){.mr-chip{min-height:44px}}

/* ================= pacote de criatura ================= */
.pk-veu{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
  background:radial-gradient(60% 50% at 50% 45%,color-mix(in srgb,var(--papel) 90%,transparent),color-mix(in srgb,var(--papel) 97%,transparent));opacity:0;transition:opacity .22s ease-out;--pk-w:min(232px,60vw)}
.pk-veu.on{opacity:1}
.pk-confete{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.pk-cab{text-align:center}
.pk-kick{margin:0 0 4px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.pk-cab h3{margin:0;font-weight:300;font-size:22px;letter-spacing:.04em;color:var(--forte)}
.pk-palco{position:relative;width:var(--pk-w);aspect-ratio:5/7;perspective:900px}
/* carta */
.pk-carta{position:absolute;inset:0;transform:translateY(18%) scale(.94);transform-style:preserve-3d;z-index:1;opacity:0}
.pk-carta.fora{opacity:1}
.pk-carta-in{position:absolute;inset:0;transform:rotateY(180deg);transform-style:preserve-3d;--mx:50%;--my:50%}
.pk-verso,.pk-frente{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.pk-verso{transform:rotateY(180deg);display:grid;place-items:center;color:rgba(255,255,255,.85);
  background:radial-gradient(120% 90% at 30% 10%,var(--c1),var(--c2) 55%,var(--c3));box-shadow:inset 0 0 0 6px rgba(255,255,255,.18),0 18px 40px rgba(20,30,50,.25)}
.pk-verso svg{width:42%}
.pk-frente{display:flex;flex-direction:column;padding:10px;background:linear-gradient(160deg,#ffffff,#f4f1ea);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,inset 0 0 0 2px color-mix(in srgb,var(--c2) 55%,transparent),0 0 0 1px rgba(20,30,50,.08),0 22px 50px rgba(20,30,50,.28)}
.pk-arte{flex:1;border-radius:10px;background:radial-gradient(90% 80% at 50% 35%,#ffffff,var(--c1) 60%,var(--c2));display:grid;place-items:center;overflow:hidden;position:relative}
.pk-img{width:86%;aspect-ratio:1;display:grid;place-items:center}
.pk-img img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(20,30,50,.25))}
.pk-info{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 8px;padding:10px 4px 2px;color:#1d2a3a}
.pk-nome{font-weight:500;font-size:16px}
.pk-n{font-style:normal;font-size:11px;color:#6b7686;font-variant-numeric:tabular-nums}
.pk-rar{grid-column:1/-1;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--c3)}
.pk-holo,.pk-luz{position:absolute;inset:0;pointer-events:none;border-radius:inherit}
.pk-holo{opacity:0;mix-blend-mode:color-dodge;transition:opacity .4s ease-out;
  background:repeating-linear-gradient(115deg,rgba(255,120,200,.0) 0%,rgba(255,140,200,.22) 6%,rgba(120,220,255,.22) 12%,rgba(160,255,190,.22) 18%,rgba(255,230,140,.22) 24%,rgba(255,120,200,0) 30%);
  background-size:200% 200%;background-position:var(--mx) var(--my)}
.pk-luz{opacity:0;transition:opacity .4s ease-out;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.55),rgba(255,255,255,0) 45%);mix-blend-mode:soft-light}
.pk-carta.brilha .pk-holo{opacity:.85}.pk-carta.brilha .pk-luz{opacity:1}
/* pacote */
.pk-pacote{position:absolute;inset:-4% -5%;z-index:2;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.pk-veu.arrastando .pk-pacote{cursor:grabbing}
.pk-tira{position:absolute;left:0;right:0;top:0;height:13%}
.pk-tira-a,.pk-tira-b{position:absolute;inset:0;border-radius:14px 14px 0 0;transform-origin:100% 100%;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.10) 0 2px,transparent 2px 6px),linear-gradient(180deg,var(--c1),var(--c2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.pk-corpo{position:absolute;left:0;right:0;top:13%;bottom:0;border-radius:0 0 14px 14px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:rgba(255,255,255,.95);
  background:linear-gradient(160deg,var(--c1) 0%,var(--c2) 45%,var(--c3) 100%);box-shadow:0 24px 50px rgba(20,30,50,.28),inset 0 0 0 1px rgba(255,255,255,.22)}
.pk-corpo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 2px,transparent 2px 6px)}
.pk-corpo::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(110% 55% at 50% 45%,rgba(255,255,255,.22),transparent 62%),linear-gradient(90deg,rgba(0,0,0,.14),transparent 10%,transparent 90%,rgba(0,0,0,.14))}
.pk-emblema{width:44%;opacity:.95;position:relative}
.pk-emblema svg{width:100%;display:block}
.pk-marca{font-size:11px;letter-spacing:.26em;text-transform:uppercase;position:relative}
.pk-sub{font-size:12px;opacity:.8;position:relative}
.pk-foil{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;
  background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.55) 45%,rgba(255,255,255,0) 60%),repeating-linear-gradient(115deg,rgba(255,255,255,0) 0 10px,rgba(255,255,255,.10) 10px 11px);
  background-size:250% 100%,auto;animation:pkFoil 3.2s ease-in-out infinite}
@keyframes pkFoil{0%,100%{background-position:100% 0,0 0}50%{background-position:0% 0,0 0}}
.pk-guia{position:absolute;left:6%;right:6%;top:13%;height:0;border-top:1.5px dashed rgba(255,255,255,.85)}
.pk-guia i{position:absolute;left:0;top:-7px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);animation:pkGuia 1.8s cubic-bezier(0.23,1,0.32,1) infinite}
@keyframes pkGuia{0%{transform:translateX(0);opacity:0}15%{opacity:1}70%{transform:translateX(calc(var(--pk-w) * .8));opacity:1}100%{transform:translateX(calc(var(--pk-w) * .8));opacity:0}}
.pk-veu.arrastando .pk-guia i{animation:none;opacity:0}
.pk-dica{margin:0;min-height:18px;font-size:13px;color:var(--muted)}
.pk-acts{display:flex;gap:10px;justify-content:center;min-height:44px}
.pk-veu.revelado .pk-acts{animation:pkSobe .32s cubic-bezier(0.23,1,0.32,1) both}
@keyframes pkSobe{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.pk-foil,.pk-guia i,.pk-veu.revelado .pk-acts{animation:none}.pk-veu{transition:none}}

/* pacote 3D: o canvas ocupa a tela; textos e botões ficam por cima */
.pk3-tela{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;transition:opacity .2s ease-out}
.pk3 .pk-cab,.pk3 .pk-dica,.pk3 .pk-acts{position:relative;z-index:1}
.pk3-palco{visibility:hidden}
.pk3 .pk-cab{transition:opacity .25s ease-out}.pk3.abrindo:not(.revelado) .pk-cab{opacity:0}.pk3.abrindo .pk-acts{opacity:0;transition:opacity .2s ease-out}.pk3.revelado .pk-acts{opacity:1}
.pk3{cursor:grab;touch-action:none}.pk3.arrastando{cursor:grabbing}.pk3.revelado{cursor:default}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ================= Leis de UX ================= */
/* navegação: divisor entre estudo e planeta (proximidade / região comum); rótulos e "Mais" só no celular */
.nav-div{display:block;width:22px;height:1px;margin:4px auto;background:var(--line2)}
.nav-rot,.nav-mais{display:none}
.mais-veu{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--veu) 70%,transparent)}
.mais-veu[hidden]{display:none}
.mais-folha{position:absolute;left:10px;right:10px;bottom:calc(84px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px;border-radius:22px;background:var(--modal-bg);border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.18);animation:maisSobe .22s cubic-bezier(0.23,1,0.32,1)}
@keyframes maisSobe{from{opacity:0;transform:translateY(8px)}}
.mais-it{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 16px;border:1px solid var(--line);border-radius:16px;background:var(--glass2);color:var(--ink);font:400 15px var(--font);cursor:pointer}
.mais-it svg{width:20px;height:20px;color:var(--muted)}
.mais-it.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}.mais-it.on svg{color:var(--on-ink)}
@media (max-width:760px){
  .nav,.nav.nav{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom) * .3)}
  .nav-div,.nav-extra{display:none!important}
  .nav-mais{display:grid}
  .navbtn{width:auto;height:54px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  .navbtn svg{width:21px;height:21px}
  .nav-rot{display:block;font-size:10px;letter-spacing:.04em;line-height:1}
  .main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){.mais-folha{animation:none}}
/* início: um próximo passo claro (Zeigarnik, gradiente de meta, Von Restorff) */
.continuar{padding:20px 22px}
.continuar .kicker{margin:0 0 6px}
.ct-tit{margin:0;font-size:22px;font-weight:400;line-height:1.25;color:var(--forte);text-wrap:balance}
.ct-sub{margin:6px 0 10px;font-size:13px;color:var(--muted)}
.ct-bar{margin-bottom:16px}
.ct-acts{display:flex;flex-wrap:wrap;gap:8px}
.ct-pri{min-height:48px;padding-inline:22px;font-size:14px}
@media (max-width:760px){.ct-acts .btn{flex:1 1 100%;justify-content:center;min-height:50px}}
/* flashcards no celular: botões de resposta grandes, lado a lado, logo abaixo do cartão (Fitts);
